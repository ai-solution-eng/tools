{{- if .Values.ezua.enabled }}
{{- if .Values.ezua.authorizationPolicy.enabled }}
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: {{ include "sqlhandler.fullname" . }}-auth-policy
  namespace: {{ .Values.ezua.authorizationPolicy.namespace }}
spec:
  action: CUSTOM
  provider:
    name: {{ .Values.ezua.authorizationPolicy.providerName }}
  rules:
    - to:
        - operation:
            hosts:
              - {{ .Values.ezua.virtualService.endpoint | required "\nValid .Values.ezua.virtualService.endpoint is required when ezua is enabled !" }}
  selector:
    matchLabels:
      istio: "ingressgateway"
{{- end }}
{{- end }}
