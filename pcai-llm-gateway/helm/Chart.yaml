# pcai-llm-gateway — the multi-tenant LLM + MCP gateway for HPE PCAI:
# virtual API keys with ledger-based token budgets, an OpenAI-compatible
# proxy over aggregated model endpoint pools, and federated MCP with
# per-tool ACLs, behind the PCAI Istio gateway.
apiVersion: v2
name: pcai-llm-gateway
description: >-
  pcai-llm-gateway — multi-tenant LLM + MCP gateway for HPE PCAI: an
