{{- /* Chart-managed Secrets, OPT-IN per credential via *.create flags.
Lookup idempotence: on install generate; on upgrade reuse the existing
Secret verbatim (data keys come back base64-encoded from lookup — never
re-encode). This is the safe apply pattern: an upgrade re-emits identical
data and never empties a live Secret.

CAVEAT (by-reference sites must stay on create: false): pipelines that
render without cluster read access (offline `helm template`, CI apply
gates) get nil from lookup and would REGENERATE — flipping an existing
Secret's value. The default is create: false everywhere for that reason.
The helm.sh/resource-policy: keep annotation deliberately orphans these
Secrets on `helm uninstall` — a reinstall must not mint new admin keys.
(Keep the `---` separators followed by a LITERAL newline: a `{{-` action
right after a separator trims that newline and `helm lint`'s YAML splitter
then sees an invalid `---apiVersion: v1` document separator.) */}}

{{- if .Values.adminApiKey.create }}
{{- $n := .Values.adminApiKey.existingSecret -}}
{{- $k := .Values.adminApiKey.existingSecretKey -}}
{{- $e := lookup "v1" "Secret" .Release.Namespace $n -}}
{{- $v := "" -}}
{{- if and $e (index $e.data $k) -}}{{- $v = index $e.data $k -}}
{{- else -}}{{- $v = randAlphaNum 48 | b64enc -}}{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $n }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.deployment.appName }}
    "hpe-ezua/type": vendor-service
    "hpe-ezua/app": {{ .Chart.Name }}
  annotations:
    pcai-llm-gateway.io/managed-by: helm
    "helm.sh/resource-policy": keep
type: Opaque
data:
  {{ $k }}: {{ $v }}
{{ end }}
{{- if .Values.secretsMasterKey.create }}
{{- $n := .Values.secretsMasterKey.existingSecret -}}
{{- $k := .Values.secretsMasterKey.existingSecretKey -}}
{{- $e := lookup "v1" "Secret" .Release.Namespace $n -}}
{{- $v := "" -}}
{{- if and $e (index $e.data $k) -}}{{- $v = index $e.data $k -}}
{{- else -}}{{- $v = randAlphaNum 48 | b64enc -}}{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $n }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.deployment.appName }}
    "hpe-ezua/type": vendor-service
    "hpe-ezua/app": {{ .Chart.Name }}
  annotations:
    pcai-llm-gateway.io/managed-by: helm
    "helm.sh/resource-policy": keep
type: Opaque
data:
  {{ $k }}: {{ $v }}
{{ end }}
{{- if and .Values.database.embedded.enabled .Values.database.embedded.auth.create }}
{{- $n := .Values.database.embedded.auth.existingSecret -}}
{{- $k := .Values.database.embedded.auth.existingSecretKey -}}
{{- $e := lookup "v1" "Secret" .Release.Namespace $n -}}
{{- $v := "" -}}
{{- if and $e (index $e.data $k) -}}{{- $v = index $e.data $k -}}
{{- else -}}{{- $v = randAlphaNum 32 | b64enc -}}{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $n }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ printf "%s-pg" .Values.deployment.appName }}
    "hpe-ezua/type": vendor-service
    "hpe-ezua/app": {{ .Chart.Name }}
  annotations:
    pcai-llm-gateway.io/managed-by: helm
    "helm.sh/resource-policy": keep
    # POSTGRES_PASSWORD seeds the data dir on FIRST init only — never change
    # this Secret after first boot without ALTER USER on the database too.
    pcai-llm-gateway.io/pg-init-once: "true"
type: Opaque
data:
  {{ $k }}: {{ $v }}
{{ end }}
