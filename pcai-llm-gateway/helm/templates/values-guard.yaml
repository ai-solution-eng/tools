{{- /*
  STALE-LAYOUT GUARD. The settings block was regrouped by subsystem
  (server/upstream/dbPool/retention/cache/relay/mcp/routing/models/healthProbe/
  auth/memory/offpeak/audio/tracing) and many keys lost the prefix the section
  now carries. Helm's map merge IGNORES a key it does not know, so a site values
  file written against the flat layout would silently boot on chart defaults -
  a relay kill switch quietly reverting to on, a token-validation gate silently
  inert. Fail the render instead, and name what to rename.

  Two classes are caught:
    1. a legacy TOP-LEVEL settings key (settings.dbPoolMax),
    2. a legacy leaf name nested under a NEW section (settings.relay.toolRelayEnabled),
       restricted to names whose new spelling DIFFERS - so a key that kept its
       name (settings.healthProbe.*, settings.models.maxTokensCeiling) is never
       flagged. The walk is bounded to the depth the tree actually has.

  Migration table: documentation/DEPLOYMENT.md section "Values migration".
*/ -}}
