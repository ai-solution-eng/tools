{{- $found := list -}}
{{- range $key := $legacyTop -}}
{{- if hasKey $settings $key -}}
{{- $found = append $found (printf "settings.%s" $key) -}}
{{- end -}}
{{- end -}}
{{- range $sec, $val := $settings -}}
{{- if kindIs "map" $val -}}
{{- range $key := $legacyLeaf -}}
{{- if hasKey $val $key -}}
{{- $found = append $found (printf "settings.%s.%s" $sec $key) -}}
{{- end -}}
{{- end -}}
{{- range $sub, $sval := $val -}}
{{- if kindIs "map" $sval -}}
{{- range $key := $legacyLeaf -}}
{{- if hasKey $sval $key -}}
{{- $found = append $found (printf "settings.%s.%s.%s" $sec $sub $key) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if $found -}}
{{- $shown := $found -}}
{{- $more := 0 -}}
{{- if gt (len $found) 8 -}}
{{- $shown = slice $found 0 8 -}}
{{- $more = sub (len $found) 8 -}}
{{- end -}}
{{- $suffix := "" -}}
{{- if gt $more 0 -}}
{{- $suffix = printf " and %d more" $more -}}
{{- end -}}
{{- fail (printf "settings: %d key(s) use the OLD FLAT layout (%s%s). The settings block is grouped by subsystem (server, upstream, dbPool, retention, cache, relay, mcp, routing, models, healthProbe, auth, memory, offpeak, audio, tracing), so Helm IGNORES these keys and the pod would boot on chart defaults. Rename them per documentation/DEPLOYMENT.md section Values migration (old -> new table)." (len $found) (join ", " $shown) $suffix) -}}
{{- end -}}
