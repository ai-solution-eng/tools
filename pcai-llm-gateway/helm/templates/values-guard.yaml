-}}
{{- $legacyLeaf := list
  "audioAsrTokensPerSecond"
  "audioTtsCharsPerToken"
  "budgetCachedExemptFraction"
  "canonicalSkipTitleRequests"
  "clientToolDispatch"
  "clientToolDispatchTimeoutS"
  "dbAcquireTimeoutS"
  "dbPoolMax"
  "dbPoolMin"
  "distillerDisableThinking"
  "distillerEnabled"
  "distillerGateBackoffS"
