{{- if and .Values.ezua.enabled .Values.ezua.authorizationPolicy.enabled }}
{{- $ap := .Values.ezua.authorizationPolicy }}
{{- $app := .Values.deployment.appName }}
{{- $ns := .Release.Namespace }}
# Istio AuthorizationPolicy — ADDITIVE and OFF by default
# (ezua.authorizationPolicy.enabled, default false): the DEFAULT render is
# byte-identical to the baseline. Requires ezua.enabled=true (it guards the
# ezua-exposed workload) and sidecar injection in the release namespace —
# this is the MESH L7 control; the CNI-layer control is networkPolicy above.
#
# ⚠️ COUPLING (why this exists): settings.trustProxyIdentity
# (PCAI_LLM_TRUST_PROXY_IDENTITY) makes the gateway CONSUME the oauth2-proxy
# identity headers — those headers are client-spoofable at the pod, so the
# flag alone is NOT the control. It is safe ONLY where (a) an enforcing
# proxy (oauth2-proxy at the ezaf-gateway) OVERWRITES the identity headers
# on every request AND (b) THIS AuthorizationPolicy keeps unauthenticated
# callers from bypassing the proxy: with the policy present, Istio denies
# everything not ALLOW-listed, so a direct in-cluster call can no longer
# smuggle X-Auth-Request-User past the identity ladder.
#
# With ezua.authorizationPolicy.rules left empty (default), rules (i)-(ii)
# below render. ALLOW-only semantics: once an AuthorizationPolicy with
# ALLOW rules matches a workload, ANY request without a matching rule is
# DENIED — so the kubelet problem is real and needs an explicit answer.
# Rule (iii) is that answer's knob, not a rule: the kubelet is OUTSIDE the
# mesh (no SPIFFE identity, not selectable via principals/namespaces/
# ipBlocks that would not also admit pod traffic) and there is no separate
# probe port to allow-list (liveness/readiness share the app port), so the
# documented relief valve is traffic.sidecar.istio.io/excludeInboundPorts
# (ezua.authorizationPolicy.excludeInboundPorts — stamped on the deployment
# pod spec): the port leaves the mesh, kubelet probes bypass Envoy entirely,
# and the NetworkPolicy ipBlock rule (networkpolicy.yaml (iii)) becomes the
# control for it. ⚠️ An excluded port bypasses ALL AuthorizationPolicy
# rules — never exclude a port that serves real traffic.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: {{ .Values.deployment.name }}-authz
  namespace: {{ $ns }}
  labels:
    app: {{ $app }}
    "hpe-ezua/app": {{ .Chart.Name }}
    "hpe-ezua/type": vendor-service
spec:
  # Target the gateway pods by label — an empty selector would make this a
  # namespace-wide policy (rejected by istiod as IST0092).
  selector:
    matchLabels:
      app: {{ $app }}
  action: ALLOW
  rules:
    {{- if $ap.rules }}
    # Operator-supplied rules REPLACE the baseline (lists replace).
    {{- toYaml $ap.rules | nindent 4 }}
    {{- else }}
    # (i) Ingress-gateway workloads — the ezaf-gateway leg that terminates
    #     the public route (virtualservice.yaml) and (where deployed) the
    #     oauth2-proxy enforcing proxy: the only legitimate writers of the
    #     proxy identity headers. DEFAULT match is the whole
    #     ingressNamespace (istio-system): AuthorizationPolicy has no
    #     pod-label SOURCE matcher (only principals/namespaces/ipBlocks),
    #     and the gateway pods' ServiceAccount names are SITE-specific.
    #     Tighten it with ingressGatewayPrincipals (SPIFFE IDs,
    #     cluster.local/ns/<ns>/sa/<sa>). Discover the gateway pods' SA with
    #     kubectl -n istio-system get pod -l 'istio=ingressgateway'
    #     -o jsonpath='{.items[0].spec.serviceAccountName}'. Do NOT select on
    #     app=ezaf-gateway: on G2 no pod carries that label (verified
    #     2026-11-02), so the query returns nothing — the ezaf-gateway
    #     Gateway resource is served by the istio-ingressgateway pods, whose
    #     SA on G2 is istio-ingressgateway-service-account, i.e.
    #     cluster.local/ns/istio-system/sa/istio-ingressgateway-service-account.
    #     NOTE: source.principals requires mTLS from the gateway, so verify
    #     the app namespace has injection on before relying on it.
    - from:
        - source:
            {{- if $ap.ingressGatewayPrincipals }}
            principals:
              {{- toYaml $ap.ingressGatewayPrincipals | nindent 14 }}
            {{- else }}
            namespaces: ["{{ $ap.ingressNamespace }}"]
            {{- end }}
    # (ii) Same-namespace callers (registry scraping / ops tooling
    #      co-deployed in the release namespace) — on the service port,
    #      EXCEPT the identity/mint/admin surfaces (audit #6): a bare
    #      from: here admitted every meshed pod in the namespace to the
    #      routes whose resolvers consume the trusted browser-header
    #      rung (see rule iv) — a leg rule (iv) cannot close when
    #      allowInClusterApi is on, because rules OR together. Every
    #      excluded path ships in BOTH spellings — Istio notPaths are
    #      EXACT matches unless suffixed /*, so "/admin" alone leaves
    #      the whole /admin/* API subtree admitted (x-val on audit #6).
    #      Same notPaths contract as rule (iv); /metrics (rule iii) and
    #      the health/ready paths stay reachable.
    - from:
        - source:
            namespaces: ["{{ $ns }}"]
      to:
        - operation:
            ports: ["{{ .Values.service.port }}"]
            notPaths: ["/v1/identity", "/v1/identity/*", "/v1/keys/for-me", "/v1/keys/for-me/*", "/v1/enroll", "/v1/enroll/*", "/admin", "/admin/*"]
    {{- if $ap.allowMetricsScrape }}
    # (iii) Metrics scrape — ANY source, scoped to the metrics path on the
    #     service port ONLY. The 2026-10-07 G2 rollout proved a
    #     namespace-scoped rule cannot do this job: kube-prometheus scrapes
    #     raw POD IPs, and a raw-IP outbound connection is envoy
    #     passthrough — PLAINTEXT even from a MESHED scraper (verified
    #     live: prometheus-0 given a sidecar, up stayed 0) — so no peer
    #     identity exists for a namespaces/principals matcher to match.
    #     /metrics carries endpoint/outcome labels only — never tenant,
    #     key or prompt material (see servicemonitor.yaml) — so an
    #     any-source rule on exactly this path restores the pre-policy
    #     posture and loosens nothing that matters. Both spellings: the
    #     app redirects /metrics -> /metrics/ and the scraper follows.
    - to:
        - operation:
            ports: ["{{ .Values.service.port }}"]
            paths: ["/metrics", "/metrics/"]
    {{- end }}
    {{- if $ap.allowInClusterApi }}
    # (iv) In-cluster API access (ADDITIVE, default false; SITE call):
    #      ANY source on the traffic port EXCEPT the identity-bearing
    #      paths. For consumers that call the gateway's SERVICE directly
    #      (DSH, OpenWebUI, opencode-web, clearwing…): unmeshed raw-IP or
    #      plaintext callers carry no peer identity, so per-namespace
    #      rules cannot match them (the (iii) lesson, same rollout). The
    #      app's own key auth remains the control on every admitted path —
    #      the edge classifies /v1/* exactly the same way. The
    #      IDENTITY/MINT/ADMIN paths (/v1/identity, /v1/keys/for-me,
    #      /v1/enroll, /admin — every route whose resolver consumes the
    #      browser-header rung: routes_identity.py, routes_enroll.py
    #      POST /enroll, routes_admin.py require_admin; the old "two
    #      paths" claim was stale — audit #6) stay reachable ONLY from
    #      the edge (rule i): with trustProxyIdentity on, an in-cluster
    #      pod must never be able to deliver spoofed X-Auth-Request-*
    #      headers to a mint. BOTH spellings per path (see rule ii):
    #      the bare form is the literal path, the /* form the subtree
    #      the admin API router (prefix=/admin) actually serves.
    - to:
        - operation:
            ports: ["{{ .Values.service.port }}"]
            notPaths: ["/v1/identity", "/v1/identity/*", "/v1/keys/for-me", "/v1/keys/for-me/*", "/v1/enroll", "/v1/enroll/*", "/admin", "/admin/*"]
    {{- end }}
    {{- end }}
{{- end }}
