# ============================================================================
# pcai-llm-gateway — multi-tenant LLM + MCP gateway for HPE PCAI: virtual API
# keys with ledger budgets, an OpenAI-compatible proxy over model endpoint
# pools, federated MCP with per-tool ACLs.
# Full guide: documentation/DEPLOYMENT.md.
# Owner: Andrew Bydlon <andrew.bydlon@hpe.com>
# Contributors: Francesco Caliva <francesco.caliva@hpe.com>, Bryan Lliguicota <bryan.lliguicota@hpe.com>
# ============================================================================

# ### REQUIRED ### — key material lives in Secrets you own, NOT in values
# (missing Secret = the pod refuses to start):
#   1. adminApiKey.existingSecret — admin keys; /admin rejects everything without it
#   2. database.existingSecret — the control-plane DSN (external mode, the default)
#   3. ezua.virtualService.endpoint — the route host (render-guard when ezua.enabled)
#   4. ingress.host — the route host (render-guard when ingress.enabled)
#   5. upstreamKeySecrets[] / mcpKeySecrets[] — every entry needs secretName + secretKey
#
# ### OPTIONAL ###
# The SSO self-mint rollout is ONE COUPLED FLIP: settings.auth.trustProxyIdentity +
# settings.auth.ssoKeyCreate.enabled + ezua.authorizationPolicy. Turning the trust
# flags on while authorizationPolicy.rules/principals are EMPTY lets the whole
# ingress namespace spoof identity headers (the render warns — NOTES.txt carries the
# block). Runbook: DEPLOYMENT.md § SSO self-mint rollout.
# Other tuning: DEPLOYMENT.md § Sizing | § Postgres | § Network isolation | § Metrics.

# ============================================================================
# Deployment / Image
# ============================================================================

deployment:
  name: pcai-llm-gateway
  appName: pcai-llm-gateway
  replicaCount: 1
  rolloutOnUpgrade: false                 # re-roll pods on every upgrade
  holdApplicationUntilProxyStarts: true   # meshed namespaces only
  terminationGracePeriodSeconds: 120      # must outlast in-flight SSE streams settling ledger rows

image:
  repository: ghcr.io/ai-solution-eng/pcai-llm-gateway
  # tag: "" inherits appVersion. The tag is MUTABLE: pin with tag@sha256:<digest>
  # (or pullPolicy: Always) for a reproducible supply chain.
  tag: v4.4.2
  pullPolicy: IfNotPresent

imagePullSecrets: []

# ============================================================================
# Secrets — every credential arrives BY REFERENCE; nothing here is material
# ============================================================================

# Admin keys for /admin — operator-created Secret:
#   kubectl -n <ns> create secret generic pcai-llm-gateway-admin --from-literal=admin-api-keys='<key1>,<key2>'
adminApiKey:
  existingSecret: pcai-llm-gateway-admin
  existingSecretKey: admin-api-keys
  create: false          # true = chart generates it on install and preserves it on upgrade; keep false for offline renders

# External Postgres DSN, from an operator-created Secret:
#   kubectl -n <ns> create secret generic pcai-llm-gateway-db --from-literal=database-url='postgresql://user:pass@host:5432/pcai_llm'
database:
  existingSecret: pcai-llm-gateway-db
  existingSecretKey: database-url
  # The database's max_connections as far as the chart knows (external mode).
  # 0 = unknown: NOTES.txt prints maxReplicas x settings.dbPool.max as a NOTE
  # instead of a WARNING. Embedded mode budgets from embedded.maxConnections.
  maxConnectionsBudget: 0

  # Embedded Postgres 16 (StatefulSet + Service + PVC); the password arrives by
  # reference via discrete PCAI_LLM_DB_* env vars.
  embedded:
    enabled: false
    image: postgres:16
    serviceName: pcai-llm-gateway-pg

    auth:
      username: pcai_llm
      database: pcai_llm
      existingSecret: pcai-llm-gateway-pg-auth   # operator-created; key: password
      existingSecretKey: password
      # POSTGRES_PASSWORD seeds the data dir on FIRST init only — never rotate it
      # without ALTER USER. create: true opts into the chart-managed mode above.
      create: false

    persistence:
      size: 5Gi
      storageClass: ""               # '' = cluster default StorageClass

    # Budget for the AUTOSCALED gateway (maxReplicas x settings.dbPool.max + its own
    # sessions); changing it RESTARTS the StatefulSet. 0 = image default (100).
    maxConnections: 0

    resources:
      requests: {cpu: 250m, memory: 512Mi}
      limits: {cpu: 4, memory: 4Gi}

# Upstream model-endpoint API keys — BY REFERENCE, registered as api_key_secret via /admin/models:
#   upstreamKeySecrets: [{suffix: vllm-upstream-key, secretName: vllm-upstream-key, secretKey: api-key}]
upstreamKeySecrets: []

# Upstream MCP server API keys — BY REFERENCE, same mechanism as upstreamKeySecrets;
#   mcpKeySecrets: [{suffix: mcp-fleet-apikeys, secretName: mcp-fleet-apikeys, secretKey: api-keys}]
mcpKeySecrets: []

# Fernet master key for panel credential storage — BY REFERENCE only:
#   kubectl -n <ns> create secret generic pcai-llm-gateway-secrets --from-literal=master-key="$(openssl rand -hex 32)"
secretsMasterKey:
  existingSecret: pcai-llm-gateway-secrets
  existingSecretKey: master-key
  create: false          # chart-managed mode; rotating a generated key voids stored credentials

# ============================================================================
# Runtime Settings
# One PCAI_LLM_* env var per key, grouped by subsystem:
#   server · upstream · dbPool · retention · cache · relay · mcp · routing ·
#   models · healthProbe · auth · memory · offpeak · audio · tracing
# Migrating from the older FLAT settings block: DEPLOYMENT.md § Values migration.
# NOTE: a section whose keys are ALL commented out parses as null and the render fails on
# it — keep at least one key in a section you enable, or delete the section line.
# ============================================================================

settings:

  # --- Server: listener, body size, concurrency ------------------------------
  server:
    host: 0.0.0.0
    port: 9200
    logLevel: INFO
    keepAliveTimeoutS: 75
    limitConcurrency: 0     # 0 = unbounded; a cap sheds load with 503 — set it only with evidence
    maxBodyBytes: 33554432                # 32 MiB proxied-body cap

  # --- Upstream: timeouts, breaker, TLS --------------------------------------
  upstream:
    timeoutS: 900
    caBundle: ""            # private-CA bundle path; empty = httpx trust store. No verify=False knob.
    breakerFailureThreshold: 5             # consecutive failures before an endpoint cools down
    breakerCooldownS: 60
    failoverTtftS: 45       # 2xx stream must produce its FIRST SSE line within this, else fail over; 0 disables
    zeroCompletionRetry: false   # retry once on 2xx + empty content (non-streaming final answers only)

  # --- Postgres pool ---------------------------------------------------------
  dbPool:
    min: 5
    # INvariant with autoscaling.maxReplicas: each pod pools its own max, so
    # worst-case demand is maxReplicas x max — keep that product inside the
    # database's max_connections or pods fail to ACQUIRE at the scale-up spike.
    max: 25
    acquireTimeoutS: 2      # bounded acquire: saturation is a fast 503, not a queue

  # --- Retention: operational tables (the usage LEDGER is never pruned) -------
  retention:
    effectivePromptCapture: true   # <=64 KB preview of every REAL model call; independent of the day knobs
    effectivePromptRetainDays: 7           # 0 = keep forever
    traceDays: 0            # agent_traces — observability, not the audit artifact; 0 = never prune
    conversationDays: 0
    canonicalDays: 0        # distiller input store; DISTILLED-ONLY deletes (un-distilled rows never lost); 0 = off

  # --- Cache: embeddings, exact-match answers, cache-aware metering ----------
  cache:
    embedding:
      enabled: true
      maxInputBytes: 65536
    # Exact-match cache for NON-STREAMING chat, deterministic requests only
    # (temperature 0, not streamed, not relayed):
    #   off = legacy path | shadow = count would-be hits, serve nothing | active = serve
    # Start in shadow, read gateway_response_cache_total{mode="shadow"}, then switch.
    response:
      mode: "off"
      ttlS: 3600
    # Cache-aware metering. The refund pair stops cache-heavy agent loops 429ing:
    # cached tokens are refunded from the TPM window and discounted against period
    # token budgets (0.9 = one-tenth weight, 1.0 = exempt, 0.0 = legacy full count;
    # USD budgets are unaffected). predictCached goes further — the ADMISSION charge
    # uses the key's own measured cache ratio and reconcile settles the difference,
    # so prediction only decides WHEN tokens are charged, never HOW MANY. It changes
    # admission behaviour, hence off by default; keep reconcile ON with it.
    metering:
      excludeCachedTokens: true
      budgetExemptFraction: 0.9
      predictCached: false
      predictReconcile: true

  # --- Relay: the model tool-calling loop -----------------------------------
  # surface decides how the granted catalogue reaches the model:
  #   hybrid = ONE pcai_tools discovery tool + a server directory (default)
  #   full   = every tool definition inline (~34k prompt tokens for 111 tools)
  # grantMode: explicit = only held (profile-preset + own ACL) pairs;
  #            scope    = mcp-scoped keys get every policy-admitted tool.
  relay:
    enabled: true
    surface: hybrid
    maxIterations: 32
    wallClockS: 900
    callRetries: 1          # per turn; spends only the remaining wall clock, needs >=10s left; 0 = fail fast
    grantMode: explicit
    # Cap on the `search` action of the pcai_tools discovery tool (BM25 over the
    # in-memory catalogue). Discovery, not enforcement: the default is a sane
    # ranking window, and 0/negative disables the action rather than returning an
    # empty result the model would read as "no such tool".
    toolSearchMaxResults: 10
    # Native wire visibility: leave FALSE for DSH — its stream client EXECUTES any
    # tool_call delta it sees. renderDeltas re-emits calls stamped pcai.relay: true
    # (requires header X-PCAI-Relay-Deltas: 1).
    streamWireTools: false
    renderDeltas: false
    renderIndexBase: 1000

    # Show the model its OWN prior reasoning (in-loop and inbound): without it a long
    # turn teaches the model to skip thinking. maxChars is the storm guard against
    # unbounded per-cycle growth.
    reasoning:
      enabled: true
      maxChars: 2000

    # Deterministic, model-free compression of oversized tool results:
    #   off | shadow (measure only — default) | on (rewrite + digest marker that the
    #   pcai__retrieve tool expands from a TTL-bound store)
    compress:
      mode: "shadow"
      minChars: 4096
      ratioFloor: 0.15
      storeTtlS: 86400
      maxStoreChars: 1000000   # above this a result passes through instead of pinning MBs

    # Tool-definition pinning (rug-pull defence, 2026-11-10): a server that rewrites a
    # tool's description/inputSchema AFTER the grant was approved offers a definition
    # nobody reviewed — and a rewritten description is an instruction channel into the
    # model's context. off | warn | block.
    # TRACKED DEFAULT "warn" — a tracked default must not change what a deployment DOES:
    # warn logs the old -> new digest and keeps offering the tool. "block" drops the
    # changed tool from the offered surface AND refuses the call at dispatch (both halves
    # are needed: the offer alone is bypassable by history replay); the GRANT is untouched
    # either way — a definition change is not an ACL change. Pins are IN-MEMORY, so a
    # restart re-records (re-approves) every definition.
    toolPinMode: "warn"
    # Tool-RESULT injection screening (2026-11-10): tool output was the one channel the
    # guardrails did not cover. off | warn | annotate | block.
    # TRACKED DEFAULT "annotate" — a FLAGGED result gets a one-line provenance header
    # (server, tool, finding count) prepended and KEEPS its content; a clean result is
    # never touched, so the default changes nothing on unflagged traffic. "block"
    # substitutes a short refusal instead. RELAY ONLY: the /mcp surface is not screened
    # yet, so this is not a whole-gateway guarantee.
    toolInjectionScreen: "annotate"

    # A key registers its local tools and answers relay dispatches over long-poll, so
    # the model calls client__<tool> in the live loop. Routes 404 while off. timeoutS
    # bounds ONE dispatch: an offline client yields a tool error, never a hang.
    clientDispatch:
      enabled: false
      timeoutS: 120.0

  # --- MCP federation (/mcp) and the registry -------------------------------
  mcp:
    # true = flat {server}__{tool} tools (inlines every granted tool into every
    # client's context); false = the two-tool surface (mcp_catalog + mcp_call).
    flatTools: false
    catalogCacheS: 60.0
    failoverAttempts: 2
    selfService: true       # keyed users manage their OWN per-server credentials + grants; false hides the routes
    callerAttribution: true # stamp X-MCP-Caller: <subject or key-fp>@gateway (RESERVED name)
    # Replicas cache the registry in PROCESS memory, so each polls a DB watermark and
    # refreshes when it moves. 0 disables the poll (only safe on a single replica).
    registryWatchS: 5.0
    registryAdminFreshS: 1.0

    # Argument-level destination policy, on BOTH MCP paths (/mcp and the relay):
    # it blocks WHERE a tool may send a request, not WHAT it sends.
    #   mode: enforce | warn | off — an unrecognised value fails CLOSED to enforce.
    #   separateReadEgress: warn | enforce | off — flags/refuses a key holding BOTH a
    #   read and an egress grant (split the keys first).
    argPolicy:
      mode: enforce
      exempt: ""              # comma-separated server.tool globs exempt from the stage
      egressServers: ""       # egress-class server globs ("" = the federation class)
      denyClusterHosts: true
      resolve: true
      telemetry: true
      separateReadEgress: warn
    # Destructive-tool approval gate (B8, 2026-11-23): a pre-authorization token
    # gates the tools that MUTATE the cluster — applygate plan_apply, workbench run,
    # k8s exec_in_pod — on BOTH the relay and /mcp paths. The ACL answers "may this
    # key call this tool"; this answers "should THIS call happen".
    #   mode: off | warn | enforce. An unknown value coerces to off (a typo must not
    #   start refusing destructive calls fleet-wide).
    #     off     = inert (the default; byte-identical to pre-B8, no store hit)
    #     warn    = record what WOULD have needed approval, change nothing
    #     enforce = require a live token; refuse with detail=approval_required, and
    #               FAIL CLOSED on a store fault (the deliberate opposite trade to
    #               pinning, which fails open — different blast radius).
    # TRACKED DEFAULT "off" — a tracked default must not change what a deployment
    # DOES: enforce refuses the destructive calls until an operator grants tokens,
    # which is an outage on the path the fleet's agents use.
    # required is the comma-separated server.tool glob set that needs a token;
    # everything else is unaffected, so turning the gate on cannot break the read
    # paths. tokenTtlS/tokenMaxUses are the CEILINGS a token may not exceed — an
    # approval that never expires is a grant wearing a disguise.
    toolApproval:
      mode: "off"
      required: "applygate.*apply*,workbench.run*,k8s-ops.exec_in_pod"
      tokenTtlS: 900
      tokenMaxUses: 1

  # --- Routing: pseudo-models, fallback, stickiness, load -------------------
  routing:
    enabled: true
    tier1Tokens: 1500       # complexity bands for routing / routing__<model>:
    tier2Tokens: 6000       # the router serves the CHEAPEST model that fits
    turnAdderTokens: 100
    agentsEnabled: false    # let the key's OFFERED agents join the candidate window
    routeDefaultModel: false               # promote the legacy auto alias into routing
    fallbackMax: 2          # fallback models walked per chain (admin-curated); 0 = never
    # Never-downgrade: a routed conversation holds a capability FLOOR — it may
    # escalate but never fall below. Off by default: it changes which model serves.
    # The DB routing config (sticky_routing) overrides. idleResetS re-decides fresh
    # after that idle gap; 0 = never reset.
    sticky:
      enabled: false
      idleResetS: 1800
    loadAwareCascade:
      enabled: false        # off by default: pick the conversation-start HEAD by live per-model load
    demandAwareExcludedModels: []          # heads never to pick; they stay on the auto ladder
    #   - Qwen3.8-27B
    # X-PCAI-Session pins a conversation to the ENDPOINT that served it (not just the
    # cascade head) so its prefix keeps hitting the same server's KV cache. Routing
    # STATE, never policy: a pin that no longer qualifies is dropped on read.
    sessionAffinity:
      enabled: false
      ttlS: 3600
    # Named sets of EQUIVALENT chat models chosen by live load (power-of-two over
    # queue depth, then KV%), usable anywhere a model name is accepted. Load comes
    # from a background Prometheus snapshot; a stale one degrades to weighted random.
    modelGroups:
      enabled: false
      loadRefreshS: 5
      loadStaleS: 30

  # --- Models ---------------------------------------------------------------
  models:
    # Silently LOWERS a client's larger max_tokens for that virtual model (never
    # raises). 0/negative = ignored; empty = no cap.
    #   maxTokensCeiling: {Qwen3.8-27B: 32768}
    maxTokensCeiling: {}

  # --- Endpoint health probe (active) --------------------------------------
  # GETs {base_url}/models per endpoint and excludes one that fails N consecutive
  # sweeps. DEFAULT OFF, deliberately: the first cut shipped on and took the fleet
  # down. Turn it on once GET /admin/endpoints shows the fleet probed OK — the probe
  # sends the endpoint's own credential, and a pool is never emptied by the probe.
  healthProbe:
    enabled: false
    intervalS: 30
    timeoutS: 5
    failuresToTrip: 2       # 1 = exclude on a blip

  # --- Auth: identity rungs, tokens, SSO -----------------------------------
  auth:
    # Trust the oauth2-proxy identity headers on the browser rung. Client-spoofable at
    # the pod — set ONLY behind an enforcing proxy + AuthorizationPolicy.
    trustProxyIdentity: false
    # X-Forwarded-Groups on the browser rung. The platform oauth2-proxy does NOT
    # inject that header, so an arriving value is client-supplied — enable ONLY for
    # chains whose proxy injects and overwrites it.
    trustForwardedGroups: false
    adminGroups: ""         # groups allowed to call /admin (empty = off); requires trustProxyIdentity
    ssoKeyCreate:
      enabled: false        # POST /v1/keys/for-me, one key per identity (409 unless rotate); needs trustProxyIdentity
    # Absolute URL of the platform oauth2-proxy sign-out, e.g.
    #   https://oauth2-proxy.<your-domain>/oauth2/sign_out
    # Empty = local-only sign-out (the UI then says the platform session is still
    # active). PREFER ezua.virtualService.ssoProxy when the proxy is in-cluster.
    ssoSignOutUrl: ""
    # Keycloak JWT validation on Authorization: Bearer, cached by TTL. ALL THREE of
    # issuer/jwksUrl/audience must be set to engage; empty = INERT. Validate only.
    tokenValidation:
      issuer: ""
      jwksUrl: ""
      audience: ""
      jwksCacheS: 300.0
      leewayS: 5.0
    tokenShadow:
      enabled: false        # first-seen VALID token subject gets a user + ledger key (inert for unattached keys)
      tenantId: ""          # inert without it
      keyName: "token-shadow"
      rateLimitRpm: 60
      rateLimitTpm: 100000

  # --- Memory: enrollment seeds and the session distiller ------------------
  memory:
    # LEGACY: provisions a private RAG dataset on the registered memory MCP server
    # and stamps X-Memory-Dataset + X-Dataset-Password onto the key (needs
    # secretsMasterKey). The supported path is a per-key X-API-Key header override.
    enroll:
      provisionDataset: false
      server: "mm-rag"
      nameRetries: 3
    # The gateway-side transcript -> memory pipeline (one canonical prompt replaces
    # the harness distillers). enabled is the master env switch; the runtime knobs
    # (summarizer model, off-peak scheduling, quiet window, output cap) are
    # admin-editable in the Memory Distiller panel (DB-backed, no redeploy).
    distiller:
      enabled: false        # inert for keys the backend reports unattached
      maxTokens: 4096       # OUTPUT cap, NOT the RAG chunk size; an overrun loses the write whole
      server: "mm-rag"
      tool: "add_memory"
      probeTool: "memory_status"
      # Skip backoff: a skipped row leaves the oldest-first due window for this long,
      # so one broken dependency cannot pin the window and starve newer rows.
      gateBackoffS: 900
      # On a FAILED distill: true = write the raw transcript as session_history (a
      # session is never lost, but mm-rag CHUNKS it — one failure can land 100+
      # fragments); false = leave the row due and retry (store gets only summaries).
      rawFallback: true
      # Minimum BODY chars for a distilled memory (measured after stripping the
      # index header). 100 clears the worst title stub and stays under a real
      # one-fact card — a SECOND NET behind title exclusion and the collapse guard.
      # 0 = no floor; 100 clears the worst stub, and 150+ REJECTS a real one-fact card.
      minDocChars: 100
      # Skip the summarizer's THINKING TRACE: when the trace eats max_tokens the reply
      # is 200 OK with content="" and EVERY distill fails while upstream looks healthy.
      # true sends chat_template_kwargs {"enable_thinking": false}; non-reasoning
      # engines ignore it. Turn off only if the summarizer REQUIRES its reasoning pass.
      disableThinking: true
    capture:
      # Skip capture/distill of auxiliary SESSION-TITLE calls, which otherwise become
      # canonical rows and bogus "session summary" memories. Detection is structural.
      skipTitleRequests: true

    # Procedural memory, READ half (2026-11-23): the distiller already WRITES
    # outcome-labelled playbooks and mm-rag exposes recall_playbooks, but nothing put
    # one in front of a model before it started work. Enabled = recall the top-k
    # procedures for the task signature and prepend them to the system preamble.
    # TRACKED DEFAULT OFF — a tracked default must not change what a deployment DOES:
    # injection spends prompt tokens on EVERY request and a stale procedure is worse
    # than none. Turn it on per site once the store holds playbooks for the traffic
    # being served. FAIL OPEN: past timeoutMs the turn proceeds without procedures.
    playbookInject:
      enabled: false
      k: 3                  # top-k procedures injected (3 = recall_playbooks' own default)
      maxChars: 2000        # hard cap on the injected block (truncation keeps a marker)
      timeoutMs: 800        # recall is a network hop; 0 disables the timeout (not recommended)
      minSuccessRate: 0.0   # smoothed-success floor for a candidate; 0.0 = no filter

  # --- Off-peak billing ----------------------------------------------------
  # Needs a registered Prometheus MCP server: GPU util under enterPct scales budget
  # drain by fraction. Enable only where that server is deployed.
  offpeak:
    enabled: false
    checkS: 30
    promql: avg(avg_over_time(DCGM_FI_DEV_GPU_UTIL[5m]))
    enterPct: 20
    exitPct: 35
    fraction: 0.5
    mcpServer: prometheus
    tool: prom_query
    # Per-model queries: model name -> PromQL returning a 0-100 load % for the GPUs
    # that model serves on. DCGM series carry NO pod label — scope by Hostname + device:
    #   GLM-5.3-Flash: 'avg(avg_over_time(DCGM_FI_DEV_GPU_UTIL{Hostname="pcai-se-scs04.hst.lab",device=~"nvidia[4-7]"}[5m]))'
    modelPromql: {}
    # L3 volume occupancy for the Off-peak tab: a label selector over
    # kubelet_volume_stats_* naming the volumes backing the L3 store (the inference
    # engine exports no storage gauge). Empty = no disk section.
    #   diskSelector: 'namespace="mooncake",persistentvolumeclaim=~"ssd-mooncake-store-.*"'
    diskSelector: ""

  # --- Audio passthrough billing -------------------------------------------
  # TTS/ASR report no token usage and a zero-token row would be a budget bypass, so
  # the gateway bills an ESTIMATE: TTS by characters, ASR by audio duration.
  audio:
    ttsCharsPerToken: 4
    asrTokensPerSecond: 3.0

  # --- Tracing: OTel spans + agent-trace quality (DB-backed) --------------
  # One server span per HTTP request, exported as OTLP/HTTP JSON to {endpoint}/v1/traces.
  # WARNING: these are CHART DEFAULTS, NOT SITE CONFIG. A site that wants tracing must
  # set it in its OWN values document (helm/values-examples/values.<site>.yaml, pasted
  # into PCAI Configure) — an upgrade from chart defaults silently disables it, which is
  # how a rollout once emitted nothing for an hour. The placeholder endpoint does not
  # resolve; use the full in-cluster name, e.g.
  #   http://otel-collector.otel-traces.svc.cluster.local:4318
  tracing:
    enabled: false
    endpoint: http://otel-collector:4318
    serviceName: pcai-llm-gateway
    sampleRatio: 1.0        # deterministic per-trace hash: 0 = none, 1 = all
    headers: ""             # comma-separated Key=Value (empty = content-type only), e.g. Langfuse:
                            #   Authorization=Basic <base64 pk:sk>,x-langfuse-ingestion-version=4

    # Agent trace PAYLOADS (2026-11-23): DB-backed rows in agent_traces, NOT OTel spans
    # and not exported anywhere. They record WHAT the agent saw (tool arguments and
    # results) — the most sensitive rows the gateway would store — so a site opts in
    # deliberately. Sampling is PER REQUEST (a hash of request_id), never per row: a
    # captured trace must be readable as a whole, not a random subset of rows.
    # TRACKED DEFAULT OFF — a tracked default must not change what a deployment DOES.
    tracePayload:
      sampling: 0.0         # 0.0 = off, 1.0 = every request, 0.1 = one in ten (deterministic per request)
      retentionDays: 7      # pruned by the housekeeping sweep; 0 = keep until manually pruned (NOT recommended)
      maxChars: 2000        # per-payload cap; the ORIGINAL length is recorded so a judge can spot a cut
      redact: true          # best-effort bearer/api-key/password/DSN-userinfo redaction — leave ON
    # Deterministic, model-free scoring of what the trace already proves: did the tool
    # call succeed, was it granted, did the turn loop on an identical call, did it blow
    # the step budget. No payloads needed and no model call. Writes one verdict row per
    # relay step ON THE HOT PATH, hence TRACKED DEFAULT OFF (a tracked default must not
    # change what a deployment DOES); read the verdicts before gating a build on them.
    agentEval:
      enabled: false
      maxSteps: 40          # a relay turn over this many model rounds is flagged step_budget; 0 disables the rule
      loopThreshold: 3      # this many calls to one (server, tool) pair in a turn = loop; 0 disables the rule
    # Calibrated behaviour judge (B1, 2026-11-23): the SECOND half of the quality
    # layer — a model reading what the agent saw and did, because the deterministic
    # scorer above cannot answer "was the answer RIGHT, and was the path
    # defensible". Design: documentation/design/agent-judge.md.
    # TRACKED DEFAULT OFF, and it stays off until CALIBRATED: a judge that is wrong
    # produces a number that looks like evidence, and a release gate reading it
    # would launder a bad change into a green build.
    #   enabled       master switch; off = no model call and no spend
    #   model         "" = the gateway's default route. Use the CHEAPEST self-hosted
    #                 model that clears the agreement floor, not the biggest
    #   dailyUsd      hard spend ceiling per day, USD. 0.0 = no spend permitted, and
    #                 that is the REAL switch: it keeps the sweep inert even when
    #                 enabled is true
    #   maxTurnsPerRun turns scored per sweep run (a 10% sample over a week beats
    #                 100% for two days followed by silence when the budget runs out)
    #   sampleRate    fraction of eligible turns judged, sampled per REQUEST so a
    #                 judged turn is judged whole
    #   minConfidence verdicts below this are stored but never counted toward a gate
    #                 (0.0 = no floor; a confidence the judge failed to state is 0.0,
    #                 so an unstamped claim can never clear a gate)
    judge:
      enabled: false
      model: ""
      dailyUsd: 0.0
      maxTurnsPerRun: 25
      sampleRate: 0.1
      minConfidence: 0.0

# ============================================================================
# Kyverno / Metrics
# ============================================================================

# Stamps hpe-ezua labels so the EZUA console shows "Ready" instead of "Unknown".
# Cluster-scoped — enable only where Kyverno is installed.
kyverno:
  enabled: false

metrics:
  # /metrics + ServiceMonitor — ALSO gates app env PCAI_LLM_METRICS_ENABLED
  # (chart-off = app-off). Requires the prometheus-operator ServiceMonitor CRD.
  enabled: false
  interval: 30s
  # PrometheusRule for the gateway's own series; requires the PrometheusRule CRD.
  # A non-empty rules: replaces the shipped default ruleset wholesale.
  prometheusRule:
    enabled: false
    rules: []

# ============================================================================
# Service / Ingress
# ============================================================================

service:
  type: ClusterIP
  port: 9200
  targetPort: 9200

# Plain-k8s Ingress — ADDITIVE, OFF by default (the PCAI primary exposure is the
# Istio VirtualService). Enable ONLY with ezua.enabled: false; /admin is not routed.
ingress:
  enabled: false
  className: nginx               # your IngressClass ('' = omit the field)
  host: ""                       # required when enabled (the route host)
  tlsSecretName: ""              # optional TLS Secret in the release namespace

# ============================================================================
# Resources / Scaling
# ============================================================================

resources:
  requests: {cpu: 250m, memory: 512Mi}
  limits: {cpu: '2', memory: 2Gi}

# Preferred (soft) anti-affinity spreads replicas across nodes without blocking scheduling:
#   affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution:
#     - {weight: 100, podAffinityTerm: {labelSelector: {matchLabels: {app: pcai-llm-gateway}}, topologyKey: kubernetes.io/hostname}}
affinity: {}

topologySpreadConstraints: []

# PodDisruptionBudget — ADDITIVE, OFF by default (meaningful only with replicas >= 2;
# the template refuses enabled+single-replica).
podDisruptionBudget:
  enabled: false
  minAvailable: 0
  maxUnavailable: 1

# HorizontalPodAutoscaler — ADDITIVE, OFF by default (needs a Metrics API provider).
# When enabled the Deployment omits spec.replicas — the HPA owns the count.
autoscaling:
  enabled: false
  minReplicas: 2
  # INvariant with settings.dbPool.max: aggregate Postgres demand is maxReplicas x max
  # (each pod pools its own connections) — keep that product within the database's
  # max_connections or pods fail to ACQUIRE at the scale-up spike (the render warns).
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

# ============================================================================
# Pod Security / Identity
# ============================================================================

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL

serviceAccount:
  create: false           # the gateway makes NO Kubernetes API calls (all state is in Postgres)
  name: pcai-llm-gateway
  automountServiceAccountToken: false   # don't hand a token to a pod that never uses it

rbac:
  create: false           # see serviceAccount above — same rationale

# NO persistence — every durable state (ledger, budgets, keys, endpoint pools, MCP
# registry) lives in Postgres; readOnlyRootFilesystem needs only an emptyDir at /tmp.

# ============================================================================
# Proxy / Network Isolation
# ============================================================================

# Each key is wired into the pod only when non-empty; keep in-cluster peers OFF the proxy.
#   {http: http://proxy.corp.example:8080, https: http://proxy.corp.example:8080,
#    noProxy: ".cluster.local,.svc,.svc.cluster,.svc.cluster.local,10.0.0.0/8,127.0.0.1,localhost"}
proxy: {}

# Network isolation (ADDITIVE; embedded Postgres NOT covered). Baseline ingress: istio
# ingress-gateway pods, same-namespace callers, kubelet probes. Baseline egress: kube-dns 53,
# embedded PG 5432, in-cluster HTTP(S) to inClusterEgressCidrs. Unmatched traffic is denied.
networkPolicy:
  enabled: false
  ingressGatewayNamespace: istio-system
  ingressGatewayLabels:
    app: ezaf-gateway

  # Node CIDRs allowed on the app port. Empty = no probe allowance; 0.0.0.0/0
  # REQUIRES probeExceptCidrs (the template fails rendering otherwise).
  probeCidrs: []
  # Pod CIDR(s) excluded from the probe allowance so pod traffic stays governed by
  # rules (i)/(ii): kubectl cluster-info dump | grep -m1 cluster-cidr
  probeExceptCidrs: []

  inClusterEgressCidrs:
    - 10.0.0.0/8
  # EXTRA rules — when NON-EMPTY these REPLACE the baseline above (Helm lists replace
  # on merge). E.g. an ingress scrape from the monitoring namespace on 9200/TCP, or
  # egress to your site DB host.
  ingress: []
  egress: []

# ============================================================================
# PCAI Networking
# ============================================================================

ezua:
  enabled: false

  virtualService:
    # REQUIRED when ezua.enabled=true (template fails loud): the route host, e.g.
    # pcai-llm-gateway.<your-domain>. CLI deploys must resolve the DOMAIN_NAME
    # placeholder FIRST.
    endpoint: ""
    istioGateway: istio-system/ezaf-gateway
    timeout: 960s           # >= settings.upstream.timeoutS or Istio 504s long streams
    # SAME-ORIGIN SSO SIGN-OUT: routes /oauth2/ on THIS host to the platform's
    # oauth2-proxy, so "Sign out" really terminates the domain-wide session cookie.
    # Without it the path falls to the gateway (a redirect — nothing breaks, the
    # session just is not ended). Find it: kubectl -n oauth2-proxy get svc
    ssoProxy:
      enabled: false
      host: ""            # e.g. oauth2-proxy.oauth2-proxy.svc.cluster.local
      port: 80

  # Route /admin on the PUBLIC VirtualService. /admin mutates the control plane — flip
  # true ONLY where real gateway auth sits in front.
  routeAdmin: false

  # Istio AuthorizationPolicy (ADDITIVE; requires ezua.enabled AND sidecar injection).
  # WARNING: the headers auth.trustProxyIdentity consumes are client-spoofable at the
  # pod — safe ONLY where an enforcing proxy overwrites them; empty rules render the
  # ALLOW-only baseline.
  authorizationPolicy:
    enabled: false
    ingressNamespace: istio-system
    ingressGatewayPrincipals: []          # SPIFFE IDs for rule (i); empty = namespace-wide
    excludeInboundPorts: []               # NEVER a traffic port — it bypasses ALL rules
    # REQUIRED whenever metrics.enabled AND this policy are on: unlisted means denied
    # and the /metrics scrapes die. Renders an ANY-SOURCE rule scoped to /metrics.
    allowMetricsScrape: false
    metricsNamespace: prometheus
    # ANY source on the traffic port EXCEPT the identity-bearing paths (/v1/identity,
    # /v1/keys/for-me, /v1/enroll, /admin) — for apps calling the SERVICE directly.
    allowInClusterApi: false
    # EXTRA rules — when NON-EMPTY these REPLACE the baseline above. E.g. a principal+GET allow:
    #   rules: [{from: [{source: {principals: ["cluster.local/ns/istio-system/sa/httpbin"]}}], to: [{operation: {methods: ["GET"]}}]}]
    rules: []
