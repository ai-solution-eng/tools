# ============================================================================
# pcai-llm-gateway — SE G2 site values (EXAMPLE — sanitized, no credentials)
# Full guide: documentation/DEPLOYMENT.md.
# Owner: Andrew Bydlon <andrew.bydlon@hpe.com>
# Contributors: Francesco Caliva <francesco.caliva@hpe.com>, Bryan Lliguicota <bryan.lliguicota@hpe.com>
# Lives in helm/values-examples/ (hardlink-synced to GitHub): intentionally SECRET-FREE.
# ============================================================================

# ### REQUIRED ### — key material lives in Secrets you own, NOT in values
# (missing Secret = the pod refuses to start):
#   1. adminApiKey.existingSecret — admin keys; /admin rejects everything without it
#   2. database.existingSecret — the control-plane DSN (external mode, the default)
#   3. ezua.virtualService.endpoint — the route host (render-guard when ezua.enabled)
#   4. ingress.host — the route host (render-guard when ingress.enabled)
#   5. upstreamKeySecrets[] / mcpKeySecrets[] — every entry needs secretName + secretKey

# ### OPTIONAL ###
# SSO self-mint rollout is ONE ORDERED FLIP: settings.auth.trustProxyIdentity +
# settings.auth.ssoKeyCreate.enabled + ezua.authorizationPolicy — DEPLOYMENT.md.
# Embedded Postgres (database.embedded.*), metrics + alert rules, scaling
# (autoscaling.* / podDisruptionBudget.*), network isolation — DEPLOYMENT.md.

# Operator creates these out-of-band BEFORE applying (see NOTES.txt / DEPLOYMENT.md):
#   pcai-llm-gateway-db    key: database-url    -> postgresql://user:pass@host:5432/pcai_llm
#   pcai-llm-gateway-admin key: admin-api-keys  -> comma-separated admin keys

# ============================================================================
# Deployment / Image
# ============================================================================

deployment:
  name: pcai-llm-gateway
  appName: pcai-llm-gateway
  replicaCount: 1
  rolloutOnUpgrade: false         # true + pullPolicy Always re-rolls pods on every apply

image:
  repository: ghcr.io/ai-solution-eng/pcai-llm-gateway
  tag: ""                         # empty = chart default (Chart.yaml appVersion)
  pullPolicy: IfNotPresent

imagePullSecrets: []

# G2 registers upstream/MCP tokens in the admin panel, so no by-reference key Secrets here.
upstreamKeySecrets: []

mcpKeySecrets: []

# ============================================================================
# Secrets / Database
# ============================================================================

adminApiKey:
  existingSecret: pcai-llm-gateway-admin        # your admin-keys Secret name
  existingSecretKey: admin-api-keys
  create: false                  # false = you manage the Secret

# Fernet master key for panel-stored credentials (endpoints/MCP tokens, per-key creds).
secretsMasterKey:
  existingSecret: pcai-llm-gateway-secrets
  existingSecretKey: master-key
  create: false

database:
  existingSecret: pcai-llm-gateway-db           # your Postgres URL Secret name
  existingSecretKey: database-url
  # The database's max_connections as the chart knows it: HPA 4 x dbPool.max 25 = 100
  # <= 200, so this example renders without a connection-budget warning.
  maxConnectionsBudget: 200
  # The LIVE G2 release runs embedded PG; this sample renders external-DB.
  embedded:
    enabled: false
    # maxReplicas 4 x dbPool.max 25 = 100 = the default ceiling, hence 200.
    # CHANGING IT RESTARTS the PG StatefulSet (brief 503 window).
    maxConnections: 200
    image: postgres:16
    serviceName: pcai-llm-gateway-pg

    auth:
      # The password seeds the data dir on FIRST init only — rotating it needs ALTER USER.
      username: pcai_llm
      database: pcai_llm
      existingSecret: pcai-llm-gateway-pg-auth   # operator-created; key: password (only when enabled)
      existingSecretKey: password
      create: false              # false = you manage the password Secret

    persistence:
      size: 5Gi
      storageClass: ""

    resources:
      requests: {cpu: 250m, memory: 512Mi}
      limits: {cpu: 4, memory: 4Gi}

# ============================================================================
# Runtime Settings
# One PCAI_LLM_* env var per key, grouped by subsystem (see helm/values.yaml).
# ============================================================================

settings:

  # --- Server: listener, body size, concurrency ------------------------------
  server:
    host: 0.0.0.0
    port: 9200
    logLevel: INFO                  # DEBUG to trace a routing/budget issue
    keepAliveTimeoutS: 75
    limitConcurrency: 0             # 0 = unbounded (the env is omitted)
    maxBodyBytes: 33554432          # 32 MiB proxied-body cap

  # --- Upstream: timeouts, breaker, TLS --------------------------------------
  upstream:
    timeoutS: 900                   # long completions; covers streaming
    caBundle: ""                    # private-CA bundle path; empty = system trust store
    breakerFailureThreshold: 5      # consecutive failures before an endpoint cools down
    breakerCooldownS: 60
    failoverTtftS: 45               # 2xx stream must emit its FIRST SSE line within this
    zeroCompletionRetry: true       # retry once on 2xx + empty content + finish_reason=stop

  # --- Postgres pool ---------------------------------------------------------
  dbPool:
    min: 5
    max: 25                         # keep maxReplicas x max inside PG's max_connections
    acquireTimeoutS: 2              # bounded acquire: saturation is a fast 503, not a queue

  # --- Retention: operational tables (the usage LEDGER is never pruned) -------
  retention:
    # agent_traces is observability, not the audit artifact; 30 covers a monthly window.
    traceDays: 30
    conversationDays: 0
    canonicalDays: 0                # distiller INPUT store, DISTILLED-ONLY deletes; 0 = forever

  # --- Cache: embeddings, exact-match answers, cache-aware metering ----------
  cache:
    embedding:
      enabled: true                 # identical embedding calls answered from cache
      maxInputBytes: 65536
    # Deterministic (temperature 0), non-streaming, non-relay requests only. shadow =
    # count WOULD-BE hits and serve nothing; read gateway_response_cache_total{mode="shadow"}.
    response:
      mode: shadow
      ttlS: 3600
    # Cached tokens are refunded from the TPM window and discounted vs period budgets
    # (0.9 = one-tenth weight). predictCached charges ADMISSION on the key's own measured
    # cache ratio; reconcile settles the difference: it moves WHEN, never HOW MANY.
    metering:
      excludeCachedTokens: true
      budgetExemptFraction: 0.9
      predictCached: true
      predictReconcile: true

  # --- Relay: the model tool-calling loop -----------------------------------
  relay:
    enabled: true                   # server-side model<->MCP loop (X-PCAI-Execute-Tools)
    surface: hybrid                 # one pcai_tools discovery tool; full inlines all 111 tools
    maxIterations: 16
    wallClockS: 900                 # clamped to the Istio VS timeout minus 30s headroom
    callRetries: 1                  # per turn; spends only the remaining wall clock
    grantMode: explicit             # explicit = hand-granted pairs; scope = policy-admitted fleet
    # FALSE for DSH: its stream client EXECUTES any tool_call delta it sees, and flat
    # '<server>__<tool>' names error as unknown.
    streamWireTools: false

    # Show the model its OWN prior reasoning (in-loop and inbound): with this off a long
    # turn teaches it to skip thinking. 32768 is 16x the chart cap; it rides every iteration.
    reasoning:
      enabled: true
      maxChars: 32768

    # Keys may register local tools (bash/edit/...) served back as `client__<tool>`;
    # inert for keys without a live offer, routes 404 while off.
    clientDispatch:
      enabled: false
      timeoutS: 120.0

  # --- MCP federation (/mcp) and the registry -------------------------------
  mcp:
    flatTools: false                # false = two-tool surface (mcp_catalog + mcp_call)
    catalogCacheS: 60.0
    failoverAttempts: 2
    callerAttribution: true         # stamps X-MCP-Caller; upstreams RECORD it, never authorize off it

  # --- Routing: pseudo-models, fallback, stickiness, load -------------------
  routing:
    enabled: true                   # routing / routing__<model>; per-profile routing_policy gates
    tier1Tokens: 1500
    tier2Tokens: 6000
    turnAdderTokens: 100
    agentsEnabled: false            # the key's OFFERED agents join the candidate window
    fallbackMax: 2                  # chain hops walked; 0 = chains never walked
    # X-PCAI-Session pins a conversation to the ENDPOINT that served it (not just the
    # cascade head) so its prefix keeps hitting the same server's KV cache.
    sessionAffinity:
      enabled: true
      ttlS: 3600
    # The load-aware cascade picks its head model at conversation START from the per-model
    # off-peak state below. ON for G2 — OFF by fleet default; that divergence is deliberate.
    loadAwareCascade:
      enabled: true
    # Named sets of equivalent chat models, load-balanced by a Prometheus snapshot; OFF.
    modelGroups:
      enabled: false
      loadRefreshS: 5
      loadStaleS: 30

  # --- Endpoint health probe (active) --------------------------------------
  # ON here with all four guards: the probe sends the endpoint's OWN credential, 401/403
  # count as ALIVE, other 4xx leaves state untouched, the pool is never emptied.
  healthProbe:
    enabled: true
    intervalS: 30
    timeoutS: 5
    failuresToTrip: 2               # 1 = exclude on a blip

  # --- Auth: identity rungs, tokens, SSO -----------------------------------
  # All defaults: no proxy-identity trust, no token shadowing, no JWT validation
  # (tokenValidation engages only with all three of issuer / jwksUrl / audience).
  # trustProxyIdentity is client-spoofable at the pod — enable it ONLY behind an enforcing
  # proxy that overwrites the identity headers, plus an AuthorizationPolicy.

  # --- Memory: enrollment seeds and the session distiller ------------------
  memory:
    # LEGACY per-user dataset provisioning; the supported path is a per-key X-API-Key
    # header override. Needs a registered mm-rag row + secretsMasterKey.
    enroll:
      provisionDataset: false
      server: "mm-rag"
      nameRetries: 3
    # One canonical transcript -> memory pipeline. Master switch only: the summarizer
    # model, scheduling, quiet window and output cap are admin-editable in the panel.
    distiller:
      enabled: true
      server: "mm-rag"
      tool: "add_memory"
      probeTool: "memory_status"
      gateBackoffS: 900             # skip backoff: a skipped row leaves the due window this long
      # OFF here: the canonical store retains every conversation, so a failed distill can
      # safely retry. Raw fallback would land 100+ mm-rag chunks of transcript noise.
      rawFallback: false
      # Minimum BODY chars after the index header is stripped (a real card measures ~130).
      # Do NOT raise toward 150+: that REJECTS the real card rather than the title stub.
      minDocChars: 100
    capture:
      skipTitleRequests: true       # session-title calls are not conversations

  # --- Off-peak billing ----------------------------------------------------
  # Needs a registered, enabled `prometheus` MCP server; G2 has that server registered.
  offpeak:
    enabled: true
    checkS: 30
    promql: avg(avg_over_time(DCGM_FI_DEV_GPU_UTIL[5m]))
    enterPct: 20
    exitPct: 35
    fraction: 0.5
    mcpServer: prometheus
    tool: prom_query
    # Per-model evaluators: model -> PromQL returning 0-100 load % for THAT model's GPUs.
    # DCGM has no pod label (scope by Hostname + device); zero series = full price.
    modelPromql:
      GLM-5.3-Flash: 'avg(avg_over_time(DCGM_FI_DEV_GPU_UTIL{Hostname="pcai-se-scs04.hst.lab",device=~"nvidia[4-7]"}[5m]))'
      Qwen3.8-27B: 'avg(avg_over_time(DCGM_FI_DEV_GPU_UTIL{Hostname="pcai-se-scs05.hst.lab",device=~"nvidia[4-7]"}[5m]))'
    # L3 volume occupancy for the Off-peak tab (empty = no disk section):
    #   diskSelector: 'namespace="mooncake",persistentvolumeclaim=~"ssd-mooncake-store-.*"'

  # --- Audio passthrough billing -------------------------------------------
  # TTS/ASR report no token usage, so the gateway bills an ESTIMATE: TTS by characters,
  # ASR by audio duration. Tune to your real rates.
  audio:
    ttsCharsPerToken: 4             # ~4 characters of spoken text per token
    asrTokensPerSecond: 3.0         # ~180 tokens/minute of audio (~150 words)

  # --- Tracing (OpenTelemetry) --------------------------------------------
  # ON for G2: the collector in otel-traces forwards to Langfuse. These MUST stay in the
  # site values document — an install from chart defaults silently disables tracing. The
  # endpoint needs the full in-cluster name; the collector filters health/metrics itself.
  tracing:
    enabled: true
    endpoint: http://otel-collector.otel-traces.svc.cluster.local:4318
    serviceName: pcai-llm-gateway
    sampleRatio: 1.0

# ============================================================================
# Service
# ============================================================================

service:
  type: ClusterIP
  port: 9200
  targetPort: 9200

# ============================================================================
# Resources / Autoscaling
# ============================================================================

# HPA trigger line: 70% of the 500m request = 350m.
resources:
  requests: {cpu: 500m, memory: 512Mi}
  limits: {cpu: '2', memory: 2Gi}

# ENABLED for G2. maxReplicas 4 x dbPool.max 25 = worst-case Postgres demand; do NOT
# raise maxReplicas until embedded PG's max_connections is raised too.
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70

# minAvailable 1 blocks draining the LAST replica and still allows a rolling update at
# the 2-replica floor (2 would deadlock: it could never replace one of two).
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# ============================================================================
# Security / Service Account
# ============================================================================

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL

# The gateway makes NO Kubernetes API calls (no identity, no token).
serviceAccount:
  create: false
  name: pcai-llm-gateway
  automountServiceAccountToken: false

rbac:
  create: false

# ============================================================================
# Ingress / Kyverno
# ============================================================================

# G2 uses the EzUA Istio VirtualService (ezua below); plain-k8s Ingress unused.
ingress:
  enabled: false
  className: nginx
  host: ""
  tlsSecretName: ""              # optional TLS Secret in the release namespace

# Kyverno vendor-label policy — cluster-scoped; G2 ships the hpe-ezua labels directly.
kyverno:
  enabled: false

# ============================================================================
# Metrics
# ============================================================================

metrics:
  enabled: true                     # pair with allowMetricsScrape once the policy is on
  interval: 30s
  # Gateway alert rules (memory-feed stalled/backlog/write-failure): the only signal that
  # the distiller stopped. Requires the PrometheusRule CRD; a non-empty `rules:` REPLACES
  # the default ruleset wholesale.
  prometheusRule:
    enabled: true
    rules: []
    # Must match the Prometheus CR's spec.ruleSelector or the operator never LOADS the
    # rules — object presence is not enough.
    labels:
      release: prometheus

# ============================================================================
# Network Isolation
# ============================================================================

# ENABLED for G2: 9200 from ezaf-gateway + the listed namespaces + the worker nodes;
# everything else DENIED. Verify the CIDRs first (`kubectl get nodes -o wide`).
networkPolicy:
  enabled: true
  ingressGatewayNamespace: istio-system
  ingressGatewayLabels:
    app: ezaf-gateway               # kubectl -n istio-system get pod -l 'app=ezaf-gateway'

  probeCidrs:
    # The two G2 worker nodes (masters carry the control-plane taint) — INTERNAL-IP as /32s.
    - 172.28.1.161/32               # pcai-se-scs04.hst.lab (worker)
    - 172.28.1.162/32               # pcai-se-scs05.hst.lab (worker)

  probeExceptCidrs:
    # The cluster pod CIDR — without it any pod in the probe allowance bypasses (i)/(ii).
    - 10.224.0.0/16                 # G2 pod range (scs04 = 10.224.1.0/24 per-node slice)
  inClusterEgressCidrs: [10.0.0.0/8]  # RFC1918 pod/service egress for upstreams
  # ⚠️ a non-empty `ingress` REPLACES the chart baseline — this list IS the ingress posture.
  ingress:
    # (i) laptops/desktops — via the ezaf-gateway + VirtualService
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
      ports:
        - port: 9200
          protocol: TCP
    # (ii) same-namespace callers (ops tooling, jobs in pcai-llm)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: pcai-llm
      ports:
        - port: 9200
          protocol: TCP
    # (iii-a) OpenWebUI
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: owebui0-11-0
      ports:
        - port: 9200
          protocol: TCP
    # (iii-b) DSH
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: dsh-web-helm
      ports:
        - port: 9200
          protocol: TCP
    # (iii-c) opencode-web
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: opencode-web-helm
      ports:
        - port: 9200
          protocol: TCP
    # (iv) kubelet probes — the two WORKER nodes only. ⚠️ REQUIRED: with a non-empty
    # `ingress` the baseline probe rule does NOT render and readiness fails without these.
    - from:
        - ipBlock:
            cidr: 172.28.1.161/32   # pcai-se-scs04.hst.lab (worker)

        - ipBlock:
            cidr: 172.28.1.162/32   # pcai-se-scs05.hst.lab (worker)
      ports:
        - port: 9200
          protocol: TCP
  egress: []

# ============================================================================
# Proxy
# ============================================================================

# Any non-cluster egress goes through the proxy; in-cluster peers MUST stay on NO_PROXY.
# PLACEHOLDER addresses — set your corporate proxy.
proxy:
  http: http://proxy.corp.example:8080
  https: http://proxy.corp.example:8080
  # Keep the cluster-local entries so in-cluster peers stay direct.
  noProxy: ".cluster.local,.svc,.svc.cluster,.svc.cluster.local,10.0.0.0/8,127.0.0.1,localhost"

# ============================================================================
# PCAI Networking
# ============================================================================

# Deploys the Istio VirtualService on the ezaf-gateway when enabled.
# ezua.authorizationPolicy below ships ON with BOTH relief rules — the live G2 posture.
ezua:
  enabled: true
  virtualService:
    endpoint: pcai-llm-gateway.your-cluster.example   # your route host
    istioGateway: istio-system/ezaf-gateway
    # >= settings.upstream.timeoutS (900s) or Istio 504s long streams
    timeout: 960s

  authorizationPolicy:
    enabled: true                   # live-verified G2 posture — enable ATOMICALLY

    allowMetricsScrape: true        # REQUIRED once metrics.enabled + policy are on:
                                    # kube-prometheus scrapes raw pod IPs (no peer identity)
    allowInClusterApi: true         # unmeshed in-cluster callers; identity paths stay edge-only
    ingressNamespace: istio-system
    # WITH trustProxyIdentity on, EMPTY IS INSECURE — the whole istio-system namespace could
    # then deliver spoofed X-Auth-Request-* headers (NOTES.txt warns). Pin the ingress gateway
    # SA's VERIFIED SPIFFE ID — NOT sa/ezaf-gateway, that SA does not exist:
    #   - cluster.local/ns/istio-system/sa/istio-ingressgateway-service-account
    # Find it: kubectl -n istio-system get pod -l 'istio=ingressgateway' \
    #   -o jsonpath='{.items[0].spec.serviceAccountName}'
    ingressGatewayPrincipals: []
    excludeInboundPorts: []         # KEEP EMPTY — an excluded port bypasses ALL rules
    rules: []                       # non-empty REPLACES the baseline ALLOW rules
