# ============================================================================
# pcai-llm-gateway — Hosted-trial site values (EXAMPLE — sanitized, no creds)
# Full guide: documentation/DEPLOYMENT.md.
# Owner: Andrew Bydlon <andrew.bydlon@hpe.com>
# Contributors: Francesco Caliva <francesco.caliva@hpe.com>, Bryan Lliguicota <bryan.lliguicota@hpe.com>
# Lives in helm/values-examples/ (hardlink-synced to GitHub): intentionally SECRET-FREE.
# ============================================================================

# ### REQUIRED ### — key material lives in Secrets you own, NOT in values
# (missing Secret = the pod refuses to start):
#   1. adminApiKey.existingSecret — admin keys; /admin rejects everything without it
#   2. database.embedded.auth.existingSecret — the Postgres password (embedded mode)
#   3. ezua.virtualService.endpoint — the route host (render-guard when ezua.enabled)
#   4. ingress.host — the route host (render-guard when ingress.enabled)
#   5. upstreamKeySecrets[] / mcpKeySecrets[] — every entry needs secretName + secretKey

# ### OPTIONAL ###
# SSO self-mint rollout is ONE ORDERED FLIP: settings.auth.trustProxyIdentity +
# settings.auth.ssoKeyCreate.enabled + ezua.authorizationPolicy — DEPLOYMENT.md.

# ============================================================================
# Deployment / Image
# ============================================================================

# One replica serves all three surfaces (/v1, /mcp, /admin); the gateway is stateless.
deployment:
  name: pcai-llm-gateway
  appName: pcai-llm-gateway
  replicaCount: 1
  rolloutOnUpgrade: false         # true + pullPolicy Always re-rolls pods on every apply

image:
  repository: ghcr.io/ai-solution-eng/pcai-llm-gateway
  tag: ""                         # empty = inherit Chart.yaml appVersion
  pullPolicy: IfNotPresent

# Only if the image registry needs auth on your unit (mirror/pull secret).
imagePullSecrets: []

# ============================================================================
# Secrets / Database
# ============================================================================

# Path A (default): operator creates the Secrets out-of-band. Path B (trial-friendly):
# create: true and ONE helm install generates them, lookup()-preserved — but NOT if your
# pipeline renders without cluster read access.
adminApiKey:
  existingSecret: pcai-llm-gateway-admin        # your admin-keys Secret name
  existingSecretKey: admin-api-keys
  create: false                  # true = chart generates/preserves (see NOTES)

secretsMasterKey:
  existingSecret: pcai-llm-gateway-secrets      # your master-key Secret name
  existingSecretKey: master-key
  create: false                  # true = chart generates/preserves

# TRIAL DEFAULT: embedded Postgres in the release namespace (enabled=false = site DB).
database:
  existingSecret: pcai-llm-gateway-db           # used ONLY when embedded=false
  existingSecretKey: database-url               # value: postgresql://... (in the Secret)

  embedded:
    enabled: true                 # false to use an external/site Postgres
    image: postgres:16            # mirror if your unit cannot reach Docker Hub
    serviceName: pcai-llm-gateway-pg

    auth:
      username: pcai_llm
      database: pcai_llm
      existingSecret: pcai-llm-gateway-pg-auth   # name (only when enabled)
      existingSecretKey: password
      create: false               # true = chart generates/preserves the password

    persistence:
      size: 5Gi
      storageClass: ""            # your unit's StorageClass ('' = default)

    # maxReplicas x settings.dbPool.max + PG's own sessions; 0 = image default (100).
    maxConnections: 0

    resources:                    # small trial sizing
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: 4, memory: 4Gi}

# Upstream model-endpoint / MCP API keys — BY REFERENCE (a trial pastes them in the panel).
upstreamKeySecrets: []

mcpKeySecrets: []

# ============================================================================
# Runtime Settings
# One PCAI_LLM_* env var per key, grouped by subsystem (see helm/values.yaml).
# ============================================================================

settings:

  # --- Server: listener, body size, concurrency ------------------------------
  server:
    host: 0.0.0.0
    port: 9200
    logLevel: INFO
    keepAliveTimeoutS: 75
    limitConcurrency: 0             # 0 = unset/unbounded (the env is omitted)
    maxBodyBytes: 33554432

  # --- Upstream: timeouts, breaker, TLS --------------------------------------
  upstream:
    timeoutS: 900
    caBundle: ""                    # private-CA bundle path; empty = system trust store
    breakerFailureThreshold: 5
    breakerCooldownS: 60
    zeroCompletionRetry: true       # retry once on 2xx + empty content + finish_reason=stop

  # --- Postgres pool ---------------------------------------------------------
  dbPool:
    min: 5
    max: 25
    acquireTimeoutS: 2

  # --- Retention: operational tables (0 = never delete) ----------------------
  retention:
    traceDays: 0                    # e.g. 30 to bound an embedded-PG PVC
    conversationDays: 0
    canonicalDays: 0                # distiller INPUT store, DISTILLED-ONLY deletes

  # --- Cache: embeddings, cache-aware metering ------------------------------
  cache:
    embedding:
      enabled: true
      maxInputBytes: 65536
    # Cached tokens refunded from the TPM window, discounted vs period budgets
    metering:
      excludeCachedTokens: true
      budgetExemptFraction: 0.9

  # --- Relay: the model tool-calling loop -----------------------------------
  relay:
    enabled: true
    surface: hybrid                 # one pcai_tools discovery tool; full inlines all 111 tools
    maxIterations: 16
    wallClockS: 900
    grantMode: explicit             # explicit = hand-granted pairs; scope = policy-admitted fleet
    # FALSE for DSH: its stream client EXECUTES any tool_call delta it sees.
    streamWireTools: false
    callRetries: 1                  # per turn; spends only the remaining wall clock
    clientDispatch:
      enabled: false
      timeoutS: 120.0

  # --- Endpoint health probe (active) --------------------------------------
  # OFF until a site has seen its own fleet probed OK (GET /admin/endpoints).
  healthProbe:
    enabled: false
    intervalS: 30
    timeoutS: 5
    failuresToTrip: 2

  # --- Routing: pseudo-models, fallback ------------------------------------
  routing:
    enabled: true                   # per-profile routing_policy gates the behavior
    tier1Tokens: 1500
    tier2Tokens: 6000
    turnAdderTokens: 100
    agentsEnabled: false            # the key's OFFERED agents join the candidate window
    fallbackMax: 2                  # chain hops walked; 0 = chains never walked

  # --- MCP federation (/mcp) and the registry -------------------------------
  mcp:
    flatTools: false                # false = two-tool surface (mcp_catalog + mcp_call)
    catalogCacheS: 60.0
    failoverAttempts: 2
    callerAttribution: true         # stamps X-MCP-Caller; upstreams RECORD it, never authorize off it

  # --- Off-peak billing ----------------------------------------------------
  # Enable ONLY if the unit runs Prometheus + the prometheus MCP server (a registry row).
  offpeak:
    enabled: false
    checkS: 30
    promql: avg(avg_over_time(DCGM_FI_DEV_GPU_UTIL[5m]))
    enterPct: 20
    exitPct: 35
    fraction: 0.5
    mcpServer: prometheus
    tool: prom_query
    # Per-model evaluators (optional): model -> PromQL 0-100 load % for THAT model's GPUs.

  # --- Auth: identity rungs, tokens, SSO -----------------------------------
  # All defaults. Keycloak JWT validation (settings.auth.tokenValidation) validates
  # Authorization: Bearer and is INERT until all three of issuer / jwksUrl / audience are
  # set — it does NOT need trustProxyIdentity. That dependency belongs to
  # settings.auth.ssoKeyCreate.enabled, which 403s without it.

  # --- Memory: enrollment seeds and the session distiller ------------------
  # Not set here: enrollment (settings.memory.enroll.*) needs a registered mm-rag row +
  # secretsMasterKey; the distiller stays at chart defaults.

# ============================================================================
# Service / Ingress
# ============================================================================

service:
  type: ClusterIP
  port: 9200
  targetPort: 9200

# Primary (PCAI) is the VirtualService below; a plain-k8s Ingress needs ezua.enabled: false.
ingress:
  enabled: false
  className: nginx                # your IngressClass
  host: ""                        # required when enabled (host override)
  tlsSecretName: ""               # optional TLS Secret in the release namespace

# ============================================================================
# Resources / Autoscaling
# ============================================================================

resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {cpu: '1', memory: 1Gi}

# Autoscaling OFF for the hosted-trial profile; see values.g2.yaml for the ENABLED shape.
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70

# ============================================================================
# Security / Service Account
# ============================================================================

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL

# The gateway makes NO Kubernetes API calls (no identity, no token).
serviceAccount:
  create: false
  name: pcai-llm-gateway
  automountServiceAccountToken: false

rbac:
  create: false

# ============================================================================
# Kyverno / Metrics
# ============================================================================

# Cluster-scoped (needs cluster-admin); the chart stamps hpe-ezua labels directly.
kyverno:
  enabled: false

# ServiceMonitor + /metrics; this key ALSO gates PCAI_LLM_METRICS_ENABLED (chart-off = app-off).
metrics:
  enabled: true                   # TRIAL: observability on by default
  interval: 30s
  # Default ruleset: error ratio, breaker-open, budget-rejection spike.
  prometheusRule:
    enabled: true
    rules: []

# ============================================================================
# Proxy
# ============================================================================

# Hosted trials run on customer clusters with their own egress — leave the proxy OFF.
proxy: {}

# ============================================================================
# PCAI Networking
# ============================================================================

ezua:
  enabled: true
  virtualService:
    # keep ${DOMAIN_NAME} — PCAI envsubsts pasted values. CLI deploys must sed-resolve it
    # FIRST (istio DENIES the literal and fails the release).
    endpoint: pcai-llm-gateway.${DOMAIN_NAME}
    istioGateway: istio-system/ezaf-gateway      # verify this gateway exists on your unit
    # >= settings.upstream.timeoutS (900s) or Istio 504s long streams
    timeout: 960s

  # SAFE here because authorizationPolicy.enabled=true below caller-gates the mesh (and the
  # site runs platform SSO at the ezaf-gateway). Sites WITHOUT the policy must leave false.
  routeAdmin: true

  # Istio AuthorizationPolicy (mesh L7, needs sidecar injection) on the gateway pods.
  authorizationPolicy:
    enabled: true                  # ALLOW-lists ezaf-gateway + same-namespace
    ingressNamespace: istio-system
    ingressGatewayPrincipals: []   # tighten to the ezaf-gateway SA SPIFFE IDs
    excludeInboundPorts: []        # NEVER a traffic port — an excluded port bypasses ALL rules
    rules: []                      # non-empty REPLACES the baseline rules

# Default-deny NetworkPolicy (CNI-layer, works without a sidecar) — trial exposure control.
networkPolicy:
  enabled: true                    # default-deny ingress/egress with the chart's baseline allows
  ingressGatewayNamespace: istio-system
  ingressGatewayLabels:
    app: ezaf-gateway              # verify with kubectl -n istio-system get pod -l 'app=ezaf-gateway'

  # kubelet probes/port-forward come from the NODE (ipBlock — no selector matches).
  probeCidrs:
    - 0.0.0.0/0

  # REQUIRED with 0.0.0.0/0: your pod CIDR, so pod traffic stays governed by (i)/(ii).
  probeExceptCidrs:
    - 10.0.0.0/8

  inClusterEgressCidrs:
    - 10.0.0.0/8                   # your pod/service CIDR — mirror proxy.noProxy
  ingress: []                      # non-empty REPLACES the baseline rules
  egress: []                       # non-empty REPLACES the baseline rules
