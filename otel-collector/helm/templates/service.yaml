apiVersion: v1
kind: Service
metadata:
  name: {{ include "otel-collector.fullname" . }}
  labels:
    {{- include "otel-collector.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "otel-collector.selectorLabels" . | nindent 4 }}
  ports:
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
      protocol: TCP
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
      protocol: TCP
    - name: otlp-http-llm
      port: 4320
      targetPort: otlp-http-llm
      protocol: TCP
