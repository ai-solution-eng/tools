apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "otel-collector.fullname" . }}
  labels:
    {{- include "otel-collector.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "otel-collector.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "otel-collector.labels" . | nindent 8 }}
      annotations:
        # Roll the pod when the collector config changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      containers:
        - name: collector
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --config=/etc/otel/collector.yaml
          ports:
            - name: otlp-http
              containerPort: 4318
              protocol: TCP
            - name: otlp-grpc
              containerPort: 4317
              protocol: TCP
            - name: otlp-http-llm
              containerPort: 4320
              protocol: TCP
            - name: health
              containerPort: 13133
              protocol: TCP
          env:
            - name: LANGFUSE_AUTH
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-langfuse" (include "otel-collector.fullname" .)) .Values.langfuse.existingSecret }}
                  key: auth
            # Second Langfuse project (LiteLLM). Rendered by secret.yaml unless
            # litellm.existingSecret names a Secret you manage yourself.
            - name: LANGFUSE_AUTH_LITELLM
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-langfuse-litellm" (include "otel-collector.fullname" .)) .Values.litellm.existingSecret }}
                  key: auth
          livenessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/otel
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "otel-collector.fullname" . }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
