{{- if not .Values.langfuse.existingSecret }}
# The Basic-auth value Langfuse expects: base64("<publicKey>:<secretKey>").
# Rendered from values so the collector config only ever references the env var.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "otel-collector.fullname" . }}-langfuse
  labels:
    {{- include "otel-collector.labels" . | nindent 4 }}
type: Opaque
data:
  auth: {{ printf "%s:%s" .Values.langfuse.publicKey .Values.langfuse.secretKey | b64enc | quote }}
{{- end }}
