{{- if not .Values.langfuse.existingSecret }}
# The Basic-auth value Langfuse expects: base64("<publicKey>:<secretKey>").
# Rendered from values so the collector config only ever references the env var.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "otel-collector.fullname" . }}-langfuse
  labels:
    {{- include "otel-collector.labels" . | nindent 4 }}
type: Opaque
# stringData, NOT data: Kubernetes base64-DECODES a data: field when it injects
# the value into the pod's environment. The collector sends the env var verbatim
# after "Basic ", so it must already be base64("<publicKey>:<secretKey>").
# With data: + b64enc the stored value decodes back to the raw pk:sk and the
# header becomes "Basic pk:sk" — invalid, and Langfuse answers 401.
# stringData: takes this text literally and encodes it once on write, so the
# decoded env var is exactly the base64 string the header needs.
stringData:
  auth: {{ printf "%s:%s" .Values.langfuse.publicKey .Values.langfuse.secretKey | b64enc | quote }}
{{- end }}
{{- if not .Values.litellm.existingSecret }}
---
# The LiteLLM project's Basic-auth value, same encoding rule as above:
# stringData + b64enc, so the decoded env var is base64("<pk>:<sk>").
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "otel-collector.fullname" . }}-langfuse-litellm
  labels:
    {{- include "otel-collector.labels" . | nindent 4 }}
type: Opaque
stringData:
  auth: {{ printf "%s:%s" .Values.litellm.publicKey .Values.litellm.secretKey | b64enc | quote }}
{{- end }}
