# ================================================================
# OpenTelemetry Collector — trace fan-out for the PCAI LLM gateway
#
# WHAT THIS IS
#   A stateless OTLP receiver that forwards traces to one or more backends.
#   Senders (e.g. pcai-llm-gateway) point at this Service and never hold
#   Langfuse credentials — the collector adds them.
#
# ADDING A BACKEND LATER (e.g. SigNoz)
#   Add an exporter under config.exporters, then add its name to
#   config.service.pipelines.traces.exporters. That is the only change;
#   no sender needs to be rebuilt or redeployed.
# ================================================================

image:
  # contrib (not core) so filter/transform processors are available if we
  # later need to drop or enrich spans before they reach a backend.
  repository: otel/opentelemetry-collector-contrib
  tag: "0.165.0"
  pullPolicy: IfNotPresent

replicaCount: 1

# -- Override the generated resource names (Service, Deployment, ConfigMap).
fullnameOverride: ""

# ================================================================
# Langfuse credentials
#
# Rendered into a Secret and injected as the LANGFUSE_AUTH env var; the
# collector config references it as ${env:LANGFUSE_AUTH}. The credential
# therefore never appears in the ConfigMap.
# ================================================================
langfuse:
  # The project the gateway's traces land in.
  publicKey: "pk-lf-4a3838c4-d9ab-4bcb-a974-23cc14eb121b"
  secretKey: "sk-lf-ee3ab4fd-38a5-4118-a20a-4d16fd426f75"
  # -- Use a pre-existing Secret instead of rendering one.
  # Must contain key `auth` = base64("<publicKey>:<secretKey>").
  existingSecret: ""

# ================================================================
# Collector configuration
#
# Rendered verbatim into a ConfigMap, so anything the collector supports can
# be set here — including extra receivers, processors and exporters.
# ================================================================
config:
  extensions:
    health_check:
      endpoint: 0.0.0.0:13133

  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317

  processors:
    # Keep the collector's own footprint bounded; limit_mib must stay below
    # the container memory limit below.
    memory_limiter:
      check_interval: 1s
      limit_mib: 400
      spike_limit_mib: 100

    # Drop the gateway's OWN health/metrics traffic before it is batched or
    # exported. Measured on the live fleet: kubelet probes and Prometheus
    # scrapes were 1,922 of 2,710 traces (71%), burying the ~56 real model
    # calls while paying Langfuse ingestion and storage for pure noise.
    #
    # WHY HERE and not in the gateway: policy belongs in the pipeline. Adding
    # a path is a values edit + restart — no image rebuild, no gateway code
    # change, and the app stays ignorant of what a backend finds interesting.
    # It also keeps the gateway's tracing tests untouched.
    #
    # error_mode ignore: one malformed expression must never stop the
    # pipeline. Matching on http.target (the path attribute the gateway's
    # middleware sets) rather than the span name keeps it method-agnostic.
    filter/drop_probes:
      error_mode: ignore
      traces:
        span:
          - 'attributes["http.target"] == "/ready"'
          - 'attributes["http.target"] == "/health"'
          - 'attributes["http.target"] == "/healthz"'
          - 'attributes["http.target"] == "/livez"'
          - 'attributes["http.target"] == "/readyz"'
          - 'attributes["http.target"] == "/metrics"'
          - 'attributes["http.target"] == "/metrics/"'

    batch:
      send_batch_size: 200
      timeout: 5s

  exporters:
    # otlp_http (underscore) is the current component name; the old otlphttp
    # alias logs a deprecation warning on 0.165.0 and will eventually be
    # removed. The pipeline reference below MUST match this key exactly —
    # the collector refuses to start on a mismatch ("references exporter
    # ... which is not configured"), and PCAI's values merge can leave the
    # two halves on different names: LISTS are replaced, MAPS are merged, so
    # a renamed exporter key can survive while the pipeline list updates.
    otlp_http/langfuse:
      # The collector appends /v1/traces to this endpoint.
      endpoint: http://langfuse-web.langfuse-v4.svc.cluster.local:3000/api/public/otel
      headers:
        Authorization: "Basic ${env:LANGFUSE_AUTH}"
        x-langfuse-ingestion-version: "4"

    # ---- Example: add SigNoz later, then list it under pipelines ----
    # otlphttp/signoz:
    #   endpoint: http://signoz-otel-collector.observability.svc.cluster.local:4318

  service:
    extensions: [health_check]
    pipelines:
      traces:
        receivers: [otlp]
        # Order matters: bound memory first, drop the noise early (so the
        # batcher never carries it), then batch what survives.
        processors: [memory_limiter, filter/drop_probes, batch]
        exporters: [otlp_http/langfuse]
    telemetry:
      logs:
        level: info

service:
  type: ClusterIP

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

nodeSelector: {}
tolerations: []
affinity: {}

# -- Annotations added to the pod (e.g. for Prometheus scraping).
podAnnotations: {}
