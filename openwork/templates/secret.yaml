{{- if not .Values.existingAuthSecret }}
{{- if or (not .Values.sessionSecret) (not .Values.auth.username) (not .Values.auth.password) (not .Values.admin.username) (not .Values.admin.password) }}
{{- fail "set existingAuthSecret to a Secret you create in this namespace, or fill sessionSecret/auth/admin in values.yaml" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openwork-web.authSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    hpe-ezua/type: vendor-service
    hpe-ezua/app: {{ .Chart.Name }}
type: Opaque
stringData:
  OPENCODE_SERVER_USERNAME: {{ .Values.auth.username }}
  OPENCODE_SERVER_PASSWORD: {{ .Values.auth.password }}
  SESSION_SECRET: {{ .Values.sessionSecret }}
  ADMIN_USERNAME: {{ .Values.admin.username }}
  ADMIN_PASSWORD: {{ .Values.admin.password }}
{{- end }}
