# ============================================================
# OpenWork deployment in PCAI — g2 environment
# This app is very powerful, be responsible.
# OpenWork is the open-source Claude Cowork alternative, powered by opencode
# (https://github.com/different-ai/openwork). This chart runs openwork-server
# web per user on HPE Private Cloud AI.
# Owner Francesco Caliva
# Admin password: admin-password
# You can login using SSO, or create a user via admin account
# SSO login grants you access to the kubeflow personal and shared PVCs
# Visit https://openwork.pcai-se-ai-application.hst.rdlabs.hpecorp.net/terminal for a terminal
# Visit https://openwork.pcai-se-ai-application.hst.rdlabs.hpecorp.net/data-manager for a file explorer
# Note: We now support helm and docker functionalities.
# ============================================================


# ============================================================
# EZUA settings
# ============================================================


ezua:
  domainName: "${DOMAIN_NAME}"
  virtualService:
    endpoint: "openwork.${DOMAIN_NAME}"
    istioGateway: "istio-system/ezaf-gateway"
  authorizationPolicy:
    namespace: "istio-system"
    providerName: "oauth2-proxy"

# ============================================================
# General configuration
# ============================================================
previewDomain: "${DOMAIN_NAME}"

# Session cookie signing secret (also used by each user pod to validate the
# session cookie that gates access to that pod's UI/terminal/previews).
sessionSecret: "9xT2mQvR4pS7kL1nW8yB5dF3hJ6cZ0aG"

storageClass: gl4f-filesystem
storage:
  sharedSize: 20Gi
  workspaceSize: 5Gi
  # CANONICAL SCHEME: openwork-v2 (matches values.yaml — every claim this
  # chart deploys is openwork-v2-*). Never bump casually: a bump re-stamps
  # existing units onto fresh volumes and orphans user data (kept, never
  # deleted, never migrated).
  nameVersion: v2
  keepPvcOnDelete: true
  stateSize: 2Gi

images:
  # Baked user image: carries the apt toolchain, openwork-server, the pinned
  # OpenCode engine, uv, ttyd and helm under /opt/openwork so pods stop
  # installing everything at boot (see docker/user/Dockerfile +
  # scripts/build-user-image.sh). Rebuild and bump whenever openwork.serverVersion /
  # openwork.opencodeVersion / provisioning.aptPackages change — the router folds
  # the tag into the pod-template version, so existing units re-stamp
  # automatically on upgrade. Set both entries back to node:22-bookworm-slim
  # to revert to install-on-boot behavior.
  user: ghcr.io/ai-solution-eng/openwork-server:0.18.59-1.18.30-dind
  init: ghcr.io/ai-solution-eng/openwork-server:0.18.59-1.18.30-dind
  # imagePullSecret in the release namespace, for PRIVATE ghcr.io packages.
  # Public ghcr.io packages pull anonymously (leave empty).
  pullSecret: ""
  # Download policy for chart-managed images: IfNotPresent (default; reuse the
  # node-cached image) or Always (pull on every pod (re)start — use while
  # iterating on the same tag, at the cost of slower unit starts). Applies to
  # the user unit containers and the router; infra images (dind, alpine, nginx,
  # cleanup) keep their own fixed policies.
  pullPolicy: Always

# ============================================================
# Docker-in-Docker sidecar (dockerize + push images from the pod terminal)
# ============================================================
# ENABLED on g2: the pod carries the hpeproxy env (below) and the combined
# CA bundle (certificatesPolicy), and the router forwards both to the dind
# daemon — so docker pull/push work through the corporate proxy, and
# builds succeed with the baked dockerbuild wrapper (--network host +
# explicit proxy build-args; the daemon bridge cannot reach the proxy).
# The image store is node-local emptyDir storage (disk-capped at
# docker.diskSize = 50Gi): push after build.
docker:
  ###
  # Setting	Effect
  # enabled: true	Docker exists at all (and only for SSO users — local accounts never get a daemon)
  # brokerForPlatformUnits: true	Your current setup. Platform units (project-user-*) get a separate privileged dind pod in the release namespace; the unit reaches it over the network
  # onPlatformUnits: false	Platform units must not carry an in-pod daemon (privileged containers are denied there by Kyverno)
  # onPlatformUnits: true	Forces the daemon inside the platform unit's own pod (sidecar mode) instead of the broker
  ###
  enabled: true
  image: docker:28-dind
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits:   {cpu: "4", memory: 8Gi}
  diskSize: 50Gi
  diskRequest: 5Gi
  # Platform units get their daemon via the per-user broker in the release
  # namespace (no Kyverno PolicyException needed). Flip onPlatformUnits to
  # true ONLY after the exception is applied (see values.yaml).
  onPlatformUnits: false
  brokerForPlatformUnits: true

# ============================================================
# OpenWork pins (upstream versions baked into the unit image)
# ============================================================
openwork:
  serverVersion: "0.18.59"      # appVersion; baked into images.user
  opencodeVersion: "1.18.30"   # engine binary pin; MUST equal OpenWork's constants.json.opencodeVersion
  approvalMode: auto           # manual would time out every gated write in web mode
  webBootstrapToken: false      # browser auto sign-in behind the router cookie gate
  disableCloudModels: true      # no OpenWork Cloud sign-in handoff; providers are configured locally (PCAI gateway)
  corsOrigins: ""              # empty => rendered from ezua.virtualService.endpoint
  readOnly: false
  logFormat: json
  sandboxEnabled: false
  tokenSecret: ""

RUNTIME_REV: 7

# Browser-facing UI: openwork-server web — single origin (UI + API) on
# serverPort, bound to 127.0.0.1 inside the pod; the nginx sidecar (:8082)
# is the only non-loopback listener. There is no chamber mode in this chart.
nginx:
  clientMaxBodySize: 64m

ui:
  mode: openwork
  serverPort: 8787

provisioning:
  aptPackages: "bash ca-certificates curl dnsutils fd-find gh git jq less make nano ncurses-term openssh-client python3 python3-pip python3-venv procps ripgrep tini tmux tree unzip util-linux vim-tiny zip zstd xz-utils lsof"
  # Loading screen shown while a user's pod is being provisioned/assigned.
  # When disabled the router reverts to the original blocking behavior.
  loadingUI:
    enabled: true
    heading: "Setting up your account\u2026"
    subtext: "This usually takes a few minutes on first launch. Please wait."

# ============================================================
warmPool:
  enabled: false
  size: 2
  refreshIntervalSeconds: 15

auth:
  username: opencode
  password: "password" # "7Vf9mQ2xKp8tL4nR6wY1cB3hDz5sUa0N"

# Admin console credentials (admin page to create/delete user accounts).
admin:
  username: admin-user
  password: "admin-password"

