# ============================================================
# OpenWork server config (new surface — openwork-server web itself)
# Single origin on 127.0.0.1:8787; platform volumes are authorized roots so
# SSO users can reach /mnt/shared and /mnt/user through the app.
# ============================================================
openworkConfig:
  serverJson: |
    {
      "host": "127.0.0.1",
      "port": 8787,
      "approval": { "mode": "auto", "timeoutMs": 30000 },
      "workspaces": [ { "path": "/workspace/personal", "name": "personal", "workspaceType": "local" } ],
      "authorizedRoots": ["/workspace", "/mnt/shared", "/mnt/user"],
      "readOnly": false,
      "logFormat": "json",
      "logRequests": true
    }

