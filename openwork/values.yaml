# ============================================================
# OpenWork deployment in PCAI
# This app is very powerful, be responsible.
# OpenWork is the open-source Claude Cowork alternative, powered by opencode
# (https://github.com/different-ai/openwork). This chart runs openwork-server
# web per user on HPE Private Cloud AI.
# Owner Francesco Caliva
# Admin password: admin-password
# You can login using SSO, or create a user via admin account
# SSO login grants you access to the kubeflow personal and shared PVCs
# Visit https://openwork.${DOMAIN}/terminal for a terminal
# Visit https://openwork.${DOMAIN}/data-manager for a file explorer
# Note: We now support helm and docker functionalities.
# If one wants to connect OpenWork cloud, must follow the following steps:
# 1) login in their account in https://app.openworklabs.com
# 2) on the left side bar click on settings and navigate to Approved web origins
# 3) type https://openwork.${DOMAIN}
# 4) click "approve origin"
# ============================================================


# ============================================================
# EZUA settings
# ============================================================
ezua:
  domainName: "${DOMAIN_NAME}"
  virtualService:
    endpoint: "openwork.${DOMAIN_NAME}"
    istioGateway: "istio-system/ezaf-gateway"
  authorizationPolicy:
    namespace: "istio-system"
    providerName: "oauth2-proxy"

# ============================================================
# General configuration
# ============================================================
previewDomain: "${DOMAIN_NAME}"

# Session cookie signing secret (also used by each user pod to validate the
# session cookie that gates access to that pod's UI/terminal/previews).
# This can be any hard-coded value, or with helm templates adaptation can become a k8s secret.
sessionSecret: "9xT2mQvR4pS7kL1nW8yB5dF3hJ6cZ0aG"

storageClass: gl4f-filesystem
storage:
  sharedSize: 20Gi
  workspaceSize: 5Gi
  # CANONICAL SCHEME: openwork-v2 (matches values.yaml — every claim this
  # chart deploys is openwork-v2-*). Never bump casually: a bump re-stamps
  # existing units onto fresh volumes and orphans user data (kept, never
  # deleted, never migrated).
  nameVersion: v2
  keepPvcOnDelete: true
  stateSize: 2Gi

images:
  # Baked user image: carries the apt toolchain, openwork-server, the pinned
  # OpenCode engine, uv, ttyd and helm under /opt/openwork so pods stop
  # installing everything at boot (see docker/user/Dockerfile +
  # scripts/build-user-image.sh). Rebuild and bump whenever openwork.serverVersion /
  # openwork.opencodeVersion / provisioning.aptPackages change — the router folds
  # the tag into the pod-template version, so existing units re-stamp
  # automatically on upgrade. Set both entries back to node:22-bookworm-slim
  # to revert to install-on-boot behavior.
  user: ghcr.io/ai-solution-eng/openwork-server:0.18.59-1.18.30-dind
  init: ghcr.io/ai-solution-eng/openwork-server:0.18.59-1.18.30-dind
  # imagePullSecret in the release namespace, for PRIVATE ghcr.io packages.
  # Public ghcr.io packages pull anonymously (leave empty).
  pullSecret: ""
  # Download policy for chart-managed images: IfNotPresent (default; reuse the
  # node-cached image) or Always (pull on every pod (re)start — use while
  # iterating on the same tag, at the cost of slower unit starts). Applies to
  # the user unit containers and the router; infra images (dind, alpine, nginx,
  # cleanup) keep their own fixed policies.
  pullPolicy: Always

# ============================================================
# Docker-in-Docker sidecar (dockerize + push images from the pod terminal)
# ============================================================
# ENABLED on g2: the pod carries the hpeproxy env (below) and the combined
# CA bundle (certificatesPolicy), and the router forwards both to the dind
# daemon — so docker pull/push work through the corporate proxy, and
# builds succeed with the baked dockerbuild wrapper (--network host +
# explicit proxy build-args; the daemon bridge cannot reach the proxy).
# The image store is node-local emptyDir storage (disk-capped at
# docker.diskSize = 50Gi): push after build.
docker:
  ###
  # Setting	Effect
  # enabled: true	Docker exists at all (and only for SSO users — local accounts never get a daemon)
  # brokerForPlatformUnits: true	Your current setup. Platform units (project-user-*) get a separate privileged dind pod in the release namespace; the unit reaches it over the network
  # onPlatformUnits: false	Platform units must not carry an in-pod daemon (privileged containers are denied there by Kyverno)
  # onPlatformUnits: true	Forces the daemon inside the platform unit's own pod (sidecar mode) instead of the broker
  ###
  enabled: true
  image: docker:28-dind
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits:   {cpu: "4", memory: 8Gi}
  diskSize: 50Gi
  diskRequest: 5Gi
  # Platform units get their daemon via the per-user broker in the release
  # namespace (no Kyverno PolicyException needed). Flip onPlatformUnits to
  # true ONLY after the exception is applied (see values.yaml).
  onPlatformUnits: false
  brokerForPlatformUnits: true

# ============================================================
# OpenWork pins (upstream versions baked into the unit image)
# ============================================================
openwork:
  serverVersion: "0.18.59"      # appVersion; baked into images.user
  opencodeVersion: "1.18.30"   # engine binary pin; MUST equal OpenWork's constants.json.opencodeVersion
  approvalMode: auto           # manual would time out every gated write in web mode
  # true: the web UI gets the client bearer token injected into the page
  # (window.__OPENWORK_BOOTSTRAP__). Without it every client-auth API call
  # (status/workspaces/models) 401s and the UI strands on the welcome/connect
  # screen after the router SSO login. The router cookie gate stays the auth
  # boundary; the token is defence-in-depth behind it (spec D3). Note: the
  # cloud handoff (PUT /den-session) is host-token-gated upstream and the
  # page only receives the client token — cloud provider sync needs the host
  # token pasted once in the UI settings panel (or stays cloud-only in Den).
  webBootstrapToken: true
  disableCloudModels: true    # Phase 0 egress hardening: the cloud handoff is an
                              # internet dependency (app.openworklabs.com). Flip to
                              # false only if OpenWork Cloud is deliberately wanted.
  corsOrigins: ""              # empty => rendered from ezua.virtualService.endpoint
  readOnly: false
  logFormat: json
  sandboxEnabled: false
  tokenSecret: ""

# v10: webBootstrapToken=true (browser gets the injected client token; welcome-screen strand fix)
RUNTIME_REV: 16

# Browser-facing UI: openwork-server web — single origin (UI + API) on
# serverPort, bound to 127.0.0.1 inside the pod; the nginx sidecar (:8082)
# is the only non-loopback listener. There is no chamber mode in this chart.
nginx:
  clientMaxBodySize: 64m

# Data Manager (in-pod file browser at /data-manager) uploads.
dataManager:
  # Per-request body cap for the /data-manager locations ONLY (nginx
  # client_max_body_size override). The http{}-level nginx.clientMaxBodySize
  # above stays as the UI cap (pasted images); this one is what a model or
  # dataset tree needs. nginx becomes the binding limit, so keep
  # maxUploadMb at or above this.
  clientMaxBodySize: 2g
  # Server-side per-file guard (DATA_MANAGER_MAX_UPLOAD_MB). Raise it together
  # with clientMaxBodySize, never below it.
  maxUploadMb: 2048

ui:
  mode: openwork
  serverPort: 8787

provisioning:
  aptPackages: "bash ca-certificates curl dnsutils fd-find gh git jq less make nano ncurses-term openssh-client python3 python3-pip python3-venv procps ripgrep tini tmux tree unzip util-linux vim-tiny zip zstd xz-utils lsof"
  # Loading screen shown while a user's pod is being provisioned/assigned.
  # When disabled the router reverts to the original blocking behavior.
  loadingUI:
    enabled: true
    heading: "Setting up your account\u2026"
    subtext: "This usually takes a few minutes on first launch. Please wait."

auth:
  username: opencode
  password: "7Vf9mQ2xKp8tL4nR6wY1cB3hDz5sUa0N"

# Admin console credentials (admin page to create/delete user accounts).
admin:
  username: admin-user
  password: "admin-password"

# ============================================================
# OpenCode engine config (model, provider, MCP servers) — unchanged from the
# opencode deployment: OpenWork runs the opencode engine underneath, so this
# surface is identical. Delivered to pods via the project-config ConfigMap
# and seeded at first boot (scripts/push_openwork_json_config.sh to propagate).
# ============================================================

opencodeConfig: |
    {
      "$schema": "https://opencode.ai/config.json",
      "formatter": false,
      "model": "glm-5.3-flash/glm-5.3-flash",
      "provider": {
        "glm-5.3-flash": {
          "npm": "@ai-sdk/openai-compatible",
          "name": "glm-5.3-flash",
          "options": {
            "baseURL": "BASE_URL_FOR_GLM.3-FLASH",
            "apiKey": "MODEL-API-KEY"
          },
          "models": {
            "glm-5.3-flash": {
              "name": "GLM-5.3-flash",
              "attachment": true,
              "modalities": {
                "input": [
                  "text",
                  "image"
                ],
                "output": [
                  "text"
                ]
              },
              "reasoning": true,
              "limit": {
                "context": 1048576,
                "output": 262144
              }
            }            
          }
        }
      },
      "mcp": {
      },
      "permission": {
        "bash": {
          "*": "ask",
          "ls *": "allow",
          "grep *": "allow",
          "glob *": "allow",
          "rm *": "deny"
        },
        "edit": "ask",
        "read": "allow",
        "glob": "allow",
        "question": "allow",
        "webfetch": "ask",
        "websearch": "ask",
        "codesearch": "allow",
        "external_directory": "allow",
        "doom_loop": "deny"
      }
    }


# ============================================================
# OpenWork server config (new surface — openwork-server web itself)
# Single origin on 127.0.0.1:8787; platform volumes are authorized roots so
# SSO users can reach /mnt/shared and /mnt/user through the app.
# ============================================================
openworkConfig:
  serverJson: |
    {
      "host": "127.0.0.1",
      "port": 8787,
      "approval": { "mode": "auto", "timeoutMs": 30000 },
      "workspaces": [ { "path": "/workspace/personal", "name": "personal", "workspaceType": "local" } ],
      "authorizedRoots": ["/workspace", "/mnt/shared", "/mnt/user"],
      "readOnly": false,
      "logFormat": "json",
      "logRequests": true
    }

opencodeSkills:
  - name: pcai-platform
    content: |
      ---
      name: pcai-platform
      description: Use for PCAI/AIE Kubernetes, routing, model-serving, and deployment troubleshooting.
      compatibility: opencode
      ---

      ## Guidance

      - Start with read-only inspection.
      - Check pods, services, endpoints, VirtualServices, and logs before changing anything.
      - Prefer the smallest safe fix.

opencodeAgents:
  - name: pcai-platform-assistant
    content: |
      ---
      description: Expert HPE AIE/PCAI platform engineer and advisor.
      mode: subagent
      ---

      # HPE AI Essentials (AIE) Platform Assistant

      You are an expert AIE/PCAI platform engineer and advisor. You have access to live Kubernetes cluster tools, indexed product documentation, and web search.

      Your mission: **Think deeply. Act decisively. Anticipate what the user needs before they ask.**

  - name: pcai-debugger
    content: |
      ---
      description: Diagnose PCAI/AIE Kubernetes, Istio routing, PVC, and opencode deployment issues.
      mode: subagent
      ---

      Start with read-only inspection. Check pods, events, services, endpoints, VirtualServices, PVCs, and logs before recommending changes.

      Prefer the smallest safe fix and call out any destructive operation before suggesting it.

router:
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

# ============================================================
# Pre-delete cleanup hook (removes dynamically-created per-user
# resources on helm uninstall so the namespace and shared PVC
# don't hang in Terminating)
# ============================================================
cleanup:
  image: node:22-bookworm-slim
  podTimeout: 180  # seconds to wait for user pods to terminate
  pvcTimeout: 120  # seconds to wait for user PVCs to be deleted

# This policy adds the ezaf-root-ca.crt to the base CA bundle in the init container, and then mounts the combined CA bundle into the user container.
certificatesPolicy:
  enabled: false
  
# ============================================================
# Proxy configuration (for clusters behind corporate proxy)
# ============================================================
# Set proxy.enabled to true to enable proxy settings for the user container. The init container will also inherit these settings.
proxy:
  enabled: false
  env:
    - name: HTTP_PROXY
      value: ""
    - name: http_proxy
      value: ""
    - name: HTTPS_PROXY
      value: ""
    - name: https_proxy
      value: ""
# ============================================================ 
no_proxy:
  enabled: false
  env:
    - name: NO_PROXY
      value: ""
    - name: no_proxy
      value: ""

# ============================================================
# Egress hardening (agent internet sandboxing)
# ============================================================
# Phase 0 of agent-egress-sandbox-design.md: remove the agent's runtime
# internet dependencies that cost nothing to remove. ENV DEFAULTS only —
# no NetworkPolicy, no traffic is blocked, fully reversible.
#
#   OPENCODE_DISABLE_MODELS_FETCH=1  models.dev catalogue fetch (hourly)
#   OPENCODE_DISABLE_AUTOUPDATE=1    engine self-update check
#   OPENCODE_DISABLE_SHARE=1         share/session upload
#
# OpenWork's own cloud egress is controlled separately by
# openwork.disableCloudModels (above). Set enabled: false to restore
# pre-Phase-0 behaviour.
egress:
  offlineDefaults:
    enabled: true

# ============================================================
# Platform (PCAI/Kubeflow) workspace integration
# ============================================================
# When enabled AND the endpoint is SSO-gated, SSO users get their unit
# deployed INSIDE their platform project namespace (project-user-<username>)
# with the platform volumes kubeflow-shared-pvc (/mnt/shared, cluster-wide
# shared) and user-pvc (/mnt/user, personal project volume) mounted
# read-write, and the unit process running as the project's unix identity
# (uid/gid from the project-info ConfigMap) so file ownership on the
# platform volumes matches notebook-written files exactly.
#
# Enabling this renders a cross-namespace ClusterRole for the router and
# cleanup service accounts (see README "Platform volumes for SSO users").
# Local (non-SSO) users keep the classic single-namespace behavior.
platformIntegration:
  enabled: false
  # Platform project namespace prefix (ezprojects-operator:
  # EZPROJECTS_NAMESPACE_NAME=project-{{ "{{" }} .EzProjectName {{ "}}" }}, private projects
  # are named user-<username>).
  namespacePrefix: "project-user-"
  # Candidate naming patterns for a user's platform project namespace —
  # comma-separated templates with a {username} placeholder (the sanitized
  # username). A trailing * acts as a wildcard: any namespace whose name
  # starts with the expanded prefix becomes a candidate (ownership is
  # verified through the project-info user field). The first candidate that
  # verifies (namespace exists + project-info carries uid/gid) wins.
  # Example: "project-user-{username},user-{username},{username}-slug"
  # When empty, the legacy single-prefix behavior applies (namespacePrefix).
  namespacePatterns: ""
  volumes:
    shared:
      claim: "kubeflow-shared-pvc"
      mountPath: "/mnt/shared"
    user:
      claim: "user-pvc"
      mountPath: "/mnt/user"
  # Monitor-only deployments: mount the platform volumes but expose them
  # read-only in the Data Manager (unix permissions stay the real
  # enforcement regardless).
  readOnly: false

# ============================================================
# Shared workspace content (populates the shared PVC)
# ============================================================
sharedContent:
  enabled: true

kyverno:
  enabled: true
