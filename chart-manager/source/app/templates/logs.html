<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audit Logs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .container { margin-top: 50px; }
        .logo { max-width: 200px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://i.postimg.cc/pL41hZKk/d051d20f_45a0_41e0_98aa_56c6bd126d80.jpg" alt="HPE Private Cloud AI" class="logo">
        <h1>Audit Logs</h1>
        <a href="{{ url_for('manage') }}" class="btn btn-secondary mb-3">Back to Manage</a>
        {% if logs %}
            <ul class="list-group">
                {% for log in logs %}
                    <li class="list-group-item">{{ log }}</li>
                {% endfor %}
            </ul>
        {% else %}
            <p>No logs available.</p>
        {% endif %}
    </div>
</body>
</html>
