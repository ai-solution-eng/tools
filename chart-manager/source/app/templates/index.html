<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HPE Private Cloud AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: Arial, sans-serif; }
        .container { max-width: 600px; margin-top: 100px; }
        h2 { color: #6c757d; }
        .small-text { font-size: 0.8em; color: #6c757d; }
        .logo { max-width: 300px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container text-center">
        <img src="https://i.postimg.cc/pL41hZKk/d051d20f_45a0_41e0_98aa_56c6bd126d80.jpg" alt="HPE Private Cloud AI" class="logo">
        <h2>ChartMuseum Interface</h2>
        <form method="POST" class="mt-4">
            <div class="mb-3">
                <label for="chartmuseum_ip" class="form-label">Please enter the IP for ChartMuseum</label>
                <input type="text" class="form-control" id="chartmuseum_ip" name="chartmuseum_ip" placeholder="e.g., 10.244.0.1" required>
            </div>
            <p class="small-text">You can get the details using the command "kubectl get svc -n ez-chartmuseum-ns"</p>
            <button type="submit" class="btn btn-primary">Submit</button>
        </form>
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="alert alert-danger mt-3">
                    {{ messages[0] }}
                </div>
            {% endif %}
        {% endwith %}
    </div>
</body>
</html>
