{{- if .Values.ui.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.deployment.name }}-ui
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.deployment.name }}-ui
    hpe-ezua/type: vendor-service
    hpe-ezua/app: {{ .Chart.Name }}
data:
  app.py: |
    {{- .Files.Get "files/app.py" | nindent 4 }}
{{- end }}