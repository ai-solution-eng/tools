{{- if .Values.ui.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.deployment.name }}-ui
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.deployment.name }}-ui
    hpe-ezua/type: vendor-service
    hpe-ezua/app: {{ .Chart.Name }}
spec:
  type: {{ .Values.ui.service.type }}
  selector:
    app: {{ .Values.deployment.name }}-ui
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.ui.service.port }}
      targetPort: http
{{- end }}