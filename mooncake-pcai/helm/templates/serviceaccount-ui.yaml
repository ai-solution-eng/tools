{{- if and .Values.ui.enabled .Values.ui.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.ui.serviceAccount.name | default (printf "%s-ui" .Values.deployment.name) }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.deployment.name }}-ui
    hpe-ezua/type: vendor-service
    hpe-ezua/app: {{ .Chart.Name }}
{{- end }}