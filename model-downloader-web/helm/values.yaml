# ============================================================================
# Model Downloader — web frontend + queueing service for HuggingFace model
# downloads on PCAI (HPE Ezmeral Unified Analytics): PVC- or S3-backed
# downloader Jobs, a downloaded-models list, and AIOLI/MLIS config push.
# Full guide: README.md (chart values reference).
# Owner: Andrew Bydlon
# Email: andrew.bydlon@hpe.com

#  ### REQUIRED ### — key material lives in Secrets you own, NOT in values
#   1. aioli.dbPasswordSecret — name/namespace/key of an EXISTING Secret the
#      chart never creates (holds the MLIS DB password):
#      kubectl -n mlis create secret generic aioli-db-password \
#        --from-literal=password=<aioli-db-password>
#   2. ezua.virtualService.endpoint — RENDER FAILS without it while ezua.enabled.
#   3. defaultNamespace — a project-user namespace that owns `models-pvc`.
#   4. s3.accessKeyId / s3.secretAccessKey — MinIO credentials as plain values;
#      site files keep the real ones in values.<site>.yaml.

#  ### OPTIONAL ###
# Major tuning setups (copy the shape from the pointer):
#   Storage: storage.backend (pvc|s3|both) / downloader.s3Work* / catalog.*
#   Gates: provenance / gate (ModelScan) / preflight + quota / gc
#   Egress: proxy.http|https|noProxy — each key wired only when non-empty
#   PCAI: pcai.enabled / kyverno.enabled / ezua.authorizationPolicy

# ============================================================================
# Application
# ============================================================================

nameOverride: ""
fullnameOverride: ""

# FastAPI service that serves the UI and submits downloader Jobs.
image:
  repository: ghcr.io/ai-solution-eng/model-downloader
  tag: v1.6.3
  # IfNotPresent is the fleet default (releases ship new tags). A tag overwrite
  # alone is not enough: the job-template ConfigMap needs the chart upgrade too.
  pullPolicy: IfNotPresent

# Max concurrent model downloads; extras queue in-process.
maxConcurrency: 4

# Namespace pre-filled in the download form; must own `models-pvc`.
defaultNamespace: project-user-andrew-bydlon

service:
  type: ClusterIP
  port: 8000

# ============================================================================
# Resources
# ============================================================================

resources:
  requests: {cpu: "200m", memory: 256Mi}
  limits: {cpu: "1", memory: 512Mi}

# Each key is wired into the downloader/debug pods and the app only when
# non-empty; a direct-egress site leaves proxy: {} and renders nothing.
proxy: {}

# ============================================================================
# PCAI Feature Gate
# ============================================================================

# Set explicitly — PCAI features no longer follow proxy config.
pcai:
  enabled: false

# ============================================================================
# Download storage
# ============================================================================

storage:
  # backend: "pvc" | "s3" | "both" — which backends users can pick in the UI.
  # default: "pvc" | "s3" — the preselected option.
  backend: both
  default: pvc

# The downloader Job streams HF model files straight into this bucket. Only
# wired in when storage.backend includes s3 — a pvc-only site gets no S3 env.
s3:
  endpointUrl: "http://minio.minio.svc.cluster.local:9000"  # MinIO / S3-compatible URL
  bucket: "mlis-models"  # bucket must already exist
  prefix: "large-models"  # objects land at s3://<bucket>/<prefix>/<org>/<Model>/
  accessKeyId: "admin-io"  # MinIO access key
  secretAccessKey: "MinIO$2K"  # MinIO secret key

# Lists models physically present on the PVC (scanner Job) and/or S3. One row per model.
downloadList:
  enabled: true
  # PVC scanning spawns a short-lived scanner Job; false = scan only on "Rescan storage".
  pvcScanEnabled: false
  # How often (seconds) the app re-scans the PVC; S3 and job history are always fresh.
  pvcRefreshInterval: 60
  # Image for the short-lived PVC scanner Job. Needs /bin/sh, find, stat.
  scanImage: "andrewbydlon/basic-ubuntu-essentials:v1.0"

# ============================================================================
# Download integrity + GC
# ============================================================================

# After a successful PVC download the Job writes manifest.json next to the
# model cache dir: repo, resolved revision, per-file sha256 + size, license.
provenance:
  # False omits the manifest step entirely — no Hub call, no hashing pass.
  enabled: true
  # Revision the download is pinned to; "main" records the resolved commit.
  revision: "main"

# ModelScan scans unsafe formats (.bin/.pt/.pth/.ckpt/pickle); needs the rebuilt image.
gate:
  # Master switch: false omits the scan step (no modelscan, no scan block).
  enabled: true
  # "warn" records the verdict and proceeds; "block" exits the Job 1 on an unsafe verdict.
  mode: warn
  # critical|high|medium|low — findings at or below this level count as clean.
  threshold: low

# Submit-time gate before the Job is created; unknown model size degrades to warn-only.
preflight:
  # Master switch; false renders no gate and no ClusterRole addition.
  enabled: true
  # refuse | warn | off — warn reports but never refuses; off skips the check.
  mode: refuse
  # Headroom (bytes or k8s quantity) subtracted from free space; 0 = none.
  safetyMargin: 0
  # TTL (seconds) of the cached storage census (used bytes / usage split).
  usageTtl: 120
  # TTL (seconds) of cached Hub size estimates.
  sizeTtl: 300

# Per-namespace byte quotas, enforced submit-time (see preflight.mode).
quota:
  default: ""
  namespaces: {}
  # refuse | warn | off — independent of preflight.mode, so a site can warn on
  # disk-fit but hard-refuse on quota.
  mode: refuse

# GC deletes expired model cache dirs from the shared PVC — only when all three
# hold: manifest.json present, no AIOLI row, no live job. /api/gc/report is dry-run.
gc:
  # Master switch: renders the CronJob + the UI report; false disables both.
  enabled: false
  # Standard cron. "0 3 * * *" = nightly 03:00.
  schedule: "0 3 * * *"
  # Delete cache dirs whose newest mtime is older than this many days; 0 disables.
  ttlDays: 30
  # DRY RUN BY DEFAULT: the job evaluates and logs every verdict but deletes
  # nothing. Review /api/gc/report before flipping to false.
  dryRun: true
  # LRU floor: never delete if fewer than this many cache dirs would remain (0 = none).
  minKeep: 0
  # Glob list of model ids / cache-dir names never to delete ("deepseek-ai/*").
  protectedModels: []
  # Forbid keeps two GC pods from ever running at once.
  concurrencyPolicy: Forbid

  resources:
    requests: {cpu: "100m", memory: 128Mi}
    limits: {cpu: "500m", memory: 256Mi}

# ============================================================================
# Jobs
# ============================================================================

# Rendered into a ConfigMap the app reads and substitutes per-submission placeholders in.
downloader:

  image:
    repository: ghcr.io/ai-solution-eng/hf-downloader
    tag: v1.0
  # PVC backed at /mnt where the model cache is written (pvc backend only).
  pvcName: models-pvc
  # Node selector for the download Job; empty = let the scheduler choose.
  nodeSelector: {}
  # S3 backend only: set to an existing PVC name to use it, else an emptyDir
  # sized by s3WorkSize. Files stream per-file, so it holds in-flight files only.
  s3WorkPvcName: ""
  s3WorkSize: 20Gi
  # Cache path (inside the work volume) used when the backend is S3; under /mnt.
  s3WorkPath: "/mnt/s3work"
  # Retries before the Job is marked Failed; a retry resumes the partial HF cache.
  backoffLimit: 2
  # Root + platform security-context opt-out (hpe-ezua/disable-sc); HPE PCAI only.
  disableSecurityContext: true

  securityContext:
    runAsUser: 0
    runAsGroup: 0

  resources:
    requests: {cpu: "2", memory: 4Gi}
    limits: {cpu: "4", memory: 8Gi}
  ttlSecondsAfterFinished: 3600
  user: andrew-bydlon  # for HF request headers / logging

  hf:
    downloadTimeout: "300"
    etagTimeout: "30"
    enableHfTransfer: "0"
    disableXet: "1"

# Long-running shell on the same PVC at /mnt for cache inspection, rendered as
# a Job so job-controller creates the Pod; scheduling follows downloader.
debugPod:
  enabled: true

  image:
    repository: andrewbydlon/basic-ubuntu-essentials
    tag: v1.0
    pullPolicy: IfNotPresent
  # Mount a different PVC than downloader.pvcName by setting it here.
  pvcName: ""
  # Root + platform security-context opt-out (HPE PCAI only), as above.
  disableSecurityContext: true

  securityContext:
    runAsUser: 0
    runAsGroup: 0
  # USER env var inside the pod (matches downloader.user by default).
  user: andrew-bydlon
  # HUGGINGFACE_HUB_CACHE inside the pod, so hf CLI resolves the same cache.
  cachePath: /mnt/large-models
  # TTL for the never-completing debug Job; deleting it from the UI drops its token Secret.
  ttlSecondsAfterFinished: 86400

# ============================================================================
# Model catalog
# ============================================================================

catalog:
  enabled: true
  size: 100Mi
  storageClassName: ""
  # Raw URL of the seed catalog JSON; the "Refresh from GitHub" button hides when empty.
  githubUrl: "https://raw.githubusercontent.com/ai-solution-eng/tools/main/model-downloader-web/src/model_downloader/app/seed_catalog.json"

# ============================================================================
# MLIS database
# ============================================================================

aioli:
  dbHost: aioli-db-service-hpe-mlis.mlis.svc.cluster.local
  dbPort: 5432
  dbName: aioli
  dbUser: postgres

  dbPasswordSecret:
    name: aioli-db-password
    namespace: mlis
    key: password

# ============================================================================
# PCAI integration
# ============================================================================

# Stamps vendor-app labels (hpe-ezua/type, hpe-ezua/app) onto the release's
# Pods/Deployments/Services via a pre-install hook. Disable off PCAI.
kyverno:
  enabled: true

# Istio ingress exposure (VirtualService + AuthorizationPolicy). On by default;
# set ezua.enabled: false when deploying outside HPE PCAI.
ezua:
  enabled: true
  domainName: "${DOMAIN_NAME}"

  virtualService:
    endpoint: "model-downloader.${DOMAIN_NAME}"
    istioGateway: "istio-system/ezaf-gateway"
    timeout: 300s

  authorizationPolicy:
    namespace: "istio-system"
    providerName: "oauth2-proxy"
