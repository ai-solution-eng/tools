# Owner: Andrew Bydlon
# Email: andrew.bydlon@hpe.com
# Prefer: Slack

# Model Downloader — web frontend + queueing service for HuggingFace model
# downloads in Kubernetes, for PCAI (HPE Ezmeral Unified Analytics). Serves
# the download UI, submits PVC- or S3-backed downloader Jobs, lists what is
# downloaded, and pushes model configs to the AIOLI/MLIS database.

# -- Naming overrides (rarely needed) -------------------------------------------
nameOverride: ""
fullnameOverride: ""

# -- App image --------------------------------------------------------------------
# The FastAPI service that serves the UI and submits Jobs.
image:
  repository: ghcr.io/ai-solution-eng/model-downloader
  tag: v1.6.3
  # Always: re-pull on every pod creation, so overwriting this tag in the
  # registry is enough — just `kubectl rollout restart` afterwards.
  # (IfNotPresent would silently keep a node-cached image when the same
  # tag is overwritten, which is how a "rebuilt" deploy serves stale JS.)
  #
  # CAVEAT: the restart refreshes ONLY the image. Helm-managed resources —
  # in particular the job-template ConfigMap whose downloader/scan/debug Job
  # scripts the app reads at startup — are NOT touched by a tag overwrite.
  # After bumping the image you must still run the chart upgrade (helm
  # upgrade, or the packaged tarball) before/alongside the rollout restart,
  # or the new app code can end up driving old Job scripts (seen live as
  # 1.6.2: scanner gained the du -sb size column, but a 1.6.0-era ConfigMap
  # kept the "Downloaded models" Size column at "—" until the chart was
  # upgraded and the pod restarted).
  pullPolicy: IfNotPresent  # fleet default: releases ship new tags (bump_version.sh lockstep)

# -- Download behavior --------------------------------------------------------------
# Max concurrent model downloads; extras are queued in-process.
maxConcurrency: 4

# Namespace pre-filled in the download form. The PVC-backed downloader Job
# mounts `models-pvc`, which every PCAI project namespace has, so default to a
# project-user namespace rather than the app's own namespace.
defaultNamespace: project-user-andrew-bydlon

# -- Service exposure -----------------------------------------------------------------
service:
  type: ClusterIP
  port: 8000

# -- Resources --------------------------------------------------------------------------
resources:
  requests:
    cpu: "200m"
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

# -- Corporate egress proxy (per-key wiring) ------------------------------------------------
# Each key is wired into the pods (downloader Jobs, debug pods, the app pod)
# only when non-empty; a direct-egress site leaves proxy: {} and everything
# renders off. There is no proxy flag anymore.
proxy: {}
#   proxy:
#     http: http://proxy.corp.example:8080
#     https: http://proxy.corp.example:8080
#     noProxy: ".cluster.local,.svc,.svc.cluster,.svc.cluster.local,10.0.0.0/8,127.0.0.1,localhost"

# -- PCAI (HPE Ezmeral Unified Analytics) feature gate ----------------------------------------
# PCAI features (ezua/kyverno-style integration) no longer follow proxy
# config: pcai.enabled defaults to FALSE — set it explicitly. Keep
# kyverno.enabled / ezua.enabled as the per-feature switches for this app's
# own PCAI integration (they default to true; see their blocks below).
pcai:
  enabled: false

# -- Download storage backend --------------------------------------------------------------
storage:
  # backend: "pvc" | "s3" | "both"   which backends users can pick in the UI
  # default: "pvc" | "s3"            the preselected option
  backend: both
  default: pvc

# -- S3-compatible backend (e.g. MinIO; used when storage.backend includes s3) ---------------
# The downloader Job streams HF model files straight into this bucket. Only
# injected into the app when storage.backend includes s3 — a pvc-only
# deployment gets no S3 env at all (no s3 option in the submit form, no S3
# scan, and the downloaded-models list won't claim s3 scanning).
s3:
  endpointUrl: "http://minio.minio.svc.cluster.local:9000"  # MinIO / S3-compatible URL
  bucket: "mlis-models"         # bucket must already exist
  prefix: "large-models"       # objects land at s3://<bucket>/<prefix>/<org>/<Model>/
  accessKeyId: "admin-io"      # MinIO access key (required for MinIO)
  secretAccessKey: "MinIO$2K"  # MinIO secret key (required for MinIO)

# -- "Downloaded models" list -----------------------------------------------------------------
# Lists models physically present on the PVC (via a short-lived scanner Job)
# and/or S3 (via boto3 listing). One row per model, most recent first.
downloadList:
  enabled: true
  # PVC filesystem scanning spawns a short-lived scanner Job. Default off:
  # the PVC is scanned only when a user clicks "Rescan storage". Set true to
  # also re-scan automatically every pvcRefreshInterval seconds.
  pvcScanEnabled: false
  # How often (seconds) the app re-scans the PVC via a scanner Job.
  # S3 and job-history are always fresh; only the PVC scan is cached.
  pvcRefreshInterval: 60
  # Image used for the short-lived PVC scanner Job. Needs /bin/sh, find, stat.
  scanImage: "andrewbydlon/basic-ubuntu-essentials:v1.0"

# -- Provenance manifest (MD-A1) -----------------------------------------------------
# After a successful PVC download the Job writes a manifest.json next to the
# model cache dir recording what was downloaded: repo, the exact revision
# (git commit) resolved, per-file sha256 + size, license, and who/what ran it.
# The file is ${cache_root}/models--<org>--<Repo>/manifest.json — the scanner
# surfaces its presence next to each model so the UI (and a future GC pass)
# can find it without mounting the PVC.
provenance:
  # When false the manifest step is omitted from the downloader Job entirely —
  # no extra Hub API call, no hashing pass, no manifest.json on disk.
  enabled: true
  # Revision the Job pins the download to. "main" keeps today's behavior
  # (snapshot_download on the default branch, resolved commit recorded).
  # Set an exact tag or commit sha for reproducible re-downloads.
  revision: "main"

# -- ModelScan provenance gate (MD-A2) ------------------------------------------------
# Runs ModelScan inside the downloader Job on the unsafe serialization formats
# (.bin/.pt/.pth/.ckpt/pickle-class files) AFTER the download and manifest
# hashing; safetensors needs no scan and is skipped. The verdict lands in
# manifest.json (scan.verdict) and the PVC scanner surfaces it as a column.
# NOTE: this feature rides the downloader image — rebuild/redeploy
# ghcr.io/ai-solution-eng/hf-downloader (Dockerfile gains the modelscan dep).
gate:
  # Master switch. When false the scan step is omitted from the downloader
  # Job entirely (no modelscan run, no scan block in manifest.json).
  enabled: true
  # mode: "warn" | "block". warn records the verdict and proceeds; block
  # makes the Job exit 1 on an unsafe scan — the failure surfaces verbatim
  # in the Jobs table's Error column. A scan-tool error is ALWAYS warn-only
  # (a broken scanner must not block downloads); only a positive unsafe
  # verdict can block.
  mode: warn
  # Downgrade ModelScan severities at or below this level to "clean" so a
  # LOW-severity finding doesn't block in block mode. One of
  # critical|high|medium|low; findings above the threshold keep their level.
  # Set "low" to treat every finding as unsafe (the strictest reading).
  threshold: low

# -- PVC preflight + per-namespace quota (MD-B) ----------------------------------------
# Submit-time gate BEFORE a downloader Job is created. Two numbers, cached:
# capacity via the k8s API (PVC status.capacity — the chart adds a read-only
# persistentvolumeclaims get/list to the ClusterRole) and used bytes via a
# du pass in the PVC scanner Job. Model size comes from the Hub API; unknown
# size degrades to warn-only, never a blind refusal. Refusals are 422s that
# name bytes-needed vs bytes-free (disk) or used+requested vs quota.
preflight:
  # Master switch; when false no ClusterRole addition and no gate.
  enabled: true
  # mode: refuse | warn | off. warn computes and reports but never refuses;
  # off skips the check entirely (and the RBAC addition stays out).
  mode: refuse
  # Headroom (bytes or k8s quantity) subtracted from free space before the
  # fit check — covers writes the du snapshot can't see yet. 0 = none.
  safetyMargin: 0
  # TTL (seconds) of the cached storage census (used bytes / usage split).
  usageTtl: 120
  # TTL (seconds) of cached Hub size estimates.
  sizeTtl: 300

# Per-namespace byte quotas (enforced submit-time; see preflight.mode).
# quota.default is the fallback for namespaces without their own entry;
# leave empty for "no default quota" (namespace entries still apply).
# Values accept k8s quantities ("500Gi", "1Ti") or plain byte integers.
quota:
  default: ""
  # namespaces:
  #   project-user-alice: 1Ti
  #   project-user-bob: 500Gi
  namespaces: {}
  # refuse | warn | off — independent of preflight.mode so a site can warn
  # on disk-fit but hard-refuse on quota (or vice versa).
  mode: refuse

# -- TTL/GC eviction (MD-C) --------------------------------------------------------------
# Garbage collection of expired model cache dirs on the shared PVC. The
# deletion runs in a CronJob whose pod mounts the model PVC (the app pod
# cannot); the app serves the DRY-RUN REPORT (/api/gc/report, UI section)
# that shows every keep/delete verdict BEFORE deletion is ever enabled.
#
# Deletion rule — three-key AND, all three must hold for a cache dir to be
# deleted (each signal alone is unreliable: job TTLs erase evidence, custom
# cache roots break path equality, MLIS rows can be stale):
#   1. manifest.json present next to the models--* dir (ownership record);
#   2. no AIOLI packaged_models row references the model (matched by
#      cache-dir name / repo id appearing in the uri — never exact paths);
#   3. no live managed job (downloader/debug/scanner) pins the cache root.
gc:
  # Master switch: renders the CronJob + the UI report section. When false
  # nothing GC-related is rendered and /api/gc/* return 400.
  enabled: false
  # CronJob schedule (standard cron). "0 3 * * *" = nightly 03:00.
  schedule: "0 3 * * *"
  # Delete model cache dirs whose mtime is older than this many days.
  # Their newest-mtime is the age signal (downloads refresh it; a re-used
  # cache dir's mtime tracks the latest write). 0 disables the TTL line.
  ttlDays: 30
  # DRY RUN BY DEFAULT. true = the job evaluates and LOGS every verdict but
  # deletes nothing (the report in the UI is the review surface). Flip to
  # false only after reviewing the report — that is the whole point of the
  # dry-run-first design.
  dryRun: true
  # LRU floor: never delete if fewer than this many cache dirs would remain
  # on the PVC scan root (0 = no floor). Protects against a values typo
  # emptying the cache.
  minKeep: 0
  # Glob list of model ids or cache-dir names never to delete
  # ("deepseek-ai/*", "models--Qwen--*", ...).
  protectedModels: []
  # Concurrency policy: Forbid keeps two GC pods from ever running at once.
  concurrencyPolicy: Forbid
  resources:
    requests:
      cpu: "100m"
      memory: 128Mi
    limits:
      cpu: "500m"
      memory: 256Mi

# -- Downloader Job definition -------------------------------------------------------------------
# Rendered into a ConfigMap that the app reads, substitutes per-submission
# placeholders (__NAMESPACE__, __MODEL_NAME__, __JOB_NAME__, __HF_TOKEN_SECRET__)
# in, then creates via the k8s API.
downloader:
  image:
    repository: ghcr.io/ai-solution-eng/hf-downloader
    tag: v1.0
  # PVC backed at /mnt where the model cache is written (pvc backend only).
  pvcName: models-pvc
  # Node selector for the download Job (e.g. node with PVC access).
  # Empty = let the scheduler choose any node.
  nodeSelector: {}
  # S3 backend only: scratch space used while downloading before upload.
  # When set to an existing PVC name the job uses that; otherwise an emptyDir
  # sized by s3WorkSize. Files are streamed to S3 per-file (8 in parallel), so
  # this only needs to hold a handful of in-flight files — not the whole model.
  s3WorkPvcName: ""
  s3WorkSize: 20Gi
  # Path (inside the work volume) the downloader writes its cache to when the
  # storage backend is S3. Must live under the volume mounted at /mnt.
  s3WorkPath: "/mnt/s3work"
  # How many times a failed download Job is retried before it is marked
  # Failed. The HF cache lives on the shared PVC, so a restart resumes the
  # partial download instead of starting over (snapshot_download picks up
  # existing blobs + .incomplete files). Set 0 to disable retries.
  backoffLimit: 2
  # When true, downloader pods opt out of the platform security-context
  # mutation (hpe-ezua/disable-sc: "true") so they can run as root and mount
  # the shared model PVC. Only relevant on HPE PCAI clusters.
  disableSecurityContext: true
  securityContext:
    runAsUser: 0
    runAsGroup: 0
  resources:
    requests:
      cpu: "2"
      memory: 4Gi
    limits:
      cpu: "4"
      memory: 8Gi
  ttlSecondsAfterFinished: 3600
  user: andrew-bydlon  # for HF request headers / logging
  hf:
    downloadTimeout: "300"
    etagTimeout: "30"
    enableHfTransfer: "0"
    disableXet: "1"
    # TLS verification for the downloader. Unset → true (verify; set false
    # only behind a MITM proxy with an untrusted cert).
    # verifyTls: false

# -- Debug pod ("Launch debug pod" in the UI) ------------------------------------------------------
# A long-running shell that mounts the same PVC as the downloader Jobs at /mnt
# so you can inspect the model cache (kubectl exec ...) instead of submitting
# download Jobs.
#
# Implemented as a Job on purpose: its Pod is then created by the kube-system
# job-controller — the same admission path as the downloader Jobs. A bare Pod
# created directly by the app's ServiceAccount is denied by the platformwide
# `protect-models-pvc` Kyverno policy (prevent-unauthorized-create-with-mlis:
# "Insufficient authorization to set the 'hpe-ezua/app' label to 'mlis'"),
# while job-controller-created pods with the same labels are admitted.
#
# Proxy env vars follow the top-level proxy: dict (per-key; see proxy:),
# exactly like the downloader Jobs.
debugPod:
  enabled: true
  image:
    repository: andrewbydlon/basic-ubuntu-essentials
    tag: v1.0
    pullPolicy: IfNotPresent
  # Mount a different PVC than downloader.pvcName by setting it here.
  pvcName: ""
  # When true the pod opts out of the platform security-context mutation
  # (hpe-ezua/disable-sc: "true") so it runs as root and can traverse the
  # root-owned shared model PVC. Only relevant on HPE PCAI clusters.
  disableSecurityContext: true
  securityContext:
    runAsUser: 0
    runAsGroup: 0
  # USER env var inside the debug pod (matches downloader.user by default).
  user: andrew-bydlon
  # HUGGINGFACE_HUB_CACHE inside the debug pod so `huggingface-cli` /
  # `hf download` resolve the same cache the downloader Jobs write.
  cachePath: /mnt/large-models
  # The debug Job never completes (tail -f /dev/null); this TTL only applies
  # once it finishes/fails, so a dead debug job self-cleans instead of
  # lingering. Delete debug jobs you're done with from the UI — that also
  # removes the HF-token Secret.
  ttlSecondsAfterFinished: 86400
  # Scheduling follows downloader.nodeSelector (same PVC, same placement
  # constraints). No separate debugPod.nodeSelector.

# -- Model catalog (a small PVC) ---------------------------------------------------------------------
catalog:
  enabled: true
  size: 100Mi
  storageClassName: ""
  # "Refresh from GitHub" button: raw URL of the seed catalog JSON on the
  # tools repo. The button is hidden when this is empty.
  githubUrl: "https://raw.githubusercontent.com/ai-solution-eng/tools/main/model-downloader-web/src/model_downloader/app/seed_catalog.json"
  # TLS verification for that fetch. Default (unset): true (verify). Set
  # false ONLY behind a corporate MITM proxy with an untrusted cert.
  # githubVerifyTls: true

# -- AIOLI / MLIS database connection (pushing model configs) ------------------------------------------
aioli:
  dbHost: aioli-db-service-hpe-mlis.mlis.svc.cluster.local
  dbPort: 5432
  dbName: aioli
  dbUser: postgres
  dbPasswordSecret:
    name: aioli-db-password
    namespace: mlis
    key: password

# -- Kyverno vendor-app labels --------------------------------------------------------------------------
# Stamps vendor-app labels (hpe-ezua type, hpe-ezua/app) onto
# Pods/Deployments/Services created in the release namespace. Installed as a
# pre-install hook. On by default (PCAI app); disable only when deploying
# outside HPE PCAI.
kyverno:
  enabled: true

# -- PCAI (HPE Ezmeral Unified Analytics) integration -----------------------------------------------------
# EZUA / PCAI Istio ingress exposure (VirtualService + AuthorizationPolicy).
# On by default (PCAI app); set ezua.enabled: false when deploying outside
# HPE PCAI.
ezua:
  enabled: true
  domainName: "${DOMAIN_NAME}"
  virtualService:
    endpoint: "model-downloader.${DOMAIN_NAME}"
    istioGateway: "istio-system/ezaf-gateway"
    timeout: 300s
  authorizationPolicy:
    namespace: "istio-system"
    providerName: "oauth2-proxy"
