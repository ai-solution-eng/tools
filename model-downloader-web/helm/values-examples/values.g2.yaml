# ============================================================================
# Model Downloader — SE G2 example site values (SANITIZED).
# Shareable counterpart of the real per-site file: real credentials live only
# in helm/local/ (gitignored, hardlink-ignored, never packaged).
# Full values document — paste it into the PCAI Helm Values editor.

#  ### REQUIRED ### — fill these for the site; key material stays out of values
#   1. defaultNamespace — a project-user namespace that owns `models-pvc`.
#   2. s3.accessKeyId / s3.secretAccessKey — MinIO credentials (real ones only
#      in helm/local/values.g2.yaml).
#   3. aioli.dbPasswordSecret — name/namespace/key of an EXISTING Secret:
#      kubectl -n mlis create secret generic aioli-db-password \
#        --from-literal=password=<aioli-db-password>
#   4. ezua.virtualService.endpoint — RENDER FAILS without it while ezua.enabled.

#  ### OPTIONAL ###
# Major tuning setups (copy the shape from the pointer):
#   Storage: storage.backend (pvc|s3|both) / downloader.s3Work* / catalog.*
#   Gates: provenance / gate (ModelScan) / preflight + quota / gc
#   Egress: proxy.http|https|noProxy — each key wired only when non-empty
#   PCAI: pcai.enabled / kyverno.enabled / ezua.authorizationPolicy

# ============================================================================
# Application
# ============================================================================

nameOverride: ""
fullnameOverride: ""

# FastAPI service that serves the UI and submits downloader Jobs.
image:
  repository: ghcr.io/ai-solution-eng/model-downloader
  tag: v1.7.1
  # IfNotPresent is the fleet default (releases ship new tags). A tag overwrite
  # alone is not enough: the job-template ConfigMap needs the chart upgrade too.
  pullPolicy: IfNotPresent

# Max concurrent model downloads; extras queue in-process.
maxConcurrency: 4

# Namespace pre-filled in the download form; must own `models-pvc`.
defaultNamespace: project-user-<USERNAME>

service:
  type: ClusterIP
  port: 8000

# ============================================================================
# Resources
# ============================================================================

resources:
  requests: {cpu: "200m", memory: 256Mi}
  limits: {cpu: "1", memory: 512Mi}

# Proxied corporate site — the addresses below are PLACEHOLDERS, substitute the
# real ones. Each key is wired only when non-empty; direct egress leaves proxy: {}.
proxy:
  http: http://proxy.corp.example:8080
  https: http://proxy.corp.example:8080
  # Keep cluster-internal traffic (MinIO, MLIS/AIOLI DB, kube API) off the proxy.
  noProxy: ".cluster.local,.svc,.svc.cluster,.svc.cluster.local,10.0.0.0/8,127.0.0.1,localhost"

# ============================================================================
# PCAI Feature Gate
# ============================================================================

# Set explicitly — PCAI features no longer follow proxy config.
pcai:
  enabled: true

# ============================================================================
# Download storage
# ============================================================================

storage:
  backend: both
  default: pvc

# Real MinIO credentials — never publish them; on G2 they live only in helm/local/.
s3:
  endpointUrl: "http://minio.minio.svc.cluster.local:9000"  # MinIO / S3-compatible URL
  bucket: "mlis-models"  # bucket must already exist
  prefix: "large-models"  # objects land at s3://<bucket>/<prefix>/<org>/<Model>/
  accessKeyId: "<MINIO_ACCESS_KEY>"  # MinIO access key
  secretAccessKey: "<MINIO_PASSWORD>"  # MinIO secret key

# Lists models physically present on the PVC (scanner Job) and/or S3. One row per model.
downloadList:
  enabled: true
  pvcScanEnabled: false
  pvcRefreshInterval: 60
  scanImage: "andrewbydlon/basic-ubuntu-essentials:v1.0"

# ============================================================================
# Jobs
# ============================================================================

# Rendered into a ConfigMap the app reads and substitutes per-submission placeholders in.
downloader:

  image:
    repository: ghcr.io/ai-solution-eng/hf-downloader
    tag: v1.0
  # PVC backed at /mnt where the model cache is written (pvc backend only).
  pvcName: models-pvc
  nodeSelector: {}
  s3WorkPvcName: ""
  s3WorkSize: 20Gi
  s3WorkPath: "/mnt/s3work"
  # Retries before the Job is marked Failed; a retry resumes the partial HF cache.
  backoffLimit: 2
  # Root + platform security-context opt-out (hpe-ezua/disable-sc); HPE PCAI only.
  disableSecurityContext: true

  securityContext:
    runAsUser: 0
    runAsGroup: 0

  resources:
    requests: {cpu: "2", memory: 4Gi}
    limits: {cpu: "4", memory: 8Gi}
  ttlSecondsAfterFinished: 3600
  # Your HF username (request headers / logging).
  user: <USERNAME>

  hf:
    downloadTimeout: "300"
    etagTimeout: "30"
    enableHfTransfer: "0"
    disableXet: "1"
    # MITM proxy presents an untrusted cert — bypassed deliberately; default is verify-on.
    verifyTls: false

# ============================================================================
# Download integrity + GC
# ============================================================================

provenance:
  enabled: true
  revision: "main"

# ModelScan scans unsafe formats (.bin/.pt/.pth/.ckpt/pickle); needs the rebuilt image.
gate:
  enabled: true
  mode: warn  # demo the scan badge; flip to block after a warn period
  threshold: low

# Submit-time gate before the Job is created; unknown model size degrades to warn-only.
preflight:
  enabled: true
  mode: refuse
  safetyMargin: 0
  usageTtl: 120
  sizeTtl: 300

# Per-namespace byte quotas, enforced submit-time (see preflight.mode).
quota:
  default: ""  # no cluster-wide default; namespace entries only
  # Per-team overrides go under namespaces (k8s quantities or plain bytes).
  namespaces: {}
  mode: refuse

# OFF — dry-run-first discipline: GC deletes model cache dirs from the shared PVC,
# so the safe path is enabled: true + dryRun: true, review /api/gc/report, then flip.
gc:
  enabled: false
  schedule: "0 3 * * *"
  ttlDays: 30
  dryRun: true  # the UI report is the review surface; flip only after review
  minKeep: 0
  protectedModels: []
  concurrencyPolicy: Forbid

  resources:
    requests: {cpu: "100m", memory: 128Mi}
    limits: {cpu: "500m", memory: 256Mi}

# Long-running shell on the same PVC at /mnt for cache inspection, rendered as
# a Job so job-controller creates the Pod; scheduling follows downloader.
debugPod:
  enabled: true

  image:
    repository: andrewbydlon/basic-ubuntu-essentials
    tag: v1.0
    pullPolicy: IfNotPresent
  pvcName: ""
  disableSecurityContext: true

  securityContext:
    runAsUser: 0
    runAsGroup: 0
  # Your HF username (USER env var inside the pod).
  user: <USERNAME>
  cachePath: /mnt/large-models
  ttlSecondsAfterFinished: 86400

# ============================================================================
# Model catalog
# ============================================================================

catalog:
  enabled: true
  size: 100Mi
  storageClassName: ""
  githubUrl: "https://raw.githubusercontent.com/ai-solution-eng/tools/main/model-downloader-web/src/model_downloader/app/seed_catalog.json"
  # MITM proxy presents an untrusted cert — bypassed deliberately; default is verify-on.
  githubVerifyTls: false

# ============================================================================
# MLIS database
# ============================================================================

aioli:
  dbHost: aioli-db-service-hpe-mlis.mlis.svc.cluster.local
  dbPort: 5432
  dbName: aioli
  dbUser: postgres

  dbPasswordSecret:
    name: aioli-db-password
    namespace: mlis
    key: password

# ============================================================================
# PCAI integration
# ============================================================================

# Stamps vendor-app labels (hpe-ezua/type, hpe-ezua/app) onto the release via a pre-install hook.
kyverno:
  enabled: true

# On PCAI, ${DOMAIN_NAME} is resolved by the platform before rendering; the UI is
# served at https://model-downloader.${DOMAIN_NAME} behind oauth2-proxy SSO.
ezua:
  enabled: true
  domainName: "${DOMAIN_NAME}"  # informational only — no template reads it

  virtualService:
    endpoint: "model-downloader.${DOMAIN_NAME}"
    istioGateway: "istio-system/ezaf-gateway"
    timeout: 300s

  authorizationPolicy:
    namespace: "istio-system"
    providerName: "oauth2-proxy"
