# Model Downloader — SE G2 example site values (SANITIZED).
# Shareable counterpart of the real per-site file (helm/local convention —
# real credentials live only in helm/local/, which is gitignored,
# hardlink-ignored and never packaged). Base chart: model-downloader 1.7.0
# (image.tag v1.6.2).
#
# FULL VALUES — complete document; paste this whole file into the PCAI
# "Helm Values" editor and adjust the '# SITE:' lines. See the top-level
# README (Deployment targets → SE G2) for context.

# -- Naming overrides (rarely needed) -------------------------------------------
nameOverride: ""
fullnameOverride: ""

# -- App image --------------------------------------------------------------------
image:
  repository: ghcr.io/ai-solution-eng/model-downloader
  tag: v1.6.3
  # IfNotPresent (fleet default): releases ship NEW image tags (bump_version.sh
  # keeps tag/Chart.yaml in lockstep), so node-cached images stay fresh.
  # (pullPolicy: Always re-pulls on every pod start — only useful for a
  # deliberate rebuild-same-tag lab flow, which then needs a rollout restart.)
  pullPolicy: IfNotPresent

# -- Download behavior ---------------------------------------------------------------
maxConcurrency: 4

# SITE: your project-user namespace (owns the models-pvc the Jobs mount).
# Namespace pre-filled in the download form (project namespaces own the
# models-pvc the downloader Jobs mount).
defaultNamespace: project-user-<USERNAME>

# -- Service exposure -------------------------------------------------------------------
service:
  type: ClusterIP
  port: 8000

# -- Resources -----------------------------------------------------------------------------
resources:
  requests:
    cpu: "200m"
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

# -- Corporate egress proxy (per-key wiring) --------------------------------------------------
# Proxied corporate site example: the downloader Jobs must reach HuggingFace
# through the corporate proxy, and the app pod gets the same proxy env so the
# catalog "Refresh from GitHub" fetch goes through the proxy too. Each key is
# wired only when non-empty; a direct-egress site leaves proxy: {}.
# Addresses below are PLACEHOLDERS — substitute the site's real proxy/no_proxy.
proxy:
  http: http://proxy.corp.example:8080
  https: http://proxy.corp.example:8080
  # Keep cluster-internal traffic (MinIO, MLIS/AIOLI DB, kube API) off the
  # proxy. Standard cluster-local entries only in this shareable example.
  noProxy: ".cluster.local,.svc,.svc.cluster,.svc.cluster.local,10.0.0.0/8,127.0.0.1,localhost"

# -- PCAI feature gate --------------------------------------------------------------------------
# Set explicitly — PCAI features no longer follow proxy config.
pcai:
  enabled: true

# -- Download storage backend -------------------------------------------------------------------
storage:
  backend: both
  default: pvc

# -- S3-compatible backend (MinIO) ----------------------------------------------------------------
# SITE: real MinIO credentials — never publish them; on G2 they live only in
# helm/local/values.g2.yaml.
s3:
  endpointUrl: "http://minio.minio.svc.cluster.local:9000"  # MinIO / S3-compatible URL
  bucket: "mlis-models"         # bucket must already exist
  prefix: "large-models"       # objects land at s3://<bucket>/<prefix>/<org>/<Model>/
  accessKeyId: "<MINIO_ACCESS_KEY>"      # MinIO access key (required for MinIO)
  secretAccessKey: "<MINIO_PASSWORD>"  # MinIO secret key (required for MinIO)

# -- "Downloaded models" list -----------------------------------------------------------------------
downloadList:
  enabled: true
  pvcScanEnabled: false
  pvcRefreshInterval: 60
  scanImage: "andrewbydlon/basic-ubuntu-essentials:v1.0"

# -- Downloader Job definition -------------------------------------------------------------------------
downloader:
  image:
    repository: ghcr.io/ai-solution-eng/hf-downloader
    tag: v1.0
  # PVC backed at /mnt where the model cache is written (pvc backend only).
  pvcName: models-pvc
  nodeSelector: {}
  s3WorkPvcName: ""
  s3WorkSize: 20Gi
  s3WorkPath: "/mnt/s3work"
  # The HF cache lives on the shared PVC, so a retried Job resumes the
  # partial download instead of starting over.
  backoffLimit: 2
  # Opt out of the platform security-context mutation so the Job can run as
  # root and mount the shared model PVC.
  disableSecurityContext: true
  securityContext:
    runAsUser: 0
    runAsGroup: 0
  resources:
    requests:
      cpu: "2"
      memory: 4Gi
    limits:
      cpu: "4"
      memory: 8Gi
  ttlSecondsAfterFinished: 3600
  # SITE: your username (HF request headers / logging).
  user: <USERNAME>
  hf:
    downloadTimeout: "300"
    etagTimeout: "30"
    enableHfTransfer: "0"
    disableXet: "1"
    # Corporate MITM proxy presents an untrusted cert — verification bypassed
    # deliberately; the secure default is verify-on (unset → true).
    verifyTls: false

# -- Provenance manifest (MD-A1)  ----------------------------------------------------------
provenance:
  enabled: true
  revision: "main"

# -- ModelScan provenance gate (MD-A2) -----------------------------------------------------
# SHOWCASE: enabled in warn mode — every download of an unsafe-format model
# (.bin/.pt/.pth/.ckpt/pickle) is scanned and the verdict lands in
# manifest.json + the UI's scan column, WITHOUT blocking customer downloads
# (a positive unsafe verdict in block mode would exit-1 the Job). Flip
# mode: block after a warn period on real downloads. Requires the rebuilt
# downloader image (Dockerfile gains modelscan); on an old image the gate
# records "error" verdicts and never blocks. Turn the feature off with
# enabled: false.
gate:
  enabled: true
  mode: warn          # demo the scan badge; flip to block after a warn period
  threshold: low

# -- PVC preflight + per-namespace quota (MD-B) --------------------------------------------
# SHOWCASE: preflight refuses a submit only when the model provably would
# not fit the target PVC's free space (422 naming bytes-needed vs
# bytes-free) — pure safety, no demo downside. Unknown model sizes degrade
# to warn-only, never a blind refusal. Turn it off with enabled: false.
preflight:
  enabled: true
  mode: refuse
  safetyMargin: 0
  usageTtl: 120
  sizeTtl: 300

# Per-namespace byte quotas. default left EMPTY here (G2 is the internal
# demo rig): quota.default is the fallback cap for namespaces without their
# own entry (k8s quantities or plain bytes). Set a value to demo the
# "used+requested vs quota" 422; per-team entries go under namespaces.
# Turn the whole enforcement off with quota.mode: off (or preflight.enabled
# above, which gates both).
quota:
  default: ""         # no cluster-wide default; namespace entries only
  # SHOWCASE example — a generous demo cap; set default to demo the refusal:
  #   default: 2Ti
  # SITE: set real per-team quotas (k8s quantities or plain bytes).
  # namespaces:
  #   project-user-alice: 1Ti
  #   project-user-bob: 500Gi
  namespaces: {}
  mode: refuse

# -- TTL/GC eviction (MD-C) ------------------------------------------------------------------
# OFF — dry-run-first discipline: GC deletes model cache dirs from
# the shared PVC, and enabling deletion on a demo rig is a foot-gun. The
# safe enable path is: (1) set enabled: true and leave
# dryRun: true — the job evaluates + logs every verdict and the UI's
# /api/gc/report section becomes the review surface, deleting nothing;
# (2) only after the report looks right, flip dryRun: false and let
# ttlDays age out stale caches. Deletion needs the three-key AND (manifest
# present + no AIOLI row + no live job), so serving models are protected.
# Turn the feature off again with enabled: false (nothing rendered).
gc:
  enabled: false
  schedule: "0 3 * * *"
  ttlDays: 30
  dryRun: true        # the UI report is the review surface; flip only after review
  minKeep: 0
  protectedModels: []
  concurrencyPolicy: Forbid
  resources:
    requests:
      cpu: "100m"
      memory: 128Mi
    limits:
      cpu: "500m"
      memory: 256Mi

# -- Debug pod ("Launch debug pod" in the UI) -------------------------------------------------------------
# Long-running shell on the same PVC at /mnt for cache inspection. A Job on
# purpose: job-controller-created pods pass the platformwide
# `protect-models-pvc` Kyverno admission path that denies bare Pods.
debugPod:
  enabled: true
  image:
    repository: andrewbydlon/basic-ubuntu-essentials
    tag: v1.0
    pullPolicy: IfNotPresent
  pvcName: ""
  disableSecurityContext: true
  securityContext:
    runAsUser: 0
    runAsGroup: 0
  # SITE: your username.
  user: <USERNAME>
  cachePath: /mnt/large-models
  ttlSecondsAfterFinished: 86400

# -- Model catalog (a small PVC) ----------------------------------------------------------------------------
catalog:
  enabled: true
  size: 100Mi
  storageClassName: ""
  githubUrl: "https://raw.githubusercontent.com/ai-solution-eng/tools/main/model-downloader-web/src/model_downloader/app/seed_catalog.json"
  # Corporate MITM proxy presents an untrusted cert — verification bypassed
  # deliberately; the secure default is verify-on (unset → true).
  githubVerifyTls: false

# -- AIOLI / MLIS database connection -------------------------------------------------------------------------
aioli:
  dbHost: aioli-db-service-hpe-mlis.mlis.svc.cluster.local
  dbPort: 5432
  dbName: aioli
  dbUser: postgres
  dbPasswordSecret:
    name: aioli-db-password
    namespace: mlis
    key: password

# -- Kyverno vendor-app labels ----------------------------------------------------------------------------------
# Keep enabled: the chart's pre-install ClusterPolicy stamps the EZUA vendor
# labels (hpe-ezua/type: app-service-core) in the release namespace; the
# downloader/debug Jobs carry hpe-ezua/app: mlis and are admitted by the
# platform's protect-models-pvc policy on G2 out of the box.
kyverno:
  enabled: true

# -- PCAI (HPE Ezmeral Unified Analytics) integration --------------------------------------------------------------
# On PCAI, ${DOMAIN_NAME} is resolved by the platform before rendering, so the
# UI is served at:
#   https://model-downloader.${DOMAIN_NAME}
# (behind oauth2-proxy SSO via the ezaf-gateway).
ezua:
  enabled: true
  domainName: "${DOMAIN_NAME}"   # informational only — no template reads it
  virtualService:
    endpoint: "model-downloader.${DOMAIN_NAME}"
    istioGateway: "istio-system/ezaf-gateway"
    timeout: 300s
  authorizationPolicy:
    namespace: "istio-system"
    providerName: "oauth2-proxy"
