[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "model-benchmarker"
version = "0.6.0"
description = "PCAI model benchmarking app: universal endpoint load benchmarker (REST/MCP + GPU scaling curves), chat streaming benchmarker (TTFT / tokens-per-second), deterministic memory estimation, and a deployable web app (memory estimator + API-key-gated benchmark launchers)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "PCAI Solutions" }]
dependencies = [
    "numpy>=2.0",
    "httpx2>=2.12.0",
    "openai>=1.40",
    # MCP mode of the universal benchmarker (streamable-http / sse transports)
    "mcp>=2.0.0",
    # The web app (model_benchmarker.webapp): memory estimator + bench launchers
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "aiohttp>=3.9",
    "uvicorn>=0.30",
    "ruff",
    "mypy",
]

[project.scripts]
# Universal tool: any REST endpoint or MCP server, sweeps + GPU telemetry.
endpoint-benchmarker = "model_benchmarker.endpoint_benchmarker.cli:main"
# Chat-specific: TTFT / tokens-per-second for OpenAI-compatible endpoints.
benchmark-chat = "model_benchmarker.benchmark_chat:cli_main"
# Deterministic memory estimation: fit / KV tokens / concurrent requests.
memory-estimate = "model_benchmarker.memory_model.cli:main"
# The deployable web app (helm chart model-benchmarker).
model-benchmarker-web = "model_benchmarker.webapp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The webapp's self-contained pages (HTML/CSS/JS) must ship in the wheel —
# the Docker image installs the package and serves exactly these files.
"model_benchmarker.webapp" = ["ui/*", "seed_catalog.json", "hf_configs/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
