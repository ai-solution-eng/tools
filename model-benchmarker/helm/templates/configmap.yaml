apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.deployment.name }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.deployment.appName }}
data:
  {{- if .Values.bench.suggestions }}
  # Combobox suggestions (advice only — the UI allows any http(s) URL).
  BENCH_TARGET_SUGGESTIONS: {{ .Values.bench.suggestions | toJson | quote }}
  {{- end }}
  {{- if .Values.bench.prometheusUrl }}
  # Operator-configured telemetry join (the scaling curve). The client may
  # only pick the label selector, never this URL.
  BENCH_PROM_URL: {{ .Values.bench.prometheusUrl | quote }}
  {{- end }}
  {{- range $key, $val := .Values.extraEnv }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}

{{- /* Corporate egress proxy env (ModelDownloader convention): wired per-key
   from the top-level proxy: dict — each key renders only when non-empty;
   proxy: {} (direct egress) renders nothing. NO_PROXY pre-seeds the
   in-cluster ranges so benchmark traffic never traverses the proxy. */ -}}
{{- with .Values.proxy }}
{{- with .noProxy }}
  no_proxy: {{ . | quote }}
  NO_PROXY: {{ . | quote }}
{{- end }}
{{- with .https }}
  https_proxy: {{ . | quote }}
  HTTPS_PROXY: {{ . | quote }}
  http_proxy: {{ . | quote }}
  HTTP_PROXY: {{ . | quote }}
{{- end }}
{{- end }}
