{{- if .Values.ezua.enabled }}
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: {{ .Values.deployment.name }}-vs
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.deployment.appName }}
    hpe-ezua/app: {{ .Chart.Name }}
    hpe-ezua/type: vendor-service
spec:
  gateways:
    - {{ .Values.ezua.virtualService.istioGateway }}
  hosts:
    - {{ .Values.ezua.virtualService.endpoint | required "\nValid .Values.ezua.virtualService.endpoint is required !" }}
  http:
    # Artifact downloads / run polling bursts -- the long timeout covers one
    # API response, not a run (runs execute server-side and are polled).
    - match:
        - uri:
            prefix: /api/runs
      route:
        - destination:
            host: {{ .Values.deployment.name }}-api.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: {{ .Values.service.port }}
      timeout: {{ .Values.ezua.virtualService.longTimeout }}
    # HF config.json fetches from the estimator page can take a while.
    - match:
        - uri:
            prefix: /api/estimate
      route:
        - destination:
            host: {{ .Values.deployment.name }}-api.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: {{ .Values.service.port }}
      timeout: {{ .Values.ezua.virtualService.longTimeout }}
    # Everything else (pages, static assets, status, probes)
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: {{ .Values.deployment.name }}-api.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: {{ .Values.service.port }}
      timeout: {{ .Values.ezua.virtualService.timeout }}
{{- end }}
