{{- /*
  Belt-and-suspenders vendor labeling for admission-time stamping. The static
  labels in deployment.yaml/service.yaml already make the EZUA card Ready at
  install AND upgrade (this policy is background:false = admission-only, it
  can never relabel an existing resource). Enable on hosted trials whose
  platform policies expect to see the labels stamped by Kyverno; the customer
  admin must permit ClusterPolicy creation. Off by default — needs nothing on
  G2. NOTE: matches Deployment+Service only, never Pods (the platform's
  assign-custom-scheduler policy makes labeled pods undeletable).
*/ -}}
{{- if .Values.kyverno.enabled }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: {{ printf "add-vendor-app-labels-%s-%s" .Release.Name .Chart.Name }}
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  background: false
  rules:
  - name: add-vendor-app-labels
    match:
      any:
      - resources:
          namespaces:
          - {{ .Release.Namespace }}
          kinds:
          - Deployment
          - Service
    mutate:
      patchStrategicMerge:
        metadata:
            labels:
              "hpe-ezua/type": vendor-service
              "hpe-ezua/app": {{ .Chart.Name }}
{{- end }}
