{{- /*
  Web-app API key (BENCH_API_KEYS) + benchmark-target keys
  (BENCH_ENDPOINT_API_KEYS) sourcing -- highest precedence first:

    1. security.existingSecret: a Secret YOU own provides the web-app key
       (security.existingSecretApiKey). This chart's Secret then renders
       neither the web-app key nor (when bench.endpointApiKeysExistingSecret
       is also set) the endpoint keys.
    2. The value already stored in the release Secret -- reused on upgrade,
       so upgrading never rotates a key under a running deployment.
    3. security.apiKey (inline seed) / bench.endpointApiKeys (inline seeds).
    4. Fresh auto-generation of the web-app key on first install (32 chars).

  Rotation is OPTIONAL and operator-initiated: the webapp re-reads the key
  set per request, so updating the Secret takes effect without a restart
  (comma-separated keys are the zero-downtime rotation mechanism).
  The chart repository ships no key material.
*/ -}}
{{- $secName := printf "%s-keys" .Values.deployment.name -}}
{{- $useExistingWeb := .Values.security.existingSecret | default "" -}}
{{- $useExistingEp := .Values.bench.endpointApiKeysExistingSecret | default "" -}}
{{- $stored := dict -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secName -}}
{{- if $existing -}}
{{-   $stored = $existing.data | default dict -}}
{{- end -}}
{{- $webKey := "" -}}
{{- if not $useExistingWeb -}}
{{-   $prev := get $stored "BENCH_API_KEYS" | default "" | b64dec -}}
{{-   $webKey = .Values.security.apiKey | default $prev | default (randAlphaNum 32) -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.deployment.appName }}
type: Opaque
stringData:
  {{- if not $useExistingWeb }}
  # Web-app key for the benchmark pages (X-API-Key / Bearer). Never shipped
  # in the chart: inline seed, reuse of the released value, or generated.
  BENCH_API_KEYS: {{ $webKey | quote }}
  {{- end }}
  {{- if not $useExistingEp }}
  {{- $ep := .Values.bench.endpointApiKeys | default dict -}}
  {{- $storedEp := get $stored "BENCH_ENDPOINT_API_KEYS" | default "" | b64dec -}}
  {{- /* Sticky: values seed first install / explicit reseed; an upgrade with
         an EMPTY values entry keeps the stored JSON (never clobbered by {}). */ -}}
  {{- if $ep }}
  BENCH_ENDPOINT_API_KEYS: {{ $ep | toJson | quote }}
  {{- else if $storedEp }}
  BENCH_ENDPOINT_API_KEYS: {{ $storedEp | quote }}
  {{- end }}
  {{- end }}
