# ============================================================================
# ModelBenchmarker — the LLM memory estimator (default page) plus API-key-gated
# benchmark launchers (chat + universal REST/MCP), deployed on PCAI behind the
# Istio gateway.
# Full guide: README.md + helm/values-examples/README.md
# Owner: Andrew Bydlon
# Email: andrew.bydlon@hpe.com

#  ### REQUIRED ### — key material lives in Secrets you own, NOT in values
#   1. bench.endpoints — the benchmarkable-target allowlist; an EMPTY list
#      disables benchmarking outright (fail-closed).
#   2. security.existingSecret (+ security.existingSecretApiKey) — a Secret YOU
#      own holding the benchmark-page API key; without it the chart seeds
#      security.apiKey or auto-generates into <deployment.name>-keys on install.
#   3. bench.endpointApiKeys (or bench.endpointApiKeysExistingSecret) — SECRET
#      target keys; injected into the bench subprocess, never served to the browser.
#   4. ezua.virtualService.endpoint — RENDER FAILS without it while ezua.enabled.

#  ### OPTIONAL ###
# Major tuning setups (copy the shape from the pointer):
#   Run storage: persistence.* (PVC keeps run artifacts across pod updates)
#   Targets: bench.suggestions / bench.prometheusUrl (GPU telemetry join)
#   Egress: proxy.http|https|noProxy — each key wired only when non-empty
#   PCAI: pcai.enabled / kyverno.enabled / ezua.authorizationPolicy

# ============================================================================
# Deployment
# ============================================================================

replicaCount: 1

deployment:
  name: model-benchmarker
  appName: model-benchmarker

# ============================================================================
# Image
# ============================================================================

image:
  repository: ghcr.io/ai-solution-eng/model-benchmarker
  # Packaged with the chart — kept in lockstep by bump_version.sh.
  tag: v0.8.2
  pullPolicy: IfNotPresent

# Only needed if the GHCR package stays private.
imagePullSecrets: []

# ============================================================================
# Benchmarks
# ============================================================================

# The allowlist of benchmarkable targets — the UI offers ONLY these, so a run
# never accepts a URL from the browser. Empty = benchmarking off (fail-closed).
bench:
  endpoints: []
  #   - name: rag-mcp
  #     url: http://rag-mcp-server-api.rag.svc.cluster.local   # kind: endpoint

  # Per-endpoint API keys for the TARGETS (JSON object name -> key). SECRET
  # material: release Secret or an existing Secret; never served to the browser.
  endpointApiKeys: {}

  # Per-endpoint keys as a pre-existing Secret reference (alternative to the above).
  endpointApiKeysExistingSecret: ""
  endpointApiKeysExistingSecretKey: endpoint-api-keys

  # Operator-curated CONVENIENCE entries for the target combobox: the UI offers
  # them in a searchable dropdown, and any http(s) URL stays typeable by hand.
  suggestions: []

  # Optional Prometheus for the GPU-telemetry join (the scaling curve), e.g.
  # http://kubeprom-prometheus.prometheus.svc.cluster.local:9090. Empty = latency only.
  prometheusUrl: ""

# ============================================================================
# Run storage
# ============================================================================

# Every run writes run.json/run.csv/report.md/report.html/run.log to
# <workDir>/runs/<run-id>/. The PVC is helm.sh/resource-policy: keep.
persistence:
  enabled: true
  mountPath: /data
  size: 10Gi
  # "" = cluster default StorageClass; an RWX class supports replicaCount > 1.
  storageClass: ""
  accessModes: [ReadWriteOnce]

# ============================================================================
# Web-app auth
# ============================================================================

# The benchmark pages (/benchmark/*, /api/runs*, /api/endpoints) require an API key,
# read per request (no restart to rotate); / and /api/estimate stay public.
security:
  apiKey: ""
  existingSecret: ""
  existingSecretApiKey: BENCH_API_KEYS

# ============================================================================
# Service + Resources
# ============================================================================

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

# Thin web server + subprocess supervisor; benchmarks consume the TARGET's GPUs.
resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {memory: 1Gi}

# ============================================================================
# Corporate Egress Proxy
# ============================================================================

# Controls proxy / no_proxy for the estimator's outbound fetches (huggingface.co
# config.json); each key is injected only when non-empty, like ModelDownloader.
proxy: {}

# ============================================================================
# PCAI Feature Gate
# ============================================================================

# Set explicitly — PCAI features no longer follow proxy config.
pcai:
  enabled: false

# Pass-through env: BENCH_MAX_CONCURRENT_RUNS, BENCH_MAX_RUN_SECONDS,
# BENCH_CATALOG_PATH, HF_TOKEN (gated repos like CohereLabs).
extraEnv: {}

# ============================================================================
# PCAI Integration
# ============================================================================

# The EZUA card shows "Ready" via the hpe-ezua/* labels, rendered statically on
# the Deployment/Service; the ClusterPolicy is optional belt-and-suspenders.
kyverno:
  enabled: false

ezua:
  enabled: true

  virtualService:
    # The DOMAIN placeholder is substituted by PCAI; change only the prefix.
    endpoint: model-benchmarker.${DOMAIN_NAME}
    istioGateway: istio-system/ezaf-gateway
    # The launcher pages poll; the gateway timeout covers an API call, not a run.
    timeout: 60s
    longTimeout: 7200s

  authorizationPolicy:
    # false where SSO is applied centrally at the gateway; true on customer clusters.
    enabled: false
    namespace: istio-system
    providerName: oauth2-proxy
