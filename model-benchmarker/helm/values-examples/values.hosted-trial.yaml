# ============================================================================
# ModelBenchmarker — HOSTED TRIAL values (sanitized) — single replica.
# Customer PCAI: oauth2-proxy AuthorizationPolicy at the gateway PLUS the
# chart's Kyverno vendor-label ClusterPolicy pre-install hook — the customer
# admin may need to permit ClusterPolicy creation on locked-down clusters.
# ALL credentials are fillers; hardlinked to the public delivery repo.

#  ### REQUIRED ### — key material lives in a Secret YOU manage, NOT in values
#   1. security.apiKey (or security.existingSecret) — the benchmark-page API
#      key; with neither set the chart auto-generates <deployment.name>-keys.
#   2. bench.endpoints — the customer endpoints to benchmark; empty ships the
#      estimator page only.
#   3. ezua.virtualService.endpoint — RENDER FAILS without it while ezua.enabled.

#  ### OPTIONAL ###
#   Targets: bench.endpointApiKeys / bench.prometheusUrl (empty = latency only)
#   Run storage: persistence.* (size + storage class per the customer cluster)
#   Egress: proxy.* — customer clusters usually have their own egress path
#   PCAI: pcai.enabled / kyverno.enabled (on here) / ezua.authorizationPolicy

replicaCount: 1

deployment:
  name: model-benchmarker
  appName: model-benchmarker

image:
  repository: ghcr.io/ai-solution-eng/model-benchmarker
  tag: v0.8.2
  pullPolicy: IfNotPresent

imagePullSecrets: []

# ============================================================================
# Benchmarks
# ============================================================================

# The customer endpoints they will benchmark; empty ships estimator-only.
bench:
  endpoints: []
  #   - name: their-model
  #     url: http://their-model.<their-ns>.svc.cluster.local   # kind: chat

  # Per-endpoint API keys for the TARGETS (JSON object name -> key). SECRET
  # material: release Secret or an existing Secret; never served to the browser.
  endpointApiKeys: {}
  endpointApiKeysExistingSecret: ""
  endpointApiKeysExistingSecretKey: endpoint-api-keys

  # The cluster Prometheus (empty = latency-only benchmarks).
  prometheusUrl: ""

persistence:
  enabled: true
  mountPath: /data
  # Size + storage class per the customer cluster.
  size: 10Gi
  storageClass: ""
  accessModes: [ReadWriteOnce]

security:
  # The chart ships NO key material: point existingSecret at a Secret you own,
  # set apiKey as an inline seed, or let the chart auto-generate on first install.
  apiKey: "<BENCH_API_KEY>"
  existingSecret: ""
  existingSecretApiKey: BENCH_API_KEYS

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {memory: 1Gi}

# Customer clusters usually have their OWN egress path — keep proxy: {}. Fill
# the keys only if this PCAI reaches the internet through a corporate proxy.
proxy: {}

# ============================================================================
# PCAI Feature Gate
# ============================================================================

# Set explicitly — PCAI features no longer follow proxy config.
pcai:
  enabled: true

extraEnv: {}

# ============================================================================
# PCAI Integration
# ============================================================================

# Hosted trials enable the pre-install ClusterPolicy (the customer admin may need
# to permit it); the static vendor labels render regardless.
kyverno:
  enabled: true

ezua:
  enabled: true

  virtualService:
    # The DOMAIN placeholder is substituted by PCAI; change the prefix only.
    endpoint: model-benchmarker.${DOMAIN_NAME}
    istioGateway: istio-system/ezaf-gateway
    timeout: 60s
    longTimeout: 7200s

  authorizationPolicy:
    # Hosted trials: customer SSO via oauth2-proxy at the gateway.
    enabled: true
    namespace: istio-system
    providerName: oauth2-proxy
