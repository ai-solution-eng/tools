# ============================================================================
# ModelBenchmarker — proxied corporate PCAI site values (SANITIZED) —
# placeholder addresses, single replica.
# The ezaf-gateway applies HPE SSO centrally at sites like this, so the chart
# creates no AuthorizationPolicy; the web-app API key still gates the pages.
# All serving URLs are placeholder-addressed and ALL credentials are fillers —
# real per-site values live in helm/local/ (gitignored, never packaged).

#  ### REQUIRED ### — key material lives in a Secret YOU manage, NOT in values
#   1. security.existingSecret — Secret `bench-platform-keys` carrying
#      BENCH_API_KEYS; build it with kubectl (see README.md).
#   2. bench.endpointApiKeys — SECRET target keys; fillers here, real values
#      only in helm/local/.
#   3. ezua.virtualService.endpoint — RENDER FAILS without it while ezua.enabled.

#  ### OPTIONAL ###
#   Run storage: persistence.* (an RWX class enables replicaCount > 1)
#   Targets: bench.suggestions (the UI combobox) / bench.prometheusUrl
#   Egress: proxy.* — proxied site; in-cluster targets stay in noProxy
#   PCAI: pcai.enabled / kyverno.enabled (off here) / ezua.authorizationPolicy

replicaCount: 1

deployment:
  name: model-benchmarker
  appName: model-benchmarker

image:
  repository: ghcr.io/ai-solution-eng/model-benchmarker
  tag: v0.9.3
  pullPolicy: IfNotPresent

imagePullSecrets: []

# ============================================================================
# Benchmark targets
# ============================================================================

# The target suggestions below populate the UI's searchable combobox — ADVICE
# ONLY, any http(s) URL stays typeable by hand. One run per origin at a time.
bench:

  suggestions:
    # Chat models (shared serving endpoints) — PLACEHOLDER addresses.
    - name: qwen-38-27b (chat)
      url: https://qwen-38-27b.project-user-<USERNAME>.serving.<cluster-domain>
      kind: chat
    - name: glm-53-flash (chat)
      url: https://glm-53-flash.project-user-<USERNAME>.serving.<cluster-domain>
      kind: chat
    # Retrieval / RAG pipeline endpoints.
    - name: qwen3-vl-embedding-8b
      url: https://qwen3-vl-embedding-8b.project-user-<USERNAME>.serving.<cluster-domain>
      kind: endpoint
    - name: qwen3-vl-reranker-8b
      url: https://qwen3-vl-reranker-8b.project-user-<USERNAME>.serving.<cluster-domain>
      kind: endpoint
    - name: cohere-transcribe
      url: https://cohere-transcribe-03-2026.project-user-<USERNAME>.serving.<cluster-domain>
      kind: any
    # MCP fleet servers (in-cluster addresses, as registered in the gateway).
    - name: mm-rag (MCP)
      url: http://rag-mcp-server-mcp.mm-rag.svc.cluster.local:9090/mcp
      kind: endpoint
    - name: applygate (MCP)
      url: http://applygate-mcp-service.applygate-mcp.svc.cluster.local:9102/mcp
      kind: endpoint
    - name: k8s-ops (MCP)
      url: http://k8s-mcp-service.k8s-mcp-ops.svc.cluster.local:9090/mcp
      kind: endpoint
    - name: logsearch (MCP)
      url: http://logsearch-mcp-service.logsearch-mcp.svc.cluster.local:9101/mcp
      kind: endpoint
    - name: prometheus (MCP)
      url: http://prometheus-mcp-service.prometheus-mcp.svc.cluster.local:9095/mcp
      kind: endpoint
    - name: seaborn (MCP)
      url: http://mcp-seaborn-server.mcp-seaborn-server.svc.cluster.local:9092/mcp
      kind: endpoint
    - name: searxng (MCP)
      url: http://searxng-mcp-service.searxng-mcp.svc.cluster.local:9090/mcp
      kind: endpoint
    - name: sqlhandler (MCP)
      url: http://sqlhandler.sqlhandler.svc.cluster.local:9097/mcp
      kind: endpoint
    - name: workbench (MCP)
      url: http://workbench-mcp-service.workbench-mcp.svc.cluster.local:9103/mcp
      kind: endpoint

  # Keys for targets that need auth (exact URL -> key; trailing slash ignored).
  # KEY MATERIAL: fillers here, real values only in helm/local/.
  endpointApiKeys:
    "https://qwen-38-27b.project-user-<USERNAME>.serving.<cluster-domain>": "<QWEN_API_KEY>"
    "https://glm-53-flash.project-user-<USERNAME>.serving.<cluster-domain>": "<GLM_API_KEY>"
    "http://rag-mcp-server-mcp.mm-rag.svc.cluster.local:9090/mcp": "<MCP_FLEET_KEY>"

# ============================================================================
# Run storage
# ============================================================================

persistence:
  enabled: true
  mountPath: /data
  # Size to your artifact volume.
  size: 10Gi
  # An RWX class (if the site has one) enables replicaCount > 1.
  storageClass: gl4f-filesystem
  accessModes: [ReadWriteMany]

# ============================================================================
# Web-app auth
# ============================================================================

security:
  # Key material lives in a Secret YOU manage; with existingSecret set the
  # chart renders no BENCH_API_KEYS into its own Secret.
  existingSecret: "bench-platform-keys"
  existingSecretApiKey: BENCH_API_KEYS
  apiKey: ""

# ============================================================================
# Service + Resources
# ============================================================================

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {memory: 1Gi}

# Proxied corporate site: the estimator's huggingface.co fetches traverse it,
# in-cluster targets stay direct. Addresses are PLACEHOLDERS — substitute the real ones.
proxy:
  http: http://proxy.corp.example:8080
  https: http://proxy.corp.example:8080
  noProxy: .cluster.local,.svc,.svc.cluster,.svc.cluster.local,10.0.0.0/8,127.0.0.1,localhost

# ============================================================================
# PCAI Feature Gate
# ============================================================================

# Set explicitly — PCAI features no longer follow proxy config.
pcai:
  enabled: true

extraEnv: {}

# ============================================================================
# PCAI Integration
# ============================================================================

# No Kyverno stamping needed here: the vendor labels are rendered statically on
# the Deployment/Service (that is what makes the EZUA card "Ready").
kyverno:
  enabled: false

ezua:
  enabled: true

  virtualService:
    # The site's literal EZUA domain.
    endpoint: model-benchmarker.<cluster-domain>
    istioGateway: istio-system/ezaf-gateway
    timeout: 60s
    longTimeout: 7200s

  authorizationPolicy:
    # false at this site — HPE SSO is applied centrally at the ezaf-gateway.
    enabled: false
    namespace: istio-system
    providerName: oauth2-proxy
