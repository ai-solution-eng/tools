{{- if not .Values.sources }}
{{- if and (eq .Values.backend "onelake") .Values.fabric.credentialsSecret.create }}
{{- /*
  OPTIONAL bootstrap Secret for the Fabric service principal.
  Only rendered when backend=onelake and fabric.credentialsSecret.create is
  true. Prefer creating this Secret out-of-band so the service-principal
  secret never appears in a values file. NEVER commit a real clientSecret.
} */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.fabric.credentialsSecret.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sqlhandler.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.fabric.credentialsSecret.tenantIdKey }}: {{ .Values.fabric.credentialsSecret.values.tenantId | quote }}
  {{ .Values.fabric.credentialsSecret.clientIdKey }}: {{ .Values.fabric.credentialsSecret.values.clientId | quote }}
  {{ .Values.fabric.credentialsSecret.clientSecretKey }}: {{ .Values.fabric.credentialsSecret.values.clientSecret | quote }}
{{- else if and (eq .Values.backend "s3") .Values.s3.credentialsSecret.create }}
{{- /*
  OPTIONAL bootstrap Secret for the S3/MinIO credentials.
  Only rendered when backend==s3 and s3.credentialsSecret.create is true.
  Prefer creating this Secret out-of-band (kubectl create secret) so keys
  never appear in a values file. NEVER commit real keys.
} */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.s3.credentialsSecret.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sqlhandler.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.s3.credentialsSecret.accessKeyKey }}: {{ .Values.s3.credentialsSecret.values.accessKey | quote }}
  {{ .Values.s3.credentialsSecret.secretKeyKey }}: {{ .Values.s3.credentialsSecret.values.secretKey | quote }}
{{- else if and (eq .Values.backend "iceberg") .Values.iceberg.credentialsSecret.create }}
{{- /*
  OPTIONAL bootstrap Secret for the Iceberg REST token + S3 storage keys.
  Only rendered when backend==iceberg and iceberg.credentialsSecret.create
  is true. Prefer creating this Secret out-of-band so tokens/keys never
  appear in a values file.
} */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.iceberg.credentialsSecret.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sqlhandler.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.iceberg.credentialsSecret.tokenKey }}: {{ .Values.iceberg.credentialsSecret.values.token | quote }}
  {{ .Values.iceberg.credentialsSecret.accessKeyKey }}: {{ .Values.iceberg.credentialsSecret.values.accessKey | quote }}
  {{ .Values.iceberg.credentialsSecret.secretKeyKey }}: {{ .Values.iceberg.credentialsSecret.values.secretKey | quote }}
{{- end }}
{{- end }}