# Model Manager — web frontend + queueing service for HuggingFace model
# downloads in Kubernetes. PCAI (HPE Ezmeral Unified Analytics) deployment:
# submits PVC- or S3-backed downloader Jobs and pushes model configs to
# AIOLI/MLIS.
apiVersion: v2
name: model-manager
description: >-
  Web frontend + queueing service for HuggingFace model downloads in
  Kubernetes: submits PVC- or S3-backed downloader Jobs, lists downloaded
  models, and pushes model configs to the AIOLI/MLIS database.
type: application
version: 2.1.2
appVersion: "2.1.2"
keywords:
  - huggingface
  - models
  - download
  - mlis
  - hpe
  - pcai
maintainers:
  - name: HPE AI Solution Engineering
