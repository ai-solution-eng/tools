{{- if eq (include "model-manager.ezuaEnabled" .) "true" }}
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: {{ include "model-manager.fullname" . }}-vs
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "model-manager.labels" . | nindent 4 }}
    hpe-ezua/app: {{ .Chart.Name }}
    hpe-ezua/type: vendor-service
spec:
  gateways:
    - {{ .Values.ezua.virtualService.istioGateway }}
  hosts:
    - {{ .Values.ezua.virtualService.endpoint | required "\nValid .Values.ezua.virtualService.endpoint is required !" }}
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: {{ include "model-manager.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: {{ .Values.service.port }}
      timeout: {{ .Values.ezua.virtualService.timeout }}
{{- end }}
