apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-router-config
  namespace: {{ .Release.Namespace }}
  labels:
    hpe-ezua/type: vendor-service
    hpe-ezua/app: {{ .Chart.Name }}
data:
  server.mjs: |
    import crypto from 'node:crypto'
    import fs from 'node:fs'
    import http from 'node:http'
    import https from 'node:https'
    import net from 'node:net'

    const namespace = process.env.POD_NAMESPACE || '{{ .Release.Namespace }}'
    const sharedWorkspaceClaim = process.env.SHARED_WORKSPACE_CLAIM || '{{ .Release.Name }}-shared-pvc'
    const storageClassName = process.env.STORAGE_CLASS_NAME || '{{ .Values.storageClass }}'
    const previewDomainSuffix = process.env.PREVIEW_DOMAIN_SUFFIX || '{{ .Values.previewDomain }}'
    const userInstanceImage = process.env.USER_INSTANCE_IMAGE || '{{ .Values.images.user }}'
    const userInitImage = process.env.USER_INIT_IMAGE || '{{ .Values.images.init }}'
    const userOpencodeVersion = process.env.USER_INSTANCE_OPENCODE_VERSION || '{{ .Values.opencode.version }}'
    const userOpenChamberVersion = process.env.USER_INSTANCE_OPENCHAMBER_VERSION || '{{ .Values.openchamber.version }}'
    const userUiMode = process.env.USER_INSTANCE_OPENCODE_UI_MODE || '{{ .Values.ui.mode }}'
    const userIsChamber = userUiMode === 'openchamber'
    const userChamberPort = Number(process.env.USER_INSTANCE_OPENCHAMBER_PORT || '{{ .Values.ui.chamberPort }}')
    const userServerPort = Number(process.env.USER_INSTANCE_OPENCODE_SERVER_PORT || '{{ .Values.ui.serverPort }}')
    const workspaceSize = process.env.PERSONAL_WORKSPACE_SIZE || '{{ .Values.storage.workspaceSize }}'
    const stateSize = process.env.PERSONAL_STATE_SIZE || '{{ .Values.storage.stateSize }}'
    // PVC-survival contract (KEEP_PVC_ON_DELETE=true, the default): user data
    // PVCs (per-user ws/st and the per-namespace shared mirror) are never
    // deleted by the app — not via the anchor GC cascade, not by the admin
    // user-delete flow, not by the helm uninstall hook. They survive so the
    // first re-SSO re-binds the exact same volumes. Manual `kubectl delete
    // pvc` remains the deliberate purge path.
    const keepPvcOnDelete = (process.env.KEEP_PVC_ON_DELETE || 'true') !== 'false'
    // userTemplateVersion is the pod-template convergence contract. Three
    // independent things must roll existing units when they change:
    //   RUNTIME_REV    — chart-side template changes (nginx, supervisor,
    //                    probes, env); bump on every such chart change
    //   app versions   — opencode.version / openchamber.version in values
    //                    (covers the version-bumped-without-image-rebuild
    //                    case: runtime install fills in)
    //   userImageRev   — the baked image tag (see docker/user/Dockerfile).
    //                    The tag is folded in so existing units re-stamp when
    //                    the image changes; user pods pull with IfNotPresent
    //                    (immutable tags).
    // v8→v10: readable user slugs (v9) + baked user image support (v10).
    // v10→v11: data-manager route renamed /data_manager → /data-manager (in-pod
    // nginx location + data_manager.mjs BASE + in-app links roll with the re-stamp).
    // v11→v12: optional Docker-in-Docker sidecar (values docker.enabled) — the
    // user container gains DOCKER_HOST and the pod a dockerd sidecar +
    // docker-data volume; existing units re-stamp so the terminal can drive
    // the daemon immediately.
    const userImageRev = (() => {
      const tag = String(userInstanceImage || '').split('@')[0].split(':').pop() || ''
      return (tag.replace(/[^a-zA-Z0-9._-]/g, '').slice(0, 32)) || 'untagged'
    })()
    // Docker-in-Docker (values docker.*): the privileged dind sidecar can
    // only be ADMITTED where the platform Kyverno policies allow privileged
    // containers. tr7's ezprojects-restrict-privileged-pods denies them in
    // project-user-* namespaces (release-namespace units are unaffected), so
    // the sidecar is RUNTIME-GATED per unit:
    //   - release-namespace units (classic + warm pool): sidecar when
    //     docker.enabled.
    //   - platform units (project-user-*): sidecar only when
    //     docker.onPlatformUnits is ALSO true — which requires the platform
    //     team's Kyverno PolicyException for the chart-managed units
    //     (opencode-user-managed=true); otherwise the Deployment POST dies
    //     with 400 and platform SSO breaks entirely.
    // The state participates in the convergence contract so flipping any of
    // it re-stamps existing units.
    const dockerEnabled = {{ if and .Values.docker .Values.docker.enabled }}true{{ else }}false{{ end }}
    const dockerOnPlatformUnits = {{ if and .Values.docker .Values.docker.onPlatformUnits }}true{{ else }}false{{ end }}
    const dockerBrokerForPlatformUnits = {{ if and .Values.docker .Values.docker.brokerForPlatformUnits }}true{{ else }}false{{ end }}
    const dockerImage = '{{ .Values.docker.image | default "docker:28-dind" }}'
    const dockerDiskSize = '{{ .Values.docker.diskSize | default "50Gi" }}'
    const dockerDiskRequest = '{{ .Values.docker.diskRequest | default "5Gi" }}'
    // Convergence marker (in-pod dind placement only): dind-classic
    // (in-pod, release ns) / dind-platform (in-pod sidecar on platform
    // units — requires the Kyverno PolicyException) / nodind. The broker
    // mode (docker.brokerForPlatformUnits) is NOT part of this marker — the
    // broker pod lives outside the unit pod template; broker flips converge
    // via the unit pod's opencode-web-helm/docker annotation (DOCKER_HOST
    // state).
    const dockerSidecar = dockerEnabled
      ? (dockerOnPlatformUnits ? 'dind-platform' : 'dind-classic')
      : 'nodind'
    const dindBrokerVersion = `${dockerSidecar}-${(dockerImage.split(':').pop() || 'untagged')}-${dockerDiskSize}`
    const userTemplateVersion = `terminal-tab-v13-opencode-${dockerSidecar}-${[...new Set([userOpencodeVersion, userOpenChamberVersion, userImageRev])].join('-')}`

    // --- DinD daemon spec (single source for the in-pod sidecar AND the
    // --- per-user broker pods) ------------------------------------------
    // Proven recipe (clearwing chart + container-builder-mcp): dockerd on
    // tcp://0.0.0.0:2375 (no unix socket when -H is passed, so the probes
    // dial DOCKER_HOST explicitly), no TLS. securityContext is the FULL root
    // triple: dockerd cannot run as a non-root uid, and platform admission
    // forces the tenant uid into every container of project-user-* namespaces
    // — container-level overrides beat both the forced uid and the
    // run-as-non-root policy (both hit live on this cluster class). Proxy env
    // -> daemon-level pulls/pushes through the corporate proxy; the
    // certificatesPolicy combined CA bundle (SSL_CERT_FILE) makes the Go
    // daemon trust its MITM TLS. docker-data is emptyDir/node-local on
    // purpose: overlay2 layer extraction fails on VAST network volumes, so
    // the image store is ephemeral (push after build).
    const dindDaemonEnv = [
      { name: 'DOCKER_TLS_CERTDIR', value: '' },
      // The probes exec `docker info` inside the daemon container; with -H
      // passed dockerd binds no unix socket — point the local CLI at the TCP
      // listener.
      { name: 'DOCKER_HOST', value: 'tcp://127.0.0.1:2375' },
      {{- if and .Values.proxy .Values.proxy.enabled }}
      {{- range .Values.proxy.env }}
      { name: '{{ .name }}', value: '{{ .value }}' },
      {{- end }}
      {{- end }}
      {{- if and .Values.no_proxy .Values.no_proxy.enabled }}
      {{- range .Values.no_proxy.env }}
      { name: '{{ .name }}', value: '{{ .value }}' },
      {{- end }}
      {{- end }}
      {{- if and .Values.certificatesPolicy .Values.certificatesPolicy.enabled }}
      {{- range .Values.certificatesPolicy.env }}
      { name: '{{ .name }}', value: '{{ .value }}' },
      {{- end }}
      {{- end }}
    ]
    const dindCertVolumeMounts = [
      {{- if and .Values.certificatesPolicy .Values.certificatesPolicy.enabled }}
      {{- range .Values.certificatesPolicy.volumeMounts }}
      { name: '{{ .name }}', mountPath: '{{ .mountPath }}'{{ if .subPath }}, subPath: '{{ .subPath }}'{{ end }}{{ if hasKey . "readOnly" }}, readOnly: {{ .readOnly }}{{ end }} },
      {{- end }}
      {{- end }}
    ]
    const dindCertVolumes = [
      {{- if and .Values.certificatesPolicy .Values.certificatesPolicy.enabled }}
      {{- range .Values.certificatesPolicy.volumes }}
      { name: '{{ .name }}', {{ if hasKey . "emptyDir" }}emptyDir: {}{{ else }}configMap: { name: '{{ .configMap.name }}', {{- if .configMap.items }} items: [ {{- range .configMap.items }} { key: '{{ .key }}', path: '{{ .path }}' }, {{- end }} ] {{- end }} }{{ end }} },
      {{- end }}
      {{- end }}
    ]
    function dindContainerSpec() {
      return {
        name: 'docker-dind',
        image: dockerImage,
        imagePullPolicy: 'IfNotPresent',
        command: ['dockerd', '--host=tcp://0.0.0.0:2375', '--tls=false'],
        env: dindDaemonEnv,
        securityContext: {
          privileged: true,
          runAsUser: 0,
          runAsNonRoot: false,
        },
        readinessProbe: {
          exec: { command: ['docker', 'info'] },
          initialDelaySeconds: 10, periodSeconds: 10, timeoutSeconds: 5, failureThreshold: 6,
        },
        livenessProbe: {
          exec: { command: ['docker', 'info'] },
          initialDelaySeconds: 30, periodSeconds: 30, timeoutSeconds: 5, failureThreshold: 3,
        },
        resources: {
          // The ephemeral-storage limit is what makes the emptyDir sizeLimit
          // enforceable (kubelet evicts when either is exceeded): a runaway
          // build dies with ENOSPC instead of filling the node disk.
          requests: { cpu: '{{ .Values.docker.resources.requests.cpu | default "250m" }}', memory: '{{ .Values.docker.resources.requests.memory | default "512Mi" }}', 'ephemeral-storage': dockerDiskRequest },
          limits: { cpu: '{{ .Values.docker.resources.limits.cpu | default "4" }}', memory: '{{ .Values.docker.resources.limits.memory | default "8Gi" }}', 'ephemeral-storage': dockerDiskSize },
        },
        volumeMounts: [
          { name: 'docker-data', mountPath: '/var/lib/docker' },
          ...dindCertVolumeMounts,
        ],
      }
    }

    // --- Per-user DinD broker (platform units) ---------------------------
    // Privileged containers are DENIED in project-user-* namespaces by the
    // platform Kyverno policies (tr7: ezprojects-restrict-privileged-pods),
    // so an SSO unit cannot carry the in-pod sidecar. Instead the router
    // deploys ONE privileged dind pod per platform user in THIS (release)
    // namespace — where privileged vendor deployments are admitted — and the
    // unit reaches it cross-namespace via DOCKER_HOST. Lifecycle is bound to
    // the user: created on unit provision/convergence, deleted on user
    // delete, and swept by the uninstall hook (opencode-user-managed=true
    // label). Ingress is restricted to the owning unit's pod via
    // NetworkPolicy; the docker API on 2375 is UNAUTHENTICATED, so if the
    // cluster CNI ignores NetworkPolicy the exposure widens to the cluster
    // (keep docker.brokerForPlatformUnits=false where that is unacceptable).
    function dindBrokerNames(slug) {
      // Cap the slug portion so every broker name (plus its -svc/-netpol
      // suffixes) stays a valid DNS-1123 label (<= 63). Truncated slugs get
      // a hash suffix so two distinct long usernames sharing the cap can
      // never collapse into one broker / one NetworkPolicy.
      const brokerSlug = slug.length > 40
        ? `${slug.slice(0, 33)}-${crypto.createHash('sha256').update(slug).digest('hex').slice(0, 6)}`
        : slug
      return {
        deployment: `opencode-dind-${brokerSlug}`,
        service: `opencode-dind-${brokerSlug}-svc`,
        netpol: `opencode-dind-${brokerSlug}-netpol`,
      }
    }
    function dindBrokerDeploymentManifest(slug) {
      const names = dindBrokerNames(slug)
      // NOT opencode-user-slug: that label means "I am the user's unit" to
      // the router's discovery paths — a broker must never be mistaken for
      // the unit. It carries its own opencode-dind-slug for service/policy
      // selection instead.
      const labels = {
        app: '{{ .Chart.Name }}',
        'opencode-user-managed': 'true',
        'opencode-dind-broker': 'true',
        'opencode-dind-slug': slug,
      }
      return {
        apiVersion: 'apps/v1',
        kind: 'Deployment',
        metadata: { name: names.deployment, namespace, labels },
        spec: {
          replicas: 1,
          strategy: { type: 'Recreate' },
          selector: { matchLabels: { 'opencode-dind-broker': 'true', 'opencode-dind-slug': slug } },
          template: {
            metadata: {
              labels,
              annotations: {
                'sidecar.istio.io/inject': 'false',
                'opencode-web-helm/dind-template-version': dindBrokerVersion,
              },
            },
            spec: {
              containers: [dindContainerSpec()],
              volumes: [
                { name: 'docker-data', emptyDir: { sizeLimit: dockerDiskSize } },
                ...dindCertVolumes,
              ],
            },
          },
        },
      }
    }
    function dindBrokerServiceManifest(slug) {
      const names = dindBrokerNames(slug)
      return {
        apiVersion: 'v1',
        kind: 'Service',
        metadata: {
          name: names.service,
          namespace,
          labels: {
            app: '{{ .Chart.Name }}',
            'opencode-user-managed': 'true',
            'opencode-dind-broker': 'true',
            'opencode-dind-slug': slug,
          },
        },
        spec: {
          type: 'ClusterIP',
          selector: { 'opencode-dind-broker': 'true', 'opencode-dind-slug': slug },
          ports: [
            { name: 'docker', protocol: 'TCP', port: 2375, targetPort: 2375 },
          ],
        },
      }
    }
    function dindBrokerNetpolManifest(slug, unitNs) {
      const names = dindBrokerNames(slug)
      return {
        apiVersion: 'networking.k8s.io/v1',
        kind: 'NetworkPolicy',
        metadata: {
          name: names.netpol,
          namespace,
          labels: {
            app: '{{ .Chart.Name }}',
            'opencode-user-managed': 'true',
            'opencode-dind-broker': 'true',
            'opencode-dind-slug': slug,
          },
        },
        spec: {
          podSelector: { matchLabels: { 'opencode-dind-broker': 'true', 'opencode-dind-slug': slug } },
          policyTypes: ['Ingress'],
          ingress: [
            {
              // Only the owning unit's pod may dial the daemon (2375 is an
              // UNAUTHENTICATED docker API — treat reachability as root on
              // the broker pod).
              from: [
                {
                  namespaceSelector: { matchLabels: { 'kubernetes.io/metadata.name': unitNs } },
                  podSelector: { matchLabels: { 'opencode-user-slug': slug } },
                },
              ],
              ports: [{ port: 2375, protocol: 'TCP' }],
            },
          ],
        },
      }
    }
    async function ensureDindBroker(slug, unitNs) {
      if (!dockerEnabled || !dockerBrokerForPlatformUnits) return
      const names = dindBrokerNames(slug)
      try {
        const depManifest = dindBrokerDeploymentManifest(slug)
        const existing = await k8sRequest('GET', `/apis/apps/v1/namespaces/${namespace}/deployments/${names.deployment}`)
        if (existing) {
          const version = existing.spec?.template?.metadata?.annotations?.['opencode-web-helm/dind-template-version']
          if (version !== dindBrokerVersion) {
            await k8sRequest('PATCH', `/apis/apps/v1/namespaces/${namespace}/deployments/${names.deployment}`, { spec: { template: depManifest.spec.template } })
          }
        } else {
          try {
            await k8sRequest('POST', `/apis/apps/v1/namespaces/${namespace}/deployments`, depManifest)
            console.log(`[dind] broker deployed for ${slug} (unit ns ${unitNs})`)
          } catch (error) {
            if (error.statusCode !== 409) throw error
          }
        }
        if (!(await k8sRequest('GET', `/api/v1/namespaces/${namespace}/services/${names.service}`))) {
          try {
            await k8sRequest('POST', `/api/v1/namespaces/${namespace}/services`, dindBrokerServiceManifest(slug))
          } catch (error) {
            if (error.statusCode !== 409) throw error
          }
        }
        if (!(await k8sRequest('GET', `/apis/networking.k8s.io/v1/namespaces/${namespace}/networkpolicies/${names.netpol}`))) {
          try {
            await k8sRequest('POST', `/apis/networking.k8s.io/v1/namespaces/${namespace}/networkpolicies`, dindBrokerNetpolManifest(slug, unitNs))
          } catch (error) {
            if (error.statusCode !== 409) throw error
          }
        }
      } catch (error) {
        // The broker is an ENHANCEMENT: a failure (RBAC not yet upgraded,
        // quota, admission) must never break the unit resolve — the unit
        // simply runs without a reachable daemon.
        console.error(`[dind] broker ensure failed for ${slug}: ${error.message}`)
      }
    }
    async function deleteDindBroker(slug) {
      const names = dindBrokerNames(slug)
      // Per-delete guards: one failing kind (e.g. an RBAC gap) must not
      // skip the others.
      for (const [api, name] of [
        [`/apis/apps/v1/namespaces/${namespace}/deployments`, names.deployment],
        [`/api/v1/namespaces/${namespace}/services`, names.service],
        [`/apis/networking.k8s.io/v1/namespaces/${namespace}/networkpolicies`, names.netpol],
      ]) {
        try {
          await deleteK8s(api, name)
        } catch (error) {
          console.error(`[dind] broker delete failed for ${slug} (${name}): ${error.message}`)
        }
      }
    }

    const ttydVersion = '1.7.7'
    const userPullSecret = process.env.USER_IMAGE_PULL_SECRET || ''
    const usernameHeader = 'x-auth-request-preferred-username'
    const fallbackUserHeader = 'x-auth-request-user'
    const kubeHost = process.env.KUBERNETES_SERVICE_HOST
    const kubePort = process.env.KUBERNETES_SERVICE_PORT_HTTPS || '443'
    const serviceAccountToken = fs.readFileSync('/var/run/secrets/kubernetes.io/serviceaccount/token', 'utf8').trim()
    const serviceAccountCa = fs.readFileSync('/var/run/secrets/kubernetes.io/serviceaccount/ca.crt')
    const basicAuth = `Basic ${Buffer.from(`${process.env.OPENCODE_SERVER_USERNAME}:${process.env.OPENCODE_SERVER_PASSWORD}`).toString('base64')}`
    const activePtyUpgrades = new Map()
    let tunnelSeq = 0
    const warmPoolEnabled = process.env.WARM_POOL_ENABLED === 'true'
    const warmPoolSize = Number(process.env.WARM_POOL_SIZE || '0')
    const warmRefreshIntervalMs = Number(process.env.WARM_REFRESH_INTERVAL_MS || '15000')
    const warmStuckThresholdMs = Number(process.env.WARM_STUCK_THRESHOLD_MS || `${15 * 60 * 1000}`)
    const ownerMap = new Map() // user slug -> warm poolId
    let poolBusy = false
    const poolLocks = new Map() // poolId -> promise chain (per-unit claim mutex)
    const warmStuckSince = new Map() // warm deployment name -> first-seen-not-ready timestamp
    const setupUiEnabled = process.env.SETUP_UI_ENABLED === 'true'
    const setupStatusPath = process.env.SETUP_STATUS_PATH || '/__oc_setup_status'
    const setupHeading = process.env.SETUP_HEADING || 'Setting up your account\u2026'
    const setupSubtext = process.env.SETUP_SUBTEXT || 'This usually takes a few minutes on first launch. Please wait.'
    const provisionTasks = new Map() // deployment name -> { promise, error }

    // --- Direct-to-pod routing / identity -------------------------------
    const istioGateway = process.env.ISTIO_GATEWAY || '{{ .Values.ezua.virtualService.istioGateway }}'
    // Public host the UI is actually served on (the chart's VirtualService
    // endpoint). Rendered ONLY as an env fallback — never into JS template
    // literals — because the platform pipeline ships it as a literal
    // "${DOMAIN_NAME}" placeholder. Forwarded to user pods as PREVIEW_UI_HOST
    // so the port watcher prints preview URLs against the deployed host
    // instead of a hardcoded opencode. subdomain.
    const uiEndpointHost = process.env.UI_ENDPOINT_HOST || 'opencode.${DOMAIN_NAME}'
    const registrySecretName = process.env.USER_REGISTRY_SECRET || '{{ .Release.Name }}-users'
    const sessionSecret = process.env.SESSION_SECRET || ''
    const sessionCookieName = 'oc_sess'
    const sessionTtlSeconds = 7 * 24 * 60 * 60
    const adminUsername = process.env.ADMIN_USERNAME || ''
    const adminPassword = process.env.ADMIN_PASSWORD || ''
    // Version the per-user PVC names so a new environment provisions a fresh
    // VAST volume instead of colliding with an orphaned quota left behind by a
    // previously-deleted volume (VAST CSI deletes can fail when
    // deletionViewPolicy is not configured to allow local volume deletion).
    const pvcNameVersion = process.env.PVC_NAME_VERSION || '{{ .Values.storage.nameVersion }}'
    const sharedWorkspaceSize = process.env.SHARED_WORKSPACE_SIZE || '{{ .Values.storage.sharedSize }}'

    // --- Platform (PCAI/Kubeflow) workspace integration --------------------
    // SSO users whose platform project (EzProject -> namespace
    // project-user-<username>, created by the ezprojects-operator on first
    // platform login) already exists get their unit deployed INSIDE that
    // namespace, with the platform volumes mounted and the process running
    // under the project's unix identity. See the README "Platform volumes for
    // SSO users".
    const platformEnabled = process.env.PLATFORM_INTEGRATION_ENABLED === 'true'
    const platformNsPrefix = process.env.PLATFORM_NAMESPACE_PREFIX || 'project-user-'
    // Candidate naming patterns for a user's platform project namespace —
    // comma-separated templates with a {username} placeholder (the sanitized
    // username). A trailing `*` acts as a wildcard: any namespace whose name
    // starts with the expanded prefix becomes a candidate (resolved via a
    // cached namespace-list scan and verified for OWNERSHIP through the
    // project-info user field, since one user's prefix can collide with
    // another user's name). When unset, the legacy single-prefix behavior
    // applies (PLATFORM_NAMESPACE_PREFIX + username). The first candidate
    // that verifies (namespace exists + project-info carries uid/gid) wins.
    const platformNsPatterns = (process.env.PLATFORM_NAMESPACE_PATTERNS || '')
      .split(',')
      .map((pattern) => pattern.trim())
      .filter(Boolean)
    const platformNsListCache = { at: 0, names: [] }
    const platformSharedClaim = process.env.PLATFORM_SHARED_CLAIM || 'kubeflow-shared-pvc'
    const platformSharedMount = process.env.PLATFORM_SHARED_MOUNT || '/mnt/shared'
    const platformUserClaim = process.env.PLATFORM_USER_CLAIM || 'user-pvc'
    const platformUserMount = process.env.PLATFORM_USER_MOUNT || '/mnt/user'
    const platformReadOnly = process.env.PLATFORM_VOLUMES_READONLY === 'true'
    // ConfigMaps the unit pod template mounts. For units deployed into a
    // project namespace these are mirrored (copied + owner-anchored) into
    // that namespace, since cross-namespace volume mounts are impossible.
    const unitConfigMapNames = [
      '{{ .Release.Name }}-project-config',
      '{{ .Release.Name }}-personal-content',
      '{{ .Release.Name }}-preview-config',
      {{- if and .Values.sharedContent .Values.sharedContent.enabled }}
      '{{ .Release.Name }}-shared-content',
      {{- end }}
    ]
    // TTL caches so the per-request resolve path does not hammer the API
    // server with platform context / mirror-sync checks.
    const platformContextCache = new Map() // username -> { at, value }
    const mirrorSyncCache = new Map() // unitNamespace -> timestamp

    // Readable user slugs. Usernames are unique in the registry (local
    // registration and admin create reject duplicates, and an SSO identity is
    // tracked under its exact lowercased header value), so the slug can simply
    // be the URL-safe username itself: SSO user "francesco-caliva" is served
    // at /francesco-caliva/ instead of the opaque /u-<sha256-prefix>/ of
    // earlier releases.
    const slugMaxLength = 54 // "opencode-user-" + slug stays well under the DNS name limits
    // Slugs that would shadow router control paths or in-pod root-relative app
    // routes (nginx serves /terminal, /term, /data-manager) keep the legacy
    // hash slug instead. "data_manager" slugifies to "data-manager", so the
    // hyphenated form must be reserved since the endpoint rename (the old
    // underscore path could never collide with a slug).
    const slugReservedNames = new Set(['healthz', 'terminal', 'term', 'u', 'data-manager'])
    function slugifyUsername(userId) {
      const cleaned = (userId || '')
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/-+/g, '-')
        .replace(/^-+|-+$/g, '')
      if (!cleaned) return ''
      if (cleaned.length > slugMaxLength) {
        // Truncated long names keep a hash suffix so two distinct usernames
        // sharing a long prefix can never collapse into one environment.
        return cleaned.slice(0, slugMaxLength - 7).replace(/-+$/, '')
          + '-' + crypto.createHash('sha256').update(userId.toLowerCase()).digest('hex').slice(0, 6)
      }
      return cleaned
    }
    // Pre-readable-slug one-way-hash slug; kept for bookmark compatibility, as
    // the degenerate-name fallback, and to find/migrate earlier environments.
    function legacySlugForUser(userId) {
      return crypto.createHash('sha256').update(userId.toLowerCase()).digest('hex').slice(0, 12)
    }
    function slugForUser(userId) {
      const readable = slugifyUsername(userId)
      if (!readable || readable.startsWith('__') || readable.startsWith('u-') || slugReservedNames.has(readable)) {
        return legacySlugForUser(userId)
      }
      return readable
    }

    function namesForSlug(slug, unitNs) {
      // Per-user claim names embed the nameVersion AND the volume kind EARLY
      // (`opencode-<ver>-ws-<slug>` / `opencode-<ver>-st-<slug>`): VAST quota
      // names are `csi:<ns>:<pvc>` truncated to 64 chars — with a long unit
      // namespace (platform units live in project-user-<username>) a version
      // SUFFIX would be invisible to VAST and re-provisions would collide
      // with orphaned quotas. Deployment/service names are unchanged.
      // EXISTING units keep the claims they already mount (resolved from the
      // deployment spec) — only fresh environments use these names.
      const base = `opencode-${pvcNameVersion}`
      return {
        deployment: `opencode-user-${slug}`,
        service: `opencode-user-${slug}-svc`,
        workspaceClaim: `${base}-ws-${slug}`,
        stateClaim: `${base}-st-${slug}`,
        virtualService: `opencode-user-vs-${slug}`,
        // The namespace the unit lives in: the release namespace (classic
        // shape) or the user's platform project namespace (platform
        // integration).
        namespace: unitNs || namespace,
      }
    }

    // --- Admin console ------------------------------------------------
    const adminCookieName = 'oc_admin'
    const adminSessionTtlSeconds = 8 * 60 * 60
    // Set by /__oc_logout so the auto-SSO landing flow does not immediately
    // sign a user who explicitly logged out back in. Cleared by an explicit
    // SSO login.
    const ssoLogoutMarkerName = 'oc_sso_out'

    function ssoLogoutMarkerCookie(set) {
      return [
        `${ssoLogoutMarkerName}=${set ? '1' : ''}`,
        'Path=/',
        `Max-Age=${set ? String(30 * 24 * 60 * 60) : '0'}`,
        'HttpOnly',
        'SameSite=Lax',
        'Secure',
      ].join('; ')
    }

    function adminSessionCookieHeader() {
      const payload = { admin: true, exp: Math.floor(Date.now() / 1000) + adminSessionTtlSeconds }
      const payloadB64 = base64url(JSON.stringify(payload))
      const sig = crypto.createHmac('sha256', sessionSecret).update(payloadB64).digest('hex')
      return [
        `${adminCookieName}=${payloadB64}.${sig}`,
        `Domain=${previewDomainSuffix}`,
        'Path=/',
        `Max-Age=${adminSessionTtlSeconds}`,
        'HttpOnly',
        'SameSite=Lax',
        'Secure',
      ].join('; ')
    }

    function clearAdminCookieHeader() {
      return [
        `${adminCookieName}=`,
        `Domain=${previewDomainSuffix}`,
        'Path=/',
        'Max-Age=0',
        'HttpOnly',
        'SameSite=Lax',
        'Secure',
      ].join('; ')
    }

    function adminCookieValid(request) {
      if (!sessionSecret) return false
      const header = request.headers.cookie || ''
      let value = null
      for (const part of header.split(';')) {
        const trimmed = part.trim()
        if (trimmed.startsWith(`${adminCookieName}=`)) {
          value = decodeURIComponent(trimmed.slice(adminCookieName.length + 1))
          break
        }
      }
      if (!value) return false
      const dot = value.lastIndexOf('.')
      if (dot <= 0) return false
      const payloadB64 = value.slice(0, dot)
      const sig = value.slice(dot + 1)
      const expected = crypto.createHmac('sha256', sessionSecret).update(payloadB64).digest('hex')
      if (sig.length !== expected.length) return false
      if (!crypto.timingSafeEqual(Buffer.from(sig, 'hex'), Buffer.from(expected, 'hex'))) return false
      let payload
      try {
        payload = JSON.parse(Buffer.from(payloadB64, 'base64url').toString('utf8'))
      } catch {
        return false
      }
      if (payload.admin !== true) return false
      if (typeof payload.exp === 'number' && payload.exp * 1000 < Date.now()) return false
      return true
    }

    function isAdmin(request) {
      if (adminCookieValid(request)) return true
      if (!adminUsername || !adminPassword) return false
      const auth = request.headers.authorization || ''
      if (!auth.startsWith('Basic ')) return false
      let decoded = ''
      try {
        decoded = Buffer.from(auth.slice(6), 'base64').toString('utf8')
      } catch {
        return false
      }
      const colon = decoded.indexOf(':')
      if (colon < 0) return false
      const user = decoded.slice(0, colon)
      const pass = decoded.slice(colon + 1)
      return user === adminUsername && pass === adminPassword
    }

    async function deleteK8s(apiPath, name) {
      try {
        await k8sRequest('DELETE', `${apiPath}/${name}?propagationPolicy=Background`)
      } catch (error) {
        if (error.statusCode !== 404) throw error
      }
    }

    async function waitForDeploymentGone(name, timeoutMs = 90000, ns = namespace) {
      const start = Date.now()
      while (Date.now() - start < timeoutMs) {
        const dep = await k8sRequest('GET', `/apis/apps/v1/namespaces/${ns}/deployments/${name}`)
        if (!dep || (dep.status?.replicas || 0) === 0) return
        await new Promise((resolve) => setTimeout(resolve, 2000))
      }
    }

    // --- Conversation cleanup -------------------------------------------
    // Deletes opencode chat history from a user's state PVC via a short-lived
    // Job: the SQLite conversation database (opencode.db, holding sessions/
    // messages since opencode ~1.2) plus any legacy storage/ subtrees, then
    // rolls the user's pod so the running server recreates a fresh database.
    // Only conversation data is removed: workspace files,
    // opencode.json/agents/skills and auth.json (model keys) survive, and the
    // user's session cookie stays valid.
    function deploymentForSlug(deployments, slug, legacySlug) {
      for (const dep of deployments) {
        const labels = dep.metadata?.labels || {}
        if (labels['opencode-user-slug'] === slug) return dep
        if (labels['opencode-user-warmpool'] === 'true'
          && (labels['opencode-user-owner'] === slug || (legacySlug && labels['opencode-user-owner'] === legacySlug))) return dep
      }
      return null
    }

    function stateClaimForDeployment(dep) {
      const volumes = dep?.spec?.template?.spec?.volumes || []
      const volume = volumes.find((v) => v.name === 'state')
      return volume?.persistentVolumeClaim?.claimName || null
    }

    async function podForSlug(slug, legacySlug, ns = namespace) {
      const result = await k8sRequest('GET', `/api/v1/namespaces/${ns}/pods?labelSelector=${encodeURIComponent('opencode-user-managed=true')}`)
      let fallback = null
      for (const pod of (result && result.items) || []) {
        const labels = pod.metadata?.labels || {}
        const podSlug = labels['opencode-user-slug'] || (labels['opencode-user-warmpool'] === 'true' ? labels['opencode-user-owner'] : null)
        if ((podSlug !== slug && (!legacySlug || podSlug !== legacySlug)) || !pod.spec?.nodeName) continue
        if (pod.status?.phase === 'Running') {
          return { phase: 'Running', nodeName: pod.spec.nodeName }
        }
        if (!fallback && pod.status?.phase !== 'Succeeded' && pod.status?.phase !== 'Failed') {
          fallback = { phase: pod.status?.phase || 'Unknown', nodeName: pod.spec.nodeName }
        }
      }
      return fallback
    }

    // Phase of the Job's pod, or null while still running/absent. Counting
    // success at the pod level guards against the JobTrackingWithFinalizers
    // failure mode where status.succeeded sticks behind a finished pod
    // (stuck batch.kubernetes.io/job-tracking finalizer).
    async function jobPodPhase(jobName, ns = namespace) {
      const result = await k8sRequest('GET', `/api/v1/namespaces/${ns}/pods?labelSelector=${encodeURIComponent('job-name=' + jobName)}`)
      for (const pod of (result && result.items) || []) {
        const phase = pod.status?.phase
        if (phase === 'Succeeded' || phase === 'Failed') return phase
      }
      return null
    }

    // Distinct namespaces opencode units live in: the release namespace plus
    // every unit namespace recorded in the registry (platform integration:
    // units inside the users' project-user-<name> namespaces). Used by the
    // cleanup sweeps and the admin snapshot paths.
    async function knownUnitNamespaces() {
      const namespaces = new Set([namespace])
      try {
        const users = await loadUserRegistry()
        for (const record of Object.values(users)) {
          if (record?.unitNs) namespaces.add(record.unitNs)
        }
      } catch {
        // Registry unreadable: stay with the release namespace only.
      }
      return [...namespaces]
    }

    // Cleanup Jobs are removed as soon as their clear finishes (finally block
    // above); this sweep mops up orphans left when the router died mid-clear.
    // The Job TTL cannot reclaim a job that never reached a terminal
    // condition (stuck job-tracking finalizer). The 5-minute age floor is
    // safely beyond the 240s poll deadline, so a live clear is never swept.
    async function sweepStaleClearJobs() {
      const namespaces = await knownUnitNamespaces()
      for (const ns of namespaces) {
        try {
          const result = await k8sRequest('GET', `/apis/batch/v1/namespaces/${ns}/jobs?labelSelector=${encodeURIComponent('opencode-user-managed=true')}`)
          const cutoff = Date.now() - 5 * 60 * 1000
          for (const job of (result && result.items) || []) {
            const name = job.metadata?.name || ''
            if (!name.startsWith('opencode-clear-')) continue
            const createdAt = Date.parse(job.metadata?.creationTimestamp || '')
            if (!Number.isFinite(createdAt) || createdAt > cutoff) continue
            console.log(`[admin] sweeping stale cleanup job ${name} in ${ns}`)
            await deleteK8s(`/apis/batch/v1/namespaces/${ns}/jobs`, name)
          }
        } catch (error) {
          if (error.statusCode !== 403 && error.statusCode !== 404) console.error(`[admin] cleanup job sweep failed in ${ns}`, error)
        }
        try {
          // Orphaned cleanup PODS: when the job controller never removes the
          // batch.kubernetes.io/job-tracking finalizer (observed on clusters
          // with wedged job tracking), deleting the Job leaves its Completed
          // pod behind. Strip the finalizer via a merge patch, then delete the
          // pod. NOTE: on clusters whose Kyverno policies rewrite immutable
          // spec fields on pod updates (schedulerName), this PATCH is only
          // accepted when a policy precondition skips terminating pods — see
          // 'assign-custom-scheduler-for-ezua-user-vendor-pods' on devday. A
          // failed strip is logged and the delete is still attempted.
          const podResult = await k8sRequest('GET', `/api/v1/namespaces/${ns}/pods?labelSelector=${encodeURIComponent('job-name')}`)
          const podCutoff = Date.now() - 5 * 60 * 1000
          for (const pod of (podResult && podResult.items) || []) {
            const podName = pod.metadata?.name || ''
            if (!podName.startsWith('opencode-clear-')) continue
            const podCreatedAt = Date.parse(pod.metadata?.creationTimestamp || '')
            if (!Number.isFinite(podCreatedAt) || podCreatedAt > podCutoff) continue
            console.log(`[admin] sweeping stale cleanup pod ${podName} in ${ns}`)
            try {
              await k8sRequest('PATCH', `/api/v1/namespaces/${ns}/pods/${podName}`, { metadata: { finalizers: null } })
            } catch (error) {
              if (error.statusCode !== 404) console.error(`[admin] finalizer strip failed for ${podName}: ${error.message}`)
            }
            await deleteK8s(`/api/v1/namespaces/${ns}/pods`, podName)
          }
        } catch (error) {
          if (error.statusCode !== 403 && error.statusCode !== 404) console.error(`[admin] cleanup pod sweep failed in ${ns}`, error)
        }
      }
    }

    // One deployments/pods snapshot shared by a whole bulk clear: fetching
    // both lists per user hammers the API server with duplicate heavy
    // requests and can wedge the batch. Deployment + pod listing covers the
    // release namespace AND every known unit namespace (platform units).
    async function fetchEnvironmentSnapshot() {
      const namespaces = await knownUnitNamespaces()
      const deployments = []
      for (const ns of namespaces) {
        try {
          deployments.push(...await listUserDeployments(ns))
        } catch (error) {
          if (error.statusCode !== 403 && error.statusCode !== 404) throw error
        }
      }
      const podBySlug = new Map()
      for (const ns of namespaces) {
        let result = null
        try {
          result = await k8sRequest('GET', `/api/v1/namespaces/${ns}/pods?labelSelector=${encodeURIComponent('opencode-user-managed=true')}`)
        } catch (error) {
          if (error.statusCode !== 403 && error.statusCode !== 404) throw error
          continue
        }
        for (const pod of (result && result.items) || []) {
          const labels = pod.metadata?.labels || {}
          const podSlug = labels['opencode-user-slug'] || (labels['opencode-user-warmpool'] === 'true' ? labels['opencode-user-owner'] : null)
          if (!podSlug || !pod.spec?.nodeName) continue
          const phase = pod.status?.phase || 'Unknown'
          const existing = podBySlug.get(podSlug)
          if (!existing || (existing.phase !== 'Running' && phase === 'Running')) {
            podBySlug.set(podSlug, { phase, nodeName: pod.spec.nodeName, namespace: ns })
          }
        }
      }
      return { deployments, podBySlug }
    }

    async function clearUserConversations(username, snapshot) {
      const slug = slugForUser(username)
      const legacySlug = legacySlugForUser(username)
      const deployments = snapshot?.deployments || await listUserDeployments()
      const deployment = deploymentForSlug(deployments, slug, legacySlug)
      if (!deployment) return { username, slug, status: 'no environment' }
      // The unit (and its state claim) may live in the user's platform
      // project namespace (platform integration) — every object below targets
      // the deployment's own namespace.
      const deploymentNs = deployment.metadata?.namespace || namespace
      const claimName = stateClaimForDeployment(deployment)
      if (!claimName) return { username, slug, status: 'failed: state claim not found on deployment' }
      // Pin the cleanup pod to the node already holding the RWO state PVC so
      // it can co-mount the volume. Prefer a Running pod but fall back to any
      // scheduled pod: an unpinned Job can deadlock on Multi-Attach.
      const pod = snapshot
        ? (snapshot.podBySlug.get(slug) || snapshot.podBySlug.get(legacySlug))
        : await podForSlug(slug, legacySlug, deploymentNs)
      const jobName = `opencode-clear-${slug}-${Date.now().toString(36)}`
      const manifest = {
        apiVersion: 'batch/v1',
        kind: 'Job',
        metadata: {
          name: jobName,
          namespace: deploymentNs,
          labels: {
            app: '{{ .Chart.Name }}',
            'opencode-user-managed': 'true',
            'opencode-user-slug': slug,
          },
        },
        spec: {
          backoffLimit: 0,
          activeDeadlineSeconds: 300,
          ttlSecondsAfterFinished: 300,
          template: {
            metadata: {
              labels: {
                app: 'opencode-user',
                'opencode-user-managed': 'true',
                'opencode-user-slug': slug,
              },
            },
            spec: {
              restartPolicy: 'Never',
              ...(pod?.nodeName ? { nodeName: pod.nodeName } : {}),
              containers: [
                {
                  name: 'clear-opencode-storage',
                  image: 'alpine:3.20',
                  imagePullPolicy: 'IfNotPresent',
                  command: ['/bin/sh', '-c', 'rm -rf /var/opencode/data/opencode/opencode.db /var/opencode/data/opencode/opencode.db-shm /var/opencode/data/opencode/opencode.db-wal /var/opencode/data/opencode/storage /var/opencode/data/opencode/project/*/storage'],
                  volumeMounts: [
                    { name: 'state', mountPath: '/var/opencode' },
                  ],
                },
              ],
              volumes: [
                { name: 'state', persistentVolumeClaim: { claimName } },
              ],
            },
          },
        },
      }
      try {
        await k8sRequest('POST', `/apis/batch/v1/namespaces/${deploymentNs}/jobs`, manifest)
      } catch (error) {
        if (error.statusCode !== 409) throw error
      }
      // The Job is always removed on every exit path below (success, failure,
      // timeout, or an unexpected error mid-poll): a leaked Job can linger
      // forever because ttlSecondsAfterFinished only applies to Jobs that
      // reach a terminal condition, which the job-tracking finalizer can
      // prevent.
      try {
        const deadline = Date.now() + 240000
        while (Date.now() < deadline) {
          const job = await k8sRequest('GET', `/apis/batch/v1/namespaces/${deploymentNs}/jobs/${jobName}`)
          if (!job) {
            return { username, slug, status: 'failed: cleanup job disappeared' }
          }
          const podPhase = await jobPodPhase(jobName, deploymentNs)
          if ((job.status?.succeeded || 0) >= 1 || podPhase === 'Succeeded') {
            // The running opencode server keeps the deleted database open (WAL
            // mode), so roll the pod to make the fresh, empty database take
            // effect immediately. Recreate strategy swaps the pod cleanly.
            if (pod) {
              try {
                await k8sRequest('PATCH', `/apis/apps/v1/namespaces/${deploymentNs}/deployments/${deployment.metadata.name}`, {
                  spec: {
                    template: {
                      metadata: {
                        annotations: { 'kubectl.kubernetes.io/restartedAt': new Date().toISOString() },
                      },
                    },
                  },
                })
              } catch (error) {
                console.error(`[admin] pod restart after clear failed for ${username}`, error)
                return { username, slug, status: 'cleared (pod restart failed; takes effect on next pod restart)' }
              }
            }
            return { username, slug, status: 'cleared' }
          }
          if ((job.status?.failed || 0) >= 1 || podPhase === 'Failed') {
            return { username, slug, status: 'failed: cleanup pod errored' }
          }
          await new Promise((resolve) => setTimeout(resolve, 2000))
        }
        return { username, slug, status: 'failed: timed out waiting for cleanup job' }
      } finally {
        await deleteK8s(`/apis/batch/v1/namespaces/${deploymentNs}/jobs`, jobName).catch(() => {})
      }
    }

    // Safety tripwire (uninstall contract): never delete a PVC owned by the
    // platform (ezprojects), even if it somehow ended up in a target set.
    // Platform PVCs carry ezprojects.hpe.com/* labels; chart-created PVCs
    // never do. Unreadable PVCs fail safe (treated as platform-owned).
    async function isPlatformOwnedClaim(ns, claimName) {
      try {
        const pvc = await k8sRequest('GET', `/api/v1/namespaces/${ns}/persistentvolumeclaims/${claimName}`)
        if (!pvc) return false
        const labels = pvc.metadata?.labels || {}
        if (Object.keys(labels).some((l) => l.startsWith('ezprojects.hpe.com/'))) {
          console.warn(`[platform] REFUSING to delete platform-owned PVC ${ns}/${claimName}`)
          return true
        }
        return false
      } catch {
        console.warn(`[platform] REFUSING to delete unreadable PVC ${ns}/${claimName}`)
        return true
      }
    }

    // Discover the namespace(s) hosting a user's unit WITHOUT relying on the
    // registry: the ownership anchors (`opencode-anchor-<slug>`, chart-
    // labeled) are the durable truth. The registry is only a hint — the entry
    // can already be deleted or stale, and either case previously orphaned
    // the unit in the project namespace.
    async function anchorNamespacesForSlug(slug) {
      const found = new Set()
      try {
        const result = await k8sRequest('GET', `/api/v1/configmaps?labelSelector=${encodeURIComponent('opencode-user-managed=true')}`)
        for (const cm of (result && result.items) || []) {
          const meta = cm.metadata || {}
          if (!String(meta.name || '').startsWith('opencode-anchor-')) continue
          if ((meta.labels || {})['opencode-user-slug'] !== slug) continue
          if (meta.namespace && meta.namespace !== namespace) found.add(meta.namespace)
        }
      } catch (error) {
        // 403 (platform RBAC not rendered) degrades to registry-only discovery.
        console.error(`[platform] anchor scan failed for ${slug}: ${error.message}`)
      }
      return [...found]
    }

    async function deleteUserEnvironment(slug, legacySlug) {
      // A user may own resources under the readable slug and/or the legacy
      // hash slug (e.g. deleted before their first post-upgrade login), so
      // both candidates are cleaned up.
      const candidates = [...new Set([slug, legacySlug].filter(Boolean))]
      const names = namesForSlug(candidates[0])
      // Platform unit namespaces: the registry (when the entry still exists)
      // UNION the cluster-wide anchor scan (durable truth).
      const unitNsSet = new Set()
      try {
        const users = await loadUserRegistry()
        for (const candidate of candidates) {
          if (users[candidate]?.unitNs && users[candidate].unitNs !== namespace) {
            unitNsSet.add(users[candidate].unitNs)
          }
          // SSO records are keyed by username while slug is derived; scan as
          // a fallback for records without a matching key.
          for (const record of Object.values(users)) {
            if (record?.slug === candidate && record.unitNs && record.unitNs !== namespace) {
              unitNsSet.add(record.unitNs)
            }
          }
        }
      } catch {
        // Registry unreadable — the anchor scan and explicit deletes still run.
      }
      for (const candidate of candidates) {
        for (const ns of await anchorNamespacesForSlug(candidate)) {
          unitNsSet.add(ns)
        }
      }
      // Delete the ownership anchors first: the Kubernetes GC cascades every
      // chart-created object in those namespaces (deployment, service, chart
      // PVCs, mirrored ConfigMaps). The platform PVCs are never
      // owner-referenced, so the GC is structurally unable to touch them.
      for (const ns of unitNsSet) {
        for (const candidate of candidates) {
          await deleteK8s(`/api/v1/namespaces/${ns}/configmaps`, `opencode-anchor-${candidate}`)
        }
      }
      // Explicit belt-and-braces cleanup (independent of the GC path), swept
      // in the release namespace and every discovered unit namespace.
      const targetNamespaces = [...new Set([namespace, ...unitNsSet])]
      const deployments = []
      for (const ns of targetNamespaces) {
        try {
          deployments.push(...await listUserDeployments(ns))
        } catch {
          // Namespace unreadable — skip it.
        }
      }
      let warm = null
      outer: for (const candidate of candidates) {
        for (const dep of deployments) {
          const labels = dep.metadata?.labels || {}
          if (labels['opencode-user-warmpool'] === 'true' && labels['opencode-user-owner'] === candidate) {
            warm = warmNamesForPoolId(Number(labels['opencode-user-pool-id']))
            break outer
          }
        }
      }
      // Prefer the environment that actually exists and derive its claim
      // names from the deployment spec: an adopted pre-readable-slug
      // environment mounts legacy-named claims that a name-derived lookup
      // would miss (leaking VAST quotas).
      let target = null
      if (warm) {
        // Warm units only exist in the release namespace.
        target = { ...warm, ns: namespace }
      } else {
        for (const candidate of candidates) {
          const candidateNames = namesForSlug(candidate)
          for (const ns of targetNamespaces) {
            const dep = deployments.find((d) => d.metadata?.name === candidateNames.deployment && (d.metadata?.namespace || namespace) === ns)
            if (!dep) continue
            const volumeClaims = new Map(
              (dep.spec?.template?.spec?.volumes || [])
                .filter((v) => v.persistentVolumeClaim?.claimName)
                .map((v) => [v.name, v.persistentVolumeClaim.claimName]),
            )
            target = {
              deployment: candidateNames.deployment,
              service: candidateNames.service,
              ns,
              workspaceClaim: volumeClaims.get('personal-workspace') || candidateNames.workspaceClaim,
              stateClaim: volumeClaims.get('state') || candidateNames.stateClaim,
              // The chart-level shared PVC is per-namespace (and
              // owner-anchored) for platform units, but release-level and
              // helm-managed for classic units — only delete it when the
              // unit does NOT live in the release namespace.
              sharedClaim: ns !== namespace ? volumeClaims.get('shared-workspace') : null,
            }
            break
          }
          if (target) break
        }
      }
      if (!target && unitNsSet.size > 0) {
        const tns = [...unitNsSet][0]
        target = {
          deployment: names.deployment,
          service: names.service,
          ns: tns,
          workspaceClaim: names.workspaceClaim,
          stateClaim: names.stateClaim,
          sharedClaim: sharedWorkspaceClaim,
        }
      }
      for (const candidate of candidates) {
        const candidateNames = namesForSlug(candidate)
        await deleteK8s(`/apis/networking.istio.io/v1/namespaces/${namespace}/virtualservices`, candidateNames.virtualService)
        await deleteK8s(`/apis/coordination.k8s.io/v1/namespaces/${namespace}/leases`, `opencode-user-${candidate}`)
        // The per-user DinD broker lives in the release namespace (not
        // owner-anchored — cross-namespace ownerReferences are invalid) and
        // is therefore deleted explicitly alongside the VS/lease.
        await deleteDindBroker(candidate)
      }
      if (target) {
        const tns = target.ns || namespace
        await deleteK8s(`/apis/apps/v1/namespaces/${tns}/deployments`, target.deployment)
        await waitForDeploymentGone(target.deployment, 90000, tns)
        await deleteK8s(`/api/v1/namespaces/${tns}/services`, target.service)
        if (keepPvcOnDelete) {
          // PVC-survival contract: the user's data PVCs are NEVER deleted
          // here. They survive so the first re-SSO re-binds the exact same
          // volumes. Deliberate purge = manual `kubectl delete pvc`.
          console.log(`[platform] keeping user data PVCs for ${candidates.join('/')}: ${[target.workspaceClaim, target.stateClaim, target.sharedClaim].filter(Boolean).join(', ')} (manual deletion required to purge)`)
        } else {
          for (const claim of [target.workspaceClaim, target.stateClaim, target.sharedClaim].filter(Boolean)) {
            if (await isPlatformOwnedClaim(tns, claim)) continue
            await deleteK8s(`/api/v1/namespaces/${tns}/persistentvolumeclaims`, claim)
          }
        }
      }
    }

    // --- Session cookie --------------------------------------------------
    function base64url(input) {
      return Buffer.from(input).toString('base64url')
    }

    function hmacSign(payloadB64) {
      return crypto.createHmac('sha256', sessionSecret).update(payloadB64).digest('hex')
    }

    function deriveSessionKey(identity) {
      // Per-identity key so a leaked pod key cannot sign another user's slug.
      return crypto.createHmac('sha256', sessionSecret).update(slugForUser(identity)).digest('hex')
    }

    function signSession(identity) {
      const payload = {
        u: identity,
        slug: slugForUser(identity),
        exp: Math.floor(Date.now() / 1000) + sessionTtlSeconds,
      }
      const payloadB64 = base64url(JSON.stringify(payload))
      const key = deriveSessionKey(identity)
      return `${payloadB64}.${crypto.createHmac('sha256', key).update(payloadB64).digest('hex')}`
    }

    function readSessionIdentity(request) {
      if (!sessionSecret) return null
      const header = request.headers.cookie || ''
      let value = null
      for (const part of header.split(';')) {
        const trimmed = part.trim()
        if (trimmed.startsWith(`${sessionCookieName}=`)) {
          value = decodeURIComponent(trimmed.slice(sessionCookieName.length + 1))
          break
        }
      }
      if (!value) return null
      const dot = value.lastIndexOf('.')
      if (dot <= 0) return null
      const payloadB64 = value.slice(0, dot)
      const sig = value.slice(dot + 1)
      let payload
      try {
        payload = JSON.parse(Buffer.from(payloadB64, 'base64url').toString('utf8'))
      } catch {
        return null
      }
      if (!payload || typeof payload.u !== 'string') return null
      if (typeof payload.exp === 'number' && payload.exp * 1000 < Date.now()) return null
      const key = deriveSessionKey(payload.u)
      const expected = crypto.createHmac('sha256', key).update(payloadB64).digest('hex')
      if (sig.length !== expected.length) return null
      const sigBuf = Buffer.from(sig, 'hex')
      const expBuf = Buffer.from(expected, 'hex')
      if (!crypto.timingSafeEqual(sigBuf, expBuf)) return null
      return payload.u
    }

    function sessionCookieHeader(identity, clear) {
      const value = clear ? '' : signSession(identity)
      const parts = [
        `${sessionCookieName}=${value}`,
        `Domain=${previewDomainSuffix}`,
        'Path=/',
        'Max-Age=' + (clear ? '0' : String(sessionTtlSeconds)),
        'HttpOnly',
        'SameSite=Lax',
        'Secure',
      ]
      return parts.join('; ')
    }

    // --- User registry (scrypt-hashed passwords in a Secret) ------------
    function hashPassword(password, salt) {
      return crypto.scryptSync(password, salt, 64).toString('hex')
    }

    async function loadUserRegistry() {
      const path = `/api/v1/namespaces/${namespace}/secrets/${registrySecretName}`
      const existing = await k8sRequest('GET', path)
      if (!existing || !existing.data || !existing.data.users) {
        return {}
      }
      try {
        return JSON.parse(Buffer.from(existing.data.users, 'base64').toString('utf8')) || {}
      } catch {
        return {}
      }
    }

    async function saveUserRegistry(users) {
      const path = `/api/v1/namespaces/${namespace}/secrets/${registrySecretName}`
      const body = {
        metadata: {
          name: registrySecretName,
          labels: {
            app: '{{ .Chart.Name }}',
            'opencode-user-managed': 'true',
          },
        },
        stringData: {
          users: JSON.stringify(users),
        },
      }
      const existing = await k8sRequest('GET', path)
      if (existing) {
        await k8sRequest('PUT', path, { ...existing, metadata: body.metadata, stringData: body.stringData })
        return
      }
      try {
        await k8sRequest('POST', `/api/v1/namespaces/${namespace}/secrets`, { apiVersion: 'v1', kind: 'Secret', metadata: body.metadata, type: 'Opaque', stringData: body.stringData })
      } catch (error) {
        if (error.statusCode !== 409) throw error
      }
    }

    async function registerUser(identity, password) {
      const users = await loadUserRegistry()
      if (users[identity]) {
        const error = new Error('Username already exists')
        error.statusCode = 409
        throw error
      }
      const salt = crypto.randomBytes(16).toString('hex')
      users[identity] = { salt, hash: hashPassword(password, salt), createdAt: new Date().toISOString() }
      await saveUserRegistry(users)
    }

    async function verifyUser(identity, password) {
      const users = await loadUserRegistry()
      const record = users[identity]
      if (!record || !record.salt || !record.hash) return false
      const candidate = hashPassword(password, record.salt)
      const a = Buffer.from(candidate, 'hex')
      const b = Buffer.from(record.hash, 'hex')
      if (a.length !== b.length) return false
      return crypto.timingSafeEqual(a, b)
    }

    // Track SSO identities in the registry so the admin console can see and
    // manage them. No password material is stored or overwritten for existing
    // local accounts: SSO entries carry no salt/hash, so they can never be
    // used for password logins.
    async function trackSsoIdentity(identity) {
      try {
        const users = await loadUserRegistry()
        const existing = users[identity]
        // Minute-precision timestamp: repeated logins/auto-SSO landings within
        // the same minute do not rewrite the registry Secret.
        const now = new Date().toISOString().slice(0, 16)
        if (existing && existing.sso && existing.lastLogin === now) return
        users[identity] = {
          ...(existing || {}),
          sso: true,
          slug: slugForUser(identity),
          createdAt: existing?.createdAt || now,
          lastLogin: now,
        }
        await saveUserRegistry(users)
      } catch (error) {
        console.error('[auth] sso registry upsert failed', error)
      }
    }

    function readHeader(headers, name) {
      const value = headers[name]
      if (Array.isArray(value)) {
        return value[0]
      }
      return value
    }

    function userFromHeaders(headers) {
      const primary = readHeader(headers, usernameHeader)
      const fallback = readHeader(headers, fallbackUserHeader)
      const userId = (primary || fallback || '').trim().toLowerCase()
      return userId || null
    }

    function json(response, statusCode, payload) {
      response.writeHead(statusCode, { 'content-type': 'application/json' })
      response.end(JSON.stringify(payload))
    }

    function jsonWithCookie(response, statusCode, payload, cookie) {
      const cookies = Array.isArray(cookie) ? cookie : [cookie]
      response.writeHead(statusCode, { 'content-type': 'application/json', 'set-cookie': cookies })
      response.end(JSON.stringify(payload))
    }

    function text(response, statusCode, payload) {
      response.writeHead(statusCode, { 'content-type': 'text/plain; charset=utf-8' })
      response.end(payload)
    }

    function k8sRequest(method, path, body) {
      return new Promise((resolve, reject) => {
        const request = https.request(
          {
            host: kubeHost,
            port: kubePort,
            method,
            path,
            ca: serviceAccountCa,
            headers: {
              accept: 'application/json',
              authorization: `Bearer ${serviceAccountToken}`,
              ...(body ? { 'content-type': method === 'PATCH' ? 'application/merge-patch+json' : 'application/json' } : {}),
            },
          },
          (response) => {
            let data = ''
            response.setEncoding('utf8')
            response.on('data', (chunk) => {
              data += chunk
            })
            response.on('end', () => {
              const parsed = data ? JSON.parse(data) : null
              if (response.statusCode >= 200 && response.statusCode < 300) {
                resolve(parsed)
                return
              }
              if (response.statusCode === 404) {
                resolve(null)
                return
              }
              const error = new Error(`Kubernetes API ${method} ${path} failed with ${response.statusCode}`)
              error.statusCode = response.statusCode
              error.payload = parsed
              reject(error)
            })
          },
        )
        // Hard ceiling so a stalled API server can never wedge a request forever.
        request.setTimeout(30000, () => request.destroy(new Error(`Kubernetes API ${method} ${path} timed out after 30s`)))
        request.on('error', reject)
        if (body) {
          request.write(JSON.stringify(body))
        }
        request.end()
      })
    }

    async function ensureLease(name) {
      const path = `/apis/coordination.k8s.io/v1/namespaces/${namespace}/leases/${name}`
      const existing = await k8sRequest('GET', path)
      if (existing) {
        return
      }
      const manifest = {
        apiVersion: 'coordination.k8s.io/v1',
        kind: 'Lease',
        metadata: {
          name,
          namespace,
          labels: {
            app: '{{ .Chart.Name }}',
            'opencode-user-managed': 'true',
          },
        },
        spec: {
          holderIdentity: '{{ .Release.Name }}-router',
        },
      }
      try {
        await k8sRequest('POST', `/apis/coordination.k8s.io/v1/namespaces/${namespace}/leases`, manifest)
      } catch (error) {
        if (error.statusCode !== 409) {
          throw error
        }
      }
    }

    async function ensurePersistentVolumeClaim(name, size, ns = namespace, ownerRefs = null, accessModes = ['ReadWriteOnce']) {
      const path = `/api/v1/namespaces/${ns}/persistentvolumeclaims/${name}`
      const existing = await k8sRequest('GET', path)
      if (existing) {
        return
      }
      const manifest = {
        apiVersion: 'v1',
        kind: 'PersistentVolumeClaim',
        metadata: {
          name,
          namespace: ns,
          labels: {
            app: '{{ .Chart.Name }}',
            'opencode-user-managed': 'true',
          },
          ...(ownerRefs ? { ownerReferences: ownerRefs } : {}),
        },
        spec: {
          accessModes,
          storageClassName,
          resources: {
            requests: {
              storage: size,
            },
          },
        },
      }
      try {
        await k8sRequest('POST', `/api/v1/namespaces/${ns}/persistentvolumeclaims`, manifest)
      } catch (error) {
        if (error.statusCode !== 409) {
          throw error
        }
      }
    }

    function servicePortsMatch(existingPorts, desiredPorts) {
      const byName = new Map((existingPorts || []).map((port) => [port.name, port]))
      return desiredPorts.every((desired) => {
        const existing = byName.get(desired.name)
        return existing
          && existing.protocol === desired.protocol
          && existing.port === desired.port
          && existing.targetPort === desired.targetPort
      })
    }

    function userServiceManifest(name, slug, ns = namespace, ownerRefs = null) {
      const spec = serviceSpec(userIsChamber ? userChamberPort : userServerPort)
      spec.selector = {
        'opencode-user-slug': slug,
      }
      return {
        apiVersion: 'v1',
        kind: 'Service',
        metadata: {
          name,
          namespace: ns,
          labels: {
            app: 'opencode-user',
            'opencode-user-managed': 'true',
            'opencode-user-slug': slug,
          },
          ...(ownerRefs ? { ownerReferences: ownerRefs } : {}),
        },
        spec,
      }
    }

    function warmServiceManifest(poolId) {
      const name = warmNamesForPoolId(poolId).service
      const poolIdStr = String(poolId)
      return {
        apiVersion: 'v1',
        kind: 'Service',
        metadata: {
          name,
          namespace,
          labels: {
            app: 'opencode-user',
            'opencode-user-managed': 'true',
            'opencode-user-warmpool': 'true',
            'opencode-user-pool-id': poolIdStr,
          },
        },
        spec: {
          type: 'ClusterIP',
          selector: {
            'opencode-user-pool-id': poolIdStr,
          },
          ports: [
            { name: 'http', protocol: 'TCP', port: 8080, targetPort: userIsChamber ? userChamberPort : userServerPort },
            { name: 'http-preview', protocol: 'TCP', port: 8082, targetPort: 8082 },
            { name: 'ttyd', protocol: 'TCP', port: 7681, targetPort: 7681 },
            { name: 'data-manager', protocol: 'TCP', port: 7682, targetPort: 7682 },
            { name: 'term-mgr', protocol: 'TCP', port: 7683, targetPort: 7683 },
          ],
        },
      }
    }

    function serviceSpec(appPort) {
      return {
        type: 'ClusterIP',
        selector: {
          'opencode-user-slug': 'PLACEHOLDER',
        },
        ports: [
          { name: 'http', protocol: 'TCP', port: 8080, targetPort: appPort },
          { name: 'http-preview', protocol: 'TCP', port: 8082, targetPort: 8082 },
          { name: 'ttyd', protocol: 'TCP', port: 7681, targetPort: 7681 },
          { name: 'data-manager', protocol: 'TCP', port: 7682, targetPort: 7682 },
          { name: 'term-mgr', protocol: 'TCP', port: 7683, targetPort: 7683 },
        ],
      }
    }

    async function upsertService(manifest) {
      const name = manifest.metadata.name
      const ns = manifest.metadata.namespace || namespace
      const path = `/api/v1/namespaces/${ns}/services/${name}`
      const existing = await k8sRequest('GET', path)
      if (existing) {
        if (!servicePortsMatch(existing.spec?.ports, manifest.spec.ports)
          || JSON.stringify(existing.metadata?.ownerReferences || []) !== JSON.stringify(manifest.metadata.ownerReferences || [])) {
          await k8sRequest('PATCH', path, {
            metadata: { labels: manifest.metadata.labels, ...(manifest.metadata.ownerReferences ? { ownerReferences: manifest.metadata.ownerReferences } : {}) },
            spec: {
              selector: manifest.spec.selector,
              ports: manifest.spec.ports,
            },
          })
        }
        return
      }
      try {
        await k8sRequest('POST', `/api/v1/namespaces/${ns}/services`, manifest)
      } catch (error) {
        if (error.statusCode !== 409) {
          throw error
        }
      }
    }

    async function ensureService(name, slug, ns = namespace, ownerRefs = null) {
      await upsertService(userServiceManifest(name, slug, ns, ownerRefs))
    }

    function warmNamesForPoolId(poolId) {
      const base = `opencode-user-warm-${poolId}`
      return {
        deployment: base,
        service: `${base}-svc`,
        workspaceClaim: `${base}-workspace-pvc-${pvcNameVersion}`,
        stateClaim: `${base}-state-pvc-${pvcNameVersion}`,
        slug: `warm-${poolId}`,
      }
    }

    async function userDeploymentManifest({ name, workspaceClaim, stateClaim, slug, isWarmPool, poolId, owner, unitNs, ownerRefs, platform, ssoUnit }) {
      slug = owner || (isWarmPool ? `warm-${poolId}` : slug)
      const manifestNs = unitNs || namespace
      const platformVolumesMounted = !!(platform && platform.volumesMounted)
      const matchLabels = isWarmPool
        ? { 'opencode-user-pool-id': String(poolId) }
        : { 'opencode-user-slug': slug }
      const podLabels = {
        app: 'opencode-user',
        'opencode-user-managed': 'true',
        'opencode-role': 'preview',
        ...matchLabels,
        ...(isWarmPool ? { 'opencode-user-warmpool': 'true' } : {}),
        ...(platformVolumesMounted ? { 'opencode-platform-unit': 'true' } : {}),
      }
      const deploymentLabels = {
        app: 'opencode-user',
        'opencode-user-managed': 'true',
        ...matchLabels,
        ...(isWarmPool ? { 'opencode-user-warmpool': 'true' } : {}),
        ...(platformVolumesMounted ? { 'opencode-platform-unit': 'true' } : {}),
      }
      if (owner) {
        podLabels['opencode-user-owner'] = owner
        deploymentLabels['opencode-user-owner'] = owner
      }
      // Identity env (platform integration): the project's unix attributes
      // from the platform project-info ConfigMap. Consumed by the init
      // container (volume chown + installs under the identity) and by the
      // startup (setpriv drop for the whole service stack). Absent for
      // classic units — everything then behaves exactly as before.
      const platformIdentityEnv = platform && platform.identity ? [
        { name: 'USER_INFO_UID', value: String(platform.identity.uid) },
        { name: 'USER_INFO_GID', value: String(platform.identity.gid) },
        { name: 'USER_INFO_USERNAME', value: platform.identity.user || '' },
        { name: 'USER_INFO_GROUP', value: platform.identity.group || '' },
        { name: 'USER_INFO_HOMEDIR', value: platform.identity.homedir || '/var/opencode/home' },
      ] : []
      // Data Manager platform roots: mounted → show; pending/off → hide.
      const platformRootsMode = platform ? (platformVolumesMounted ? 'mounted' : 'pending') : 'off'
      // DinD placement for THIS unit (see the dockerEnabled note at the top
      // of the file). SECURITY (2026-10-03 decision): docker is an
      // SSO-identity capability — the classic login is a SINGLE SHARED
      // credential (values auth block) and daemon access is node-root-
      // equivalent (privileged container + unauthenticated API), so units
      // resolved by a local session NEVER get a daemon:
      //   - SSO + platform namespace: per-user BROKER pod in the release
      //     namespace (docker.brokerForPlatformUnits), or the in-pod
      //     sidecar with the Kyverno PolicyException (onPlatformUnits).
      //   - SSO + release-namespace fallback unit: in-pod sidecar (loopback,
      //     reachable solely through the authenticated session).
      //   - local (shared-credential) session: no daemon anywhere.
      const unitIsSso = !!platform || !!ssoUnit
      const dockerSidecarHere = dockerEnabled && unitIsSso && (manifestNs === namespace || dockerOnPlatformUnits)
      const dockerBrokerHere = dockerEnabled && !dockerSidecarHere && manifestNs !== namespace && dockerBrokerForPlatformUnits
      const dockerHostForUnit = dockerSidecarHere
        ? 'tcp://127.0.0.1:2375'
        : (dockerBrokerHere ? `tcp://${dindBrokerNames(slug).service}.${namespace}.svc.cluster.local:2375` : null)
      // Platform PVC volumes — mounted BY REFERENCE (claimName) into the
      // unit's namespace. Never labeled, never owner-referenced, never
      // deleted by the chart: they belong to the platform (EzProject).
      const platformVolumes = platformVolumesMounted ? [
        { name: 'platform-shared', persistentVolumeClaim: { claimName: platformSharedClaim } },
        { name: 'platform-user', persistentVolumeClaim: { claimName: platformUserClaim } },
      ] : []
      const platformVolumeMounts = platformVolumesMounted ? [
        { name: 'platform-shared', mountPath: platformSharedMount },
        { name: 'platform-user', mountPath: platformUserMount },
      ] : []
      // npm packages (opencode-ai + @openchamber/web): when the image ships
      // baked copies under /opt/opencode/npm whose version markers match
      // OPENCODE_VERSION and OPENCHAMBER_VERSION, alias the PVC prefix to
      // them (fresh state PVCs only — an existing /var/opencode/data/npm
      // keeps the user's installed copies) and skip the installs entirely.
      // Version mismatch or a vanilla image falls back to the original
      // install-into-the-state-PVC behavior; the openchamber fallback install
      // only fires when OPENCHAMBER_INSTALL=true is stamped (chamber mode, as
      // before). PATH keeps working because the .bashrc entry
      // /var/opencode/data/npm/bin resolves through the alias.
      const npmBakedGuardCommand = '$RUN_AS_USER sh -c \'if [ -f /opt/opencode/npm/.opencode-version ] && [ "$(cat /opt/opencode/npm/.opencode-version 2>/dev/null)" = "${OPENCODE_VERSION}" ] && [ -f /opt/opencode/npm/.openchamber-version ] && [ "$(cat /opt/opencode/npm/.openchamber-version 2>/dev/null)" = "${OPENCHAMBER_VERSION}" ]; then if [ ! -e /var/opencode/data/npm ]; then ln -sfn /opt/opencode/npm /var/opencode/data/npm; fi; ln -sf /opt/opencode/npm/bin/opencode /usr/local/bin/opencode 2>/dev/null || true; ln -sf /opt/opencode/npm/bin/openchamber /usr/local/bin/openchamber 2>/dev/null || true; else if [ ! -f /var/opencode/data/npm/bin/opencode ] || [ "$(cat /var/opencode/.opencode-version 2>/dev/null)" != "${OPENCODE_VERSION}" ]; then HOME=/var/opencode/home npm install -g "opencode-ai@${OPENCODE_VERSION}" --prefix /var/opencode/data/npm && echo "${OPENCODE_VERSION}" > /var/opencode/.opencode-version && (ln -sf /var/opencode/data/npm/bin/opencode /usr/local/bin/opencode 2>/dev/null || true); fi; if [ -n "$OPENCHAMBER_INSTALL" ] && { [ ! -f /var/opencode/data/npm/bin/openchamber ] || [ "$(cat /var/opencode/.openchamber-version 2>/dev/null)" != "${OPENCHAMBER_VERSION}" ]; }; then HOME=/var/opencode/home npm install -g "@openchamber/web@${OPENCHAMBER_VERSION}" --prefix /var/opencode/data/npm && echo "${OPENCHAMBER_VERSION}" > /var/opencode/.openchamber-version && (ln -sf /var/opencode/data/npm/bin/openchamber /usr/local/bin/openchamber 2>/dev/null || true); fi; fi\''
      const initCommandParts = [
        'mkdir -p /workspace/personal /workspace/shared /var/opencode/home/.config/opencode/agents /var/opencode/home/.config/opencode/skills /var/opencode/data /var/opencode/state /var/opencode/cache /var/opencode/bin',
        // --- Platform identity (platform integration): when USER_INFO_* is
        // stamped (SSO unit inside the project namespace), all VOLUME content
        // work runs as the project unix identity so file ownership matches
        // the platform. Chart-owned volumes are chowned ONLY when their root
        // owner differs (fresh volume) — never a blanket recursive chown on
        // every boot, and NEVER the platform volumes (/mnt/shared, /mnt/user):
        // those keep their platform ownership; access is enforced by unix
        // permissions against the identity, exactly like a notebook.
        'RUN_AS_USER=""; if [ -n "$USER_INFO_UID" ] && [ "$USER_INFO_UID" != "0" ]; then export HOME=/var/opencode/home; RUN_AS_USER="setpriv --clear-groups --reuid=$USER_INFO_UID --regid=$USER_INFO_GID"; for d in /var/opencode /workspace/personal /workspace/shared; do if [ "$(stat -c %u "$d" 2>/dev/null)" != "$USER_INFO_UID" ]; then chown -R "$USER_INFO_UID:$USER_INFO_GID" "$d" || true; fi; done; fi',
        '$RUN_AS_USER ln -sfn /workspace /var/opencode/home/workspace',
        'if ! command -v git >/dev/null 2>&1 || ! command -v curl >/dev/null 2>&1; then apt-get update -qq && apt-get install -y -qq --no-install-recommends git curl ca-certificates && rm -rf /var/lib/apt/lists/*; fi',
        '$RUN_AS_USER sh -c \'if [ ! -d /workspace/personal/.git ]; then git init /workspace/personal >/dev/null; fi\' || true',
        '$RUN_AS_USER sh -c \'if [ ! -f /var/opencode/home/.config/opencode/opencode.json ]; then if [ -f /var/opencode/config/opencode/opencode.json ]; then cp /var/opencode/config/opencode/opencode.json /var/opencode/home/.config/opencode/opencode.json; else cp /opt/opencode-defaults/opencode.json /var/opencode/home/.config/opencode/opencode.json; fi; fi\'',
        "$RUN_AS_USER sh -c 'legacy_agents=/tmp/opencode-legacy-AGENTS.md; printf \"%s\n%s\n%s\n\" \"# HPE AI Essentials (AIE) Platform Assistant\" \"You are an expert AIE/PCAI platform engineer and advisor. You have access to live Kubernetes cluster tools, indexed product documentation, and web search.\" \"Your mission: **Think deeply. Act decisively. Anticipate what the user needs before they ask.**\" > \"$legacy_agents\"; if [ -f /var/opencode/home/.config/opencode/AGENTS.md ] && cmp -s \"$legacy_agents\" /var/opencode/home/.config/opencode/AGENTS.md; then rm /var/opencode/home/.config/opencode/AGENTS.md; fi; rm -f \"$legacy_agents\"' || true",
        {{- range .Values.opencodeSkills }}
        '$RUN_AS_USER sh -c \'mkdir -p /var/opencode/home/.config/opencode/skills/{{ .name }} && if [ ! -f /var/opencode/home/.config/opencode/.seeded-skill-{{ .name }} ]; then if [ ! -f /var/opencode/home/.config/opencode/skills/{{ .name }}/SKILL.md ]; then cp /opt/opencode-defaults/skill-{{ .name }}.md /var/opencode/home/.config/opencode/skills/{{ .name }}/SKILL.md; fi; touch /var/opencode/home/.config/opencode/.seeded-skill-{{ .name }}; fi\' || true',
        {{- end }}
        {{- range .Values.opencodeAgents }}
        '$RUN_AS_USER sh -c \'if [ ! -f /var/opencode/home/.config/opencode/.seeded-agent-{{ .name }} ]; then if [ ! -f /var/opencode/home/.config/opencode/agents/{{ .name }}.md ]; then cp /opt/opencode-defaults/agent-{{ .name }}.md /var/opencode/home/.config/opencode/agents/{{ .name }}.md; fi; touch /var/opencode/home/.config/opencode/.seeded-agent-{{ .name }}; fi\' || true',
        {{- end }}
{{- range $path, $_ := $.Files.Glob "personal/**" }}
{{- if not (hasPrefix "." (base $path)) }}
        '$RUN_AS_USER sh -c \'mkdir -p /workspace/personal{{ dir $path | trimPrefix "personal" }} && cp /personal-templates/{{ trimPrefix "personal/" $path | replace "/" "." }} /workspace/personal{{ dir $path | trimPrefix "personal" }}/{{ base $path }}\' || true',
{{- end }}
{{- end }}
{{- range $path, $_ := $.Files.Glob "create-server.sh" }}
        '$RUN_AS_USER sh -c \'cp /personal-templates/create-server.sh /var/opencode/bin/create-server.sh && chmod 0755 /var/opencode/bin/create-server.sh\' || true',
{{- end }}
        // NOTE: the printf format strings below stay SINGLE-quoted in the
        // shell so $HOME/$PATH/$@ are written into the files as literals and
        // expand at login time. $RUN_AS_USER prefixes each so the files are
        // created under the project identity where possible (a plain root
        // printf into a uid-owned directory would leave root-owned,
        // non-editable files — reconciled by the root chown below).
        "$RUN_AS_USER printf 'export PATH=\"$HOME/.local/bin:/var/opencode/bin:/var/opencode/data/npm/bin:$PATH\"\\nexport COLORTERM=truecolor\\nexport LANG=C.UTF-8\\nexport LC_ALL=C.UTF-8\\nexport LC_CTYPE=C.UTF-8\\n' > /var/opencode/home/.bashrc",
        "$RUN_AS_USER printf '[ -f \"$HOME/.bashrc\" ] && . \"$HOME/.bashrc\"\\n' > /var/opencode/home/.bash_profile",
        '$RUN_AS_USER cp /var/opencode/home/.bash_profile /var/opencode/home/.profile',
        "$RUN_AS_USER printf 'export PATH=\"$HOME/.local/bin:/var/opencode/bin:/var/opencode/data/npm/bin:$PATH\"\\nexport COLORTERM=truecolor\\nexport LANG=C.UTF-8\\nexport LC_ALL=C.UTF-8\\nexport LC_CTYPE=C.UTF-8\\n' > /var/opencode/bin/opencode-bashrc",
        "$RUN_AS_USER printf '#!/bin/sh\\nexport BASH_ENV=/var/opencode/bin/opencode-bashrc\\nexec /usr/bin/bash \"$@\"\\n' > /var/opencode/bin/opencode-login-shell",
        // ROOT chmod + ownership reconciliation: the `>` redirections above
        // are performed by the ROOT shell (setpriv only wraps the command
        // itself), so those files land root-owned — a $RUN_AS_USER chmod on
        // them hits EPERM (observed on g2 with the dsh chart: the login shell
        // stayed 644 → the tmux pane couldn't exec → every terminal
        // [exited]). Root performs the chmod and hands the files to the
        // project identity instead.
        'chmod 0755 /var/opencode/bin/opencode-login-shell',
        'if [ -n "$USER_INFO_UID" ] && [ "$USER_INFO_UID" != "0" ]; then chown -f "$USER_INFO_UID:$USER_INFO_GID" /var/opencode/home/.bashrc /var/opencode/home/.bash_profile /var/opencode/home/.profile /var/opencode/bin/opencode-bashrc /var/opencode/bin/opencode-login-shell /var/opencode/bin/create-server.sh || true; fi',
{{- if and .Values.certificatesPolicy .Values.certificatesPolicy.enabled }}
        '$RUN_AS_USER sh -c \'echo "export NODE_EXTRA_CA_CERTS=/tmp/certs/ca-certificates.crt" >> /var/opencode/home/.bashrc && echo "export NODE_EXTRA_CA_CERTS=/tmp/certs/ca-certificates.crt" >> /var/opencode/home/.profile && echo "export NODE_EXTRA_CA_CERTS=/tmp/certs/ca-certificates.crt" >> /var/opencode/bin/opencode-bashrc\'',
{{- end }}
        // uv: prefer the baked copy (/opt/opencode/bin, baked user image) when
        // present; only download when neither the state PVC nor the image
        // ships one. Keeps the old install-on-boot behavior as the fallback.
        '$RUN_AS_USER sh -c \'if [ ! -f /var/opencode/bin/uv ] && [ ! -f /opt/opencode/bin/uv ]; then curl -LsSf https://astral.sh/uv/install.sh | UV_INSTALL_DIR=/var/opencode/bin sh; fi\' || true',
        '$RUN_AS_USER sh -c \'ln -sf /var/opencode/bin/uv /usr/local/bin/uv 2>/dev/null || true; ln -sf /var/opencode/bin/uvx /usr/local/bin/uvx 2>/dev/null || true\' || true',
        npmBakedGuardCommand,
        '$RUN_AS_USER sh -c \'if [ ! -x /var/opencode/bin/ttyd ] && [ ! -x /opt/opencode/bin/ttyd ]; then arch="$(uname -m)"; case "$arch" in x86_64|amd64) ttyd_asset=ttyd.x86_64 ;; aarch64|arm64) ttyd_asset=ttyd.aarch64 ;; armv7l|armhf) ttyd_asset=ttyd.armhf ;; arm*) ttyd_asset=ttyd.arm ;; *) echo "unsupported architecture for ttyd: $arch" >&2; exit 1 ;; esac; curl -fsSL --retry 3 -o /var/opencode/bin/ttyd "https://github.com/tsl0922/ttyd/releases/download/${TTYD_VERSION}/${ttyd_asset}" && chmod 0755 /var/opencode/bin/ttyd; fi\'',
        // Compat symlinks on the state PVC: the startup execs
        // /var/opencode/bin/ttyd directly (and PATH carries /var/opencode/bin),
        // so alias any baked binary into /var/opencode/bin when the PVC copy
        // is missing or not executable (partial download recovery). PVC
        // copies always win when present so existing volumes keep their
        // behavior.
        '$RUN_AS_USER sh -c \'for b in uv uvx ttyd; do if [ -e "/opt/opencode/bin/$b" ]; then if [ ! -e "/var/opencode/bin/$b" ] || [ ! -x "/var/opencode/bin/$b" ]; then ln -sfn "/opt/opencode/bin/$b" "/var/opencode/bin/$b" || true; fi; fi; done\' || true',
{{- if and .Values.sharedContent .Values.sharedContent.enabled }}
        // Per-namespace shared PVC seeding (platform units each get their own
        // <release>-shared-pvc; classic units seed here too — cp -n makes it
        // seed-once, so user edits in the shared workspace survive restarts).
        '$RUN_AS_USER sh -c \'if [ -f /opencode-shared-seed/seed.sh ]; then sh /opencode-shared-seed/seed.sh /opencode-shared-seed /workspace/shared; fi\' || true',
{{- end }}
        // The service stack (ttyd, port watcher, data manager, terminal
        // manager, opencode supervisor) is wrapped in start_services(); the
        // startup execs it via setpriv under the project identity
        // (USER_INFO_*), so every user-facing service — and every file it
        // writes, on the chart volumes AND on the platform volumes — runs as
        // the platform unix identity, byte-identical to a Kubeflow notebook.
        // Without identity (classic local units) it runs as root, exactly as
        // before.
        "printf '#!/bin/bash\nset -e\nexport DEBIAN_FRONTEND=noninteractive\nexport PATH=\"/var/opencode/bin:/var/opencode/data/npm/bin:$PATH\"\nmissing=0\nfor cmd in bash curl git script tmux; do\n  command -v \"$cmd\" >/dev/null 2>&1 || missing=1\ndone\nif [ \"$missing\" = \"1\" ]; then\n  apt-get update -qq || true\n  apt-get install -y -qq --no-install-recommends {{ .Values.provisioning.aptPackages }} || {\n    echo \"WARNING: toolchain apt install failed; retrying once in 15s\" >&2\n    sleep 15\n    apt-get update -qq || true\n    apt-get install -y -qq --no-install-recommends {{ .Values.provisioning.aptPackages }} || echo \"WARNING: continuing with degraded toolchain; full install retries on next restart\" >&2\n  }\n  rm -rf /var/lib/apt/lists/* || true\nfi\nrm -f /usr/lib/python*/EXTERNALLY-MANAGED\nln -sf /usr/bin/vi /usr/local/bin/vim 2>/dev/null || true\nln -sf /usr/bin/fdfind /usr/local/bin/fd 2>/dev/null || true\nln -sf /usr/bin/python3 /usr/local/bin/python 2>/dev/null || true\nln -sf /usr/bin/pip3 /usr/local/bin/pip 2>/dev/null || true\nif ! command -v xdg-open >/dev/null 2>&1; then\n  printf \"#!/bin/sh\\nexit 0\\n\" > /usr/local/bin/xdg-open\n  chmod 0755 /usr/local/bin/xdg-open\nfi\nln -sf /var/opencode/bin/uv /usr/local/bin/uv 2>/dev/null || true\nln -sf /var/opencode/bin/uvx /usr/local/bin/uvx 2>/dev/null || true\nln -sf /var/opencode/data/npm/bin/opencode /usr/local/bin/opencode 2>/dev/null || true\nln -sf /var/opencode/data/npm/bin/openchamber /usr/local/bin/openchamber 2>/dev/null || true\nstart_services() {\n  /var/opencode/bin/ttyd -p 7681 -i 0.0.0.0 -W -a -T xterm-256color -w /workspace -b /term -t titleFixed=\"OpenCode Terminal\" -t fontSize=14 -t fontFamily=\"menlo,consolas,dejavu sans mono,monospace\" bash /opt/preview/tty-attach-session.sh &\n  node /opt/preview/port_watcher.mjs &\n  node /opt/preview/data_manager.mjs &\n  node /opt/preview/terminal_manager.js &\n  exec node /opt/preview/opencode_supervisor.mjs\n}\nif [ -n \"$USER_INFO_UID\" ] && [ \"$USER_INFO_UID\" != \"0\" ] && command -v setpriv >/dev/null 2>&1; then\n  getent group \"$USER_INFO_GID\" >/dev/null 2>&1 || groupadd -g \"$USER_INFO_GID\" \"${USER_INFO_GROUP:-opencodeuser}\" || true\n  getent passwd \"$USER_INFO_UID\" >/dev/null 2>&1 || useradd -M -u \"$USER_INFO_UID\" -g \"$USER_INFO_GID\" -d \"${USER_INFO_HOMEDIR:-/var/opencode/home}\" -s /bin/bash \"${USER_INFO_USERNAME:-opencodeuser}\" || true\n  export -f start_services\n  exec setpriv --init-groups --reuid=\"$USER_INFO_UID\" --regid=\"$USER_INFO_GID\" /bin/bash -c \"start_services\"\nfi\nstart_services\n' > /var/opencode/bin/opencode-startup.sh",
        "chmod 0755 /var/opencode/bin/opencode-startup.sh",
        '$RUN_AS_USER sh -c \'rm -rf /workspace/personal/shared\' || true',
      ]
      const initCommand = initCommandParts.join(' && ')

      const appCommand = [
        'cp /var/opencode/bin/create-server.sh /workspace/create-server.sh 2>/dev/null || true',
        '/var/opencode/bin/opencode-startup.sh',
      ].join(' && ')

      const manifest = {
        apiVersion: 'apps/v1',
        kind: 'Deployment',
        metadata: {
          name,
          namespace: manifestNs,
          labels: deploymentLabels,
          ...(ownerRefs ? { ownerReferences: ownerRefs } : {}),
        },
        spec: {
          replicas: 1,
          // Recreate: the pod mounts RWO PVCs, so a RollingUpdate surge pod
          // scheduled on a different node would deadlock on a Multi-Attach
          // error while the old pod still holds the volumes (and would keep
          // serving with a stale auth key). Terminate first, then recreate.
          strategy: { type: 'Recreate' },
          selector: {
            matchLabels,
          },
          template: {
            metadata: {
              labels: podLabels,
              annotations: {
                'sidecar.istio.io/inject': 'false',
                'opencode-web-helm/user-template-version': userTemplateVersion,
                // Docker placement state (DOCKER_HOST value or 'none'):
                // flips of docker.enabled / brokerForPlatformUnits /
                // onPlatformUnits converge here without a marker bump.
                'opencode-web-helm/docker': dockerHostForUnit || 'none',
                // Convergence key for the platform mounts: when the
                // platform state changes (pending -> mounted), the router
                // re-stamps the unit so the pod restarts with the volumes.
                'opencode-web-helm/platform-mounts': platformVolumesMounted ? 'mounted' : (platform ? 'pending' : 'off'),
              },
            },
            spec: {
              ...(userPullSecret ? { imagePullSecrets: [{ name: userPullSecret }] } : {}),
              securityContext: {
                fsGroup: 1000,
                fsGroupChangePolicy: 'OnRootMismatch',
              },
              initContainers: [
                {{- if and .Values.certificatesPolicy .Values.certificatesPolicy.enabled }}
                {
                  name: 'build-ca-bundle',
                  image: '{{ .Values.certificatesPolicy.initContainer.image }}',
                  imagePullPolicy: 'IfNotPresent',
                  command: {{ toJson .Values.certificatesPolicy.initContainer.command }},
                  volumeMounts: [
                    {{- range .Values.certificatesPolicy.initVolumeMounts }}
                    { name: '{{ .name }}', mountPath: '{{ .mountPath }}'{{ if .subPath }}, subPath: '{{ .subPath }}'{{ end }}{{ if hasKey . "readOnly" }}, readOnly: {{ .readOnly }}{{ end }} },
                    {{- end }}
                  ],
                },
                {{- end }}
                {
                  name: 'init-opencode-storage',
                  image: userInitImage,
                  imagePullPolicy: 'Always',
                  command: ['/bin/sh', '-lc', initCommand],
                  env: [
                    { name: 'OPENCODE_VERSION', value: userOpencodeVersion },
                    { name: 'TTYD_VERSION', value: ttydVersion },
                    { name: 'OPENCHAMBER_VERSION', value: userOpenChamberVersion },
                    // Gate for the openchamber runtime-install fallback in the
                    // npm guard above (chamber mode only, as before).
                    ...(userIsChamber ? [{ name: 'OPENCHAMBER_INSTALL', value: 'true' }] : []),
                    ...platformIdentityEnv,
                    {{- if and .Values.proxy .Values.proxy.enabled }}
                    {{- range .Values.proxy.env }}
                    { name: '{{ .name }}', value: '{{ .value }}' },
                    {{- end }}
                    {{- end }}
                    {{- if and .Values.no_proxy .Values.no_proxy.enabled }}
                    {{- range .Values.no_proxy.env }}
                    { name: '{{ .name }}', value: '{{ .value }}' },
                    {{- end }}
                    {{- end }}
                  ],
                  volumeMounts: [
                    { name: 'personal-workspace', mountPath: '/workspace/personal' },
                    { name: 'shared-workspace', mountPath: '/workspace/shared' },
                    { name: 'state', mountPath: '/var/opencode' },
                    { name: 'project-config', mountPath: '/opt/opencode-defaults', readOnly: true },
                    { name: 'personal-content', mountPath: '/personal-templates', readOnly: true },
{{- if and .Values.sharedContent .Values.sharedContent.enabled }}
                    { name: 'shared-content-seed', mountPath: '/opencode-shared-seed', readOnly: true },
{{- end }}
                    ...platformVolumeMounts,
                  ],
                },
              ],
              containers: [
                {
                  name: 'opencode-web',
                  image: userInstanceImage,
                  imagePullPolicy: 'Always',
                  workingDir: '/workspace',
                  command: ['/bin/sh', '-lc', appCommand],
                  stdin: true,
                  tty: true,
                  securityContext: {
                    capabilities: { add: ['SYS_PTRACE'] },
                  },
                  env: [
                    { name: 'HOME', value: '/var/opencode/home' },
                    { name: 'SHELL', value: '/usr/bin/bash' },
                    { name: 'TERM', value: 'xterm-256color' },
                    { name: 'COLORTERM', value: 'truecolor' },
                    { name: 'LANG', value: 'C.UTF-8' },
                    { name: 'LC_ALL', value: 'C.UTF-8' },
                    { name: 'LC_CTYPE', value: 'C.UTF-8' },
                    { name: 'XDG_DATA_HOME', value: '/var/opencode/data' },
                    { name: 'XDG_CONFIG_HOME', value: '/var/opencode/home/.config' },
                    { name: 'XDG_STATE_HOME', value: '/var/opencode/state' },
                    { name: 'XDG_CACHE_HOME', value: '/var/opencode/cache' },
                    // Docker CLI (baked in the user image) -> the DinD daemon
                    // for THIS unit: loopback sidecar (release-ns units) or
                    // the per-user broker pod cross-namespace (platform
                    // units). The baked `dockerbuild` wrapper is the
                    // proxy-aware way to run builds (see docker/user/Dockerfile).
                    ...(dockerHostForUnit ? [{ name: 'DOCKER_HOST', value: dockerHostForUnit }] : []),
                    { name: 'OPENCODE_CONFIG_PATH', value: '/var/opencode/home/.config/opencode/opencode.json' },
                    { name: 'OPENCODE_WATCH_CONFIG_FILES', value: 'opencode.json,config.json,opencode.jsonc' },
                    { name: 'OPENCODE_WATCH_CONFIG_DIRS', value: 'skills,agents' },
                    {
                      name: 'OPENCODE_SERVER_USERNAME',
                      valueFrom: {
                        secretKeyRef: {
                          name: '{{ .Release.Name }}-auth',
                          key: 'OPENCODE_SERVER_USERNAME',
                        },
                      },
                    },
                    {
                      name: 'OPENCODE_SERVER_PASSWORD',
                      valueFrom: {
                        secretKeyRef: {
                          name: '{{ .Release.Name }}-auth',
                          key: 'OPENCODE_SERVER_PASSWORD',
                        },
                      },
                    },
                    { name: 'PREVIEW_DOMAIN_SUFFIX', value: previewDomainSuffix },
                    // Canonical public UI host for preview URL construction
                    // (the VirtualService endpoint). port_watcher.mjs /
                    // preview-url fall back to opencode.<PREVIEW_DOMAIN_SUFFIX>
                    // when unset (pre-UI_HOST behavior).
                    { name: 'PREVIEW_UI_HOST', value: uiEndpointHost },
                    { name: 'PREVIEW_STATE_FILE', value: '/var/opencode/state/preview-ports.txt' },
                    { name: 'PREVIEW_MIN_PORT', value: '3000' },
                    { name: 'PREVIEW_MAX_PORT', value: '9999' },
                    { name: 'PREVIEW_EXCLUDE_PORTS', value: '3000,4096,8082,7681,7682,7683,7684' },
                    { name: 'OPENCODE_VERSION', value: userOpencodeVersion },
                    { name: 'TTYD_VERSION', value: ttydVersion },
                    { name: 'OPENCODE_UI_MODE', value: userUiMode },
                    { name: 'OPENCHAMBER_VERSION', value: userOpenChamberVersion },
                    { name: 'OPENCHAMBER_PORT', value: String(userChamberPort) },
                    { name: 'OPENCHAMBER_ALLOW_UNAUTHENTICATED_LAN', value: 'true' },
                    { name: 'OPENCODE_SERVER_PORT', value: String(userServerPort) },
                    { name: 'PREVIEW_USER_SLUG', value: slug },
                    { name: 'TTYD_DOMAIN', value: previewDomainSuffix },
                    { name: 'TTYD_SLUG', value: slug },

                    {{- if and .Values.proxy .Values.proxy.enabled }}
                    {{- range .Values.proxy.env }}
                    { name: '{{ .name }}', value: '{{ .value }}' },
                    {{- end }}
                    {{- end }}
                    {{- if and .Values.no_proxy .Values.no_proxy.enabled }}
                    {{- range .Values.no_proxy.env }}
                    { name: '{{ .name }}', value: '{{ .value }}' },
                    {{- end }}
                    {{- end }}
                    ...platformIdentityEnv,
                    { name: 'OPENCODE_PLATFORM_ROOTS', value: platformRootsMode },
                    { name: 'OPENCODE_PLATFORM_ROOTS_READONLY', value: platformReadOnly ? 'true' : 'false' },
                    {{- if and .Values.certificatesPolicy .Values.certificatesPolicy.enabled }}
                    {{- range .Values.certificatesPolicy.env }}
                    { name: '{{ .name }}', value: '{{ .value }}' },
                    {{- end }}
                    {{- end }}
                  ],
                  ports: [
                    { name: 'http', containerPort: userIsChamber ? userChamberPort : userServerPort, protocol: 'TCP' },
                    ...(userIsChamber ? [{ name: 'server', containerPort: userServerPort, protocol: 'TCP' }] : []),
                    { name: 'ttyd', containerPort: 7681, protocol: 'TCP' },
                    { name: 'data-manager', containerPort: 7682, protocol: 'TCP' },
                    { name: 'term-mgr', containerPort: 7683, protocol: 'TCP' },
                  ],
                  readinessProbe: {
                    tcpSocket: { port: userIsChamber ? userChamberPort : userServerPort },
                    initialDelaySeconds: 10, periodSeconds: 10, timeoutSeconds: 3, failureThreshold: 6,
                  },
                  livenessProbe: {
                    tcpSocket: { port: userIsChamber ? userChamberPort : userServerPort },
                    initialDelaySeconds: 30, periodSeconds: 20, timeoutSeconds: 3, failureThreshold: 3,
                  },
                  startupProbe: {
                    tcpSocket: { port: userIsChamber ? userChamberPort : userServerPort },
                    periodSeconds: 10, timeoutSeconds: 3, failureThreshold: 18,
                  },
                  resources: {
                    requests: { cpu: '250m', memory: '512Mi' },
                    limits: { cpu: '2', memory: '2Gi' },
                  },
                  volumeMounts: [
                    { name: 'personal-workspace', mountPath: '/workspace/personal' },
                    { name: 'shared-workspace', mountPath: '/workspace/shared' },
                    { name: 'state', mountPath: '/var/opencode' },
                    { name: 'project-config', mountPath: '/opt/opencode-defaults', readOnly: true },
                    { name: 'preview-config', mountPath: '/usr/local/bin/preview-url', subPath: 'preview-url' },
                    { name: 'preview-config', mountPath: '/opt/preview/port_watcher.mjs', subPath: 'port_watcher.mjs' },
                    { name: 'preview-config', mountPath: '/opt/preview/opencode_supervisor.mjs', subPath: 'opencode_supervisor.mjs' },
                    { name: 'preview-config', mountPath: '/opt/preview/data_manager.mjs', subPath: 'data_manager.mjs' },
                    { name: 'preview-config', mountPath: '/opt/preview/data_manager.html', subPath: 'data_manager.html' },
                    { name: 'preview-config', mountPath: '/opt/preview/terminal_manager.js', subPath: 'terminal_manager.js' },
                    { name: 'preview-config', mountPath: '/opt/preview/terminal_manager.html', subPath: 'terminal_manager.html' },
                    { name: 'preview-config', mountPath: '/opt/preview/tty-attach-session.sh', subPath: 'tty-attach-session.sh' },
                    ...platformVolumeMounts,
                    {{- if and .Values.certificatesPolicy .Values.certificatesPolicy.enabled }}
                    {{- range .Values.certificatesPolicy.volumeMounts }}
                    { name: '{{ .name }}', mountPath: '{{ .mountPath }}'{{ if .subPath }}, subPath: '{{ .subPath }}'{{ end }}{{ if hasKey . "readOnly" }}, readOnly: {{ .readOnly }}{{ end }} },
                    {{- end }}
                    {{- end }}
                  ],
                },
                {
                  name: 'opencode-preview-proxy',
                  image: 'nginx:1.27-alpine',
                  imagePullPolicy: 'IfNotPresent',
                  ports: [
                    { name: 'http-preview', containerPort: 8082, protocol: 'TCP' },
                  ],
                  volumeMounts: [
                    { name: 'preview-config', mountPath: '/etc/nginx/nginx.conf', subPath: 'nginx.conf' },
                  ],
                },
                {
                  name: 'opencode-auth',
                  image: userInstanceImage,
                  imagePullPolicy: 'Always',
                  command: ['node', '/opt/preview/auth_validator.mjs'],
                  env: [
                    { name: 'SESSION_KEY', value: crypto.createHmac('sha256', sessionSecret).update(slug).digest('hex') },
                    { name: 'USER_SLUG', value: slug },
                  ],
                  ports: [
                    { name: 'auth', containerPort: 7684, protocol: 'TCP' },
                  ],
                  volumeMounts: [
                    { name: 'preview-config', mountPath: '/opt/preview/auth_validator.mjs', subPath: 'auth_validator.mjs' },
                  ],
                },
                // ---- Docker-in-Docker sidecar (release-ns units; the spec
                // lives in dindContainerSpec() so the per-user broker pods
                // for platform units share the exact same daemon definition).
                ...(dockerSidecarHere ? [dindContainerSpec()] : []),
              ],
              volumes: [
                { name: 'personal-workspace', persistentVolumeClaim: { claimName: workspaceClaim } },
                { name: 'shared-workspace', persistentVolumeClaim: { claimName: sharedWorkspaceClaim } },
                { name: 'state', persistentVolumeClaim: { claimName: stateClaim } },
                { name: 'project-config', configMap: { name: '{{ .Release.Name }}-project-config' } },
                { name: 'personal-content', configMap: { name: '{{ .Release.Name }}-personal-content' } },
                { name: 'preview-config', configMap: { name: '{{ .Release.Name }}-preview-config', defaultMode: 365 } },
                // DinD image store — node-local emptyDir (overlay2 fails on
                // VAST network volumes; see the docker-dind sidecar note).
                ...(dockerSidecarHere ? [{ name: 'docker-data', emptyDir: { sizeLimit: dockerDiskSize } }] : []),
{{- if and .Values.sharedContent .Values.sharedContent.enabled }}
                { name: 'shared-content-seed', configMap: { name: '{{ .Release.Name }}-shared-content' } },
{{- end }}
                ...platformVolumes,
                {{- if and .Values.certificatesPolicy .Values.certificatesPolicy.enabled }}
                {{- range .Values.certificatesPolicy.volumes }}
                { name: '{{ .name }}', {{ if hasKey . "emptyDir" }}emptyDir: {}{{ else }}configMap: { name: '{{ .configMap.name }}', {{- if .configMap.items }} items: [ {{- range .configMap.items }} { key: '{{ .key }}', path: '{{ .path }}' }, {{- end }} ] {{- end }} }{{ end }} },
                {{- end }}
                {{- end }}
              ],
            },
          },
        },
      }
      return manifest
    }

    async function upsertUserDeployment(name, manifest) {
      const ns = manifest.metadata.namespace || namespace
      const existing = await k8sRequest('GET', `/apis/apps/v1/namespaces/${ns}/deployments/${name}`)
      if (existing) {
        const version = existing.spec?.template?.metadata?.annotations?.['opencode-web-helm/user-template-version']
        // Also converge the rollout strategy on deployments created before
        // Recreate was introduced (RWO volumes + RollingUpdate deadlock).
        const needsStrategy = existing.spec?.strategy?.type !== 'Recreate'
        // Platform-mount state is part of the convergence contract: a unit
        // provisioned while the platform workspace was pending must be
        // re-stamped once the platform PVCs become available.
        const mounts = existing.spec?.template?.metadata?.annotations?.['opencode-web-helm/platform-mounts']
        const desiredMounts = manifest.spec.template.metadata.annotations['opencode-web-helm/platform-mounts']
        // Docker placement (DOCKER_HOST / 'none') is part of the convergence
        // contract too: docker.enabled / brokerForPlatformUnits /
        // onPlatformUnits flips roll units like any other key.
        const dockerHost = existing.spec?.template?.metadata?.annotations?.['opencode-web-helm/docker']
        const desiredDockerHost = manifest.spec.template.metadata.annotations['opencode-web-helm/docker']
        if (version !== userTemplateVersion || needsStrategy || mounts !== desiredMounts || dockerHost !== desiredDockerHost) {
          await k8sRequest('PATCH', `/apis/apps/v1/namespaces/${ns}/deployments/${name}`, {
            metadata: { labels: manifest.metadata.labels },
            spec: { strategy: { type: 'Recreate' }, template: manifest.spec.template },
          })
        }
        return
      }
      try {
        await k8sRequest('POST', `/apis/apps/v1/namespaces/${ns}/deployments`, manifest)
      } catch (error) {
        if (error.statusCode !== 409) {
          throw error
        }
      }
    }

    async function ensureDeployment(name, workspaceClaim, stateClaim, slug, options = {}) {
      const manifest = await userDeploymentManifest({ name, workspaceClaim, stateClaim, slug, isWarmPool: false, ...options })
      await upsertUserDeployment(name, manifest)
    }

    async function ensureWarmDeployment(poolId, owner) {
      const names = warmNamesForPoolId(poolId)
      const manifest = await userDeploymentManifest({ name: names.deployment, workspaceClaim: names.workspaceClaim, stateClaim: names.stateClaim, slug: names.slug, isWarmPool: true, poolId, owner })
      await upsertUserDeployment(names.deployment, manifest)
    }

    async function ensureWarmUnit(poolId) {
      const names = warmNamesForPoolId(poolId)
      await ensurePersistentVolumeClaim(names.workspaceClaim, workspaceSize)
      await ensurePersistentVolumeClaim(names.stateClaim, stateSize)
      await upsertService(warmServiceManifest(poolId))
      await ensureWarmDeployment(poolId)
    }

    async function listUserDeployments(ns = namespace) {
      const result = await k8sRequest('GET', `/apis/apps/v1/namespaces/${ns}/deployments?labelSelector=${encodeURIComponent('opencode-user-managed=true')}`)
      return (result && result.items) || []
    }

    async function recoverOwnerPool() {
      ownerMap.clear()
      if (!warmPoolEnabled || warmPoolSize <= 0) return
      try {
        const deployments = await listUserDeployments()
        for (const dep of deployments) {
          const labels = dep.metadata?.labels || {}
          const owner = labels['opencode-user-owner']
          if (!owner) continue
          const poolId = Number(labels['opencode-user-pool-id'])
          if (Number.isFinite(poolId) && poolId > 0) ownerMap.set(owner, poolId)
        }
        console.log(`[warmpool] recovered ${ownerMap.size} owned warm unit(s)`)
      } catch (error) {
        console.error('[warmpool] owner recovery failed', error)
      }
    }

    function warmUnitState(dep) {
      const labels = dep.metadata?.labels || {}
      const poolId = Number(labels['opencode-user-pool-id'])
      const ready = (dep.status?.availableReplicas || 0) >= 1 && (dep.status?.updatedReplicas || 0) >= 1
      return {
        labels,
        isWarm: labels['opencode-user-warmpool'] === 'true',
        poolId,
        ready,
        owned: !!labels['opencode-user-owner'],
      }
    }

    async function reconcilePool() {
      if (!warmPoolEnabled || warmPoolSize <= 0) return
      if (poolBusy) return
      poolBusy = true
      try {
        // Converge existing units FIRST (idempotent): heals deployments
        // created by older chart versions (RollingUpdate strategy / old
        // template), preserving the current owner so a claimed unit keeps
        // its auth key and labels. Running this before counting/cleanup
        // also guarantees we never re-create a unit the cleanup deletes.
        const initial = await listUserDeployments()
        const initialWarm = initial
          .map((dep) => warmUnitState(dep))
          .filter((state) => state.isWarm && Number.isFinite(state.poolId))
        await Promise.all(initialWarm.map((state) => ensureWarmDeployment(state.poolId, state.owned ? state.labels['opencode-user-owner'] : undefined)))

        const deployments = await listUserDeployments()
        let maxPoolId = 0
        let free = 0
        let pending = 0
        const now = Date.now()
        for (const dep of deployments) {
          const state = warmUnitState(dep)
          if (Number.isFinite(state.poolId) && state.poolId > maxPoolId) maxPoolId = state.poolId
          if (!state.isWarm) continue
          if (state.owned) {
            warmStuckSince.delete(dep.metadata.name)
            continue
          }
          if (state.ready) {
            warmStuckSince.delete(dep.metadata.name)
            free += 1
            continue
          }
          const stuckStart = warmStuckSince.get(dep.metadata.name)
          if (stuckStart === undefined) {
            warmStuckSince.set(dep.metadata.name, now)
            pending += 1
            continue
          }
          if (now - stuckStart >= warmStuckThresholdMs) {
            // Stuck warm unit: its init container has not completed for a long
            // time. Recreate the Deployment (PVCs and Service persist, so the
            // toolchain state survives) so the pool refills instead of drying
            // up on a permanently broken unit.
            console.log(`[warmpool] warm unit ${dep.metadata.name} stuck not-ready for ${Math.round((now - stuckStart) / 60000)}m, recreating it`)
            warmStuckSince.delete(dep.metadata.name)
            await deleteK8s(`/apis/apps/v1/namespaces/${namespace}/deployments`, dep.metadata.name)
            continue
          }
          pending += 1
        }
        const need = warmPoolSize - free - pending
        if (need <= 0) return
        const needPoolIds = []
        for (let i = 0; i < need; i++) {
          needPoolIds.push(maxPoolId + 1 + i)
        }
        // Build the needed warm units in parallel so a fresh pool fills
        // quickly instead of one-at-a-time.
        await Promise.all(needPoolIds.map(async (poolId) => {
          console.log(`[warmpool] ensuring warm unit poolId=${poolId}`)
          await ensureWarmUnit(poolId)
          await waitForDeployment(warmNamesForPoolId(poolId).deployment)
          console.log(`[warmpool] warm unit ready poolId=${poolId}`)
        }))
      } catch (error) {
        console.error('[warmpool] reconcile failed', error)
      } finally {
        poolBusy = false
      }
    }

    function acquirePoolLock(poolId) {
      const prev = poolLocks.get(poolId) || Promise.resolve()
      let release
      const tail = new Promise((resolve) => { release = resolve })
      poolLocks.set(poolId, prev.then(() => tail))
      return prev.then(() => release)
    }

    async function claimWarmForUser(slug, legacySlug, isSsoUser = false) {
      // Bounded retries: re-verify ownership inside the per-pool lock so two
      // concurrent claims can never both PATCH the same warm unit (which would
      // overwrite the owner and strand one user on a pod that authenticates the
      // other). Different units are still claimed in parallel.
      for (let attempt = 0; attempt < 5; attempt++) {
        const deployments = await listUserDeployments()
        let mine = null
        let bestReady = null
        let bestPending = null
        for (const dep of deployments) {
          const state = warmUnitState(dep)
          if (!state.isWarm) continue
          if (state.owned && (state.labels['opencode-user-owner'] === slug
            || (legacySlug && state.labels['opencode-user-owner'] === legacySlug))) {
            // Owns it under the readable slug or the legacy hash (the claim
            // below re-templates the unit with the readable slug, rolling the
            // pod while its volumes — and the user's data — stay).
            if (mine === null || state.poolId < mine) mine = state.poolId
          } else if (!state.owned) {
            // Ready units are preferred, but a unit that is still starting
            // (init container installing the toolchain) is claimed too: the
            // router's loading screen already waits for readiness, which beats
            // falling back to a dedicated pod and locking the user there.
            if (state.ready) {
              if (bestReady === null || state.poolId < bestReady) bestReady = state.poolId
            } else if (bestPending === null || state.poolId < bestPending) {
              bestPending = state.poolId
            }
          }
        }
        if (mine !== null) {
          const poolId = mine
          const names = warmNamesForPoolId(poolId)
          ownerMap.set(slug, poolId)
          return { slug, names }
        }
        const poolId = bestReady !== null ? bestReady : bestPending
        if (poolId === null) {
          return null
        }
        const release = await acquirePoolLock(poolId)
        try {
          // Re-verify while holding the lock: someone else may have claimed
          // this unit after our selection, or reconcile may have recreated it.
          // If so, retry the selection.
          const current = await k8sRequest('GET', `/apis/apps/v1/namespaces/${namespace}/deployments/${warmNamesForPoolId(poolId).deployment}`)
          const state = warmUnitState(current)
          if (!current || !state.isWarm || state.owned) {
            continue
          }
          const names = warmNamesForPoolId(poolId)
          const manifest = await userDeploymentManifest({ name: names.deployment, workspaceClaim: names.workspaceClaim, stateClaim: names.stateClaim, slug, isWarmPool: true, poolId, owner: slug, ssoUnit: isSsoUser })
          await k8sRequest('PATCH', `/apis/apps/v1/namespaces/${namespace}/deployments/${names.deployment}`, {
            metadata: { labels: manifest.metadata.labels },
            spec: { template: manifest.spec.template },
          })
          ownerMap.set(slug, poolId)
          console.log(`[warmpool] claimed poolId=${poolId} owner=${slug}${state.ready ? '' : ' (unit still starting)'}`)
          reconcilePool()
          return { slug, names }
        } finally {
          release()
        }
      }
      return null
    }

    async function waitForDeployment(name, timeoutMs = 300000, ns = namespace) {
      const start = Date.now()
      while (Date.now() - start < timeoutMs) {
        const deployment = await k8sRequest('GET', `/apis/apps/v1/namespaces/${ns}/deployments/${name}`)
        const desiredReplicas = deployment?.spec?.replicas || 1
        if (
          deployment?.status?.observedGeneration >= deployment?.metadata?.generation
          && deployment?.status?.updatedReplicas >= desiredReplicas
          && deployment?.status?.availableReplicas >= desiredReplicas
        ) {
          return
        }
        await new Promise((resolve) => setTimeout(resolve, 2000))
      }
      throw new Error(`Timed out waiting for deployment ${name}`)
    }

    async function isEnvironmentReady(names) {
      const ns = names.namespace || namespace
      const deployment = await k8sRequest('GET', `/apis/apps/v1/namespaces/${ns}/deployments/${names.deployment}`)
      if (!deployment) return false
      const desiredReplicas = deployment?.spec?.replicas || 1
      return (
        deployment?.status?.observedGeneration >= deployment?.metadata?.generation
        && (deployment?.status?.updatedReplicas || 0) >= desiredReplicas
        && (deployment?.status?.availableReplicas || 0) >= desiredReplicas
      )
    }

    function startProvisionWatch(names) {
      const ns = names.namespace || namespace
      // The MAP KEY includes the namespace (platform units get their own
      // task slot) — but the watch must pass the namespace separately:
      // embedding it into the deployment name builds a malformed API path
      // (observed as a 403 + router crash on the first platform login in the
      // dsh chart).
      const key = `${ns}/${names.deployment}`
      const existing = provisionTasks.get(key)
      if (existing) return existing
      const task = { promise: null, error: null }
      // The promise must NEVER reject: with the setup UI enabled nothing
      // awaits it, and an unhandled rejection would crash the router.
      // Failures are recorded on the task for the setup-status page to show.
      task.promise = waitForDeployment(names.deployment, 300000, ns).then(
        () => { task.error = null },
        (error) => {
          task.error = error
          console.error(`[provision] watch failed for ${ns}/${names.deployment}: ${error.message}`)
        },
      )
      provisionTasks.set(key, task)
      return task
    }

    async function provisionReady(names) {
      await startProvisionWatch(names).promise
    }

    // --- Platform environment resolution (PCAI/Kubeflow integration) --------
    // The EzProject name derives from the SSO username with the platform's
    // own sanitization (dots/underscores -> dashes) — the same shape as
    // slugifyUsername. The candidate namespace is always VERIFIED against
    // the live project-info ConfigMap, so a sanitization mismatch or a
    // not-yet-provisioned workspace degrades safely to the classic
    // release-namespace unit instead of guessing wrong.
    // Ordered platform-namespace candidates for a user: static patterns in
    // the listed order first (deterministic, cheapest), then wildcard
    // matches. Each entry carries `wildcard` so the verifier knows which
    // candidates need the ownership check.
    async function platformNamespaceCandidates(userId) {
      const sanitized = slugifyUsername(userId)
      if (!sanitized || !platformEnabled) return []
      let patterns = platformNsPatterns.slice()
      if (patterns.length === 0) {
        // Legacy configuration: single prefix, username appended.
        patterns = [`${platformNsPrefix}{username}`]
      }
      const staticNames = []
      const wildcardPrefixes = []
      for (const pattern of patterns) {
        const expanded = pattern.split('{username}').join(sanitized)
        if (expanded.endsWith('*')) {
          const prefix = expanded.slice(0, -1)
          if (prefix) wildcardPrefixes.push(prefix.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'))
        } else {
          staticNames.push(expanded)
        }
      }
      if (wildcardPrefixes.length === 0) {
        return [...new Set(staticNames)].map((name) => ({ name, wildcard: false }))
      }
      // Wildcard patterns need the namespace list (names only, cached 60s).
      const now = Date.now()
      if (now - platformNsListCache.at > 60000) {
        try {
          const result = await k8sRequest('GET', '/api/v1/namespaces')
          platformNsListCache.names = ((result && result.items) || [])
            .map((item) => item.metadata?.name || '')
            .filter(Boolean)
            .sort()
          platformNsListCache.at = Date.now()
        } catch (error) {
          console.error(`[platform] namespace list failed: ${error.message}`)
          platformNsListCache.names = []
          platformNsListCache.at = Date.now()
        }
      }
      const matches = []
      for (const prefix of wildcardPrefixes) {
        const rex = new RegExp('^' + prefix)
        matches.push(...platformNsListCache.names.filter((name) => rex.test(name)))
      }
      const seen = new Set()
      const candidates = []
      for (const { name, wildcard } of [...staticNames.map((name) => ({ name, wildcard: false })), ...matches.map((name) => ({ name, wildcard: true }))]) {
        if (seen.has(name) || name === namespace) continue
        seen.add(name)
        candidates.push({ name, wildcard })
      }
      return candidates
    }

    async function fetchPlatformContext(userId) {
      // Candidate order: the registry-recorded unitNs first (sticky across
      // pattern changes), then the configured patterns in order.
      const candidates = []
      try {
        const users = await loadUserRegistry()
        const recorded = users[userId]?.unitNs
        if (recorded && recorded !== namespace) candidates.push({ name: recorded, wildcard: false })
      } catch {
        // Registry unreadable — pattern candidates still apply.
      }
      candidates.push(...await platformNamespaceCandidates(userId))
      const seen = new Set()
      for (const { name: unitNs, wildcard } of candidates) {
        if (seen.has(unitNs)) continue
        seen.add(unitNs)
        let info = null
        try {
          info = await k8sRequest('GET', `/api/v1/namespaces/${unitNs}/configmaps/project-info`)
        } catch (error) {
          if (error.statusCode === 404) continue // candidate not provisioned → next pattern
          throw error // 403 (RBAC) or transient — surface it like the single-prefix path did
        }
        if (!info?.data?.uid || !info?.data?.gid) continue // exists, project not provisioned yet
        // Wildcard candidates cannot be trusted by name alone (one user's
        // prefix can collide with another user's name) — verify OWNERSHIP
        // through the project-info user field before adopting.
        if (wildcard) {
          const owner = slugifyUsername(info.data.user || '')
          if (!owner || owner !== slugifyUsername(userId)) continue
        }
        const identity = {
          uid: info.data.uid,
          gid: info.data.gid,
          user: info.data.user || '',
          group: info.data.group || '',
          homedir: info.data.homedir || '',
        }
        const [sharedPvc, userPvc] = await Promise.all([
          k8sRequest('GET', `/api/v1/namespaces/${unitNs}/persistentvolumeclaims/${platformSharedClaim}`).catch(() => null),
          k8sRequest('GET', `/api/v1/namespaces/${unitNs}/persistentvolumeclaims/${platformUserClaim}`).catch(() => null),
        ])
        const bound = (pvc) => !!pvc && pvc.status?.phase === 'Bound'
        return {
          unitNamespace: unitNs,
          identity,
          volumesMounted: bound(sharedPvc) && bound(userPvc),
        }
      }
      return null
    }

    async function platformContextForUser(userId) {
      const cached = platformContextCache.get(userId)
      const now = Date.now()
      if (cached && now - cached.at < 60000) return cached.value
      let value = null
      try {
        value = await fetchPlatformContext(userId)
      } catch (error) {
        // 403 (cross-namespace RBAC not granted yet) and transient API
        // failures degrade to the classic release-namespace unit — the
        // platform feature must never break a user's request.
        console.error(`[platform] context fetch failed for ${userId}: ${error.message}`)
      }
      platformContextCache.set(userId, { at: now, value })
      return value
    }

    function anchorManifest(unitNs, slug) {
      return {
        apiVersion: 'v1',
        kind: 'ConfigMap',
        metadata: {
          name: `opencode-anchor-${slug}`,
          namespace: unitNs,
          labels: {
            app: '{{ .Chart.Name }}',
            'opencode-user-managed': 'true',
            'opencode-user-slug': slug,
          },
          // Ownership anchor: the unit's Deployment, Service and mirrored
          // ConfigMaps reference this anchor via ownerReferences. Deleting it
          // (admin user-delete or helm uninstall) cascades the unit compute —
          // and ONLY the compute: the platform PVCs and the user data PVCs
          // (ws/st/shared) are never owner-referenced, so the GC is
          // structurally unable to touch them.
          annotations: { 'opencode-web-helm/anchor': 'true' },
        },
        data: { note: 'opencode unit ownership anchor. Deleting it deletes the opencode unit compute resources in this namespace (deployment, service, mirrored configmaps); it never deletes the platform PVCs (kubeflow-shared-pvc / user-pvc) nor the user data PVCs (opencode-*-ws-*/-st-* / opencode-web-helm-shared-pvc) — those survive and must be deleted manually.' },
      }
    }

    async function ensureUnitAnchor(unitNs, slug) {
      const manifest = anchorManifest(unitNs, slug)
      const path = `/api/v1/namespaces/${unitNs}/configmaps/${manifest.metadata.name}`
      const existing = await k8sRequest('GET', path)
      if (existing) return existing
      try {
        return await k8sRequest('POST', `/api/v1/namespaces/${unitNs}/configmaps`, manifest)
      } catch (error) {
        if (error.statusCode !== 409) throw error
        return await k8sRequest('GET', path)
      }
    }

    function ownerRefToAnchor(anchor) {
      if (!anchor?.metadata?.name || !anchor?.metadata?.uid) return null
      return [{
        apiVersion: 'v1',
        kind: 'ConfigMap',
        name: anchor.metadata.name,
        uid: anchor.metadata.uid,
        blockOwnerDeletion: false,
        controller: false,
      }]
    }

    // Mirror the ConfigMaps the unit pod template mounts into the unit
    // namespace (cross-namespace volume mounts are impossible). Synced on a
    // rate-limited path so a helm upgrade converges the mirrors without
    // hammering the API server on every request.
    async function syncUnitConfigMaps(unitNs, ownerRefs) {
      for (const cmName of unitConfigMapNames) {
        const src = await k8sRequest('GET', `/api/v1/namespaces/${namespace}/configmaps/${cmName}`)
        if (!src) continue
        const desiredData = src.data || {}
        const desiredLabels = {
          app: '{{ .Chart.Name }}',
          'opencode-user-managed': 'true',
        }
        const existing = await k8sRequest('GET', `/api/v1/namespaces/${unitNs}/configmaps/${cmName}`)
        if (!existing) {
          try {
            await k8sRequest('POST', `/api/v1/namespaces/${unitNs}/configmaps`, {
              apiVersion: 'v1',
              kind: 'ConfigMap',
              metadata: {
                name: cmName,
                namespace: unitNs,
                labels: desiredLabels,
                ...(ownerRefs ? { ownerReferences: ownerRefs } : {}),
              },
              data: desiredData,
            })
          } catch (error) {
            if (error.statusCode !== 409) throw error
          }
        } else if (JSON.stringify(existing.data || {}) !== JSON.stringify(desiredData)) {
          await k8sRequest('PUT', `/api/v1/namespaces/${unitNs}/configmaps/${cmName}`, {
            ...existing,
            data: desiredData,
            metadata: { ...existing.metadata, labels: desiredLabels },
          })
        }
      }
    }

    async function syncUnitConfigMapsRateLimited(unitNs, ownerRefs) {
      const now = Date.now()
      const last = mirrorSyncCache.get(unitNs) || 0
      if (now - last < 60000) return
      mirrorSyncCache.set(unitNs, now)
      await syncUnitConfigMaps(unitNs, ownerRefs)
      await syncUnitSecrets(unitNs, ownerRefs)
    }

    // The unit pod template also references the release auth Secret
    // (OPENCODE_SERVER_USERNAME/PASSWORD via secretKeyRef). For platform
    // units (pod in the project namespace) Kubernetes cannot resolve a
    // cross-namespace secretRef, so the router mirrors a FILTERED copy of
    // that secret into the unit namespace — ONLY the keys the pod template
    // references. SESSION_SECRET/ADMIN_* deliberately stay
    // release-namespace-only (the project namespace is user-readable, and
    // SESSION_SECRET would allow forging any user's session cookie). The
    // image pull secret (private registries) is mirrored the same way.
    // The router never reads a mirror back: create, then strategic-merge
    // patch on 409 — the platform ClusterRole therefore grants NO secret
    // read, preserving the "never touches platform secrets" contract.
    const unitAuthSecretName = '{{ .Release.Name }}-auth'
    const unitAuthSecretKeys = ['OPENCODE_SERVER_USERNAME', 'OPENCODE_SERVER_PASSWORD']

    async function mirrorSecretIntoUnitNs(unitNs, secretName, keys, ownerRefs) {
      const src = await k8sRequest('GET', `/api/v1/namespaces/${namespace}/secrets/${secretName}`)
      if (!src?.data) return
      const desiredData = {}
      if (keys) {
        for (const key of keys) {
          if (src.data[key] !== undefined) desiredData[key] = src.data[key]
        }
      } else {
        Object.assign(desiredData, src.data)
      }
      try {
        await k8sRequest('POST', `/api/v1/namespaces/${unitNs}/secrets`, {
          apiVersion: 'v1',
          kind: 'Secret',
          metadata: {
            name: secretName,
            namespace: unitNs,
            labels: {
              app: '{{ .Chart.Name }}',
              'opencode-user-managed': 'true',
            },
            ...(ownerRefs ? { ownerReferences: ownerRefs } : {}),
          },
          type: src.type || 'Opaque',
          data: desiredData,
        })
      } catch (error) {
        if (error.statusCode !== 409) throw error
        // Exists: strategic-merge patch refreshes the mirrored keys (no
        // read-back — the platform ClusterRole grants no secret `get`).
        await k8sRequest('PATCH', `/api/v1/namespaces/${unitNs}/secrets/${secretName}`, { data: desiredData })
      }
    }

    async function syncUnitSecrets(unitNs, ownerRefs) {
      await mirrorSecretIntoUnitNs(unitNs, unitAuthSecretName, unitAuthSecretKeys, ownerRefs)
      if (userPullSecret) {
        // Full copy (dockerconfigjson) — pull-only registry credentials for
        // the unit's own image; required for private ghcr packages on
        // platform units (imagePullSecrets resolve in the pod's namespace).
        await mirrorSecretIntoUnitNs(unitNs, userPullSecret, null, ownerRefs)
      }
    }

    // The platform environment: unit Deployment/Service/chart PVCs in the
    // user's project namespace, all owner-anchored, with the platform PVCs
    // mounted BY REFERENCE and the identity stamped into the pod.
    async function resolvePlatformEnvironment(userId, slug, platform) {
      const unitNs = platform.unitNamespace
      const names = { ...namesForSlug(slug, unitNs), unitSharedClaim: sharedWorkspaceClaim }
      const existing = await k8sRequest('GET', `/apis/apps/v1/namespaces/${unitNs}/deployments/${names.deployment}`)
      const anchor = await ensureUnitAnchor(unitNs, slug)
      const ownerRefs = ownerRefToAnchor(anchor)
      await syncUnitConfigMapsRateLimited(unitNs, ownerRefs)
      if (existing) {
        await ensurePersistentVolumeClaim(names.workspaceClaim, workspaceSize, unitNs)
        await ensurePersistentVolumeClaim(names.stateClaim, stateSize, unitNs)
        await ensurePersistentVolumeClaim(names.unitSharedClaim, sharedWorkspaceSize, unitNs, null, ['ReadWriteMany'])
        await ensureService(names.service, slug, unitNs, ownerRefs)
        await ensureDeployment(names.deployment, names.workspaceClaim, names.stateClaim, slug, { unitNs, ownerRefs, platform })
        await ensureDindBroker(slug, unitNs)
        return { slug, names }
      }
      // First provision inside the platform namespace: the unit is BORN here
      // (Kubernetes objects cannot move between namespaces), so a brand-new
      // SSO user cold-starts once; every later login/resume is warm. A unit
      // provisioned while the platform PVCs were not Bound yet is re-stamped
      // (pod restart) once they are — see the platform-mounts annotation.
      console.log(`[platform] provisioning unit for ${userId} in ${unitNs} (mounts=${platform.volumesMounted ? 'platform+own' : 'own only; platform PVCs not Bound yet'})`)
      await ensureLease(`opencode-user-${slug}`)
      // PVCs are deliberately NOT owner-anchored (keepPvcOnDelete): they must
      // survive anchor deletion / helm uninstall so a re-SSO re-binds the
      // exact same volumes.
      await ensurePersistentVolumeClaim(names.workspaceClaim, workspaceSize, unitNs)
      await ensurePersistentVolumeClaim(names.stateClaim, stateSize, unitNs)
      await ensurePersistentVolumeClaim(names.unitSharedClaim, sharedWorkspaceSize, unitNs, null, ['ReadWriteMany'])
      await ensureService(names.service, slug, unitNs, ownerRefs)
      await ensureDeployment(names.deployment, names.workspaceClaim, names.stateClaim, slug, { unitNs, ownerRefs, platform })
      await ensureDindBroker(slug, unitNs)
      try {
        // Persist the unit location so admin listing, conversation clears
        // and the uninstall cleanup find the unit without guessing.
        const users = await loadUserRegistry()
        if (users[userId]) {
          users[userId] = { ...users[userId], unitNs }
          await saveUserRegistry(users)
        }
      } catch (error) {
        console.error(`[platform] registry unitNs persist failed for ${userId}`, error)
      }
      return { slug, names }
    }

    async function resolveUserEnvironment(userId) {
      const slug = slugForUser(userId)
      const legacySlug = legacySlugForUser(userId)
      const names = namesForSlug(slug)
      // Docker is an SSO-identity capability (see the placement note in
      // userDeploymentManifest): derive the session type from the registry
      // (SSO logins stamp sso: true). An unreadable registry fails CLOSED —
      // no daemon.
      let isSsoUser = false
      try {
        const users = await loadUserRegistry()
        isSsoUser = !!users[userId]?.sso
      } catch {
        isSsoUser = false
      }
      // Sticky: if the user already has a dedicated (non-warm) environment, keep
      // serving them there. Prevents a user who fell back to a dedicated
      // deployment during a pool shortage from being silently moved to a warm
      // unit later when the pool recovers.
      const existingDedicated = await k8sRequest('GET', `/apis/apps/v1/namespaces/${namespace}/deployments/${names.deployment}`)
      if (existingDedicated) {
        // Data-preserving adoption: mount the claims the deployment ALREADY
        // uses (units provisioned before the VAST-safe claim-name scheme
        // carry legacy-named claims — renaming would strand the user's data
        // on the old volumes).
        const volumeClaims = new Map(
          (existingDedicated.spec?.template?.spec?.volumes || [])
            .filter((v) => v.persistentVolumeClaim?.claimName)
            .map((v) => [v.name, v.persistentVolumeClaim.claimName]),
        )
        const workspaceClaim = volumeClaims.get('personal-workspace') || names.workspaceClaim
        const stateClaim = volumeClaims.get('state') || names.stateClaim
        await ensureLease(`opencode-user-${slug}`)
        await ensurePersistentVolumeClaim(workspaceClaim, workspaceSize)
        await ensurePersistentVolumeClaim(stateClaim, stateSize)
        await ensureService(names.service, slug)
        await ensureDeployment(names.deployment, workspaceClaim, stateClaim, slug, { ssoUnit: isSsoUser })
        return { slug, names: { ...names, workspaceClaim, stateClaim } }
      }
      // Platform integration — only for users WITHOUT an existing
      // release-namespace unit (sticky semantics preserved: nobody is
      // silently moved or reset). A fresh install therefore provisions every
      // SSO user inside their platform project namespace; an upgraded
      // cluster keeps existing units where they are until they are deleted.
      if (platformEnabled) {
        const platform = await platformContextForUser(userId)
        if (platform) {
          return await resolvePlatformEnvironment(userId, slug, platform)
        }
      }
      // One-time readable-slug migration: a dedicated environment provisioned
      // by a pre-readable-slug release lives under the legacy hash slug.
      // Re-home it under the readable slug while KEEPING the user's volumes:
      // PVCs cannot be renamed, so the new deployment mounts the legacy
      // claims (resolved from the legacy deployment's spec) and the legacy
      // deployment/service/lease are retired (the legacy deployment is
      // deleted first so its RWO volumes detach before the new pod binds
      // them).
      const legacyNames = namesForSlug(legacySlug)
      const legacyDedicated = await k8sRequest('GET', `/apis/apps/v1/namespaces/${namespace}/deployments/${legacyNames.deployment}`)
      if (legacyDedicated) {
        const legacyVolumeClaims = new Map(
          (legacyDedicated.spec?.template?.spec?.volumes || [])
            .filter((v) => v.persistentVolumeClaim?.claimName)
            .map((v) => [v.name, v.persistentVolumeClaim.claimName]),
        )
        const legacyWorkspaceClaim = legacyVolumeClaims.get('personal-workspace') || legacyNames.workspaceClaim
        const legacyStateClaim = legacyVolumeClaims.get('state') || legacyNames.stateClaim
        console.log(`[migration] adopting legacy environment of ${userId}: ${legacyNames.deployment} -> ${names.deployment}`)
        await deleteK8s(`/apis/apps/v1/namespaces/${namespace}/deployments`, legacyNames.deployment)
        await waitForDeploymentGone(legacyNames.deployment)
        await deleteK8s(`/api/v1/namespaces/${namespace}/services`, legacyNames.service)
        await deleteK8s(`/apis/coordination.k8s.io/v1/namespaces/${namespace}/leases`, `opencode-user-${legacySlug}`)
        await deleteK8s(`/apis/networking.istio.io/v1/namespaces/${namespace}/virtualservices`, legacyNames.virtualService)
        await ensureLease(`opencode-user-${slug}`)
        await ensureService(names.service, slug)
        await ensureDeployment(names.deployment, legacyWorkspaceClaim, legacyStateClaim, slug, { ssoUnit: isSsoUser })
        return { slug, names: { ...names, workspaceClaim: legacyWorkspaceClaim, stateClaim: legacyStateClaim } }
      }
      if (warmPoolEnabled && warmPoolSize > 0) {
        let claimed = null
        try {
          // Units being created by a concurrent refill do not exist in the
          // deployments list yet, so a single claim pass can come up empty
          // while the pool is mid-refill. Retry briefly before falling back
          // to a dedicated pod (bounded: worst case ~6s, vs minutes of cold
          // provisioning).
          for (let attempt = 0; attempt < 3 && !claimed; attempt++) {
            claimed = await claimWarmForUser(slug, legacySlug, isSsoUser)
            if (!claimed && attempt < 2) {
              await new Promise((resolve) => setTimeout(resolve, 2000))
            }
          }
        } catch (error) {
          // A transient claim failure must not break the user's request:
          // fall through and provision the dedicated environment instead.
          console.error('[warmpool] claim failed, falling back to dedicated environment', error)
        }
        if (claimed) {
          return claimed
        }
      }
      await ensureLease(`opencode-user-${slug}`)
      await ensurePersistentVolumeClaim(names.workspaceClaim, workspaceSize)
      await ensurePersistentVolumeClaim(names.stateClaim, stateSize)
      await ensureService(names.service, slug)
      await ensureDeployment(names.deployment, names.workspaceClaim, names.stateClaim, slug, { ssoUnit: isSsoUser })
      return { slug, names }
    }

    function targetForUserPath(names, path, prefix) {
      return {
        host: `${names.service}.${names.namespace || namespace}.svc.cluster.local`,
        port: 8082,
        injectBasicAuth: false,
        preserveHost: true,
        path,
        forwardedPrefix: prefix,
      }
    }

    function targetForPassthrough(names, path) {
      return {
        host: `${names.service}.${names.namespace || namespace}.svc.cluster.local`,
        port: 8082,
        injectBasicAuth: false,
        preserveHost: true,
        path,
      }
    }

    // `prefix` is the browser-visible per-user URL prefix: readable
    // `/{username-slug}` (readable-slug releases) or legacy `/u-{hash}`. It is
    // stripped before the proxy hop (the pod nginx serves at root).
    function stripSlugPrefix(requestUrl, prefix) {
      if (!requestUrl.startsWith(prefix)) return requestUrl
      const rest = requestUrl.slice(prefix.length)
      if (rest === '') return '/'
      if (rest.startsWith('?')) return '/' + rest
      return rest
    }

    function proxyHeaders(request, target) {
      const headers = { ...request.headers }
      const originalHost = request.headers.host
      headers.host = target.preserveHost ? request.headers.host : `${target.host}:${target.port}`
      if (originalHost) headers['x-forwarded-host'] = originalHost
      if (!headers['x-forwarded-proto']) headers['x-forwarded-proto'] = 'https'
      if (request.socket?.remoteAddress) {
        const prior = headers['x-forwarded-for']
        headers['x-forwarded-for'] = prior ? `${prior}, ${request.socket.remoteAddress}` : request.socket.remoteAddress
      }
      if (target.injectBasicAuth) {
        headers.authorization = basicAuth
      }
      if (target.forwardedPrefix) {
        headers['x-forwarded-prefix'] = target.forwardedPrefix
      }
      return headers
    }

    function ptyUpgradeKey(request, target) {
      const pathname = new URL(target.path || request.url || '/', 'http://internal').pathname
      const match = pathname.match(/^\/pty\/([^/]+)\/connect$/)
      if (!match) return null
      return `${target.host}:${target.port}:${match[1]}`
    }

    function proxyRequest(request, response, target) {
      const upstream = http.request(
        {
          host: target.host,
          port: target.port,
          method: request.method,
          path: target.path || request.url,
          headers: proxyHeaders(request, target),
        },
        (upstreamResponse) => {
          response.writeHead(upstreamResponse.statusCode || 502, upstreamResponse.headers)
          upstreamResponse.pipe(response)
        },
      )
      upstream.on('error', (error) => {
        console.error('proxy request failed', error)
        if (!response.headersSent) {
          json(response, 502, { error: 'upstream request failed' })
          return
        }
        response.destroy(error)
      })
      request.pipe(upstream)
    }

    function proxyUpgrade(request, socket, head, target) {
      const ptyKey = ptyUpgradeKey(request, target)
      const tunnelId = ++tunnelSeq
      let upgraded = false
      let closed = false
      let upstreamSocket

      console.log(`[tunnel ${tunnelId}] upgrade start url=${request.url} ptyKey=${ptyKey}`)

      const cleanup = () => {
        if (closed) return
        closed = true
        upstreamSocket?.unpipe(socket)
        socket.unpipe(upstreamSocket)
        if (ptyKey && activePtyUpgrades.get(ptyKey) === cleanup) {
          activePtyUpgrades.delete(ptyKey)
          console.log(`[tunnel ${tunnelId}] removed from activePtyUpgrades ptyKey=${ptyKey}`)
        }
        upstreamSocket?.destroy()
        socket.destroy()
        console.log(`[tunnel ${tunnelId}] cleanup done ptyKey=${ptyKey} upgraded=${upgraded}`)
      }

      const failUpgrade = (error) => {
        if (closed) return
        console.error('proxy upgrade failed', error)
        if (!upgraded && !socket.destroyed) {
          socket.write('HTTP/1.1 502 Bad Gateway\r\n\r\n')
        }
        cleanup()
      }

      upstreamSocket = net.connect(target.port, target.host, () => {
        const method = request.method || 'GET'
        const reqLine = `${method} ${target.path || request.url} HTTP/1.1\r\n`
        const headers = proxyHeaders(request, target)
        headers.host = request.headers.host
        const headerStr = Object.entries(headers)
          .flatMap(([key, value]) => {
            if (Array.isArray(value)) return value.map((entry) => `${key}: ${entry}\r\n`)
            return [`${key}: ${value}\r\n`]
          })
          .join('')
        upstreamSocket.write(reqLine + headerStr + '\r\n')
        if (head.length > 0) upstreamSocket.write(head)
      })

      socket.on('close', cleanup)
      socket.on('end', cleanup)
      socket.on('error', cleanup)
      upstreamSocket.on('close', cleanup)
      upstreamSocket.on('end', cleanup)
      upstreamSocket.on('error', (error) => {
        if (upgraded) {
          cleanup()
          return
        }
        failUpgrade(error)
      })

      let buffer = Buffer.alloc(0)

      upstreamSocket.on('data', (chunk) => {
        buffer = Buffer.concat([buffer, chunk])
        const headerEnd = buffer.indexOf('\r\n\r\n')
        if (headerEnd === -1) return

        upstreamSocket.removeAllListeners('data')

        const headerSection = buffer.slice(0, headerEnd).toString('utf8')
        const lines = headerSection.split('\r\n')
        const statusMatch = lines[0].match(/^HTTP\/\d\.\d\s+(\d+)\s+(.+)$/)
        if (!statusMatch) {
          socket.destroy()
          upstreamSocket.destroy()
          return
        }

        const statusCode = parseInt(statusMatch[1], 10)
        const statusMessage = statusMatch[2]

        const responseHeaders = {}
        for (let i = 1; i < lines.length; i++) {
          const colonIdx = lines[i].indexOf(':')
          if (colonIdx > 0) {
            const key = lines[i].slice(0, colonIdx).trim()
            const value = lines[i].slice(colonIdx + 1).trim()
            responseHeaders[key] = value
          }
        }

        if (statusCode !== 101) {
          socket.write(buffer)
          socket.destroy()
          upstreamSocket.destroy()
          return
        }

        upgraded = true
        if (ptyKey) {
          const previous = activePtyUpgrades.get(ptyKey)
          if (previous && previous !== cleanup) {
            console.log(`[tunnel ${tunnelId}] replacing previous tunnel for ptyKey=${ptyKey}`)
            previous()
          }
          activePtyUpgrades.set(ptyKey, cleanup)
          console.log(`[tunnel ${tunnelId}] registered in activePtyUpgrades ptyKey=${ptyKey}`)
        }

        const statusLine = `HTTP/1.1 ${statusCode} ${statusMessage}\r\n`
        const headerLines = Object.entries(responseHeaders)
          .map(([key, value]) => `${key}: ${value}\r\n`)
          .join('')
        socket.write(statusLine + headerLines + '\r\n')

        const upstreamHead = buffer.slice(headerEnd + 4)
        if (upstreamHead.length > 0) socket.write(upstreamHead)

        upstreamSocket.pipe(socket, { end: false })
        socket.pipe(upstreamSocket, { end: false })
        console.log(`[tunnel ${tunnelId}] pipes established ptyKey=${ptyKey} upstream=${target.host}:${target.port}`)
      })
    }

    async function handleSetupStatus(request, response) {
      const userId = readSessionIdentity(request)
      if (!userId) {
        json(response, 401, { error: 'Missing session' })
        return
      }
      const url = new URL(request.url || '/', 'http://internal')
      try {
        const environment = await resolveUserEnvironment(userId)
        if (url.searchParams.get('reset') === 'retry') {
          provisionTasks.delete(`${environment.names.namespace || namespace}/${environment.names.deployment}`)
          json(response, 200, { ready: false, retried: true })
          return
        }
        const ready = await isEnvironmentReady(environment.names)
        if (ready) {
          json(response, 200, { ready: true })
          return
        }
        const task = provisionTasks.get(`${environment.names.namespace || namespace}/${environment.names.deployment}`)
        if (task?.error) {
          json(response, 200, { ready: false, failed: true, error: task.error.message || 'Provisioning failed' })
          return
        }
        json(response, 200, { ready: false })
      } catch (error) {
        console.error('setup status failed', error)
        json(response, 200, { ready: false, failed: true, error: error.message || 'Provisioning failed' })
      }
    }

    function setupPageHtml() {
      const statusUrl = JSON.stringify(setupStatusPath)
      const heading = setupHeading.replace(/</g, '&lt;')
      const subtext = setupSubtext.replace(/</g, '&lt;')
      return `<!DOCTYPE html>
    <html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setting up your account</title>
    <link rel="icon" type="image/x-icon" href="data:image/x-icon;base64,">
    <script>
    (function() {
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
    </script>
    <style>
    :root, [data-theme="light"] {
      --bg: #f4f6f9; --surface: #ffffff; --surface-2: #eef0f5;
      --border: #d1d5db; --text: #1f2937; --text-muted: #6b7280;
      --accent: #01a982; --accent-hover: #02c99a;
      --green: #059669; --red: #dc2626; --radius: 6px;
      --accent-soft: rgba(1, 169, 130, 0.08);
    }
    [data-theme="dark"] {
      --bg: #0b0e14; --surface: #161a24; --surface-2: #1e2432;
      --border: #2a3142; --text: #e0e4ed; --text-muted: #8891a8;
      --accent: #01a982; --accent-hover: #02c99a;
      --green: #34d399; --red: #f87171;
      --accent-soft: rgba(1, 169, 130, 0.14);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 14px; padding: 24px 0; }
    .wrap { width: 100%; max-width: 560px; padding: 0 24px; }
    .hpe-header { display: flex; align-items: center; margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
    .hpe-header-left { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
    .hpe-brand { display: flex; flex-direction: column; }
    .hpe-brand-name { font-size: 0.7rem; font-weight: 500; color: var(--text-muted); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 1px; }
    .hpe-brand-title { font-size: 1.3rem; font-weight: 600; color: var(--text); }
    .hpe-brand-sub { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }
    #card { text-align: center; max-width: 460px; width: 100%; margin: 0 auto; padding: 40px 32px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }
    #heading { font-size: 20px; font-weight: 600; margin-bottom: 10px; }
    #subtext { color: var(--text-muted); line-height: 1.5; margin-bottom: 24px; }
    .spinner { width: 44px; height: 44px; margin: 0 auto 24px; border: 4px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #error-box { display: none; }
    #error-box .error-title { color: var(--red); font-size: 16px; font-weight: 600; margin-bottom: 8px; }
    #error-box .error-detail { font-size: 12px; color: var(--text-muted); margin-bottom: 18px; word-break: break-word; }
    button { background: var(--accent); color: #fff; border: none; border-radius: var(--radius); padding: 8px 16px; font-size: 13px; cursor: pointer; font-family: inherit; }
    button:hover { background: var(--accent-hover); }
    .theme-controls { margin-left: auto; display: flex; align-items: center; gap: 10px; }
    .theme-emoji-btn { width: 38px; height: 38px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface-2); color: var(--text); cursor: pointer; font-size: 1.1rem; line-height: 1; opacity: 0.55; transition: opacity 0.15s ease, border-color 0.15s ease, color 0.15s ease; }
    .theme-emoji-btn:hover { border-color: var(--accent); color: var(--accent); opacity: 1; }
    .theme-emoji-btn.active { opacity: 1; border-color: var(--accent); color: var(--accent); }
    .theme-switch { display: flex; align-items: center; margin: 0; cursor: pointer; }
    .theme-switch input { position: absolute; opacity: 0; width: 0; height: 0; }
    .switch-track { position: relative; width: 44px; height: 24px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); transition: background 0.2s ease; }
    .switch-thumb { position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: var(--text); transition: transform 0.2s ease, background 0.2s ease; }
    .theme-switch input:checked + .switch-track { background: var(--accent); border-color: var(--accent); }
    .theme-switch input:checked + .switch-track .switch-thumb { transform: translateX(20px); background: var(--surface); }
    .theme-controls.fixed { position: fixed; top: 16px; right: 16px; margin-left: 0; z-index: 100; }
    .hpe-footer { margin-top: 32px; padding-top: 18px; border-top: 1px solid var(--border); font-size: .78rem; color: var(--text-muted); text-align: center; }
    </style>
    </head>
    <body>
    <div class="theme-controls fixed" title="Dark / light mode">
      <button class="theme-emoji-btn" id="themeLight" aria-label="Light mode">☀️</button>
      <label class="theme-switch">
        <input type="checkbox" id="themeSwitch" />
        <span class="switch-track"><span class="switch-thumb"></span></span>
      </label>
      <button class="theme-emoji-btn" id="themeDark" aria-label="Dark mode">🌙</button>
    </div>
    <div class="wrap">
      <header class="hpe-header">
        <div class="hpe-header-left">
          <svg xmlns="http://www.w3.org/2000/svg" width="210" height="140" viewBox="0 0 432 288" style="flex-shrink:0">
