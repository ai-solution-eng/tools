    .sub { color: var(--text-muted); margin-bottom: 20px; line-height: 1.5; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; margin-bottom: 20px; }
    .card h2 { font-size: 15px; font-weight: 600; margin-bottom: 12px; }
    label { display: block; font-size: .85rem; font-weight: 500; margin: 10px 0 4px; color: var(--text-muted); }
    input { width: 100%; padding: 10px 12px; border-radius: 4px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); font-size: .9rem; font-family: inherit; }
    input:focus { outline: none; border-color: var(--accent); }
    input[type="checkbox"] { width: auto; padding: 0; }
    button { width: 100%; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 18px; border-radius: 4px; border: 1px solid transparent; font-size: .9rem; font-weight: 600; cursor: pointer; margin-top: 14px; font-family: inherit; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 18px; border-radius: 4px; border: none; font-size: .85rem; font-weight: 500; cursor: pointer; font-family: inherit; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-outline:hover { border-color: var(--accent); color: var(--accent); }
    .err { display: none; color: var(--red); font-size: 12px; margin-top: 10px; word-break: break-word; }
    .hint { color: var(--text-muted); font-size: 11px; margin-top: 10px; line-height: 1.4; }
    .theme-controls { margin-left: auto; display: flex; align-items: center; gap: 10px; }
    .theme-emoji-btn { width: 38px; height: 38px; margin-top: 0; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface-2); color: var(--text); cursor: pointer; font-size: 1.1rem; line-height: 1; opacity: 0.55; transition: opacity 0.15s ease, border-color 0.15s ease, color 0.15s ease; }
    .theme-emoji-btn:hover { border-color: var(--accent); color: var(--accent); opacity: 1; }
    .theme-emoji-btn.active { opacity: 1; border-color: var(--accent); color: var(--accent); }
    .theme-switch { display: flex; align-items: center; margin: 0; cursor: pointer; }
    .theme-switch input { position: absolute; opacity: 0; width: 0; height: 0; }
    .switch-track { position: relative; width: 44px; height: 24px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); transition: background 0.2s ease; }
    .switch-thumb { position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: var(--text); transition: transform 0.2s ease, background 0.2s ease; }
    .theme-switch input:checked + .switch-track { background: var(--accent); border-color: var(--accent); }
    .theme-switch input:checked + .switch-track .switch-thumb { transform: translateX(20px); background: var(--surface); }
    .theme-controls.fixed { position: fixed; top: 16px; right: 16px; margin-left: 0; z-index: 100; }
    .hpe-footer { margin-top: 32px; padding-top: 18px; border-top: 1px solid var(--border); font-size: .78rem; color: var(--text-muted); text-align: center; }
