    </div>
    <script>
    (function () {
      var statusUrl = ${statusUrl};
      var errorBox = document.getElementById('error-box');
      var spinner = document.getElementById('spinner');
      var detail = document.getElementById('error-detail');
      var retryBtn = document.getElementById('retry');
      function showError(message) {
        spinner.style.display = 'none';
        detail.textContent = message || '';
        errorBox.style.display = 'block';
      }
      function check() {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', statusUrl, true);
        xhr.onload = function () {
          var state = null;
          try { state = JSON.parse(xhr.responseText); } catch (e) { state = null; }
          if (xhr.status !== 200 || !state) { setTimeout(check, 2000); return; }
          if (state.ready) { window.location.reload(); return; }
          if (state.failed) { showError(state.error); return; }
          setTimeout(check, 2000);
        };
        xhr.onerror = function () { setTimeout(check, 2000); };
        xhr.send();
      }
      retryBtn.addEventListener('click', function () {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', statusUrl + '?reset=retry', true);
        xhr.onload = function () { window.location.reload(); };
        xhr.onerror = function () { window.location.reload(); };
        xhr.send();
      });
      check();
    })();
    </script>
    <script>
    (function() {
      var themeLight = document.getElementById("themeLight");
      var themeDark = document.getElementById("themeDark");
      var themeSwitch = document.getElementById("themeSwitch");
      function applyTheme(theme) {
        document.documentElement.setAttribute("data-theme", theme);
        try { localStorage.setItem("theme", theme); } catch (e) {}
        themeSwitch.checked = theme === "dark";
        themeLight.classList.toggle("active", theme === "light");
        themeDark.classList.toggle("active", theme === "dark");
      }
      applyTheme(document.documentElement.getAttribute("data-theme") || "light");
      themeLight.addEventListener("click", function() { applyTheme("light"); });
      themeDark.addEventListener("click", function() { applyTheme("dark"); });
      themeSwitch.addEventListener("change", function() { applyTheme(themeSwitch.checked ? "dark" : "light"); });
    })();
    </script>
    <footer class="hpe-footer">Powered by HPE Private Cloud AI</footer>
    </body>
    </html>`
    }

    function serveSetupPage(response) {
      response.writeHead(200, {
        'content-type': 'text/html; charset=utf-8',
        'cache-control': 'no-store, no-cache, must-revalidate, max-age=0',
      })
      response.end(setupPageHtml())
    }

    function readJsonBody(request) {
      return new Promise((resolve, reject) => {
        const chunks = []
        request.on('data', (chunk) => chunks.push(chunk))
        request.on('end', () => {
          try {
            resolve(JSON.parse(Buffer.concat(chunks).toString('utf8') || '{}'))
          } catch (error) {
            reject(error)
          }
        })
        request.on('error', reject)
      })
    }

    function authPageHtml(identity) {
      const esc = (value) => String(value).replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]))
      const adminConfigured = !!(adminUsername && adminPassword)
      const strip = identity
        ? `<div class="card" style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;">
            <div style="font-size:13px;">Signed in as <b>${esc(identity)}</b></div>
            <div style="display:flex;gap:14px;">
              <a href="/__oc_start" style="color:var(--accent);">Open your environment</a>
              <a href="/__oc_logout" style="color:var(--text-muted);">Log out</a>
            </div>
          </div>`
        : ''
      return `<!DOCTYPE html>
