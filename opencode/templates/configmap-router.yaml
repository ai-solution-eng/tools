      </header>
      <div class="sub">Each user gets their own isolated workspace.</div>
      ${strip}
      <div class="card">
        <button id="sso" class="btn btn-outline" type="button">Continue with SSO</button>
        ${adminConfigured ? '<button id="admin-open" class="btn btn-outline" type="button" style="margin-top:10px;">Log in as admin</button>' : ''}
        <div class="err" id="sso-err"></div>
      </div>
      <div class="card">
        <h2>Use a local account</h2>
        <form id="form">
          <label for="username">Username</label>
          <input id="username" name="username" autocomplete="username" required>
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
          <label style="display:flex;align-items:center;gap:6px;margin-top:6px;"><input type="checkbox" id="show-pass" style="width:auto;"> show password</label>
          <button type="submit" id="submit-btn" class="btn btn-primary">Log in</button>
          <div class="err" id="err"></div>
        </form>
      </div>
    </div>
    ${adminConfigured ? `
    <div id="admin-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);align-items:center;justify-content:center;z-index:50;">
      <div class="card" style="width:100%;max-width:360px;margin:0;">
        <h2>Admin login</h2>
        <label for="admin-pass">Admin password</label>
        <input id="admin-pass" name="admin-pass" type="password" autocomplete="current-password">
        <label style="display:flex;align-items:center;gap:6px;margin-top:6px;"><input type="checkbox" id="admin-pass-show" style="width:auto;"> show password</label>
        <button type="button" id="admin-pass-btn" class="btn btn-primary">Log in as admin</button>
        <div class="err" id="admin-pass-err"></div>
      </div>
    </div>` : ''}
    <script>
    var err = document.getElementById('err');
    function show(msg) { err.style.display = 'block'; err.textContent = msg; }
    async function post(path, body) {
      var res = await fetch(path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
      if (res.redirected) { window.location = res.url; return; }
      var data = null; try { data = await res.json(); } catch (e) {}
      if (data && data.redirect) { window.location = data.redirect; return; }
      if (res.status >= 200 && res.status < 300) { window.location.reload(); return; }
      show((data && data.error) || ('Error ' + res.status));
    }
    var ssoErr = document.getElementById('sso-err');
    function showSso(msg) { ssoErr.style.display = 'block'; ssoErr.textContent = msg; }
    document.getElementById('sso').addEventListener('click', async function () {
      ssoErr.style.display = 'none';
      var btn = this;
      btn.disabled = true;
      try {
        var res = await fetch('/__oc_sso', { method: 'POST', headers: { 'content-type': 'application/json' }, body: '{}' });
        var data = null; try { data = await res.json(); } catch (e) {}
        if (data && data.redirect) { window.location = data.redirect; return; }
        showSso((data && data.error) || ('Error ' + res.status));
      } catch (e) { showSso('SSO login failed'); }
      finally { btn.disabled = false; }
    });
    ${adminConfigured ? `
    var adminModal = document.getElementById('admin-modal');
    function closeAdminModal() { adminModal.style.display = 'none'; }
    document.getElementById('admin-open').addEventListener('click', function () {
      document.getElementById('admin-pass').value = '';
      document.getElementById('admin-pass-show').checked = false;
      document.getElementById('admin-pass').type = 'password';
      document.getElementById('admin-pass-err').style.display = 'none';
      adminModal.style.display = 'flex';
      document.getElementById('admin-pass').focus();
    });
    document.getElementById('admin-pass-show').addEventListener('change', function () {
      document.getElementById('admin-pass').type = this.checked ? 'text' : 'password';
    });
    adminModal.addEventListener('click', function (e) { if (e.target === adminModal) closeAdminModal(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeAdminModal(); });
    document.getElementById('admin-pass-btn').addEventListener('click', async function () {
      var btn = this;
      var p = document.getElementById('admin-pass').value;
      var aerr = document.getElementById('admin-pass-err');
      aerr.style.display = 'none';
      if (!p) { aerr.style.display = 'block'; aerr.textContent = 'admin password required'; return; }
      btn.disabled = true;
      try {
        var res = await fetch('/__oc_admin_login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ password: p }) });
        var data = null; try { data = await res.json(); } catch (e2) {}
        if (data && data.redirect) { window.location = data.redirect; return; }
        aerr.style.display = 'block';
        aerr.textContent = (data && data.error) || ('Error ' + res.status);
      } catch (e3) { aerr.style.display = 'block'; aerr.textContent = 'admin login failed'; }
      finally { btn.disabled = false; }
    });` : ''}
    document.getElementById('submit-btn').addEventListener('click', function (e) {
      e.preventDefault();
      post('/__oc_login', { username: document.getElementById('username').value, password: document.getElementById('password').value });
    });
    document.getElementById('form').addEventListener('submit', function (e) { e.preventDefault(); });
    document.getElementById('show-pass').addEventListener('change', function () {
      document.getElementById('password').type = this.checked ? 'text' : 'password';
    });
    </script>
    <script>
    (function() {
      var themeLight = document.getElementById("themeLight");
      var themeDark = document.getElementById("themeDark");
      var themeSwitch = document.getElementById("themeSwitch");
      function applyTheme(theme) {
        document.documentElement.setAttribute("data-theme", theme);
        try { localStorage.setItem("theme", theme); } catch (e) {}
        themeSwitch.checked = theme === "dark";
        themeLight.classList.toggle("active", theme === "light");
        themeDark.classList.toggle("active", theme === "dark");
      }
      applyTheme(document.documentElement.getAttribute("data-theme") || "light");
      themeLight.addEventListener("click", function() { applyTheme("light"); });
      themeDark.addEventListener("click", function() { applyTheme("dark"); });
      themeSwitch.addEventListener("change", function() { applyTheme(themeSwitch.checked ? "dark" : "light"); });
    })();
    </script>
    <footer class="hpe-footer">Powered by HPE Private Cloud AI</footer>
    </body>
    </html>`
    }

    function serveAuthPage(response, identity) {
      response.writeHead(200, {
        'content-type': 'text/html; charset=utf-8',
        'cache-control': 'no-store, no-cache, must-revalidate, max-age=0',
      })
      response.end(authPageHtml(identity))
    }

    function redirectToPod(response, slug) {
      response.writeHead(302, { location: `/${slug}` })
      response.end()
    }

    // Shared body of a per-user prefixed request (readable and legacy URLs).
    // `prefix` is what the browser sees; it is stripped before the proxy hop
    // and passed to the pod as x-forwarded-prefix.
    async function serveUserPath(request, response, identity, prefix) {
      try {
        const environment = await resolveUserEnvironment(identity)
        if (setupUiEnabled) {
          if (!(await isEnvironmentReady(environment.names))) {
            startProvisionWatch(environment.names)
            serveSetupPage(response)
            return
          }
        } else {
          await provisionReady(environment.names)
        }
        const target = targetForUserPath(environment.names, stripSlugPrefix(request.url || '/', prefix), prefix)
        proxyRequest(request, response, target)
      } catch (error) {
        console.error('user path request handling failed', error)
        json(response, error.statusCode || 500, { error: error.message })
      }
    }

    function adminPageHtml() {
      return `<!DOCTYPE html>
    <html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenCode Admin</title>
    <style>
    :root { --bg: #0d1117; --bg-panel: #161b22; --border: #30363d; --text: #e6edf3; --text-muted: #7d8590; --accent: #2f81f7; --danger: #f85149; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; padding: 24px; }
    h1 { font-size: 20px; margin-bottom: 4px; }
    .sub { color: var(--text-muted); margin-bottom: 24px; }
    .card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 20px; max-width: 720px; }
    .card h2 { font-size: 15px; margin-bottom: 12px; }
    label { display: block; font-size: 12px; color: var(--text-muted); margin: 8px 0 4px; }
    input { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; font-size: 14px; }
    button { background: var(--accent); color: #fff; border: none; border-radius: 6px; padding: 8px 14px; font-size: 13px; font-weight: 600; cursor: pointer; margin-top: 12px; }
    button.danger { background: var(--danger); }
    .msg { display: none; margin-top: 10px; font-size: 12px; word-break: break-word; }
    .msg.err { color: var(--danger); }
    .msg.ok { color: #3fb950; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); font-size: 13px; }
    th { color: var(--text-muted); font-weight: 600; }
    .spinner { display:inline-block; width:12px; height:12px; border:2px solid var(--border); border-top-color: var(--accent); border-radius:50%; animation: spin .8s linear infinite; vertical-align:middle; margin-right:6px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .ready { color:#3fb950; font-weight:600; }
    .none-dot { color: var(--text-muted); }
    .empty { color: var(--text-muted); padding: 12px 0; }
    .badge { display:inline-block; padding:2px 8px; border-radius:10px; border:1px solid var(--border); font-size:11px; color: var(--text); }
    .badge.dim { color: var(--text-muted); }
    a.back { color: var(--accent); font-size: 12px; text-decoration: none; }
    </style>
    </head>
    <body>
    <a class="back" href="/">&larr; back to login</a>
    <span style="float:right;"><a class="back" href="/__oc_admin_logout">Log out</a></span>
    <h1>Admin</h1>
    <div class="sub">Create or delete user accounts.</div>

    <div class="card">
      <h2>Create user</h2>
      <label for="u">Username</label>
      <input id="u" autocomplete="off">
      <label for="p">Password</label>
      <input id="p" type="password">
      <label style="display:flex;align-items:center;gap:6px;margin-top:6px;"><input type="checkbox" id="p-show" style="width:auto;"> show password</label>
      <button id="create">Create user</button>
      <div class="msg" id="create-msg"></div>
    </div>

    <div class="card">
      <h2>Users</h2>
      <div id="list" class="empty">Loading&hellip;</div>
    </div>

    <div id="modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);align-items:center;justify-content:center;z-index:20;">
      <div class="card" style="max-width:380px;width:100%;">
        <h2 id="modal-title"></h2>
        <label id="modal-label" style="display:none;">New username</label>
        <input id="modal-username" type="text" style="display:none;">
        <label id="modal-pass-label" style="display:none;">New password</label>
        <input id="modal-pass" type="password" style="display:none;">
        <label id="modal-pass-show-wrap" style="display:none;align-items:center;gap:6px;margin-top:6px;"><input type="checkbox" id="modal-pass-show" style="width:auto;"> show password</label>
        <div class="msg err" id="modal-msg"></div>
        <button id="modal-ok">OK</button>
        <button id="modal-cancel">Cancel</button>
      </div>
    </div>

    <script>
    var listEl = document.getElementById('list');
    var pollTimer = null;
    var modalMode = null;
    var modalUser = null;
    function msg(id, text, ok) {
      var el = document.getElementById(id);
      el.style.display = 'block';
      el.className = 'msg ' + (ok ? 'ok' : 'err');
      el.textContent = text;
      if (ok) setTimeout(function () { el.style.display = 'none'; }, 2500);
    }
    async function api(path, method, body) {
      var res = await fetch(path, { method: method || 'GET', headers: { 'content-type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
      var data = null; try { data = await res.json(); } catch (e) {}
      if (res.status >= 400) throw new Error((data && data.error) || ('Error ' + res.status));
      return data;
    }
    function openModal(mode, username) {
      modalMode = mode;
      modalUser = username;
      var isReset = mode === 'reset';
      document.getElementById('modal-title').textContent = (isReset ? 'Reset password' : 'Rename') + ' for ' + username;
      document.getElementById('modal-msg').style.display = 'none';
      document.getElementById('modal-username').style.display = isReset ? 'none' : 'block';
      document.getElementById('modal-label').style.display = isReset ? 'none' : 'block';
      document.getElementById('modal-pass-label').style.display = isReset ? 'block' : 'none';
      document.getElementById('modal-pass').style.display = isReset ? 'block' : 'none';
      document.getElementById('modal-pass-show').checked = false;
      document.getElementById('modal-pass').type = 'password';
      document.getElementById('modal-pass-show-wrap').style.display = isReset ? 'flex' : 'none';
      document.getElementById('modal-username').value = '';
      document.getElementById('modal-pass').value = '';
      document.getElementById('modal').style.display = 'flex';
    }
    function closeModal() {
      document.getElementById('modal').style.display = 'none';
      modalMode = null;
      modalUser = null;
    }
    document.getElementById('modal-cancel').addEventListener('click', closeModal);
    document.getElementById('modal-pass-show').addEventListener('change', function () {
      document.getElementById('modal-pass').type = this.checked ? 'text' : 'password';
    });
    document.getElementById('modal-ok').addEventListener('click', async function () {
      if (!modalMode || !modalUser) return;
      var btn = document.getElementById('modal-ok');
      btn.disabled = true;
      try {
        if (modalMode === 'reset') {
          var pass = document.getElementById('modal-pass').value;
          if (!pass) throw new Error('password required');
          await api('/__oc_admin/api/reset-password', 'POST', { username: modalUser, password: pass });
        } else {
          var nu = document.getElementById('modal-username').value.trim();
          if (!nu) throw new Error('new username required');
          await api('/__oc_admin/api/rename', 'POST', { username: modalUser, newUsername: nu });
        }
        closeModal();
        await loadUsers();
      } catch (e) {
        var me = document.getElementById('modal-msg');
        me.style.display = 'block';
        me.textContent = e.message;
      } finally {
        btn.disabled = false;
      }
    });
    async function loadUsers() {
      try {
        var data = await api('/__oc_admin/api/users');
        var users = data.users || [];
        if (users.length === 0) {
          listEl.innerHTML = '<div class="empty">No users.</div>';
          syncPoll(users);
          return;
        }
        listEl.innerHTML = '<table><thead><tr><th>Username</th><th>Source</th><th>Slug</th><th>Namespace</th><th>Last login</th><th>Status</th><th></th></tr></thead><tbody>' +
          users.map(function (u) {
            var source = u.source === 'sso' ? '<span class="badge">SSO</span>'
              : u.source === 'unknown' ? '<span class="badge dim">?</span>'
              : '<span class="badge dim">local</span>';
            var lastLogin = u.lastLogin ? new Date(u.lastLogin).toLocaleString() : '&mdash;';
            var nameCell = u.username ? u.username : '<i style="color:var(--text-muted);">unidentified</i>';
            var actions = '';
            if (u.username) {
              actions += '<button data-act="open" data-slug="' + u.slug + '" style="padding:6px 10px;font-size:12px;margin-right:6px;">Open</button>';
            }
            if (u.username && u.source !== 'sso') {
              actions += '<button data-act="rename" data-u="' + u.username + '" style="padding:6px 10px;font-size:12px;margin-right:6px;">Rename</button>' +
                '<button data-act="reset" data-u="' + u.username + '" style="padding:6px 10px;font-size:12px;margin-right:6px;">Reset</button>';
            }
            if (u.username) {
              actions += '<button class="danger" data-act="delete" data-u="' + u.username + '" style="padding:6px 10px;font-size:12px;">Delete</button>';
            } else {
              actions += '<button class="danger" data-act="delete" data-slug="' + u.slug + '" style="padding:6px 10px;font-size:12px;">Delete</button>';
            }
            var nsCell = u.namespace && u.namespace !== '' ? '<code>' + u.namespace + '</code>' : '&mdash;';
            return '<tr><td>' + nameCell + '</td><td>' + source + '</td><td><code>' + u.slug + '</code></td><td>' + nsCell + '</td><td>' + lastLogin + '</td><td>' + statusHtml(u) + '</td>' +
              '<td style="white-space:nowrap;">' + actions + '</td></tr>';
          }).join('') + '</tbody></table>';
        syncPoll(users);
        listEl.querySelectorAll('button[data-act]').forEach(function (b) {
          b.addEventListener('click', async function () {
            var u = b.getAttribute('data-u');
            var slug = b.getAttribute('data-slug');
            var act = b.getAttribute('data-act');
            if (act === 'open') { window.location.href = '/' + slug; return; }
            if (act === 'rename') { openModal('rename', u); return; }
            if (act === 'reset') { openModal('reset', u); return; }
            b.disabled = true;
            b.innerHTML = '&hellip;';
            try { await api('/__oc_admin/api/delete', 'POST', slug ? { slug: slug } : { username: u }); } catch (e) { alert(e.message); }
            await loadUsers();
          });
        });
      } catch (e) {
        listEl.innerHTML = '<div class="empty">' + e.message + '</div>';
      }
    }
    function statusHtml(u) {
      if (u.ready) return '<span class="ready">&#10003; ready</span>';
      if (u.exists) return '<span class="spinner"></span>creating&hellip;';
      return '<span class="none-dot">&mdash;</span>';
    }
    function syncPoll(users) {
      var anyCreating = users.some(function (u) { return u.exists && !u.ready; });
      if (anyCreating && !pollTimer) pollTimer = setInterval(loadUsers, 4000);
      else if (!anyCreating && pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    }
    document.getElementById('p-show').addEventListener('change', function () {
      document.getElementById('p').type = this.checked ? 'text' : 'password';
    });
    document.getElementById('create').addEventListener('click', async function () {
      var btn = document.getElementById('create');
      var u = document.getElementById('u').value.trim();
      var p = document.getElementById('p').value;
      if (!u || !p) { msg('create-msg', 'username and password required', false); return; }
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Creating&hellip;';
      try {
        await api('/__oc_admin/api/create', 'POST', { username: u, password: p });
        msg('create-msg', 'created ' + u, true);
        document.getElementById('u').value = '';
        document.getElementById('p').value = '';
        document.getElementById('p-show').checked = false;
        document.getElementById('p').type = 'password';
        await loadUsers();
      } catch (e) {
        msg('create-msg', e.message, false);
      } finally {
        btn.disabled = false;
        btn.innerHTML = 'Create user';
      }
    });
    loadUsers();
    </script>
    </body>
    </html>`
    }

    function serveAdminPage(response) {
      response.writeHead(200, {
        'content-type': 'text/html; charset=utf-8',
        'cache-control': 'no-store, no-cache, must-revalidate, max-age=0',
      })
      response.end(adminPageHtml())
    }

    const server = http.createServer(async (request, response) => {
      const url = new URL(request.url || '/', 'http://internal')
      const pathname = url.pathname
      const method = request.method || 'GET'

      if (pathname === '/healthz') {
        json(response, 200, { ok: true })
        return
      }

      if (pathname === '/__oc_login' && method === 'POST') {
        const body = await readJsonBody(request).catch(() => null)
        const identity = (body?.username || '').trim().toLowerCase()
        const password = body?.password || ''
        if (!identity || !password) {
          json(response, 400, { error: 'username and password are required' })
          return
        }
        if (!(await verifyUser(identity, password))) {
          json(response, 401, { error: 'invalid username or password' })
          return
        }
        jsonWithCookie(response, 200, { ok: true, redirect: '/__oc_start' }, sessionCookieHeader(identity, false))
        return
      }

      if (pathname === '/__oc_register' && method === 'POST') {
        const body = await readJsonBody(request).catch(() => null)
        const identity = (body?.username || '').trim().toLowerCase()
        const password = body?.password || ''
        if (!/^[a-z0-9._-]{3,64}$/.test(identity)) {
          json(response, 400, { error: 'username must be 3-64 chars (lowercase letters, digits, . _ -)' })
          return
        }
        if (password.length < 6) {
          json(response, 400, { error: 'password must be at least 6 characters' })
          return
        }
        try {
          await registerUser(identity, password)
        } catch (error) {
          json(response, error.statusCode || 500, { error: error.message })
          return
        }
        jsonWithCookie(response, 200, { ok: true, redirect: '/__oc_start' }, sessionCookieHeader(identity, false))
        return
      }

      if (pathname === '/__oc_sso' && method === 'POST') {
        const ssoIdentity = (userFromHeaders(request.headers) || '').trim().toLowerCase()
        if (!ssoIdentity) {
          console.log('[auth] /__oc_sso rejected: no SSO identity headers present')
          json(response, 401, { error: 'not authenticated via SSO' })
          return
        }
        await trackSsoIdentity(ssoIdentity)
        console.log(`[auth] sso login slug=${slugForUser(ssoIdentity)}`)
        // Explicit SSO login clears the logout suppress marker.
        jsonWithCookie(response, 200, { ok: true, redirect: '/__oc_start' }, [
          sessionCookieHeader(ssoIdentity, false),
          ssoLogoutMarkerCookie(false),
        ])
        return
      }

      if (pathname === '/__oc_logout' && (method === 'GET' || method === 'POST')) {
        response.writeHead(302, {
          location: '/',
          'set-cookie': [
            sessionCookieHeader('', true),
            ssoLogoutMarkerCookie(true),
          ],
        })
        response.end()
        return
      }

      // Admin console (basic-auth gated)
      if (pathname === '/__oc_admin_login' && method === 'POST') {
        if (!adminUsername || !adminPassword) {
          json(response, 401, { error: 'admin login is not configured' })
          return
        }
        const body = await readJsonBody(request).catch(() => null)
        // The login page's password-only admin popup sends no username; the
        // expected admin username lives server-side. An explicitly provided
        // username must still match.
        const u = (body?.username || adminUsername).trim()
        const p = body?.password || ''
        if (u === adminUsername && p === adminPassword) {
          jsonWithCookie(response, 200, { ok: true, redirect: '/__oc_admin' }, adminSessionCookieHeader())
          return
        }
        json(response, 401, { error: 'invalid admin credentials' })
        return
      }
      if (pathname === '/__oc_admin_logout' && (method === 'GET' || method === 'POST')) {
        response.writeHead(302, { location: '/', 'set-cookie': [clearAdminCookieHeader()] })
        response.end()
        return
      }
      if (pathname === '/__oc_admin' && method === 'GET') {
        if (!isAdmin(request)) {
          response.writeHead(401, { 'www-authenticate': 'Basic realm="opencode-admin"' })
          response.end()
          return
        }
        serveAdminPage(response)
        return
      }
      if (pathname === '/__oc_admin/api/users' && method === 'GET') {
        if (!isAdmin(request)) {
          json(response, 401, { error: 'unauthorized' })
          return
        }
        const users = await loadUserRegistry()
        const deployments = await listUserDeployments()
        const list = await Promise.all(Object.keys(users).map(async (username) => {
          const record = users[username] || {}
          const slug = slugForUser(username)
          const legacy = legacySlugForUser(username)
          let dep = null
          let unitNs = namespace
          if (record.unitNs && record.unitNs !== namespace) {
            // Platform unit — lives in the user's project namespace, look it
            // up there directly.
            unitNs = record.unitNs
            dep = await k8sRequest('GET', `/apis/apps/v1/namespaces/${unitNs}/deployments/${namesForSlug(slug, unitNs).deployment}`).catch(() => null)
          } else {
            dep = deployments.find((d) => {
              const labels = d.metadata?.labels || {}
              return labels['opencode-user-slug'] === slug
                || (labels['opencode-user-warmpool'] === 'true'
                  && (labels['opencode-user-owner'] === slug || labels['opencode-user-owner'] === legacy))
            }) || null
          }
          return {
            username,
            slug,
            source: record.sso ? 'sso' : 'local',
            lastLogin: record.lastLogin || null,
            namespace: unitNs,
            exists: !!dep,
            ready: !!dep && (dep.status?.readyReplicas || 0) >= 1,
          }
        }))
        // Merge environments that belong to no registry user (e.g. SSO users
        // who signed in before identity tracking existed). The identity behind
        // the slug is a one-way hash, so only the slug can be shown; these
        // rows can still be deleted by slug.
        const knownSlugs = new Set(list.map((u) => u.slug))
        // A user's pre-readable-slug environment still carries the legacy hash
        // as its owner until their first post-upgrade login migrates it — do
        // not list it as an unknown row in the meantime.
        for (const username of Object.keys(users)) knownSlugs.add(legacySlugForUser(username))
        for (const d of deployments) {
          const labels = d.metadata?.labels || {}
          const slug = labels['opencode-user-warmpool'] === 'true'
            ? labels['opencode-user-owner']
            : labels['opencode-user-slug']
          if (!slug || knownSlugs.has(slug)) continue
          knownSlugs.add(slug)
          list.push({
            username: null,
            slug,
            source: 'unknown',
            lastLogin: null,
            exists: true,
            ready: (d.status?.readyReplicas || 0) >= 1,
          })
        }
        json(response, 200, { users: list })
        return
      }
      if (pathname === '/__oc_admin/api/create' && method === 'POST') {
        if (!isAdmin(request)) {
          json(response, 401, { error: 'unauthorized' })
          return
        }
        const body = await readJsonBody(request).catch(() => null)
        const identity = (body?.username || '').trim().toLowerCase()
        const password = body?.password || ''
        if (!/^[a-z0-9._-]{3,64}$/.test(identity)) {
          json(response, 400, { error: 'username must be 3-64 chars (lowercase letters, digits, . _ -)' })
          return
        }
        if (password.length < 6) {
          json(response, 400, { error: 'password must be at least 6 characters' })
          return
        }
        try {
          await registerUser(identity, password)
        } catch (error) {
          json(response, error.statusCode || 500, { error: error.message })
          return
        }
        try {
          // Provision the pod immediately so the account is "ready" up front.
          await resolveUserEnvironment(identity)
        } catch (error) {
          console.error('admin create provisioning failed', error)
        }
        json(response, 200, { ok: true, username: identity })
        return
      }
      if (pathname === '/__oc_admin/api/delete' && method === 'POST') {
        if (!isAdmin(request)) {
          json(response, 401, { error: 'unauthorized' })
          return
        }
        const body = await readJsonBody(request).catch(() => null)
        const identity = (body?.username || '').trim().toLowerCase()
        const slug = (body?.slug || '').trim().toLowerCase() || (identity ? slugForUser(identity) : '')
        if (!slug) {
          json(response, 400, { error: 'username or slug is required' })
          return
        }
        try {
          await deleteUserEnvironment(slug, identity ? legacySlugForUser(identity) : undefined)
          if (identity) {
            const users = await loadUserRegistry()
            if (users[identity]) {
              delete users[identity]
              await saveUserRegistry(users)
            }
          }
          json(response, 200, { ok: true, username: identity || slug })
        } catch (error) {
          console.error('admin delete failed', error)
          json(response, 500, { error: error.message })
        }
        return
      }
      if (pathname === '/__oc_admin/api/reset-password' && method === 'POST') {
        if (!isAdmin(request)) {
          json(response, 401, { error: 'unauthorized' })
          return
        }
        const body = await readJsonBody(request).catch(() => null)
        const identity = (body?.username || '').trim().toLowerCase()
        const password = body?.password || ''
        const users = await loadUserRegistry()
        if (!users[identity]) {
          json(response, 404, { error: 'user not found' })
          return
        }
        if (password.length < 6) {
          json(response, 400, { error: 'password must be at least 6 characters' })
          return
        }
        const salt = crypto.randomBytes(16).toString('hex')
        users[identity] = { ...users[identity], salt, hash: hashPassword(password, salt), updatedAt: new Date().toISOString() }
        await saveUserRegistry(users)
        json(response, 200, { ok: true, username: identity })
        return
      }
      if (pathname === '/__oc_admin/api/rename' && method === 'POST') {
        if (!isAdmin(request)) {
          json(response, 401, { error: 'unauthorized' })
          return
        }
        const body = await readJsonBody(request).catch(() => null)
        const oldName = (body?.username || '').trim().toLowerCase()
        const newName = (body?.newUsername || '').trim().toLowerCase()
        if (oldName === newName) {
          json(response, 400, { error: 'new username is the same as the current one' })
          return
        }
        if (!/^[a-z0-9._-]{3,64}$/.test(newName)) {
          json(response, 400, { error: 'new username must be 3-64 chars (lowercase letters, digits, . _ -)' })
          return
        }
        const users = await loadUserRegistry()
        if (!users[oldName]) {
          json(response, 404, { error: 'user not found' })
          return
        }
        if (users[newName]) {
          json(response, 409, { error: 'username already exists' })
          return
        }
        users[newName] = users[oldName]
        delete users[oldName]
        await saveUserRegistry(users)
        try {
          await resolveUserEnvironment(newName)
        } catch (error) {
          console.error('admin rename provision failed', error)
        }
        try {
          await deleteUserEnvironment(slugForUser(oldName), legacySlugForUser(oldName))
        } catch (error) {
          console.error('admin rename cleanup failed', error)
        }
        json(response, 200, { ok: true, username: newName })
        return
      }
      if (pathname === '/__oc_admin/api/sessions/clear' && method === 'POST') {
        if (!isAdmin(request)) {
          json(response, 401, { error: 'unauthorized' })
          return
        }
        const body = await readJsonBody(request).catch(() => ({}))
        const username = (body?.username || '').trim().toLowerCase()
        const users = await loadUserRegistry()
        let targets = []
        if (username) {
          if (!users[username]) {
            json(response, 404, { error: 'user not found' })
            return
          }
          targets = [username]
        } else {
          // No username (or {all: true}): clear every registry user.
          targets = Object.keys(users)
        }
        if (targets.length === 0) {
          json(response, 200, { ok: true, results: [] })
          return
        }
        console.log(`[admin] clearing opencode chat history for ${targets.length} user(s)`)
        const snapshot = await fetchEnvironmentSnapshot()
        const results = []
        const concurrency = 5
        let cursor = 0
        async function clearWorker() {
          while (cursor < targets.length) {
            const name = targets[cursor++]
            try {
              results.push(await clearUserConversations(name, snapshot))
            } catch (error) {
              results.push({ username: name, slug: slugForUser(name), status: `failed: ${error.message}` })
            }
          }
        }
        await Promise.all(Array.from({ length: Math.min(concurrency, targets.length) }, clearWorker))
        json(response, 200, { ok: true, results })
        return
      }

      if (setupUiEnabled && pathname === setupStatusPath) {
        await handleSetupStatus(request, response)
        return
      }

      // Provisioning entry point: after login/register/sso. Ensures the user's
      // pod, shows the loading page while it comes up, then redirects to the pod.
      if (pathname === '/__oc_start') {
        const identity = readSessionIdentity(request)
        if (!identity) {
          console.log('[auth] /__oc_start without a valid session, redirecting to /')
          response.writeHead(302, { location: '/' })
          response.end()
          return
        }
        try {
          const environment = await resolveUserEnvironment(identity)
          if (setupUiEnabled) {
            if (!(await isEnvironmentReady(environment.names))) {
              startProvisionWatch(environment.names)
              serveSetupPage(response)
              return
            }
          } else {
            await provisionReady(environment.names)
          }
          redirectToPod(response, slugForUser(identity))
        } catch (error) {
          console.error('start request handling failed', error)
          json(response, error.statusCode || 500, { error: error.message })
        }
        return
      }

      // Path-based per-user routing -> that user's pod nginx (:8082). Two URL
      // forms are served, both only for the signed-in user's own slug:
      //   /{username-slug}/...  readable slug, e.g. /francesco-caliva/
      //   /u-{12-hex}/...       legacy one-way-hash slug (older bookmarks)
      const legacyPathMatch = pathname.match(/^\/u-([a-f0-9]{12})(\/.*)?$/)
      if (legacyPathMatch) {
        const pathSlug = legacyPathMatch[1]
        const identity = readSessionIdentity(request)
        if (!identity || legacySlugForUser(identity) !== pathSlug) {
          response.writeHead(302, { location: '/' })
          response.end()
          return
        }
        await serveUserPath(request, response, identity, `/u-${pathSlug}`)
        return
      }
      const userPathMatch = pathname.match(/^\/([a-z0-9][a-z0-9-]{0,53})(\/.*)?$/)
      if (userPathMatch) {
        const pathSlug = userPathMatch[1]
        const identity = readSessionIdentity(request)
        if (identity && slugForUser(identity) === pathSlug) {
          await serveUserPath(request, response, identity, `/${pathSlug}`)
          return
        }
        // Not this user's slug (or no session): fall through to the session
        // passthrough / login page below — a single-segment match must never
        // swallow root-relative in-pod app paths (/terminal, /data-manager…).
      }

      // Session-keyed passthrough: any other path on the main host is served to the
      // signed-in user's pod so in-pod apps that emit root-relative URLs (openchamber,
      // data manager, terminal) keep working without a /{slug}/ prefix.
      const sessionIdentity = readSessionIdentity(request)
      if (sessionIdentity && pathname !== '/') {
        try {
          const environment = await resolveUserEnvironment(sessionIdentity)
          // Deep links with a valid session must also see the loading screen
          // instead of a connection error while the pod is still coming up.
          if (setupUiEnabled && !(await isEnvironmentReady(environment.names))) {
            startProvisionWatch(environment.names)
            serveSetupPage(response)
            return
          }
          const target = targetForPassthrough(environment.names, request.url || '/')
          proxyRequest(request, response, target)
        } catch (error) {
          console.error('session passthrough failed', error)
          json(response, error.statusCode || 500, { error: error.message })
        }
        return
      }

      // Main host presents the login/account page (with an "Open your
      // environment / Log out" strip when a session already exists). When the
      // request arrives already authenticated through the platform SSO
      // (x-auth-request headers injected by the gateway) and no local session
      // exists yet, sign the user in automatically: a portal deep-link then
      // lands in the normal provisioning flow instead of requiring a second
      // click on "Continue with SSO". /__oc_logout plants a suppress marker so
      // users who explicitly log out are not bounced straight back in.
      if (!sessionIdentity && pathname === '/' && method === 'GET') {
        const headerIdentity = userFromHeaders(request.headers)
        if (headerIdentity) {
          const cookieHeader = request.headers.cookie || ''
          const suppressed = cookieHeader.split(';').some((part) => part.trim() === `${ssoLogoutMarkerName}=1`)
          if (!suppressed) {
            const identity = headerIdentity.trim().toLowerCase()
            console.log(`[auth] auto-sso login slug=${slugForUser(identity)}`)
            await trackSsoIdentity(identity)
            response.writeHead(302, {
              location: '/__oc_start',
              'set-cookie': [
                sessionCookieHeader(identity, false),
                ssoLogoutMarkerCookie(false),
              ],
            })
            response.end()
            return
          }
        }
      }
      serveAuthPage(response, sessionIdentity)
    })

    // WebSocket upgrades for /{slug}/... and legacy /u-{hash}/... (terminal,
    // ttyd, preview sockets).
    server.on('upgrade', async (request, socket, head) => {
      const pathname = new URL(request.url || '/', 'http://internal').pathname
      const legacyMatch = pathname.match(/^\/u-([a-f0-9]{12})(\/.*)?$/)
      const readableMatch = !legacyMatch && pathname.match(/^\/([a-z0-9][a-z0-9-]{0,53})(\/.*)?$/)
      const reject = (status, message) => {
        socket.write(`HTTP/1.1 ${status} ${message}\r\n\r\n`)
        socket.destroy()
      }
      if (!legacyMatch && !readableMatch) {
        // Root-relative WebSocket from an in-pod app: route to the signed-in user's pod.
        const identity = readSessionIdentity(request)
        if (!identity) {
          reject(401, 'Unauthorized')
          return
        }
        try {
          const environment = await resolveUserEnvironment(identity)
          proxyUpgrade(request, socket, head, targetForPassthrough(environment.names, request.url || '/'))
        } catch (error) {
          console.error('session passthrough upgrade failed', error)
          reject(502, 'Bad Gateway')
        }
        return
      }
      const pathSlug = legacyMatch ? legacyMatch[1] : readableMatch[1]
      const prefix = legacyMatch ? `/u-${pathSlug}` : `/${pathSlug}`
      const identity = readSessionIdentity(request)
      const expectedSlug = !identity
        ? null
        : (legacyMatch ? legacySlugForUser(identity) : slugForUser(identity))
      if (!identity || expectedSlug !== pathSlug) {
        // A readable slug that is not this user's must not be rejected
        // outright: root-relative in-pod app sockets (e.g. /pty/...) would be
        // swallowed by the single-segment match. Only the strict legacy hash
        // route rejects.
        if (legacyMatch || !identity) {
          reject(401, 'Unauthorized')
          return
        }
        try {
          const environment = await resolveUserEnvironment(identity)
          proxyUpgrade(request, socket, head, targetForPassthrough(environment.names, request.url || '/'))
        } catch (error) {
          console.error('session passthrough upgrade failed', error)
          reject(502, 'Bad Gateway')
        }
        return
      }
      try {
        const environment = await resolveUserEnvironment(identity)
        const target = targetForUserPath(environment.names, stripSlugPrefix(request.url || '/', prefix), prefix)
        proxyUpgrade(request, socket, head, target)
      } catch (error) {
        console.error('user path upgrade failed', error)
        reject(502, 'Bad Gateway')
      }
    })

    server.listen(8080, '0.0.0.0', () => {
      console.log('opencode router listening on 0.0.0.0:8080')
    })

    recoverOwnerPool()
    reconcilePool()
    setInterval(sweepStaleClearJobs, 60000)
    if (warmPoolEnabled && warmPoolSize > 0) {
      setInterval(reconcilePool, warmRefreshIntervalMs)
    }
