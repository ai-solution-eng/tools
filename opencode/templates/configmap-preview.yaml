    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header, .hpe-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      margin-bottom: 0;
    }
    .hpe-header-left { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
    .hpe-brand { display: flex; flex-direction: column; }
    .hpe-brand-name { font-size: 0.7rem; font-weight: 500; color: var(--text-muted); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 1px; }
    .hpe-brand-title { font-size: 1.3rem; font-weight: 600; color: var(--text); }
    .hpe-brand-sub { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }
    header .spacer { flex: 1; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
      text-decoration: none;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .btn:hover { border-color: var(--accent); color: var(--accent); }
    .btn:active { background: var(--bg-active); }
    .theme-controls { margin-left: auto; display: flex; align-items: center; gap: 10px; }
    .theme-emoji-btn { width: 38px; height: 38px; margin-top: 0; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface-2); color: var(--text); cursor: pointer; font-size: 1.1rem; line-height: 1; opacity: 0.55; transition: opacity 0.15s ease, border-color 0.15s ease, color 0.15s ease; }
    .theme-emoji-btn:hover { border-color: var(--accent); color: var(--accent); opacity: 1; }
    .theme-emoji-btn.active { opacity: 1; border-color: var(--accent); color: var(--accent); }
    .theme-switch { display: flex; align-items: center; margin: 0; cursor: pointer; }
    .theme-switch input { position: absolute; opacity: 0; width: 0; height: 0; }
    .switch-track { position: relative; width: 44px; height: 24px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); transition: background 0.2s ease; }
    .switch-thumb { position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: var(--text); transition: transform 0.2s ease, background 0.2s ease; }
    .theme-switch input:checked + .switch-track { background: var(--accent); border-color: var(--accent); }
    .theme-switch input:checked + .switch-track .switch-thumb { transform: translateX(20px); background: var(--surface); }
    
    /* Tab bar */
    .tabbar-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 10px;
      height: 40px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex: 0 0 auto;
    }
    .tabbar-row h1 {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      padding-right: 8px;
      border-right: 1px solid var(--border);
      margin-right: 4px;
      white-space: nowrap;
    }
    #tabbar {
      display: flex;
      align-items: center;
      gap: 4px;
      overflow-x: auto;
      flex: 1 1 auto;
    }
    .tab {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 0 10px;
      height: 28px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
    }
    .tab.active {
      background: var(--accent-soft);
      border-color: var(--accent);
    }
    .tab .title {
      max-width: 180px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tab .close {
      color: var(--text-muted);
      font-weight: 700;
      padding: 0 2px;
      border-radius: 4px;
    }
    .tab .close:hover { color: var(--red); background: rgba(220, 38, 38, 0.12); }
    .add {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      cursor: pointer;
      font-size: 18px;
      font-weight: 600;
    }
    .add:hover { background: var(--surface-2); border-color: var(--accent); color: var(--accent); }
    #panes { flex: 1 1 auto; position: relative; }
    .pane { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: none; }
    .pane.active { display: block; }
    
    /* Footer */
    .hpe-footer { margin-top: 0; padding-top: 0; border-top: none; font-size: .78rem; color: var(--text-muted); text-align: center; }
    .app-footer { padding: 6px 16px; border-top: 1px solid var(--border); flex-shrink: 0; }
    </style>
    </head>
