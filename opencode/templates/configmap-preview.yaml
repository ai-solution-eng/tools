      let cur = null
      let i = start
      // A blank line that merely ENDS the list must not make its last item loose.
      const trimTrailingBlank = (item) => {
        while (item && item.lines.length && blank(item.lines[item.lines.length - 1])) item.lines.pop()
      }
      const blank = (l) => l === undefined || /^[ \t]*$/.test(l)
    
      while (i < lines.length) {
        const line = lines[i]
        if (blank(line)) {
