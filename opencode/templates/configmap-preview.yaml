        const m = MD_LIST.exec(line)
        if (m && m[1].length === indent) {
          if (kindOf(m[2]) !== listKind) { trimTrailingBlank(cur); break }
          cur = { lines: [m[3]], marker: m[2] }
          items.push(cur)
          i += 1
          continue
        }
        if (m && m[1].length < indent) break            // back out to the parent list
        if (!cur) break
        if (/^ {2,}/.test(line) || !m) {
          // Continuation or nested block: strip the item's content indent.
          cur.lines.push(line.replace(stripIndent, ''))
          i += 1
          continue
        }
        break
      }
    
      trimTrailingBlank(cur)
      let html = ordered ? '<ol>' : '<ul>'
      for (const item of items) {
        const body = item.lines.slice()
        let task = ''
        if (body.length && MD_TASK.test(body[0])) {
          const checked = /^\[[xX]\]/.test(body[0])
          task = '<input type="checkbox" disabled' + (checked ? ' checked' : '') + '> '
          body[0] = body[0].replace(MD_TASK, '')
        }
        const isTight = body.every((l) => !blank(l))
        // Past the nesting cap, stop recursing and keep the text inline.
        let inner = d >= MD_MAX_DEPTH
          ? '<p>' + mdInline(body.join(' '), ctx) + '</p>'
          : mdBlocks(body, ctx, d + 1)
        // A tight list item's paragraphs render without the <p> wrapper, like every
        // other markdown engine, so list lines stay visually compact — including
        // when the item's first paragraph is followed by a nested list.
        if (isTight && inner.startsWith('<p>')) {
          const end = inner.indexOf('</p>')
          if (end > 0) inner = (inner.slice(3, end) + inner.slice(end + 4)).replace(/\n(?=<)/, '')
        }
        html += '<li>' + task + inner + '</li>'
      }
      html += ordered ? '</ol>' : '</ul>'
      return { html, next: i }
    }
    
    function mdRender(src, ctx) {
      const text = mdEscText(String(src).replace(/\u0000/g, '').replace(/\r\n?/g, '\n'))
      return mdBlocks(text.split('\n'), ctx || { baseDir: '' })
    }
    
    // ─── Document preview page (/api/preview) ──────────────────────────────────
    // Served for .md (rendered here) and .html (streamed verbatim). Both responses
    // carry a CSP \`sandbox\` so the document is an opaque origin: no script can run,
    // it cannot reach the parent frame's DOM/storage, and forms/top-level
    // navigation are blocked. The client additionally sets sandbox="" on the
    // iframe, so the isolation does not depend on this header surviving a proxy.
    const DOC_MD_EXT = new Set(['md', 'markdown', 'mdown', 'mkd'])
    const DOC_HTML_EXT = new Set(['html', 'htm'])
    // Markdown is OUR escaped output, so remote https images (README badges) are
    // allowed. A raw .html file is untrusted, so it may load nothing remote at all:
    // no beacon, no exfil, no third-party script even if the sandbox were bypassed.
    // NOTE the missing 'sandbox' directive: a rendered .md keeps its REAL origin.
    // A sandboxed (opaque-origin) document makes every link clicked inside it a
    // cross-site navigation, so SameSite=Lax cookies (the platform SSO cookie and
    // the unit's own session cookie) are dropped and the click lands on the
    // ingress without a session — the user sees 403 / a login page while the
    // initial preview (a parent-initiated navigation, same-site) renders fine.
    // Same-origin is safe here because the markdown page cannot execute script:
    // the source is HTML-escaped before any parsing, every tag is written by
    // this file, and default-src 'none' blocks scripts outright.
    // Raw .html previews keep the full sandbox (see HTML_PREVIEW_CSP).
    const MD_PREVIEW_CSP = "default-src 'none'; img-src 'self' data: https:; media-src 'self' https:; style-src 'unsafe-inline'; font-src data:; base-uri 'none'; frame-ancestors 'self'"
    const HTML_PREVIEW_CSP = "sandbox; default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; font-src data:; base-uri 'none'; frame-ancestors 'self'"
    
    const MD_PAGE_CSS = [
      ':root{color-scheme:light dark;--bg:#ffffff;--fg:#1f2937;--muted:#6b7280;--bd:#d1d5db;--code:#f3f4f6;--link:#2563eb;--quote:#e5e7eb}',
      'html[data-theme="dark"]{--bg:#0f1117;--fg:#e0e4ed;--muted:#8891a8;--bd:#2a3142;--code:#171a22;--link:#7aa2f7;--quote:#2a3142}',
      'html,body{margin:0;padding:0;background:var(--bg);color:var(--fg)}',
      'body{font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}',
      '.md{max-width:980px;margin:0 auto;padding:24px 28px 48px}',
      '.md h1,.md h2,.md h3,.md h4,.md h5,.md h6{line-height:1.25;margin:1.6em 0 .6em;font-weight:600}',
      '.md h1{font-size:1.9em;border-bottom:1px solid var(--bd);padding-bottom:.3em}',
      '.md h2{font-size:1.45em;border-bottom:1px solid var(--bd);padding-bottom:.25em}',
      '.md h3{font-size:1.2em}.md h4{font-size:1.05em}',
      '.md p{margin:.75em 0}',
      '.md a{color:var(--link);text-decoration:none}.md a:hover{text-decoration:underline}',
      // "up" affordance: a rendered page opened FROM another page carries a link
      // back to it, so walking into a folder tree is reversible without the
      // browser's back button (and without any script — the CSP has none).
      '.md-back{margin:0 0 4px;font-size:.86em}',
      '.md-back a{display:inline-block;padding:3px 9px;border:1px solid var(--bd);border-radius:999px;color:var(--muted);background:var(--code)}',
      '.md-back a:hover{color:var(--link);border-color:var(--link);text-decoration:none}',
      '.md code{background:var(--code);border-radius:4px;padding:.15em .4em;font-size:.9em;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}',
      '.md pre.md-pre{background:var(--code);border:1px solid var(--bd);border-radius:8px;padding:14px 16px;overflow:auto}',
      '.md pre.md-pre code{background:none;padding:0;font-size:.88em}',
      '.md blockquote{margin:.9em 0;padding:.1em 0 .1em 1em;border-left:3px solid var(--quote);color:var(--muted)}',
      '.md ul,.md ol{padding-left:1.6em;margin:.6em 0}.md li{margin:.25em 0}',
      '.md li>ul,.md li>ol{margin:.25em 0}',
      '.md input[type=checkbox]{margin-right:.45em}',
      '.md hr{border:0;border-top:1px solid var(--bd);margin:1.6em 0}',
      '.md img{max-width:100%;height:auto}',
      '.md-table-wrap{overflow-x:auto;margin:1em 0}',
      '.md table{border-collapse:collapse;font-size:.94em}',
      '.md th,.md td{border:1px solid var(--bd);padding:6px 12px}',
      '.md th{background:var(--code);font-weight:600}',
      '.md .md-notice{padding:18px;border:1px solid var(--bd);border-radius:8px;color:var(--muted)}',
    ].join('\n')
    
    // The trail of pages you clicked through to get here, nearest ancestor first.
    // Each entry is URI-encoded and joined with '|', which encodeURIComponent
    // escapes — so a path can never forge a separator, and a comma or a pipe in a
    // real filename is harmless.
    const MD_TRAIL_MAX = 8
    
    function parseTrail(raw) {
      if (typeof raw !== 'string' || !raw) return []
      const out = []
      for (const part of raw.split('|').slice(0, MD_TRAIL_MAX)) {
        if (!part) continue
        try {
          out.push(decodeURIComponent(part))
        } catch {
          // a malformed entry is simply dropped: the trail is a convenience,
          // never a capability
        }
      }
      return out
    }
    
    function trailParam(trail) {
      return trail.map((p) => encodeURIComponent(p)).join('|')
    }
    
    // "back to <page>" — only ever a path that passed resolveSafe() and only ever
    // another previewable document, so the bar can never be turned into a link
    // to somewhere the workspace clamp would refuse. Walking back one level at a
    // time works at any depth because each page hands its own ancestors on.
    async function backBar(fromParam, currentPath, theme) {
      const trail = parseTrail(fromParam)
      if (trail.length === 0) return ''
      const parent = await resolveSafe(trail[0])
      if (!parent || parent === currentPath) return ''
      const ext = path.extname(parent).slice(1).toLowerCase()
      if (!DOC_MD_EXT.has(ext) && !DOC_HTML_EXT.has(ext)) return ''
      const rest = trail.slice(1)
      let href = BASE + '/api/preview?path=' + encodeURIComponent(parent) +
        '&amp;theme=' + (theme === 'dark' ? 'dark' : 'light')
      if (rest.length) href += '&amp;from=' + trailParam(rest)
      return '<div class="md-back"><a href="' + href + '" title="' + mdEscText(parent) + '">\u2190 ' +
        mdEscText(path.basename(parent)) + '</a></div>\n'
    }
    
    function mdPage(title, body, theme) {
      const t = theme === 'dark' ? 'dark' : 'light'
      return '<!DOCTYPE html>\n<html lang="en" data-theme="' + t + '">\n<head>\n' +
        '<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n' +
        '<meta name="referrer" content="no-referrer">\n' +
        '<title>' + mdEscText(title) + '</title>\n<style>\n' + MD_PAGE_CSS + '\n</style>\n' +
        '</head>\n<body>\n<article class="md">\n' + body + '\n</article>\n</body>\n</html>\n'
    }
    
    // Explain a refusal WITHOUT weakening it: the clamp is unchanged, but a bare
    // "Forbidden path" makes a symlink that leaves the workspace look like a
    // renderer bug, and the browser is showing this response as a raw JSON page.
    async function forbiddenReason(inputPath) {
      if (typeof inputPath !== 'string' || inputPath.length === 0) return 'Forbidden path: no path given'
      const resolved = path.resolve(inputPath)
      const lexical = NAVIGABLE_PATHS.some((rp) => resolved === rp || resolved.startsWith(rp + path.sep))
      if (!lexical) return 'Forbidden path: ' + resolved + ' is outside the workspace roots'
      try {
        const real = await fsp.realpath(resolved)
        return 'Forbidden path: ' + resolved + ' resolves to ' + real +
          ', which is outside the workspace roots — a symlink or bind mount leaves the workspace'
      } catch {
        return 'Forbidden path: ' + resolved + ' does not exist'
      }
    }
    
    async function handlePreviewDoc(req, res, url) {
      const filePath = url.searchParams.get('path')
      const theme = url.searchParams.get('theme') === 'dark' ? 'dark' : 'light'
      const safePath = await resolveSafe(filePath)
      if (!safePath) {
        sendError(res, 403, await forbiddenReason(filePath))
        return
      }
      try {
        const stat = await fsp.stat(safePath)
        if (!stat.isFile()) {
          sendError(res, 400, 'Not a file')
          return
        }
        const ext = path.extname(safePath).slice(1).toLowerCase()
        const filename = path.basename(safePath)
        const headers = {
          'content-type': 'text/html; charset=utf-8',
          'content-disposition': 'inline; filename="' + filename.replace(/"/g, '\\"') + '"',
          'x-content-type-options': 'nosniff',
          'cache-control': 'private, max-age=60',
        }
    
        if (DOC_MD_EXT.has(ext)) {
          // Rendering needs the whole text in memory, so past the edit cap we show
          // a notice rather than a half-rendered document. Same 5 MB as /api/read.
          headers['content-security-policy'] = MD_PREVIEW_CSP
          if (stat.size > MAX_TEXT_SIZE) {
            res.writeHead(200, headers)
            res.end(mdPage(filename, '<div class="md-notice">This file is too large to render (' +
              (stat.size / (1024 * 1024)).toFixed(1) + ' MB). Use Download to open it locally.</div>', theme))
            return
          }
          const src = await fsp.readFile(safePath, 'utf8')
          let body
          try {
            // filePath/theme travel with the context so every link this page
            // emits can carry them: the theme keeps a dark preview dark when you
            // navigate, and the path lets the NEXT page offer a way back.
            body = mdRender(src, {
              baseDir: path.dirname(safePath),
              filePath: safePath,
              theme,
              trail: parseTrail(url.searchParams.get('from')),
            })
          } catch (err) {
            // A renderer bug must degrade to escaped source, never to a 500: the
            // preview is the only way to look at the file from the browser.
            console.error('[data_manager] markdown render failed:', err)
            body = '<pre class="md-pre"><code>' + mdEscText(src) + '</code></pre>'
          }
          const back = await backBar(url.searchParams.get('from'), safePath, theme)
          res.writeHead(200, headers)
          res.end(mdPage(filename, back + body, theme))
          return
        }
    
        if (DOC_HTML_EXT.has(ext)) {
          // Verbatim bytes: a report exported from another tool keeps its own
          // markup. The CSP above is what makes that safe.
          headers['content-security-policy'] = HTML_PREVIEW_CSP
          res.writeHead(200, headers)
          fs.createReadStream(safePath).pipe(res)
          return
        }
    
        sendError(res, 404, 'Not a previewable document')
      } catch (err) {
        // A dangling symlink resolves under a root but stat() follows it and
        // fails: that is a missing file, not a server error.
        if (err && err.code === 'ENOENT') {
          sendError(res, 404, 'Not found')
          return
        }
        sendError(res, 500, err.message)
      }
    }
    
    async function handleWrite(req, res, url, body) {
      const filePath = url.searchParams.get('path')
      const safePath = await resolveSafe(filePath)
      if (!safePath) {
        sendError(res, 403, 'Forbidden')
        return
      }
      const blocked = platformWriteBlocked(safePath)
      if (blocked) {
        sendError(res, 403, blocked)
        return
      }
      try {
        await fsp.mkdir(path.dirname(safePath), { recursive: true })
        const tmpPath = safePath + '.tmp-' + Date.now()
        await fsp.writeFile(tmpPath, body.content || '', 'utf8')
        await fsp.rename(tmpPath, safePath)
        json(res, 200, { ok: true, path: safePath })
      } catch (err) {
        sendError(res, 500, err.message)
      }
    }
    
    async function handleMkdir(req, res, body) {
      if (typeof body.path !== 'string' || !body.path) {
        sendError(res, 400, 'Missing path')
        return
      }
      // Two shapes: { path: <existing dir>, rel: "a/b" } (preferred, what the
      // SPA sends) and the legacy { path: <full path> }. The legacy shape is
      // split at its deepest existing ancestor, which is what finally makes a
      // nested "New folder" possible: resolveSafe() alone requires the parent to
      // exist, so the old handler could only ever create one level.
      const wantsRel = typeof body.rel === 'string' && body.rel.length > 0
      let baseReal = null
      let rel = ''
      if (wantsRel) {
        baseReal = await resolveSafe(body.path)
        rel = sanitizeRelPath(body.rel)
        if (!baseReal || !rel) {
          sendError(res, 403, 'Forbidden')
          return
        }
      } else {
        const split = await splitAtExistingAncestor(body.path)
        if (!split) {
          sendError(res, 403, 'Forbidden')
          return
        }
        baseReal = split.baseReal
        if (split.rel) {
          rel = sanitizeRelPath(split.rel)
          if (!rel) {
            sendError(res, 403, 'Forbidden')
            return
          }
        }
      }
      const blocked = platformWriteBlocked(baseReal)
      if (blocked) {
        sendError(res, 403, blocked)
        return
      }
      try {
        if (!rel) {
          // Already exists — recursive mkdir used to be a no-op here.
          json(res, 200, { ok: true, path: baseReal, existed: true })
          return
        }
        const created = await mkdirInside(baseReal, rel)
        json(res, 200, { ok: true, path: created })
      } catch (err) {
        uploadError(res, err)
      }
    }
    
    async function handleDelete(req, res, body) {
      const paths = body.paths
      if (!Array.isArray(paths) || paths.length === 0) {
        sendError(res, 400, 'No paths specified')
        return
      }
      const deleted = []
      for (const p of paths) {
        const safe = await resolveSafe(p)
        if (!safe) {
          deleted.push({ path: p, error: 'Forbidden' })
          continue
        }
        if (NAVIGABLE_PATHS.includes(safe)) {
          // A root is not a file: rm -rf here would take the whole workspace
          // (or the cluster-wide shared volume) with it.
          deleted.push({ path: p, error: 'Cannot delete a workspace root' })
          continue
        }
        const blocked = platformWriteBlocked(safe)
        if (blocked) {
          deleted.push({ path: p, error: blocked })
          continue
        }
        try {
          await fsp.rm(safe, { recursive: true })
          deleted.push({ path: p, ok: true })
        } catch (err) {
          deleted.push({ path: p, error: err.message })
        }
      }
      json(res, 200, { deleted })
    }
    
    async function handleRename(req, res, body) {
      const from = body.from
      const to = body.to
      const safeFrom = await resolveSafe(from)
      const safeTo = await resolveSafe(to)
      if (!safeFrom || !safeTo) {
        sendError(res, 403, 'Forbidden')
        return
      }
      const blocked = platformWriteBlocked(safeFrom) || platformWriteBlocked(safeTo)
      if (blocked) {
        sendError(res, 403, blocked)
        return
      }
      try {
        await fsp.mkdir(path.dirname(safeTo), { recursive: true })
        await fsp.rename(safeFrom, safeTo)
        json(res, 200, { ok: true, from: safeFrom, to: safeTo })
      } catch (err) {
        sendError(res, 500, err.message)
      }
    }
    
    // ─── Copy / move / duplicate handlers ───────────────
    // Copy and move share one routine: resolve the destination ONCE, then walk
    // the sources, refusing per item so one bad path cannot sink the batch.
    async function handleTransfer(req, res, body, verb) {
      const parsed = parseTransferBody(body)
      if (parsed.error) {
        sendError(res, 400, parsed.error)
        return
      }
      // The destination must EXIST: resolveSafe() falls back to the parent's
      // realpath for a missing path, and a lexical path must never reach
      // platformWriteBlocked()'s prefix test.
      const destReal = await resolveSafe(body.dest)
      if (!destReal) {
        sendError(res, 403, 'Forbidden destination')
        return
      }
      let destStat = null
      try {
        destStat = await fsp.stat(destReal)
      } catch {
        destStat = null
      }
      if (!destStat) {
        sendError(res, 404, 'Destination not found')
        return
      }
      if (!destStat.isDirectory()) {
        sendError(res, 400, 'Destination is not a directory')
        return
      }
      const destBlocked = platformWriteBlocked(destReal)
      if (destBlocked) {
        sendError(res, 403, destBlocked)
        return
      }
      const onConflict = transferConflict(body.onConflict)
      const guard = makeTransferGuard(res)
      const results = []
      for (const p of parsed.paths) {
        if (guard.cancelled) break
        const src = await resolveSafe(p)
        if (!src) {
          results.push({ path: p, error: await missingOrForbidden(p) })
          continue
        }
        if (NAVIGABLE_PATHS.includes(src)) {
          results.push({ path: p, error: 'Cannot ' + verb + ' a workspace root' })
          continue
        }
        const srcBlocked = verb === 'move' ? platformWriteBlocked(src) : null
        if (srcBlocked) {
          results.push({ path: p, error: srcBlocked })
          continue
        }
        let st = null
        try {
          st = await fsp.lstat(src)
        } catch {
          results.push({ path: p, error: 'Not found' })
          continue
        }
        // A directory transferred into itself (or into its own subtree) would
        // recurse forever on copy and delete itself on move.
        if (st.isDirectory() && isInside(src, destReal)) {
          results.push({ path: p, error: 'Cannot ' + verb + ' a folder into itself' })
          continue
        }
        const target0 = path.join(destReal, path.basename(src))
        // The item already lives in the destination folder.
        if (target0 === src) {
          if (verb === 'move') {
            // Moving a file into the folder it is already in has nothing to do
            // (and "replacing itself" would be meaningless).
            results.push({ path: p, target: target0, ok: true, noop: true })
            continue
          }
          if (onConflict === 'skip') {
            results.push({ path: p, target: target0, skipped: true })
            continue
          }
          if (onConflict === 'overwrite') {
            // Replacing an item with itself would delete the thing being copied.
            results.push({ path: p, error: 'Source and destination are the same' })
            continue
          }
          // Keep-both: a copy pasted into its own folder is a duplicate, which
          // is what every file manager does. Fall through to the rename policy.
        }
        let target = target0
        let renamed = false
        if (await pathExists(target)) {
          if (onConflict === 'skip') {
            results.push({ path: p, target, skipped: true })
            continue
          }
          if (onConflict === 'rename') {
            target = await uniqueTarget(target, st.isDirectory())
            renamed = true
          }
        }
        let overwrite = false
        if (!renamed && (await pathExists(target))) {
          // Hard links and bind mounts make "different path, same inode"
          // possible; replacing it would delete the source mid-copy.
          let same = false
          try {
            const tst = await fsp.lstat(target)
            same = tst.dev === st.dev && tst.ino === st.ino
          } catch {
            // vanished between the two calls — treat it as absent
          }
          if (same) {
            results.push({ path: p, error: 'Source and destination are the same' })
            continue
          }
          overwrite = true
        }
        try {
          if (verb === 'move') {
            const extra = await moveEntry(src, target, overwrite, guard)
            results.push({ path: p, target, ok: true, renamed, ...extra })
          } else {
            // "keep both" must actually keep both: if another tab takes the
            // name between uniqueTarget() and the atomic publish, take the next
            // free name instead of failing the item.
            for (let attempt = 0; ; attempt += 1) {
              try {
                await copyEntry(src, target, overwrite, guard)
                break
              } catch (err) {
                if (err.code === 'EEXIST' && onConflict === 'rename' && !overwrite && attempt < 3) {
                  target = await uniqueTarget(path.join(destReal, path.basename(src)), st.isDirectory())
                  renamed = true
                  continue
                }
                throw err
              }
            }
            results.push({ path: p, target, ok: true, renamed })
          }
        } catch (err) {
          results.push({ path: p, target, error: transferErrorText(err) })
        }
      }
      json(res, 200, { ok: true, results })
    }
    
    async function handleCopy(req, res, body) {
      return handleTransfer(req, res, body, 'copy')
    }
    
    async function handleMove(req, res, body) {
      return handleTransfer(req, res, body, 'move')
    }
    
    // Duplicate is always a sibling with a fresh name: no destination, no
    // conflict policy, and nothing it could overwrite.
    async function handleDuplicate(req, res, body) {
      const parsed = parseTransferBody(body)
      if (parsed.error) {
        sendError(res, 400, parsed.error)
        return
      }
      const guard = makeTransferGuard(res)
      const results = []
      for (const p of parsed.paths) {
        if (guard.cancelled) break
        const src = await resolveSafe(p)
        if (!src) {
          results.push({ path: p, error: await missingOrForbidden(p) })
          continue
        }
        if (NAVIGABLE_PATHS.includes(src)) {
          results.push({ path: p, error: 'Cannot duplicate a workspace root' })
          continue
        }
        const blocked = platformWriteBlocked(src)
        if (blocked) {
          results.push({ path: p, error: blocked })
          continue
        }
        try {
          const st = await fsp.lstat(src)
          const target = await duplicateTarget(src, st.isDirectory())
          await copyEntry(src, target, false, guard)
          results.push({ path: p, target, ok: true })
        } catch (err) {
          results.push({ path: p, error: transferErrorText(err) })
        }
      }
      json(res, 200, { ok: true, results })
    }
    
    async function handleStorage(req, res) {
      const now = Date.now()
      if (storageCache && now - storageCacheTime < STORAGE_CACHE_MS) {
        json(res, 200, storageCache)
        return
      }
      const results = []
      for (const root of ROOTS) {
        // platform-shared statfs reports the WHOLE cluster-wide filesystem
        // (every platform user's data), not this user's share — label it so.
        const label = root.key === 'platform-shared' ? root.label + ' — all users' : root.label
        try {
          const stats = await fsp.statfs(root.path)
          const total = stats.blocks * stats.bsize
          const free = stats.bfree * stats.bsize
          const available = stats.bavail * stats.bsize
          const used = total - free
          const percent = total > 0 ? Math.round((used / total) * 100) : 0
          const inodesTotal = stats.files
          const inodesFree = stats.ffree
          const inodesUsed = inodesTotal - inodesFree
          const inodesPercent = inodesTotal > 0 ? Math.round((inodesUsed / inodesTotal) * 100) : 0
          results.push({
            key: root.key,
            label,
            path: root.path,
            navigable: root.navigable,
            shared: root.shared,
            platform: !!root.platform,
            total,
            used,
            available,
            free,
            percent,
            inodesTotal,
            inodesUsed,
            inodesFree,
            inodesPercent,
          })
        } catch (err) {
          results.push({
            key: root.key,
            label,
            path: root.path,
            navigable: root.navigable,
            shared: root.shared,
            platform: !!root.platform,
            error: err.message,
          })
        }
      }
      storageCache = results
      storageCacheTime = now
      json(res, 200, results)
    }
    
    function loadSpaHtml() {
      try {
        return fs.readFileSync('/opt/preview/data_manager.html', 'utf8')
      } catch {
        return '<!DOCTYPE html><html><body><h1>Data Manager</h1><p>SPA file not found. Ensure data_manager.html is mounted.</p></body></html>'
      }
    }
    
    let spaHtml = null
    
    async function handleRequest(req, res) {
      const url = new URL(req.url, 'http://internal')
      const pathname = url.pathname
    
      if (!pathname.startsWith(BASE)) {
        sendError(res, 404, 'Not found')
        return
      }
    
      const subPath = pathname.slice(BASE.length)
    
      if (subPath === '' || subPath === '/' || subPath === '/index.html') {
        if (!spaHtml) {
          spaHtml = loadSpaHtml()
            .replaceAll('__PREVIEW_USER_SLUG__', USER_SLUG)
            .replace('__OPENCODE_HOME__', USER_SLUG ? `/${USER_SLUG}/` : '/')
        }
        // Never cache the SPA: it is a subPath mount that only changes when the
        // unit re-stamps, and a heuristically-cached copy makes a chart upgrade
        // look like it did nothing.
        res.writeHead(200, { 'content-type': 'text/html; charset=utf-8', 'cache-control': 'no-store' })
        res.end(spaHtml)
        return
      }
    
      if (subPath === '/api/healthz') {
        json(res, 200, { ok: true, build: BUILD })
        return
      }
    
      if (subPath === '/api/roots' && req.method === 'GET') {
        return handleRoots(req, res)
      }
    
      if (subPath === '/api/list' && req.method === 'GET') {
        return handleList(req, res, url)
      }
    
      if (subPath === '/api/download' && req.method === 'GET') {
        return handleDownload(req, res, url)
      }
    
      if (subPath === '/api/archive' && req.method === 'POST') {
        const chunks = []
        for await (const chunk of req) chunks.push(chunk)
        const body = JSON.parse(Buffer.concat(chunks).toString())
        return handleArchive(req, res, body)
      }
    
      if (subPath === '/api/upload' && req.method === 'POST') {
        return handleUpload(req, res, url)
      }
    
      if (subPath === '/api/upload-archive' && req.method === 'POST') {
        return handleUploadArchive(req, res, url)
      }
    
      if (subPath === '/api/upload-file' && req.method === 'POST') {
        return handleUploadFile(req, res, url)
      }
    
      if (subPath === '/api/read' && req.method === 'GET') {
        return handleRead(req, res, url)
      }
    
      // Rendered .md / .html preview (see handlePreviewDoc). Kept off
      // /api/download so the byte endpoint stays a dumb, Range-capable stream.
      if (subPath === '/api/preview' && req.method === 'GET') {
        return handlePreviewDoc(req, res, url)
      }
    
      if (subPath === '/api/write' && req.method === 'PUT') {
        const chunks = []
        for await (const chunk of req) chunks.push(chunk)
        const body = JSON.parse(Buffer.concat(chunks).toString())
        return handleWrite(req, res, url, body)
      }
    
      if (subPath === '/api/mkdir' && req.method === 'POST') {
        const chunks = []
        for await (const chunk of req) chunks.push(chunk)
        const body = JSON.parse(Buffer.concat(chunks).toString())
        return handleMkdir(req, res, body)
      }
    
      if (subPath === '/api/delete' && req.method === 'POST') {
        const chunks = []
        for await (const chunk of req) chunks.push(chunk)
        const body = JSON.parse(Buffer.concat(chunks).toString())
        return handleDelete(req, res, body)
      }
    
      if (subPath === '/api/rename' && req.method === 'POST') {
        const chunks = []
        for await (const chunk of req) chunks.push(chunk)
        const body = JSON.parse(Buffer.concat(chunks).toString())
        return handleRename(req, res, body)
      }
    
      // Copy / move / duplicate. Same JSON-body shape as /api/rename and
      // /api/delete; a batch answers 200 with per-item results.
      if (subPath === '/api/copy' && req.method === 'POST') {
        const chunks = []
        for await (const chunk of req) chunks.push(chunk)
        const body = JSON.parse(Buffer.concat(chunks).toString())
        return handleCopy(req, res, body)
      }
    
      if (subPath === '/api/move' && req.method === 'POST') {
        const chunks = []
        for await (const chunk of req) chunks.push(chunk)
        const body = JSON.parse(Buffer.concat(chunks).toString())
        return handleMove(req, res, body)
      }
    
      if (subPath === '/api/duplicate' && req.method === 'POST') {
        const chunks = []
        for await (const chunk of req) chunks.push(chunk)
        const body = JSON.parse(Buffer.concat(chunks).toString())
        return handleDuplicate(req, res, body)
      }
    
      if (subPath === '/api/storage' && req.method === 'GET') {
        return handleStorage(req, res)
      }
    
      sendError(res, 404, 'Not found: ' + subPath)
    }
    
    // A rejected handler must produce a response, not a hanging socket:
    // requestTimeout is disabled for uploads, and a malformed JSON body
    // used to reject before anything was written.
    const server = http.createServer((req, res) => {
      handleRequest(req, res).catch((err) => {
        console.error('[data_manager] request failed:', err)
        if (res.headersSent) res.destroy()
        else sendError(res, 400, (err && err.message) || 'Bad request')
      })
    })
    // Belt and braces: an async handler that throws must never take the
    // process down — it is started unsupervised (node data_manager.mjs &),
    // and a single bad upload used to exit it (unhandled rejection).
    process.on('unhandledRejection', (err) => {
      console.error('[data_manager] unhandled rejection:', err)
    })
    // Large uploads are legitimate: never let node's 300 s request timeout
    // kill a body that is still arriving (the streamed upload endpoint writes
    // straight to disk). headersTimeout still bounds slowloris headers.
    server.requestTimeout = 0
    server.listen(PORT, HOST, () => {
      console.log('[data_manager] listening on ' + HOST + ':' + PORT)
    })
    
