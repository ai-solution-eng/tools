    // One list block: items at the same indent, nested runs pushed down. Content
    // lines that are not a new item belong to the current item (lazy text).
    function mdList(lines, start, ctx, depth) {
      const d = depth || 0
      const first = MD_LIST.exec(lines[start])
      const indent = first[1].length
      // Built once per list instead of once per continuation line.
      const stripIndent = new RegExp('^ {0,' + (indent + 2) + '}')
      const ordered = /\d/.test(first[2])
      // A list is a run of items with the SAME marker type: '- a' followed by
      // '1. b' is two lists (CommonMark), not one <ul> that swallows the numbers.
      const kindOf = (marker) => (/^\d/.test(marker) ? 'ol' + marker.slice(-1) : 'ul' + marker)
      const listKind = kindOf(first[2])
