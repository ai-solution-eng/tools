      let out = text
      // 1. Code spans first: their content must never be formatted or linked.
      out = out.replace(/(\x60+)([\s\S]*?)\1/g, (m, ticks, body) => keep('<code>' + body + '</code>'))
      // 2. Images before links ('![a](b)' contains '[a](b)').
      out = out.replace(/!\[([^\]]*)\]\(\s*((?:[^\s()]|\([^\s()]*\))+)\s*(?:"([^"]*)")?\s*\)/g, (m, alt, url, title) => {
        const safe = mdSafeUrl(url)
        if (!safe) return alt
        const src = mdAttr(mdResolveRef(safe, ctx, 'image'))
        return keep('<img src="' + src + '" alt="' + mdAttr(alt) + '"' + (title ? ' title="' + mdAttr(title) + '"' : '') + ' loading="lazy">')
      })
      // 3. Links.
      out = out.replace(/\[([^\]]*)\]\(\s*((?:[^\s()]|\([^\s()]*\))+)\s*(?:"([^"]*)")?\s*\)/g, (m, label, url, title) => {
        const safe = mdSafeUrl(url)
        if (!safe) return label
        const href = mdAttr(mdResolveRef(safe, ctx, 'link'))
        const inner = mdInline(label, ctx)
        return keep('<a href="' + href + '"' + (title ? ' title="' + mdAttr(title) + '"' : '') + ' rel="noopener noreferrer nofollow">' + inner + '</a>')
      })
      // 4. Autolinks (<https://x>) and bare URLs.
      out = out.replace(/&lt;((?:https?:\/\/|mailto:)[^&\s>]+)>/g, (m, url) =>
        keep('<a href="' + mdAttr(url) + '" rel="noopener noreferrer nofollow">' + url + '</a>'))
      out = out.replace(/(^|[\s(])((?:https?:\/\/)[^\s<)]+)/g, (m, pre, url) =>
        pre + keep('<a href="' + mdAttr(url) + '" rel="noopener noreferrer nofollow">' + url + '</a>'))
      // 5. Emphasis / strikethrough.
      out = out.replace(/\*\*\*(?=\S)([\s\S]+?)(?<=\S)\*\*\*/g, '<strong><em>$1</em></strong>')
      out = out.replace(/\*\*(?=\S)([\s\S]+?)(?<=\S)\*\*/g, '<strong>$1</strong>')
      out = out.replace(/\*(?=\S)([\s\S]+?)(?<=\S)\*/g, '<em>$1</em>')
      out = out.replace(/___(?=\S)([\s\S]+?)(?<=\S)___/g, '<strong><em>$1</em></strong>')
      out = out.replace(/__(?=\S)([\s\S]+?)(?<=\S)__/g, '<strong>$1</strong>')
      out = out.replace(/(^|[\s(])_(?=\S)([\s\S]+?)(?<=\S)_(?=$|[\s).,;:!?])/g, '$1<em>$2</em>')
      out = out.replace(/~~(?=\S)([\s\S]+?)(?<=\S)~~/g, '<del>$1</del>')
      // 6. Hard break: two trailing spaces or a trailing backslash.
      out = out.replace(/ {2,}\n/g, '<br>\n').replace(/\\\n/g, '<br>\n')
      return mdRestore(out, tokens)
    }
    
    // Nesting cap. Blockquotes and lists recurse, and a pathological file (5000
    // levels of nested bullets) made the single-threaded server copy O(n^2) lines
    // and stall for ~20 s; deeper structures are flattened to inline text instead.
    // Real documents nest a handful of levels, so this is never hit in practice.
    const MD_MAX_DEPTH = 12
    const MD_FENCE = new RegExp('^ {0,3}(' + MD_BT + '{3,}|~{3,})\\s*([^' + MD_BT + '~]*)$')
    const MD_ATX = /^ {0,3}(#{1,6})\s+(.*?)\s*#*\s*$/
    const MD_HR = /^ {0,3}(?:(?:\*[ \t]*){3,}|(?:-[ \t]*){3,}|(?:_[ \t]*){3,})$/
    const MD_QUOTE = /^ {0,3}> ?/
