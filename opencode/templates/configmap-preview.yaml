  tty-attach-session.sh: |
    #!/bin/bash
    # ttyd command wrapper: attach to (or create) a named persistent tmux session.
    # Each terminal tab maps to its own tmux session, so subprocesses are
    # independent and survive closing the browser tab. Destroying a tab calls
    # the manager which runs `tmux kill-session` for that name.
    set -u
    name="${1:-main}"
    [ -z "$name" ] && name=main
    case "$name" in
      *[^a-zA-Z0-9_.-]*|''|.) printf 'invalid session name: %s\n' "${name}" >&2; exit 1 ;;
    esac
    if [ "${#name}" -gt 64 ]; then
      printf 'session name too long\n' >&2
      exit 1
    fi
    export TERM="${TERM:-xterm-256color}"
    export COLORTERM="${COLORTERM:-truecolor}"
    export LANG="${LANG:-C.UTF-8}"
    export LC_ALL="${LC_ALL:-C.UTF-8}"
    export LC_CTYPE="${LC_CTYPE:-C.UTF-8}"
    tty_conf="${HOME}/.tmux.conf"
    printf '%s\n' \
      'set -g default-terminal "tmux-256color"' \
      'set -ga terminal-overrides ",tmux-256color:RGB"' \
      'set -as terminal-features ",tmux-256color:RGB"' \
      'set -g mouse off' \
      'set -g history-limit 5000' \
      > "${tty_conf}"
    if ! command -v tmux >/dev/null 2>&1; then
      printf '\n[terminal] tmux is not installed in this container; starting a plain shell.\n[terminal] Tab sessions will not persist and the toolchain install retries on the next container restart.\n\n' >&2
      exec /var/opencode/bin/opencode-login-shell
    fi
    exec tmux -u new -A -s "$name" /var/opencode/bin/opencode-login-shell
  terminal_manager.js: |
    import http from 'node:http'
    import fs from 'node:fs'
    import { execFile } from 'node:child_process'
    
    const PORT = parseInt(process.env.TERMINAL_MANAGER_PORT || '7683', 10)
    const HOST = '0.0.0.0'
    const BASE = '/terminal'
    const SESSION_NAME = /^[a-zA-Z0-9_.-]{1,64}$/
    const USER_SLUG = process.env.PREVIEW_USER_SLUG || ''
    
    function json(res, code, data) {
      res.writeHead(code, { 'content-type': 'application/json' })
      res.end(JSON.stringify(data))
    }
    
    function sendError(res, code, msg) {
      json(res, code, { error: msg })
    }
    
    function loadSpaHtml() {
      try {
        return fs.readFileSync('/opt/preview/terminal_manager.html', 'utf8')
      } catch {
        return '<!DOCTYPE html><html><body><h1>Terminal</h1><p>SPA file not found.</p></body></html>'
      }
    }
    
    let spaHtml = null
    
    function listSessions() {
      return new Promise((resolve) => {
        execFile('tmux', ['list-sessions', '-F', '#{session_name}'], { timeout: 5000 }, (err, stdout) => {
          if (err && err.code === 1) {
            // no tmux server running yet
            resolve([])
            return
          }
          if (err) {
            resolve({ error: String(err.message || err) })
            return
          }
          const names = stdout.split('\n').map((s) => s.trim()).filter(Boolean)
          resolve(names)
        })
      })
    }
    
    function killSession(name) {
      return new Promise((resolve) => {
        execFile('tmux', ['kill-session', '-t', name], { timeout: 5000 }, (err) => {
          if (err) {
            resolve({ ok: false, error: String(err.message || err) })
            return
          }
          resolve({ ok: true })
        })
      })
    }
    
    async function handleRequest(req, res) {
      const url = new URL(req.url, 'http://internal')
      const pathname = url.pathname
    
      if (!pathname.startsWith(BASE)) {
        sendError(res, 404, 'Not found')
        return
      }
    
      const subPath = pathname.slice(BASE.length)
    
      if (subPath === '' || subPath === '/') {
        if (!spaHtml) {
          spaHtml = loadSpaHtml()
            .replaceAll('__PREVIEW_USER_SLUG__', USER_SLUG)
            .replace('__OPENCODE_HOME__', USER_SLUG ? `/${USER_SLUG}/` : '/')
        }
        // Never cache the SPA: it is a subPath mount that only changes when the
        // unit re-stamps, and a heuristically-cached copy makes a chart upgrade
        // look like it did nothing.
        res.writeHead(200, { 'content-type': 'text/html; charset=utf-8', 'cache-control': 'no-store' })
        res.end(spaHtml)
        return
      }
    
      if (subPath === '/api/healthz') {
        json(res, 200, { ok: true })
        return
      }
    
      if (subPath === '/api/sessions' && req.method === 'GET') {
        const sessions = await listSessions()
        if (Array.isArray(sessions)) {
          json(res, 200, { sessions })
        } else {
          json(res, 500, sessions)
        }
        return
      }
    
      if (subPath.startsWith('/api/sessions/') && req.method === 'DELETE') {
        const name = decodeURIComponent(subPath.slice('/api/sessions/'.length))
        if (!SESSION_NAME.test(name)) {
          sendError(res, 400, 'Invalid session name')
          return
        }
        const result = await killSession(name)
        json(res, result.ok ? 200 : 404, result)
        return
      }
    
      sendError(res, 404, 'Not found: ' + subPath)
    }
    
    const server = http.createServer(handleRequest)
    server.listen(PORT, HOST, () => {
      console.log('[terminal_manager] listening on ' + HOST + ':' + PORT)
    })
  terminal_manager.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
    <meta charset="UTF-8">
