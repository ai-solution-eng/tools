    // Only http(s)/mailto/relative survive: a javascript:/data:/vbscript: target
    // is dropped. Control characters are removed for CLASSIFICATION only, because
    // browsers strip them too ("java\tscript:" IS javascript:).
    function mdSafeUrl(raw) {
      const s = String(raw || '').trim()
      if (!s) return ''
      const probe = s.replace(/[\u0000-\u0020\u007f]/g, '').toLowerCase()
      const scheme = /^([a-z][a-z0-9+.-]*):/.exec(probe)
      if (scheme && !/^(https?|mailto)$/.test(scheme[1])) return ''
      return s
    }
    
    // Relative references in a previewed README point at sibling files, which the
    // browser would resolve against /data-manager/api/. Map them back onto the
    // data-manager endpoints instead: images to the inline byte endpoint (so
    // screenshots and badges in a repo folder actually show up), .md/.html links
    // to the preview itself.
    function mdResolveRef(url, ctx, kind) {
      if (!url || url.startsWith('/') || url.startsWith('#')) return url
      if (/^[a-z][a-z0-9+.-]*:/i.test(url.replace(/[\u0000-\u0020]/g, ''))) return url
      // Anything synthesized here is HTML, so '&' is written as '&amp;' (mdAttr
      // only escapes quotes — values from the source already carry entities).
      //
      // The fragment/query is split off BEFORE joining: encodeURIComponent()
      // would otherwise fold "#top" into the path parameter, and the server
      // would then look for a file literally named "ONE-PAGER.md#top" (404). A
      // fragment is re-attached to the generated href so the browser can still
      // anchor; a query string is dropped — it means nothing to these endpoints.
      const cut = url.search(/[?#]/)
      const clean = cut < 0 ? url : url.slice(0, cut)
      const suffix = cut < 0 ? '' : url.slice(cut)
      const hash = suffix.startsWith('#') ? suffix : ''
      const abs = path.posix.join(ctx.baseDir, clean)
      const enc = encodeURIComponent(abs)
      if (kind === 'image') return BASE + '/api/download?inline=1&amp;path=' + enc
      if (/\.(md|markdown|mdown|mkd|html?)$/i.test(clean)) {
        // Keep the theme (a dark preview must not turn light on navigation) and
        // record which page we came from, so the target can render a link back.
        let href = BASE + '/api/preview?path=' + enc +
          '&amp;theme=' + (ctx.theme === 'dark' ? 'dark' : 'light')
        if (ctx.filePath) href += '&amp;from=' + trailParam([ctx.filePath].concat(ctx.trail || []))
        return href + hash
      }
      // A folder has no byte endpoint: hand it to the SPA, which accepts
      // ?path=<dir> and opens that folder (see loadRoots()).
      if (clean.endsWith('/')) return BASE + '/?path=' + enc
      // Every other file (PDF, zip, dataset, …) resolves through the byte
      // endpoint: ?inline=1 serves a previewable type inline and falls back to a
      // plain attachment otherwise, so the link works instead of 404ing against
      // /data-manager/api/.
      return BASE + '/api/download?inline=1&amp;path=' + enc
    }
    
    function mdRestore(out, tokens) {
