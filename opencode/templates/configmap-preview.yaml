    // Copy src to target. The copy always lands at a stage name beside the
    // target and is published from there, so a failed copy leaves the previous
    // entry intact and a symlink planted at the target can never redirect the
    // write: copyFile() would follow such a link, link()/rename() never do.
    async function copyEntry(src, target, overwrite, guard) {
      const st = await fsp.lstat(src)
      const isDir = st.isDirectory()
      const stage = stagePath(path.dirname(target))
      try {
        await copyTree(src, stage, 0, guard)
      } catch (err) {
        await discardPath(stage)
        throw err
      }
      if (!overwrite) {
        try {
          await publishStage(stage, target, isDir)
        } catch (err) {
          await discardPath(stage)
          throw err
        }
        return
      }
      // Overwrite: move the old entry aside, swap the new one in, drop the old
      // one. If the swap fails the old entry is renamed back, so a failed
      // overwrite never destroys what was there.
      const backup = stagePath(path.dirname(target))
      try {
        await fsp.rename(target, backup)
      } catch (err) {
        await discardPath(stage)
        throw err
      }
      try {
        await fsp.rename(stage, target)
      } catch (err) {
        await fsp.rename(backup, target).catch(() => {})
        await discardPath(stage)
        throw err
      }
      await discardPath(backup)
    }
    
    // Once the destination exists the move HAS happened. A failure to remove the
    // source is a warning on a successful item, never a failed item: reporting
    // failure invites a retry, and the retry makes a third copy.
    async function dropSource(src) {
      try {
        await fsp.rm(src, { recursive: true, force: true })
        return null
      } catch (err) {
        return 'moved, but the original could not be removed: ' + transferErrorText(err)
      }
    }
    
    async function moveEntry(src, target, overwrite, guard) {
      if (!overwrite) {
        try {
          await fsp.rename(src, target)
          return {}
        } catch (err) {
          // rename() cannot cross a filesystem boundary: personal and shared
          // can sit on different mounts, and a platform PVC always does. Copy
          // first, delete second — in that order, so a failed copy never loses
          // the source.
          if (err.code !== 'EXDEV') throw err
          await copyEntry(src, target, false, guard)
          const warn = await dropSource(src)
          return warn ? { crossDevice: true, warning: warn } : { crossDevice: true }
        }
      }
      // Overwrite. rename(2) replaces an existing FILE atomically, so a
      // same-filesystem overwrite-move stays a metadata operation instead of a
      // full byte copy; only a DIRECTORY target (which rename refuses when it
      // is not empty) needs the staged copy below.
      let targetIsDir = false
      try {
        targetIsDir = (await fsp.lstat(target)).isDirectory()
      } catch {
        targetIsDir = false
      }
      if (!targetIsDir) {
        try {
          await fsp.rename(src, target)
          return {}
        } catch (err) {
          // EXDEV: different filesystems. ENOTDIR: the source is a directory
          // and the target is a file — rename refuses that, so fall through to
          // the staged copy, which replaces the file with the tree.
          if (err.code !== 'EXDEV' && err.code !== 'ENOTDIR') throw err
        }
      }
      await copyEntry(src, target, true, guard)
      const warn = await dropSource(src)
      return warn ? { staged: true, warning: warn } : { staged: true }
    }
    
    // "report.txt" -> "report (copy).txt" -> "report (copy 2).txt". A folder
    // named "v1.2" keeps its dot: the extension split is for files only.
    async function duplicateTarget(src, isDir) {
      const dir = path.dirname(src)
      const base = path.basename(src)
      const ext = isDir ? '' : path.extname(base)
      const stem = base.slice(0, base.length - ext.length)
      const tail0 = ' (copy)'
      const first = path.join(dir, fitStem(stem, ext, tail0) + tail0 + ext)
      if (!(await pathExists(first))) return first
      for (let i = 2; i < 1000; i += 1) {
        const tail = ' (copy ' + i + ')'
        const candidate = path.join(dir, fitStem(stem, ext, tail) + tail + ext)
        if (!(await pathExists(candidate))) return candidate
      }
      const tailN = ' (copy ' + Date.now() + ')'
      return path.join(dir, fitStem(stem, ext, tailN) + tailN + ext)
    }
    
    // Filesystem errors, phrased for the SPA's toast (which shows the first one).
    function transferErrorText(err) {
      const code = err && err.code
      if (code === 'ENOSPC') return 'No space left on device'
      if (code === 'EDQUOT') return 'Quota exceeded'
      if (code === 'EROFS') return 'Read-only file system'
      if (code === 'EACCES' || code === 'EPERM') return 'Permission denied'
      if (code === 'ENAMETOOLONG') return 'Path too long'
      if (code === 'ENOENT') return 'Not found'
      if (code === 'EEXIST') return 'An item with that name appeared while copying — nothing was overwritten'
      if (code === 'ECANCELED') return 'Transfer cancelled'
      if (code === 'EUNSUPPORTED' || code === 'EDEEP' || code === 'ETOOMANY') return err.message
      return (err && err.message) || 'Transfer failed'
    }
    
    // resolveSafe() answers null both for a path outside the workspace and for
    // one whose parent does not exist. Say which, so a row that another tab
    // deleted reads as "gone" rather than "forbidden".
    async function missingOrForbidden(p) {
      const lexical = path.resolve(String(p || ''))
      const inside = NAVIGABLE_PATHS.some((rp) => lexical === rp || lexical.startsWith(rp + path.sep))
      // Only a path inside the workspace can be "missing"; answering "not found"
      // for anything else would turn the endpoint into an existence oracle for
      // the whole filesystem.
      if (!inside) return 'Forbidden'
      try {
        await fsp.lstat(lexical)
        return 'Forbidden'
      } catch (err) {
        return err.code === 'ENOENT' ? 'Not found' : 'Forbidden'
      }
    }
    
    function parseTransferBody(body) {
      const paths = body && body.paths
      if (!Array.isArray(paths) || paths.length === 0) return { error: 'No paths specified' }
      if (paths.length > MAX_TRANSFER_ITEMS) return { error: 'Too many items (max ' + MAX_TRANSFER_ITEMS + ')' }
      for (const p of paths) {
        if (typeof p !== 'string' || p.length === 0) return { error: 'Invalid path' }
      }
      return { paths }
    }
    
    // Conflict policy for copy/move. Deliberately NOT normalizeConflict(),
    // whose upload default is "overwrite": a transfer handed no policy must
    // keep both, never replace silently.
    function transferConflict(raw) {
      return raw === 'skip' || raw === 'overwrite' ? raw : 'rename'
    }
    
    function formatBytes(bytes) {
      if (bytes === 0) return '0 B'
      const units = ['B', 'KB', 'MB', 'GB', 'TB']
      const i = Math.floor(Math.log(bytes) / Math.log(1024))
      return (bytes / Math.pow(1024, i)).toFixed(i > 0 ? 1 : 0) + ' ' + units[i]
    }
    
    function parseMultipart(body, boundary) {
      const parts = []
      const boundaryBuf = Buffer.from('--' + boundary)
      let pos = body.indexOf(boundaryBuf)
      if (pos === -1) return parts
      pos += boundaryBuf.length
    
      while (pos < body.length) {
        if (body[pos] === 0x2d && body[pos + 1] === 0x2d) break
        if (body[pos] === 0x0d && body[pos + 1] === 0x0a) pos += 2
    
        const headerEnd = body.indexOf(Buffer.from('\r\n\r\n'), pos)
        if (headerEnd === -1) break
    
        const headerStr = body.slice(pos, headerEnd).toString('utf8')
        pos = headerEnd + 4
    
        const nextBoundary = body.indexOf(Buffer.from('\r\n--' + boundary), pos)
        if (nextBoundary === -1) break
    
        const partData = body.slice(pos, nextBoundary)
    
        const headers = {}
        for (const line of headerStr.split('\r\n')) {
          const idx = line.indexOf(':')
          if (idx > 0) {
            headers[line.slice(0, idx).trim().toLowerCase()] = line.slice(idx + 1).trim()
          }
        }
    
        const cd = headers['content-disposition'] || ''
        const nameMatch = cd.match(/name="([^"]+)"/)
        const filenameMatch = cd.match(/filename="([^"]*)"/)
    
        parts.push({
          name: nameMatch ? nameMatch[1] : null,
          filename: filenameMatch ? filenameMatch[1] : null,
          contentType: headers['content-type'] || 'application/octet-stream',
          data: partData,
        })
    
        pos = nextBoundary + 2 + boundaryBuf.length
      }
    
      return parts
    }
    
    async function handleRoots(req, res) {
      json(res, 200, NAVIGABLE_ROOTS.map((r) => ({
        key: r.key,
        label: r.label,
        path: r.path,
        shared: r.shared,
        platform: !!r.platform,
        // Lets the SPA disable upload / new-folder on a read-only platform
        // volume instead of failing one file at a time.
        writable: !platformWriteBlocked(r.path),
      })))
    }
    
    async function handleList(req, res, url) {
      const dirPath = url.searchParams.get('path') || NAVIGABLE_PATHS[0]
      const safePath = await resolveSafe(dirPath)
      if (!safePath) {
        sendError(res, 403, 'Forbidden path')
        return
      }
      try {
        const stat = await fsp.stat(safePath)
        if (!stat.isDirectory()) {
          sendError(res, 400, 'Not a directory')
          return
        }
        // A copy's in-flight .dm-stage-* entry is not a user file: showing it
        // invites a rename or delete that breaks the copy with a confusing
        // ENOENT.
        const entries = (await fsp.readdir(safePath, { withFileTypes: true }))
          .filter((e) => !e.name.startsWith('.dm-stage-'))
        const items = await Promise.all(
          entries
            .map(async (e) => {
              try {
                const full = path.join(safePath, e.name)
                const s = await fsp.stat(full)
                return {
                  name: e.name,
                  type: e.isDirectory() ? 'dir' : 'file',
                  size: s.size,
                  mtime: s.mtime.toISOString(),
                  mode: s.mode,
                  ext: e.isFile() ? path.extname(e.name).slice(1).toLowerCase() : '',
                }
              } catch {
                return { name: e.name, type: e.isDirectory() ? 'dir' : 'file', size: 0, mtime: null, mode: 0, ext: '' }
              }
            }),
        )
        items.sort((a, b) => {
          if (a.type !== b.type) return a.type === 'dir' ? -1 : 1
          return a.name.localeCompare(b.name)
        })
        json(res, 200, { path: safePath, entries: items })
      } catch (err) {
        sendError(res, 500, err.message)
      }
    }
    
    // Content types used ONLY for ?inline=1 (preview). Deliberately excludes
    // html: that can execute script in the data-manager origin, so it stays on
    // the download path. SVG IS included — through <img> its scripts never run,
    // and the inline response also carries a sandbox CSP + nosniff.
    const PREVIEW_MIME = {
      png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', gif: 'image/gif',
      webp: 'image/webp', svg: 'image/svg+xml', bmp: 'image/bmp',
      avif: 'image/avif', ico: 'image/x-icon',
      pdf: 'application/pdf',
      mp4: 'video/mp4', webm: 'video/webm', mov: 'video/quicktime',
      m4v: 'video/x-m4v', ogv: 'video/ogg',
      mp3: 'audio/mpeg', wav: 'audio/wav', ogg: 'audio/ogg',
      m4a: 'audio/mp4', flac: 'audio/flac', aac: 'audio/aac',
    }
    function previewMimeFor(filePath) {
      const ext = path.extname(filePath).slice(1).toLowerCase()
      return PREVIEW_MIME[ext] || null
    }
    
    async function handleDownload(req, res, url) {
      const filePath = url.searchParams.get('path')
      const customName = url.searchParams.get('name')
      const safePath = await resolveSafe(filePath)
      if (!safePath) {
        sendError(res, 403, 'Forbidden path')
        return
      }
      try {
        const stat = await fsp.stat(safePath)
        if (!stat.isFile()) {
          sendError(res, 400, 'Not a file')
          return
        }
        const filename = customName || path.basename(safePath)
        const inlineMime = url.searchParams.get('inline') ? previewMimeFor(safePath) : null
    
        // ?inline=1 serves bytes for PREVIEW: real content-type, inline
        // disposition, and HTTP Range support so <video>/<audio>/pdf can seek
        // without pulling the whole file. Anything without a preview MIME
        // falls through to the plain attachment download.
        if (inlineMime) {
          const headers = {
            'content-type': inlineMime,
            'content-disposition': 'inline; filename="' + filename.replace(/"/g, '\\"') + '"',
            'x-content-type-options': 'nosniff',
            'content-security-policy': "sandbox; default-src 'none'; img-src 'self' data:; media-src 'self'",
            'cache-control': 'private, max-age=60',
            'accept-ranges': 'bytes',
          }
          const rangeHeader = req.headers.range
          if (rangeHeader) {
            const m = /^bytes=(\d*)-(\d*)$/.exec(String(rangeHeader).trim())
            if (m && (m[1] || m[2])) {
              let start
              let end
              if (m[1]) {
                start = parseInt(m[1], 10)
                end = m[2] ? parseInt(m[2], 10) : stat.size - 1
              } else {
                start = Math.max(0, stat.size - parseInt(m[2], 10))
                end = stat.size - 1
              }
              if (!Number.isFinite(start) || !Number.isFinite(end) || start > end || start >= stat.size) {
                res.writeHead(416, { 'content-range': 'bytes */' + stat.size })
                res.end()
                return
              }
              end = Math.min(end, stat.size - 1)
              headers['content-range'] = 'bytes ' + start + '-' + end + '/' + stat.size
              headers['content-length'] = String(end - start + 1)
              res.writeHead(206, headers)
              fs.createReadStream(safePath, { start, end }).pipe(res)
              return
            }
          }
          headers['content-length'] = String(stat.size)
          res.writeHead(200, headers)
          fs.createReadStream(safePath).pipe(res)
          return
        }
    
        res.writeHead(200, {
          'content-type': 'application/octet-stream',
          'content-length': stat.size,
          'content-disposition': 'attachment; filename="' + filename.replace(/"/g, '\\"') + '"',
        })
        fs.createReadStream(safePath).pipe(res)
      } catch (err) {
        sendError(res, 500, err.message)
      }
    }
    
    async function handleArchive(req, res, body) {
      const selectedPaths = body.paths
      const format = body.format || 'tar.gz'
      const archiveName = (body.name || 'archive').replace(/[^a-zA-Z0-9._-]/g, '_')
    
      if (!Array.isArray(selectedPaths) || selectedPaths.length === 0) {
        sendError(res, 400, 'No paths specified')
        return
      }
    
      const safePaths = []
      for (const p of selectedPaths) {
        const safe = await resolveSafe(p)
        if (!safe) {
          sendError(res, 403, 'Forbidden path: ' + p)
          return
        }
        safePaths.push(safe)
      }
    
      const root = NAVIGABLE_ROOTS.find((r) =>
        safePaths.every((p) => p === r.path || p.startsWith(r.path + path.sep)),
      )
      if (!root) {
        sendError(res, 400, 'Cannot archive files from different roots')
        return
      }
    
      // Anchor the archive at the DEEPEST COMMON PARENT of the selection —
      // not at the navigable root. One file → an archive whose root IS that
      // file; one folder → an archive whose root IS that folder; several
      // items in one directory → plain basenames. The old root-relative
      // anchoring embedded the full personal/<user>/<...> chain from the
      // navigable root into every archive.
      let anchor = path.dirname(safePaths[0])
      for (const p of safePaths.slice(1)) {
        while (!(p === anchor || p.startsWith(anchor + path.sep))) {
          const up = path.dirname(anchor)
          if (up === anchor) break // '/' guard (unreachable: same-root check below)
          anchor = up
        }
      }
      const relPaths = safePaths.map((p) => path.relative(anchor, p))
      const ext = format === 'tar.gz' ? '.tar.gz' : '.zip'
      const contentType = format === 'tar.gz' ? 'application/gzip' : 'application/zip'
    
      res.writeHead(200, {
        'content-type': contentType,
        'content-disposition': 'attachment; filename="' + archiveName + ext + '"',
      })
    
      const cmd = format === 'tar.gz'
        ? spawn('tar', ['czf', '-', ...relPaths], { cwd: anchor })
        : spawn('zip', ['-rq', '-', ...relPaths], { cwd: anchor })
    
      cmd.stdout.pipe(res)
      cmd.stderr.on('data', (d) => console.error('[data_manager] archive stderr:', d.toString()))
      cmd.on('error', (err) => {
        console.error('[data_manager] archive error:', err)
        if (!res.writableEnded) res.end()
      })
      cmd.on('close', () => {
        if (!res.writableEnded) res.end()
      })
    }
    
    async function handleUpload(req, res, url) {
      const targetPath = url.searchParams.get('path')
      const safePath = await resolveSafe(targetPath)
      if (!safePath) {
        sendError(res, 403, 'Forbidden path')
        return
      }
    
      const contentType = req.headers['content-type'] || ''
      const boundaryMatch = contentType.match(/boundary=(?:"([^"]+)"|([^;]+))/)
      if (!boundaryMatch) {
        sendError(res, 400, 'Missing multipart boundary')
        return
      }
    
      const boundary = boundaryMatch[1] || boundaryMatch[2]
      const contentLength = parseInt(req.headers['content-length'] || '0', 10)
      if (contentLength > MAX_MULTIPART_SIZE) {
        sendError(res, 413, 'Upload too large')
        return
      }
    
      const chunks = []
      let totalSize = 0
      try {
        for await (const chunk of req) {
          totalSize += chunk.length
          if (totalSize > MAX_MULTIPART_SIZE) {
            sendError(res, 413, 'Upload too large')
            return
          }
          chunks.push(chunk)
        }
      } catch (err) {
        // The client hung up mid-upload: answer if we still can, never throw.
        if (!res.headersSent) sendError(res, 400, 'Upload aborted')
        return
      }
      const body = Buffer.concat(chunks)
      const parts = parseMultipart(body, boundary)
    const uploaded = []
    const onConflict = normalizeConflict(url.searchParams.get('onConflict'))
    const modeRaw = url.searchParams.get('mode')
    const mode = parseMode(modeRaw)
    if (modeRaw && mode === null) {
      sendError(res, 400, 'Invalid mode')
      return
    }
    
    for (const part of parts) {
      if (!part.filename) continue
      const rel = sanitizeRelPath(part.filename)
      if (!rel) {
        uploaded.push({ name: part.filename, error: 'Invalid path' })
        continue
      }
      try {
        const { target, savedAs, skipped } = await prepareUploadTarget(safePath, rel, onConflict)
        if (skipped) {
          uploaded.push({ name: rel, skipped: true })
          continue
        }
        // Temp file + rename, the same primitive the streamed endpoint uses:
        // a direct writeFile() follows a symlink at the destination (only
        // directory components go through mkdirInside), blocks forever on a
        // FIFO, and leaves a truncated file when the disk fills mid-write.
        const partTmp = path.join(path.dirname(target), '.dm-' + process.pid + '-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8) + '.tmp')
        try {
          await fsp.writeFile(partTmp, part.data)
          if (mode) await fsp.chmod(partTmp, mode)
          await fsp.rename(partTmp, target)
        } catch (err) {
          await fsp.unlink(partTmp).catch(() => {})
          throw err
        }
        uploaded.push({ name: rel, savedAs, size: part.data.length })
      } catch (err) {
        // One bad part must never take the process down: an async handler that
        // throws is an unhandled rejection, node exits, and this server is not
        // supervised (it is started with `node /opt/preview/data_manager.mjs &`).
        uploaded.push({ name: rel, error: (err && err.message) || 'Upload failed' })
      }
    }
    
      json(res, 200, { uploaded })
    }
    
    // Streamed single-file upload — one request per file, body piped to a temp
    // file beside the destination and renamed on success, so a partial transfer
    // never shows up as a file and nothing is held in memory. The multipart
    // /api/upload above stays for browsers running a cached SPA copy, but it
    // buffers the whole body; folder uploads use this endpoint.
    async function handleUploadFile(req, res, url) {
      const baseReal = await resolveSafe(url.searchParams.get('path'))
      if (!baseReal) {
        sendError(res, 403, 'Forbidden path')
        return
      }
      const blocked = platformWriteBlocked(baseReal)
      if (blocked) {
        sendError(res, 403, blocked)
        return
      }
      const rel = sanitizeRelPath(url.searchParams.get('rel'))
      if (!rel) {
        sendError(res, 400, 'Invalid relative path')
        return
      }
      const onConflict = normalizeConflict(url.searchParams.get('onConflict'))
      const modeRaw = url.searchParams.get('mode')
      const mode = parseMode(modeRaw)
      if (modeRaw && mode === null) {
        sendError(res, 400, 'Invalid mode')
        return
      }
      const declared = parseInt(req.headers['content-length'] || '0', 10)
      if (declared > MAX_UPLOAD_SIZE) {
        sendError(res, 413, 'File too large')
        return
      }
    
      let tmpPath = null
      try {
        const { target, savedAs, skipped } = await prepareUploadTarget(baseReal, rel, onConflict)
        if (skipped) {
          // Discard the body we no longer need; swallow an abort so a dropped
          // connection cannot surface as an unhandled stream error.
          req.on('error', () => {})
          req.resume()
          json(res, 200, { ok: true, rel, skipped: true })
          return
        }
        const existing = await fsp.lstat(target).catch(() => null)
        if (existing && existing.isDirectory()) {
          req.resume()
          sendError(res, 409, 'A directory exists at ' + rel)
          return
        }
        // Fixed-width temp name: deriving it from the destination basename
        // overflows NAME_MAX for long (but legal) file names.
        tmpPath = path.join(path.dirname(target), '.dm-' + process.pid + '-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8) + '.tmp')
        const handle = await fsp.open(tmpPath, 'wx')
        // chmod after open: open()'s mode is masked by the process umask.
        if (mode) await handle.chmod(mode)
        let total = 0
        try {
          for await (const chunk of req) {
            total += chunk.length
            if (total > MAX_UPLOAD_SIZE) {
              const err = new Error('File too large')
              err.code = 'ETOOLARGE'
              throw err
            }
            let off = 0
            while (off < chunk.length) {
              const { bytesWritten } = await handle.write(chunk, off, chunk.length - off)
              if (!bytesWritten) throw new Error('Short write')
              off += bytesWritten
            }
          }
        } finally {
          await handle.close()
        }
        await fsp.rename(tmpPath, target)
        tmpPath = null
        // savedAs is the name that actually landed on disk: onConflict=rename
        // appends " (n)", and the SPA needs the real name to refresh the row.
        json(res, 200, { ok: true, rel, savedAs, size: total })
      } catch (err) {
        if (tmpPath) await fsp.unlink(tmpPath).catch(() => {})
        if (res.headersSent) {
          res.destroy()
          return
        }
        uploadError(res, err)
        // A rejected body may still be streaming in; drop the connection so the
        // client sees the error instead of pushing the rest of the file.
        if (err && err.code === 'ETOOLARGE') req.destroy()
      }
    }
    
    // ─── Archive upload (zip / tar / tar.gz) ────────────
    // A whole tree in one request: the browser sends an archive, the server
    // detects the format, validates every entry name, extracts into an isolated
    // temp dir inside the target, then installs the files with the same
    // path-safety and conflict primitives as a normal upload. Links are never
    // installed (both unzip and GNU tar refuse to write through a symlink
    // member, and the installer drops them), and entries that escape the target
    // reject the whole archive instead of extracting a partial tree.
    const MAX_ARCHIVE_ENTRIES = 20000
    
    // "644" / "775" -> octal number; rejects setuid/setgid/sticky.
    function parseMode(raw) {
      if (raw === null || raw === undefined || raw === '') return null
      const s = String(raw)
      if (!/^[0-7]{3,4}$/.test(s)) return null
      const n = parseInt(s, 8)
      return n > 0o777 ? null : n
    }
    
    function runTool(cmd, args) {
      return new Promise((resolve) => {
        let child
        try {
          child = spawn(cmd, args, { stdio: ['ignore', 'pipe', 'pipe'] })
        } catch (err) {
          resolve({ code: -1, stdout: '', stderr: String(err && err.message) })
          return
        }
        let stdout = ''
        let stderr = ''
        child.stdout.on('data', (d) => { if (stdout.length < 8 * 1024 * 1024) stdout += d.toString() })
        child.stderr.on('data', (d) => { if (stderr.length < 64 * 1024) stderr += d.toString() })
        child.on('error', (err) => resolve({ code: -1, stdout, stderr: String(err && err.message) }))
        child.on('close', (code) => resolve({ code, stdout, stderr }))
      })
    }
    
    // 'zip' | 'tar' (tar auto-detects gzip/bzip2/xz/zstd on read) | null.
    function detectArchive(head) {
      if (!head || head.length < 4) return null
      if (head[0] === 0x50 && head[1] === 0x4b) return 'zip' // PK..
      if (head[0] === 0x1f && head[1] === 0x8b) return 'tar' // gzip
      if (head[0] === 0x42 && head[1] === 0x5a && head[2] === 0x68) return 'tar' // bzip2
      if (head[0] === 0xfd && head[1] === 0x37 && head[2] === 0x7a && head[3] === 0x58) return 'tar' // xz
      if (head[0] === 0x28 && head[1] === 0xb5 && head[2] === 0x2f && head[3] === 0xfd) return 'tar' // zstd
      if (head.length >= 262 && head.subarray(257, 262).toString('latin1') === 'ustar') return 'tar'
      return null
    }
    
    async function handleUploadArchive(req, res, url) {
      const baseReal = await resolveSafe(url.searchParams.get('path'))
      if (!baseReal) {
        sendError(res, 403, 'Forbidden path')
        return
      }
      const blocked = platformWriteBlocked(baseReal)
      if (blocked) {
        sendError(res, 403, blocked)
        return
      }
      const onConflict = normalizeConflict(url.searchParams.get('onConflict'))
      const modeRaw = url.searchParams.get('mode')
      const mode = parseMode(modeRaw)
      if (modeRaw && mode === null) {
        sendError(res, 400, 'Invalid mode')
        return
      }
      const baseStat = await fsp.stat(baseReal).catch(() => null)
      if (!baseStat || !baseStat.isDirectory()) {
        sendError(res, 404, 'Target directory not found')
        return
      }
      // Hidden entries are skipped on install (the archive still extracts into
      // the temp dir, which is removed afterwards).
      const skipHidden = url.searchParams.get('skipHidden') === '1'
      const declared = parseInt(req.headers['content-length'] || '0', 10)
      if (declared > MAX_UPLOAD_SIZE) {
        sendError(res, 413, 'Archive too large')
        return
      }
    
      const stamp = Date.now() + '-' + Math.random().toString(36).slice(2, 8)
      const zipPath = path.join(baseReal, '.dm-upload-' + stamp + '.bin')
      const extractDir = path.join(baseReal, '.dm-extract-' + stamp)
      let payload = null
      try {
        // 1. stream the archive to disk (never buffered in memory)
        const handle = await fsp.open(zipPath, 'wx')
        let total = 0
        try {
          for await (const chunk of req) {
            total += chunk.length
            if (total > MAX_UPLOAD_SIZE) {
              const err = new Error('Archive too large')
              err.code = 'ETOOLARGE'
              throw err
            }
            let off = 0
            while (off < chunk.length) {
              const { bytesWritten } = await handle.write(chunk, off, chunk.length - off)
              if (!bytesWritten) throw new Error('Short write')
              off += bytesWritten
            }
          }
        } finally {
          await handle.close()
        }
    
        // 2. detect the format, then validate EVERY entry before extracting
        const headHandle = await fsp.open(zipPath, 'r')
        const head = Buffer.alloc(512)
        let headLen = 0
        try {
          const read = await headHandle.read(head, 0, 512, 0)
          headLen = read.bytesRead
        } finally {
          await headHandle.close()
        }
        const format = detectArchive(head.subarray(0, headLen))
        if (!format) {
          sendError(res, 400, 'Not a zip, tar or tar.gz archive')
          return
        }
        const tool = format === 'zip' ? 'unzip' : 'tar'
        const listing = await runTool(tool, format === 'zip' ? ['-Z1', zipPath] : ['-tf', zipPath])
        if (listing.code === -1) {
          sendError(res, 500, tool + ' is not available in this container')
          return
        }
        const entries = String(listing.stdout || '').split('\n').map((s) => s.replace(/\r$/, '')).filter(Boolean)
        if (entries.length === 0) {
          const hint = String(listing.stderr || '').split('\n').filter(Boolean)[0] || ''
          sendError(res, 400, hint ? 'Unreadable archive: ' + hint.slice(0, 160) : 'Empty or unreadable archive')
          return
        }
        if (entries.length > MAX_ARCHIVE_ENTRIES) {
          sendError(res, 400, 'Archive has more than ' + MAX_ARCHIVE_ENTRIES + ' entries')
          return
        }
        for (const raw of entries) {
          // tar (and some zips) prefix every member with "./"; the root
          // member itself is a no-op.
          const entry = raw.replace(/^\.\//, '').replace(/\/+$/, '')
          if (!entry) continue
          if (!sanitizeRelPath(entry)) {
            sendError(res, 400, 'Archive entry not allowed: ' + raw.slice(0, 120))
            return
          }
        }
    
        // 3. extract into an isolated directory inside the target, then install.
        await fsp.mkdir(extractDir)
        const extract = format === 'zip'
          ? await runTool('unzip', ['-o', '-qq', zipPath, '-d', extractDir])
          : await runTool('tar', ['-xf', zipPath, '-C', extractDir, '--no-same-owner'])
    
        const installed = []
        const skipped = []
        const failed = []
        const installDir = async (dirRel) => {
          const abs = dirRel ? path.join(extractDir, dirRel) : extractDir
          const dirents = await fsp.readdir(abs, { withFileTypes: true })
          for (const ent of dirents) {
            const childRel = dirRel ? dirRel + '/' + ent.name : ent.name
            const absChild = path.join(abs, ent.name)
            const skippable = (seg) => {
              if (seg === '.' || seg === '..') return false
              if (seg.charAt(0) === '.') return true
              if (seg.indexOf('~$') === 0) return true
              if (/^~WRL/i.test(seg)) return true
              return /^(thumbs\.db|ehthumbs\.db|desktop\.ini)$/i.test(seg)
            }
            if (skipHidden && childRel.split('/').some(skippable)) {
              skipped.push(childRel)
              continue
            }
            const rel = sanitizeRelPath(childRel)
            if (!rel) { skipped.push(childRel); continue }
            if (ent.isSymbolicLink()) { skipped.push(childRel); continue }
            if (ent.isDirectory()) {
              await installDir(childRel)
              try {
                const dir = await mkdirInside(baseReal, rel)
                if (mode) await fsp.chmod(dir, mode | 0o111)
              } catch (err) { failed.push({ rel, error: (err && err.message) || 'mkdir failed' }) }
              continue
            }
            if (!ent.isFile()) { skipped.push(childRel); continue }
            try {
              const prep = await prepareUploadTarget(baseReal, rel, onConflict)
              if (prep.skipped) { skipped.push(rel); continue }
              await fsp.rename(absChild, prep.target)
              if (mode) await fsp.chmod(prep.target, mode)
              installed.push(prep.savedAs)
            } catch (err) {
              failed.push({ rel, error: (err && err.message) || 'install failed' })
            }
          }
        }
        await installDir('')
    
        // Respond AFTER the finally below removed the temp archive and extract
        // dir: the SPA refreshes the listing as soon as it sees this response and
        // must not show .dm-* scratch entries.
        payload = {
          ok: true,
          format,
          entries: entries.length,
          installed: installed.length,
          skipped: skipped.length,
          failed: failed.length,
          bytes: total,
          details: { skipped: skipped.slice(0, 20), failed: failed.slice(0, 20) },
          stderr: extract.code === 0 ? '' : String(extract.stderr || '').slice(0, 500),
        }
      } catch (err) {
        if (res.headersSent) {
          res.destroy()
          return
        }
        uploadError(res, err)
        // A rejected body may still be streaming in; drop the connection so the
        // client sees the error instead of pushing the rest of the file.
        if (err && err.code === 'ETOOLARGE') req.destroy()
        return
      } finally {
        await fsp.rm(extractDir, { recursive: true, force: true }).catch(() => {})
        await fsp.unlink(zipPath).catch(() => {})
      }
      json(res, 200, payload)
    }
    
    async function handleRead(req, res, url) {
      const filePath = url.searchParams.get('path')
      const safePath = await resolveSafe(filePath)
      if (!safePath) {
        sendError(res, 403, 'Forbidden')
        return
      }
      try {
        const stat = await fsp.stat(safePath)
        if (!stat.isFile()) {
          sendError(res, 400, 'Not a file')
          return
        }
        if (stat.size > MAX_TEXT_SIZE) {
          json(res, 200, { tooLarge: true, size: stat.size })
          return
        }
        const fd = await fsp.open(safePath, 'r')
        const probeSize = Math.min(8192, stat.size)
        const probe = Buffer.alloc(probeSize)
        await fd.read(probe, 0, probeSize, 0)
        await fd.close()
        if (probe.includes(0)) {
          json(res, 200, { binary: true, size: stat.size })
          return
        }
        const content = await fsp.readFile(safePath, 'utf8')
        json(res, 200, { content, size: stat.size })
      } catch (err) {
        sendError(res, 500, err.message)
      }
    }
    
    // ─── Markdown / HTML preview ───────────────────────────────────────────────
    // /api/preview renders .md server-side and streams .html verbatim, both under
    // a CSP sandbox (see MD_PREVIEW_CSP / HTML_PREVIEW_CSP below). Nothing here
    // executes file content; the renderer is escape-first by design.
    // ─── Markdown preview (zero-dependency, escape-first) ───────────────────────
    // /api/preview renders .md server-side so the browser never runs a parser and
    // the data-manager origin never evaluates file content.
    //
    // ESCAPE-FIRST: '&', '<' and '>' are escaped BEFORE any parsing, so raw HTML
    // inside a .md file is displayed as text instead of being passed through.
    // Every tag emitted below is written by this file itself — there is no
    // sanitizer to keep in sync and no passthrough path that can execute script
    // in the data-manager origin. Keep it that way: never add a raw-HTML branch.
    //
    // Note: the fence/code-span patterns below spell the backtick as \x60 /
    // String.fromCharCode(96) so this file can live inside the chart's YAML block
    // scalar without escaping games.
    const MD_TOKEN = '\u0000'
    const MD_BT = String.fromCharCode(96)
    
    function mdEscText(s) {
      // '>' is NOT escaped: it is inert in HTML text, and leaving it alone is what
      // keeps blockquote markers ("> ") parseable after this pass.
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    }
    // Values that already went through mdEscText() carry their entities, so only
    // the quote characters still need handling before they enter an attribute.
    function mdAttr(s) {
      return String(s).replace(/"/g, '&quot;').replace(/'/g, '&#39;')
