        // (much narrower) chance of replacing a same-name file that appeared
        // while the copy was running.
        if (err.code === 'EPERM' || err.code === 'ENOSYS' || err.code === 'EOPNOTSUPP' || err.code === 'EXDEV') {
          await fsp.rename(stage, target)
          return
        }
        throw err
