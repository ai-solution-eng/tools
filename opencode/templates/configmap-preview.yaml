          <div class="hpe-brand-name">Hewlett Packard Enterprise</div>
          <div class="hpe-brand-title">OpenCode Terminals</div>
          <div class="hpe-brand-sub">Multi-tab terminal sessions for your environment</div>
        </div>
      </div>
      <div class="spacer"></div>
      <div class="theme-controls" title="Dark / light mode">
        <button class="theme-emoji-btn" id="themeLight" aria-label="Light mode">☀️</button>
        <label class="theme-switch">
          <input type="checkbox" id="themeSwitch" />
          <span class="switch-track"><span class="switch-thumb"></span></span>
        </label>
        <button class="theme-emoji-btn" id="themeDark" aria-label="Dark mode">🌙</button>
      </div>
      <a class="btn" href="/" target="_blank">To Login</a>
      <a class="btn" href="__OPENCODE_HOME__" target="_blank">OpenCode</a>
      <a class="btn" href="/data-manager" target="_blank">Data Manager</a>
    </header>
    
    <div class="tabbar-row">
      <h1>Terminal</h1>
      <div id="tabbar"></div>
      <button class="add" id="add-btn" title="New terminal tab">+</button>
    </div>
    <main id="panes"></main>
    <script>
    const API = '/terminal/api';
    const TERM_PATH = '/term/';
    const tabbar = document.getElementById('tabbar');
    const panes = document.getElementById('panes');
    const addBtn = document.getElementById('add-btn');
    
    function newName() {
      return 't-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
    }
    
    let active = null;
    const tabs = new Map(); // name -> { li, iframe }
    
    function select(name) {
      active = name;
      for (const [n, t] of tabs) {
        const on = n === name;
        t.li.classList.toggle('active', on);
        t.iframe.classList.toggle('active', on);
      }
    }
    
    function ensurePanes() {
      if (tabs.size === 0) {
        createTab(newName());
      }
    }
    
    function addDom(name) {
      if (tabs.has(name)) return;
      const li = document.createElement('div');
      li.className = 'tab';
      const span = document.createElement('span');
      span.className = 'title';
      span.textContent = name;
      span.title = name;
      const close = document.createElement('span');
      close.className = 'close';
      close.textContent = '✕';
      close.addEventListener('click', (ev) => {
        ev.stopPropagation();
        destroyTab(name);
      });
      li.appendChild(span);
      li.appendChild(close);
      li.addEventListener('click', () => select(name));
    
      const frame = document.createElement('iframe');
      frame.className = 'pane';
      frame.src = TERM_PATH + '?arg=' + encodeURIComponent(name);
    
      tabbar.appendChild(li);
      panes.appendChild(frame);
      tabs.set(name, { li, iframe: frame });
      select(name);
    }
    
    async function destroyTab(name) {
      const t = tabs.get(name);
      if (!t) return;
      try {
        await fetch(API + '/sessions/' + encodeURIComponent(name), { method: 'DELETE' });
      } catch (e) {
        // ignore network errors; still remove the tab below
      }
      t.iframe.src = 'about:blank';
      t.li.remove();
      t.iframe.remove();
      tabs.delete(name);
      if (active === name) {
        const remaining = Array.from(tabs.keys());
        if (remaining.length) select(remaining[remaining.length - 1]);
        else ensurePanes();
      }
    }
    
    function createTab(name) {
      addDom(name);
    }
    
    (async function init() {
      let sessions = [];
      try {
        const resp = await fetch(API + '/sessions');
        if (resp.ok) sessions = (await resp.json()).sessions || [];
      } catch (e) {
        console.error('list sessions failed', e);
      }
      for (const name of sessions) {
        try {
          addDom(name);
        } catch (e) {
          console.error('failed to open session', name, e);
        }
      }
      ensurePanes();
    })();
    
    addBtn.addEventListener('click', () => createTab(newName()));
    </script>
    <footer class="hpe-footer app-footer">Powered by HPE Private Cloud AI</footer>
    <script>
    (function() {
      var themeLight = document.getElementById("themeLight");
      var themeDark = document.getElementById("themeDark");
      var themeSwitch = document.getElementById("themeSwitch");
      function applyTheme(theme) {
        document.documentElement.setAttribute("data-theme", theme);
        try { localStorage.setItem("theme", theme); } catch (e) {}
        themeSwitch.checked = theme === "dark";
        themeLight.classList.toggle("active", theme === "light");
        themeDark.classList.toggle("active", theme === "dark");
      }
      applyTheme(document.documentElement.getAttribute("data-theme") || "light");
      themeLight.addEventListener("click", function() { applyTheme("light"); });
      themeDark.addEventListener("click", function() { applyTheme("dark"); });
      themeSwitch.addEventListener("change", function() { applyTheme(themeSwitch.checked ? "dark" : "light"); });
    })();
    </script>
    </body>
    </html>
