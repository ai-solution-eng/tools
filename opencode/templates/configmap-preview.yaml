        <div class="hpe-brand">
          <div class="hpe-brand-name">Hewlett Packard Enterprise</div>
          <div class="hpe-brand-title">Data Manager</div>
          <div class="hpe-brand-sub">Browse, upload, and edit your workspace files <span id="build-badge" style="opacity:.7"></span></div>
        </div>
      </div>
      <button class="btn" id="btn-toggle-storage">Storage</button>
      <div class="spacer"></div>
      <div class="theme-controls" title="Dark / light mode">
        <button class="theme-emoji-btn" id="themeLight" aria-label="Light mode">☀️</button>
        <label class="theme-switch">
          <input type="checkbox" id="themeSwitch" />
          <span class="switch-track"><span class="switch-thumb"></span></span>
        </label>
        <button class="theme-emoji-btn" id="themeDark" aria-label="Dark mode">🌙</button>
      </div>
      <a class="btn" href="/" target="_blank">To Login</a>
      <a class="btn" href="__OPENCODE_HOME__" target="_blank">OpenCode</a>
      <a class="btn" href="/terminal" target="_blank">Terminal</a>
    </header>
    
    <div id="storage-panel" class="hidden"></div>
    
    <div id="toolbar">
      <select id="root-selector"></select>
      <nav id="breadcrumb"></nav>
      <button class="btn" id="btn-upload">Upload</button>
      <button class="btn" id="btn-upload-folder">Upload folder</button>
      <button class="btn" id="btn-new-folder">New Folder</button>
      <button class="btn" id="btn-new-file">New File</button>
      <button class="btn" id="btn-paste" disabled title="Nothing to paste — select items and use Copy or Move first">Paste</button>
      <button class="btn" id="btn-refresh">Refresh</button>
    </div>
    
    <div id="main">
      <div id="drop-overlay">Drop files or folders here to upload</div>
      <table>
        <thead>
          <tr>
            <th style="width:32px;"><input type="checkbox" id="select-all"></th>
            <th>Name</th>
            <th style="width:100px;">Size</th>
            <th style="width:160px;">Modified</th>
            <th style="width:80px;">Perms</th>
          </tr>
        </thead>
        <tbody id="file-list"></tbody>
      </table>
      <div id="empty-state" class="empty-state hidden">No files</div>
    </div>
    
    <div id="selection-bar">
      <span id="selection-count">0 selected</span>
      <button class="btn" id="btn-copy-sel">Copy</button>
      <button class="btn" id="btn-move-sel">Move</button>
      <button class="btn" id="btn-dup-sel">Duplicate</button>
      <button class="btn" id="btn-download-sel">Download</button>
      <button class="btn btn-danger" id="btn-delete-sel">Delete</button>
    </div>
    
    <div id="ctx-menu" role="menu"></div>
    <div id="toasts"></div>
    
    <!-- Edit Dialog -->
    <dialog id="edit-dialog">
      <form method="dialog">
        <div class="dlg-header">
          <span id="edit-title">Edit File</span>
          <span id="edit-meta" style="font-size:11px;color:var(--text-muted);"></span>
        </div>
        <div class="dlg-body">
          <div id="editor-container"></div>
        </div>
        <div class="dlg-footer">
          <button class="btn" id="btn-editor-source" type="button" style="display:none">Source</button>
          <button class="btn" id="btn-editor-download" type="button">Download</button>
          <button class="btn" id="btn-editor-rename" type="button">Rename</button>
          <button class="btn btn-danger" id="btn-editor-delete" type="button">Delete</button>
          <button class="btn btn-primary" id="btn-editor-save" type="button">Save</button>
          <button class="btn" id="btn-editor-close" type="button">Close</button>
        </div>
      </form>
    </dialog>
    
    <!-- Download Dialog -->
    <dialog id="download-dialog">
      <div class="dlg-header">Download</div>
      <div class="dlg-body">
        <div id="dl-hint" style="display:none;font-size:12px;color:var(--text-muted);margin-bottom:10px;"></div>
        <div class="dlg-field">
          <label>Filename (without extension)</label>
          <input type="text" id="dl-name" value="archive">
        </div>
        <div class="dlg-field" id="dl-format-field">
          <label>Format</label>
          <select id="dl-format">
            <option value="zip">ZIP</option>
            <option value="tar.gz">TAR.GZ</option>
          </select>
        </div>
      </div>
      <div class="dlg-footer">
        <button class="btn" id="dl-cancel">Cancel</button>
        <button class="btn btn-primary" id="dl-confirm">Download</button>
      </div>
    </dialog>
    
    <!-- Rename Dialog -->
    <dialog id="rename-dialog">
      <div class="dlg-header">Rename / Move</div>
      <div class="dlg-body">
        <div class="dlg-field">
          <label>New name</label>
          <input type="text" id="rename-input">
        </div>
      </div>
      <div class="dlg-footer">
        <button class="btn" id="rename-cancel">Cancel</button>
        <button class="btn btn-primary" id="rename-confirm">Rename</button>
      </div>
    </dialog>
    
    <!-- New Folder Dialog -->
    <dialog id="mkdir-dialog">
      <div class="dlg-header">New Folder</div>
      <div class="dlg-body">
        <div class="dlg-field">
          <label>Folder name</label>
          <input type="text" id="mkdir-input">
        </div>
      </div>
      <div class="dlg-footer">
        <button class="btn" id="mkdir-cancel">Cancel</button>
        <button class="btn btn-primary" id="mkdir-confirm">Create</button>
      </div>
    </dialog>
    
    <!-- New File Dialog -->
    <dialog id="newfile-dialog">
      <div class="dlg-header">New File</div>
      <div class="dlg-body">
        <div class="dlg-field">
          <label>File name</label>
          <input type="text" id="newfile-input">
        </div>
      </div>
      <div class="dlg-footer">
        <button class="btn" id="newfile-cancel">Cancel</button>
        <button class="btn btn-primary" id="newfile-confirm">Create</button>
      </div>
    </dialog>
    
    <!-- Paste (copy / move) Dialog: the destination is whatever folder is open -->
    <dialog id="paste-dialog">
      <div class="dlg-header" id="paste-title">Paste</div>
      <div class="dlg-body">
        <p id="paste-summary" style="font-size:13px;line-height:1.5;margin:0 0 12px;"></p>
        <div class="dlg-field">
          <label for="paste-conflict">If an item already exists</label>
          <select id="paste-conflict">
            <option value="rename" selected>Keep both — rename the new item</option>
            <option value="skip">Skip it</option>
            <option value="overwrite">Overwrite it</option>
          </select>
        </div>
      </div>
      <div class="dlg-footer">
        <button class="btn" id="paste-cancel">Cancel</button>
        <button class="btn btn-primary" id="paste-confirm">Paste</button>
      </div>
    </dialog>
    
    <!-- Confirm Delete Dialog -->
    <dialog id="confirm-dialog">
      <div class="dlg-header" id="confirm-title">Confirm Delete</div>
      <div class="dlg-body">
        <p id="confirm-message" style="font-size:13px;line-height:1.5;"></p>
      </div>
      <div class="dlg-footer">
        <button class="btn" id="confirm-cancel">Cancel</button>
        <button class="btn btn-danger" id="confirm-yes">Delete</button>
      </div>
    </dialog>
    
    <!-- Upload dialog: pre-flight, then live progress -->
    <dialog id="upload-dialog">
      <div class="dlg-header">Upload</div>
      <div class="dlg-body">
        <div id="up-pre">
          <p id="up-summary" style="font-size:13px;line-height:1.5;margin:0 0 12px;"></p>
          <div class="dlg-field">
            <label for="up-conflict">If a file already exists</label>
            <select id="up-conflict">
              <option value="rename">Keep both — rename the new file</option>
              <option value="skip">Skip it</option>
              <option value="overwrite">Overwrite it</option>
            </select>
          </div>
          <div class="dlg-field">
            <label for="up-mode">Permissions</label>
            <select id="up-mode">
              <option value="">Default (644 files, 755 folders)</option>
              <option value="664">Group-writable (664 / 775)</option>
              <option value="755">Executable (755 / 755)</option>
              <option value="775">Group-writable and executable (775 / 775)</option>
            </select>
          </div>
          <label id="up-extract-wrap" style="display:flex;gap:8px;align-items:center;font-size:13px;margin-top:2px;">
            <input type="checkbox" id="up-extract" checked>
            <span>Extract archives (.zip, .tar, .tar.gz, .tar.xz, .tar.zst)</span>
          </label>
          <label id="up-hidden-wrap" style="display:flex;gap:8px;align-items:center;font-size:13px;margin-top:6px;">
            <input type="checkbox" id="up-skip-hidden" checked>
            <span>Skip hidden and temporary files (.git, .venv, ~$…, Thumbs.db)</span>
          </label>
          <label id="up-keep-wrap" style="display:flex;gap:8px;align-items:center;font-size:13px;margin-top:6px;">
            <input type="checkbox" id="up-keep-top" checked>
            <span>Keep the top-level folder name</span>
          </label>
        </div>
        <div id="up-progress" class="hidden">
          <div class="up-bar" id="up-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="up-bar-fill" id="up-bar-fill"></div></div>
          <div id="up-count" aria-live="polite" style="font-size:12px;color:var(--text-muted);margin:8px 0;"></div>
          <div id="up-list"></div>
        </div>
      </div>
      <div class="dlg-footer">
        <button class="btn" id="up-cancel">Cancel</button>
        <button class="btn btn-primary" id="up-start">Upload</button>
      </div>
    </dialog>
    
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
    <script>
    const API = '/data-manager/api';
    let currentPath = '';
    let currentRoot = null;
    let roots = [];
    let selectedPaths = new Set();
    let monacoEditor = null;
    let monacoReady = false;
    let editorCurrentPath = null;
    
    function fmt(bytes) {
      if (bytes === 0) return '0 B';
      const u = ['B','KB','MB','GB','TB'];
      const i = Math.floor(Math.log(bytes) / Math.log(1024));
      return (bytes / Math.pow(1024, i)).toFixed(i > 0 ? 1 : 0) + ' ' + u[i];
    }
    
    function fmtDate(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      return d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
    }
    
    function fmtMode(mode) {
      return '0' + (mode & 0o777).toString(8);
    }
    
    function toast(msg, type) {
      const el = document.createElement('div');
      el.className = 'toast ' + (type || 'info');
      el.textContent = msg;
      document.getElementById('toasts').appendChild(el);
      setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, 4000);
    }
    
    async function api(path, opts) {
      const res = await fetch(API + path, opts);
      const text = await res.text();
      let data;
      try { data = text ? JSON.parse(text) : {}; } catch { data = { error: text }; }
      if (!res.ok) throw new Error(data.error || 'HTTP ' + res.status);
      return data;
    }
    
    // "Which build am I looking at?" — answered in the header, because a
    // stale subPath mount otherwise looks exactly like a missing feature.
    async function showBuild() {
      try {
        const r = await fetch(API + '/healthz');
        const d = await r.json();
        const el = document.getElementById('build-badge');
        if (el && d && d.build) el.textContent = '· v' + d.build;
      } catch (e) { /* cosmetic only */ }
    }
    showBuild();
    
    function iconFor(type, ext) {
      if (type === 'dir') return '\u{1F4C1}';
      const imgExts = ['png','jpg','jpeg','gif','webp','svg','bmp'];
      if (imgExts.includes(ext)) return '\u{1F5BC}';
      if (['md','markdown','mdown','mkd'].includes(ext)) return '\u{1F4DD}';
      if (['html','htm'].includes(ext)) return '\u{1F310}';
      return '\u{1F4C4}';
    }
    
    function langForExt(ext) {
      const map = {
        js:'javascript',mjs:'javascript',ts:'typescript',json:'json',html:'html',
        css:'css',md:'markdown',py:'python',sh:'shell',bash:'shell',
        yml:'yaml',yaml:'yaml',xml:'xml',sql:'sql',go:'go',rs:'rust',
        java:'java',c:'c',cpp:'cpp',h:'c',rb:'ruby',php:'php',
        txt:'plaintext',log:'plaintext',env:'ini',conf:'ini',toml:'ini',
      };
      return map[ext] || 'plaintext';
    }
    
    // ─── Root Selector ──────────────────────────────────
    async function loadRoots() {
      roots = await api('/roots');
      const sel = document.getElementById('root-selector');
      sel.innerHTML = '';
      roots.forEach(r => {
        const opt = document.createElement('option');
        opt.value = r.path;
        // Platform roots carry their own disambiguating label
        // ("Platform … (Kubeflow)") — no '(shared)' suffix needed.
        opt.textContent = r.label + (r.platform ? '' : (r.shared ? ' (shared)' : ''));
        sel.appendChild(opt);
      });
      if (roots.length > 0) {
        // ?path=<dir> opens that folder directly. A rendered markdown link to a
        // folder uses it, and so does a bookmark; without it the SPA always
        // started at the first root, which made a folder link look broken.
        const want = (function () {
          try { return new URLSearchParams(window.location.search).get('path'); } catch (e) { return null; }
        })();
        const linked = want
          ? roots.find(function (r) { return want === r.path || want.indexOf(r.path + '/') === 0; })
          : null;
        currentRoot = linked || roots[0];
        currentPath = linked ? want : roots[0].path;
        if (linked) sel.value = linked.path;
        await loadDir(currentPath);
      }
    }
    
    sel = document.getElementById('root-selector');
    sel.addEventListener('change', async () => {
      const path = sel.value;
      currentRoot = roots.find(r => r.path === path);
      currentPath = path;
      selectedPaths.clear();
      await loadDir(path);
    });
    
    // ─── Breadcrumb ─────────────────────────────────────
    function renderBreadcrumb() {
      syncUploadButtons();
      syncClipboardUi();
      const bc = document.getElementById('breadcrumb');
      bc.innerHTML = '';
      if (!currentRoot) return;
      const rel = currentPath.startsWith(currentRoot.path)
        ? currentPath.slice(currentRoot.path.length).replace(/^\/+/, '')
        : '';
      const parts = rel ? rel.split('/') : [];
    
      const rootCrumb = document.createElement('span');
      rootCrumb.className = 'crumb';
      rootCrumb.textContent = currentRoot.label;
      rootCrumb.onclick = () => navigateTo(currentRoot.path);
      bc.appendChild(rootCrumb);
    
      let accum = currentRoot.path;
      parts.forEach(part => {
        accum += '/' + part;
        // Capture the path for THIS crumb. Closing over the mutable 'accum'
        // made every intermediate crumb navigate to the final directory (the
        // one already open), so clicking e.g. ".dsh" in
        // Personal/.dsh/skills/probe appeared to do nothing.
        const target = accum;
        const sep = document.createElement('span');
        sep.className = 'crumb-sep';
        sep.textContent = '/';
        bc.appendChild(sep);
        const crumb = document.createElement('span');
        crumb.className = 'crumb';
        crumb.textContent = part;
        crumb.title = target;
        crumb.onclick = () => navigateTo(target);
        bc.appendChild(crumb);
      });
    }
    
    // ─── File Listing ───────────────────────────────────
    async function loadDir(dirPath) {
      hideContextMenu();
      currentPath = dirPath;
      const data = await api('/list?path=' + encodeURIComponent(dirPath));
      renderBreadcrumb();
      renderTable(data.entries);
      selectedPaths.clear();
      updateSelectionBar();
    }
    
    function renderTable(entries) {
      const tbody = document.getElementById('file-list');
      const empty = document.getElementById('empty-state');
      tbody.innerHTML = '';
      if (entries.length === 0) {
        empty.classList.remove('hidden');
        return;
      }
      empty.classList.add('hidden');
    
      // Parent dir row (if not at root)
      if (currentRoot && currentPath !== currentRoot.path) {
        const tr = document.createElement('tr');
        tr.innerHTML = '<td></td><td colspan="4" style="color:var(--text-muted);">\u2191 ..</td>';
        tr.onclick = () => {
          const parent = currentPath.split('/').slice(0, -1).join('/') || '/';
          navigateTo(parent);
        };
        tbody.appendChild(tr);
      }
    
      entries.forEach(entry => {
        const fullPath = joinPath(currentPath, entry.name);
        const tr = document.createElement('tr');
        tr.dataset.path = fullPath;
        if (selectedPaths.has(fullPath)) tr.classList.add('selected');
    
        const cb = document.createElement('td');
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = selectedPaths.has(fullPath);
        checkbox.onchange = (e) => {
          e.stopPropagation();
          if (checkbox.checked) selectedPaths.add(fullPath);
          else selectedPaths.delete(fullPath);
          tr.classList.toggle('selected', checkbox.checked);
          updateSelectionBar();
        };
        cb.appendChild(checkbox);
        tr.appendChild(cb);
    
        const nameTd = document.createElement('td');
        nameTd.innerHTML = '<span class="file-icon">' + iconFor(entry.type, entry.ext) + '</span> <span class="file-name">' + escHtml(entry.name) + '</span>';
        tr.appendChild(nameTd);
    
        const sizeTd = document.createElement('td');
        sizeTd.className = 'file-size';
        sizeTd.textContent = entry.type === 'dir' ? '-' : fmt(entry.size);
        tr.appendChild(sizeTd);
    
        const modTd = document.createElement('td');
        modTd.className = 'file-mtime';
        modTd.textContent = fmtDate(entry.mtime);
        tr.appendChild(modTd);
    
        const modeTd = document.createElement('td');
        modeTd.className = 'file-mode';
        modeTd.textContent = fmtMode(entry.mode);
        tr.appendChild(modeTd);
    
        tr.ondblclick = () => {
          if (entry.type === 'dir') navigateTo(fullPath);
          else openEditor(fullPath, entry);
        };
    
        // Right-click: select the row if it is not already part of the
        // selection, then open the row menu at the pointer.
        tr.oncontextmenu = (e) => {
          e.preventDefault();
          if (!selectedPaths.has(fullPath)) {
            selectedPaths.clear();
            selectedPaths.add(fullPath);
            renderTable(entries);
            updateSelectionBar();
          }
          showContextMenu(e.clientX, e.clientY, entry, fullPath);
        };
    
        tbody.appendChild(tr);
      });
    }
    
    function joinPath(base, name) {
      if (base.endsWith('/')) return base + name;
      return base + '/' + name;
    }
    
    function escHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    
    async function navigateTo(path) {
      selectedPaths.clear();
      await loadDir(path);
    }
    
    // ─── Select All ─────────────────────────────────────
    document.getElementById('select-all').onchange = function() {
      const checked = this.checked;
      selectedPaths.clear();
      document.querySelectorAll('#file-list tr[data-path]').forEach(tr => {
        const cb = tr.querySelector('input[type="checkbox"]');
        if (cb) {
          cb.checked = checked;
          if (checked) selectedPaths.add(tr.dataset.path);
          tr.classList.toggle('selected', checked);
        }
      });
      updateSelectionBar();
    };
    
    // ─── Selection Bar ──────────────────────────────────
    function updateSelectionBar() {
      const bar = document.getElementById('selection-bar');
      const count = document.getElementById('selection-count');
      if (selectedPaths.size > 0) {
        bar.classList.add('active');
        count.textContent = selectedPaths.size + ' selected';
      } else {
        bar.classList.remove('active');
      }
    }
    
    // ─── Clipboard: copy / move ─────────────────────────
    // Copy and Move fill an in-page clipboard and Paste applies it to whatever
    // folder is open — the desktop file-manager gesture, and the reason there is
    // no destination picker: the destination is where you navigated to. The
    // clipboard is per-tab and in memory only, so a reload drops it.
    let clipboard = null;
    
    function pasteAllowed() {
      return !currentRoot || currentRoot.writable !== false;
    }
    
    function syncClipboardUi() {
      const btn = document.getElementById('btn-paste');
      if (!btn) return;
      const n = clipboard ? clipboard.paths.length : 0;
      btn.textContent = n > 0 ? 'Paste (' + n + ')' : 'Paste';
      btn.disabled = n === 0 || !pasteAllowed();
      btn.title = n === 0
        ? 'Nothing to paste — select items and use Copy or Move first'
        : (pasteAllowed()
          ? 'Paste ' + n + ' item(s) here' + (clipboard.mode === 'move' ? ' (move)' : '')
          : 'This location is read-only');
    }
    
    function setClipboard(mode) {
      const paths = Array.from(selectedPaths);
      if (paths.length === 0) { toast('Select something first', 'info'); return; }
      clipboard = { mode: mode, paths: paths };
      syncClipboardUi();
      toast((mode === 'move' ? 'Cut ' : 'Copied ') + paths.length + ' item(s) — open a folder and click Paste', 'success');
    }
    
    // One toast per batch, not one per item: a 40-item paste must not bury the
    // toolbar. The first failure is surfaced verbatim.
    function reportTransfer(results, verb) {
      const ok = results.filter(function (r) { return r.ok; });
      const renamed = ok.filter(function (r) { return r.renamed; });
      const skipped = results.filter(function (r) { return r.skipped; });
      const failed = results.filter(function (r) { return r.error; });
      const warned = ok.filter(function (r) { return r.warning; });
      const bits = [ok.length + ' ' + verb];
      if (renamed.length) bits.push(renamed.length + ' renamed to keep both');
      if (skipped.length) bits.push(skipped.length + ' skipped');
      if (failed.length) bits.push(failed.length + ' failed');
      const note = failed.length ? ' — ' + failed[0].error : (warned.length ? ' — ' + warned[0].warning : '');
      toast(bits.join(', ') + note, failed.length ? 'error' : 'success');
    }
    
    // A moved file is the same file at a new path: keep the open editor (and
    // its Save target) pointed at it instead of silently writing the old path.
    function remapEditorPath(results) {
      if (!editorCurrentPath) return;
      results.forEach(function (r) {
        if (!r.ok || !r.target) return;
        if (editorCurrentPath === r.path || editorCurrentPath.indexOf(r.path + '/') === 0) {
          editorCurrentPath = r.target + editorCurrentPath.slice(r.path.length);
          if (editorCurrentEntry) {
            // The dialog title and the language hint read the entry, not the
            // path, so a rename-on-conflict move would otherwise keep the old
            // basename on screen.
            const nm = editorCurrentPath.split('/').pop();
            editorCurrentEntry.name = nm;
            editorCurrentEntry.ext = nm.indexOf('.') > 0 ? nm.split('.').pop().toLowerCase() : '';
          }
        }
      });
    }
    
    // The server accepts at most 200 paths per request. Select-all on a big
    // folder is one click, so a paste is split into batches instead of being
    // rejected outright; results are merged so the toast still summarises the
    // whole gesture.
    const TRANSFER_CHUNK = 200;
    
    async function postTransfer(endpoint, paths, dest, onConflict) {
      const results = [];
      for (let i = 0; i < paths.length; i += TRANSFER_CHUNK) {
        const body = { paths: paths.slice(i, i + TRANSFER_CHUNK) };
        if (dest) body.dest = dest;
        if (onConflict) body.onConflict = onConflict;
        const data = await api(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        (data.results || []).forEach(function (r) { results.push(r); });
      }
      return results;
    }
    
    function openPasteDialog() {
      if (!clipboard || clipboard.paths.length === 0) return;
      if (!pasteAllowed()) { toast('This location is read-only', 'error'); return; }
      const moving = clipboard.mode === 'move';
      const verb = moving ? 'Move' : 'Copy';
      const names = clipboard.paths.map(function (p) { return p.split('/').pop(); });
      const shown = names.slice(0, 6).join(', ') + (names.length > 6 ? ', …' : '');
      document.getElementById('paste-title').textContent = verb + ' into ' + (currentPath.split('/').pop() || currentPath);
      document.getElementById('paste-summary').textContent =
        verb + ' ' + clipboard.paths.length + ' item(s) into ' + currentPath + ': ' + shown +
        (moving ? ' — the originals will be removed.' : '.');
      document.getElementById('paste-confirm').textContent = verb;
      document.getElementById('paste-dialog').showModal();
    }
    
    async function runPaste() {
      const dlg = document.getElementById('paste-dialog');
      if (!clipboard || clipboard.paths.length === 0) { dlg.close(); return; }
      const moving = clipboard.mode === 'move';
      const paths = clipboard.paths.slice();
      const dest = currentPath;
      const onConflict = document.getElementById('paste-conflict').value;
      dlg.close();
      toast(moving ? 'Moving…' : 'Copying…', 'info');
      try {
        const results = await postTransfer(moving ? '/move' : '/copy', paths, dest, onConflict);
        reportTransfer(results, moving ? 'moved' : 'copied');
        if (moving) remapEditorPath(results);
        // The clipboard is ONE-SHOT, for a copy as well as a move: once a paste
        // has been made the gesture is finished, so Paste greys out instead of
        // staying armed for the rest of the session. Copying the same items
        // somewhere else is a deliberate re-selection. (Only a request that
        // never reached the server keeps the clipboard, so a failed paste can
        // be retried without re-selecting.)
        clipboard = null;
        selectedPaths.clear();
        syncClipboardUi();
        await loadDir(currentPath);
        loadStorage();
      } catch (e) {
        toast((moving ? 'Move' : 'Copy') + ' failed: ' + e.message, 'error');
      }
    }
    
    async function duplicateSelection() {
      const paths = Array.from(selectedPaths);
      if (paths.length === 0) return;
      if (!pasteAllowed()) { toast('This location is read-only', 'error'); return; }
      try {
        const results = await postTransfer('/duplicate', paths, null, null);
        reportTransfer(results, 'duplicated');
        selectedPaths.clear();
        await loadDir(currentPath);
        loadStorage();
      } catch (e) {
        toast('Duplicate failed: ' + e.message, 'error');
      }
    }
    
    // ─── Row context menu ───────────────────────────────
    // Right-click used to jump straight into the rename dialog, which hid every
    // other per-row action. The menu now carries the whole set and is clamped to
    // the viewport, so a row at the bottom edge does not open it off-screen.
    function hideContextMenu() {
      const menu = document.getElementById('ctx-menu');
      if (menu) menu.classList.remove('open');
    }
    
    function ctxItem(label, hint, run, extraClass) {
      const el = document.createElement('div');
      el.className = 'ctx-item' + (extraClass ? ' ' + extraClass : '');
      el.setAttribute('role', 'menuitem');
      // textContent, never innerHTML: a file name can contain quotes, angle
      // brackets or newlines and must not become markup.
      const text = document.createElement('span');
      text.textContent = label;
      el.appendChild(text);
      if (hint) {
        const key = document.createElement('span');
        key.className = 'ctx-key';
        key.textContent = hint;
        el.appendChild(key);
      }
      el.onclick = function () { hideContextMenu(); run(); };
      return el;
    }
    
    function showContextMenu(x, y, entry, fullPath) {
      const menu = document.getElementById('ctx-menu');
      menu.innerHTML = '';
      menu.appendChild(entry.type === 'dir'
        ? ctxItem('Open', '', function () { navigateTo(fullPath); })
        : ctxItem('Edit', '', function () { openEditor(fullPath, entry); }));
      menu.appendChild(ctxItem('Download', '', function () { checkSingleFile(fullPath); }));
      menu.appendChild(ctxItem('Rename', '', function () { showRenameDialog(fullPath); }));
      menu.appendChild(ctxItem('Duplicate', '', duplicateSelection));
      menu.appendChild(ctxItem('Copy', 'Ctrl+C', function () { setClipboard('copy'); }));
      menu.appendChild(ctxItem('Move', 'Ctrl+X', function () { setClipboard('move'); }));
      const sep = document.createElement('div');
      sep.className = 'ctx-sep';
      menu.appendChild(sep);
      menu.appendChild(ctxItem('Delete', '', function () { askDelete(Array.from(selectedPaths)); }, 'danger'));
      menu.classList.add('open');
      // Measure only after display, then clamp.
      const box = menu.getBoundingClientRect();
      menu.style.left = Math.max(8, Math.min(x, window.innerWidth - box.width - 8)) + 'px';
      menu.style.top = Math.max(8, Math.min(y, window.innerHeight - box.height - 8)) + 'px';
    }
    
    document.addEventListener('click', function (e) {
      const menu = document.getElementById('ctx-menu');
      if (menu && menu.classList.contains('open') && !menu.contains(e.target)) hideContextMenu();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') hideContextMenu();
    });
    window.addEventListener('resize', hideContextMenu);
    // The menu is anchored to viewport coordinates: any scroll detaches it from
    // the row it belongs to, so dismiss it (capture: the scrolling element is
    // #main, not the window).
    window.addEventListener('scroll', hideContextMenu, true);
    
    // ─── Storage Panel ──────────────────────────────────
    async function loadStorage() {
      try {
        const data = await api('/storage');
        renderStorage(data);
      } catch (e) {
        console.error('Storage load failed:', e);
      }
    }
    
    function renderStorage(data) {
      const panel = document.getElementById('storage-panel');
      panel.innerHTML = '';
      data.forEach(item => {
        const div = document.createElement('div');
        div.className = 'storage-item';
    
        const label = document.createElement('div');
        label.className = 'si-label';
        label.textContent = item.label;
        if (item.shared) {
          const badge = document.createElement('span');
          badge.className = 'si-badge';
          badge.textContent = 'shared';
          label.appendChild(badge);
        }
        if (!item.navigable) {
          const badge = document.createElement('span');
          badge.className = 'si-badge';
          badge.textContent = 'info only';
          label.appendChild(badge);
        }
        div.appendChild(label);
    
        if (item.error) {
          const err = document.createElement('div');
          err.className = 'si-detail';
          err.style.color = 'var(--danger)';
          err.textContent = 'Error: ' + item.error;
          div.appendChild(err);
          panel.appendChild(div);
          return;
        }
    
        const bar = document.createElement('div');
        bar.className = 'storage-bar';
        const fill = document.createElement('div');
        fill.className = 'storage-bar-fill ' + barColor(item.percent);
        fill.style.width = Math.min(item.percent, 100) + '%';
        bar.appendChild(fill);
        div.appendChild(bar);
    
        const detail = document.createElement('div');
        detail.className = 'si-detail';
        detail.textContent = fmt(item.used) + ' / ' + fmt(item.total) + ' (' + item.percent + '%)';
        div.appendChild(detail);
    
        const inodes = document.createElement('div');
        inodes.className = 'si-inodes';
        inodes.textContent = item.inodesUsed.toLocaleString() + ' / ' + item.inodesTotal.toLocaleString() + ' inodes (' + item.inodesPercent + '%)';
        div.appendChild(inodes);
    
        panel.appendChild(div);
      });
    }
    
    function barColor(pct) {
      if (pct >= 90) return 'red';
      if (pct >= 70) return 'yellow';
      return 'green';
    }
    
    document.getElementById('btn-toggle-storage').onclick = function() {
      const panel = document.getElementById('storage-panel');
      panel.classList.toggle('hidden');
      if (!panel.classList.contains('hidden')) loadStorage();
    };
    
    // ─── Upload (files, archives, folders) ──────────────
    // One pipeline for every entry point. "Upload" takes files *and* compressed
    // archives (a .zip/.tar/.tar.gz is extracted server-side unless the user
    // unticks the box); "Upload folder" takes a directory tree. A drop can carry
    // both files and folders. An item is { file, rel } for a file, or
    // { rel, dir: true } for an empty directory — only the drop path can see
    // those (a <input webkitdirectory> never reports them).
    const UPLOAD_CONCURRENCY = 3;
    const UPLOAD_MAX_ROWS = 300;
    const ARCHIVE_NAME_RE = /\.(zip|tar|tar\.gz|tgz|tar\.xz|txz|tar\.zst)$/i;
    const upState = { items: [], policy: 'rename', keepTop: true, skipHidden: true, extract: true, mode: '', folderMode: false, running: false, abort: null };
    
    function uploadAllowed() {
      return !currentRoot || currentRoot.writable !== false;
    }
    
    function syncUploadButtons() {
      const ok = uploadAllowed();
      ['btn-upload', 'btn-upload-folder'].forEach((id) => {
        const el = document.getElementById(id);
        if (!el) return;
        el.disabled = !ok;
        el.title = ok ? '' : 'This location is read-only';
      });
    }
    
    function isArchiveName(name) {
      return ARCHIVE_NAME_RE.test(String(name || ''));
    }
    
    function pickUploadFiles() {
      if (!uploadAllowed()) { toast('This location is read-only', 'error'); return; }
      const input = document.createElement('input');
      input.type = 'file';
      input.multiple = true;
      input.onchange = function () {
        const items = Array.from(input.files).map(function (f) { return { file: f, rel: f.name }; });
        if (items.length) openUploadDialog(items, false);
      };
      input.click();
    }
    
    function pickUploadFolder() {
      if (!uploadAllowed()) { toast('This location is read-only', 'error'); return; }
      const probe = document.createElement('input');
      if (!('webkitdirectory' in probe)) { toast('This browser cannot pick folders — use Upload', 'error'); return; }
      const input = document.createElement('input');
      input.type = 'file';
      input.multiple = true;
      input.webkitdirectory = true;
      input.onchange = function () {
        const items = Array.from(input.files).map(function (f) {
          return { file: f, rel: f.webkitRelativePath || f.name };
        });
        if (items.length) openUploadDialog(items, true);
      };
      input.click();
    }
    
    // Entries API walk for the drop path. readEntries() must be called until it
    // returns an empty batch (Chromium caps one call at 100 entries). A single
    // unreadable entry (locked file, broken link) must not abort the whole drop,
    // so both callbacks resolve to a safe empty value on error.
    async function walkEntry(entry, out) {
      if (!entry) return;
      const rel = String(entry.fullPath || '').replace(/^\/+/, '');
      if (entry.isFile) {
        const file = await new Promise(function (resolve) {
          entry.file(resolve, function () { resolve(null); });
        });
        if (file && rel) out.push({ file: file, rel: rel });
        return;
      }
      if (entry.isDirectory) {
        const reader = entry.createReader();
        const children = [];
        for (;;) {
          const batch = await new Promise(function (resolve) {
            reader.readEntries(resolve, function () { resolve([]); });
          });
          if (!batch || batch.length === 0) break;
          for (const child of batch) children.push(child);
        }
        if (children.length === 0 && rel) { out.push({ rel: rel, dir: true }); return; }
        for (const child of children) await walkEntry(child, out);
      }
    }
    
    // Read the drag payload synchronously (webkitGetAsEntry must be called while
    // the event is still live), then walk it.
    function itemsFromDrop(dt) {
      const entries = [];
      const list = Array.from(dt.items || []);
      for (const it of list) {
        const get = it.webkitGetAsEntry || it.getAsEntry;
        if (typeof get === 'function') {
          const entry = get.call(it);
          if (entry) entries.push(entry);
        }
      }
      if (entries.length === 0) {
        const files = Array.from(dt.files || []);
        // Without the entries API a dropped directory arrives as ONE zero-length,
        // type-less File named after the folder: refuse it instead of writing a
        // 0-byte file. A single empty extensionless file is indistinguishable, so
        // only treat a lone such item as a folder.
        if (files.length === 1 && !files[0].type && files[0].size === 0) {
          return Promise.resolve({ error: 'This browser cannot read dropped folders — use Upload folder' });
        }
        return Promise.resolve({ items: files.map(function (f) { return { file: f, rel: f.name }; }) });
      }
      return (async function () {
        const out = [];
        for (const entry of entries) await walkEntry(entry, out);
        return { items: out };
      })();
    }
    
    // "." and ".." are not "hidden entries" — a path containing them is a
    // malformed one the server rejects with a visible error, which is better
    // than silently dropping it here.
    // Entries that never need to travel to the workspace when the skip box
    // is on: hidden entries, Office owner/lock files (~$deck.pptx), Word
    // temp files (~WRL*.tmp) and the usual Windows/macOS directory junk.
    const JUNK_NAMES = { 'thumbs.db': 1, 'ehthumbs.db': 1, 'desktop.ini': 1 };
    function isSkippableSeg(s) {
      if (s === '.' || s === '..') return false;
      if (s.charAt(0) === '.') return true;
      if (s.indexOf('~$') === 0) return true;
      if (/^~WRL/i.test(s)) return true;
      return !!JUNK_NAMES[s.toLowerCase()];
    }
    function isHiddenRel(rel) {
      return rel.split('/').some(isSkippableSeg);
    }
    
    // Pure: apply the "keep top-level folder" choice, drop hidden entries when
    // asked to, and drop empty names. origRel is kept so a retry starts from the
    // name the user actually chose.
    function buildUploadPlan(items, folderMode, keepTop, skipHidden) {
      const plan = [];
      for (const it of items) {
        let rel = it.rel;
        if (skipHidden && isHiddenRel(rel)) continue;
        if (folderMode && !keepTop) {
          const slash = rel.indexOf('/');
          rel = slash === -1 ? rel : rel.slice(slash + 1);
        }
        if (rel) plan.push({ file: it.file, dir: it.dir, rel: rel, origRel: it.rel });
      }
      return plan;
    }
    
    function countHidden(items) {
      return items.filter(function (it) { return isHiddenRel(it.rel); }).length;
    }
    
    function openUploadDialog(items, folderMode) {
      if (upState.running) { toast('An upload is already running', 'warning'); return; }
      if (!uploadAllowed()) { toast('This location is read-only', 'error'); return; }
      upState.items = items;
      upState.folderMode = !!folderMode;
      upState.policy = 'rename';
      upState.keepTop = true;
      upState.skipHidden = true;
      upState.extract = true;
      const files = items.filter(function (i) { return !!i.file; });
      const dirs = items.filter(function (i) { return !!i.dir; });
      const archives = files.filter(function (i) { return isArchiveName(i.file.name); });
      let bytes = 0;
      for (const f of files) bytes += f.file.size;
      const hidden = countHidden(items);
      document.getElementById('up-summary').textContent =
        files.length + ' file' + (files.length === 1 ? '' : 's') +
        (archives.length ? ' (' + archives.length + ' archive' + (archives.length === 1 ? '' : 's') + ')' : '') +
        (dirs.length ? ' and ' + dirs.length + ' empty folder' + (dirs.length === 1 ? '' : 's') : '') +
        ' · ' + fmt(bytes) + ' → ' + currentPath +
        (hidden ? ' · ' + hidden + ' hidden/temp entr' + (hidden === 1 ? 'y' : 'ies') + ' skipped' : '');
      document.getElementById('up-conflict').value = 'rename';
      document.getElementById('up-mode').value = '';
      document.getElementById('up-skip-hidden').checked = true;
      document.getElementById('up-extract-wrap').style.display = archives.length ? 'flex' : 'none';
      document.getElementById('up-extract').checked = true;
      document.getElementById('up-keep-wrap').style.display = upState.folderMode ? 'flex' : 'none';
      document.getElementById('up-keep-top').checked = true;
      document.getElementById('up-pre').classList.remove('hidden');
      document.getElementById('up-progress').classList.add('hidden');
      document.getElementById('up-list').innerHTML = '';
      const startBtn = document.getElementById('up-start');
      startBtn.classList.remove('hidden');
      startBtn.textContent = 'Upload';
      startBtn.onclick = startUpload;
      document.getElementById('up-cancel').textContent = 'Cancel';
      document.getElementById('upload-dialog').showModal();
    }
    
    // A proxy in front of the app answers with an HTML error page, which the
    // SPA used to collapse into a bare "HTTP 500". Keep the first words of
    // the body so the row says who failed and why.
    function httpErrorText(status, text) {
      const stripped = String(text || '').replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
      return 'HTTP ' + status + (stripped ? ' — ' + stripped.slice(0, 140) : '');
    }
    
    function uploadOne(item, onProgress) {
      return new Promise(function (resolve, reject) {
        let url = API + '/upload-file?path=' + encodeURIComponent(currentPath) +
          '&rel=' + encodeURIComponent(item.rel) +
          '&onConflict=' + encodeURIComponent(upState.policy);
        if (upState.mode) url += '&mode=' + encodeURIComponent(upState.mode);
        const xhr = new XMLHttpRequest();
        // Capture the session: a late onload/onerror can fire after the run has
        // finished and upState.abort has been cleared.
        const session = upState.abort || { xhrs: new Set() };
        session.xhrs.add(xhr);
        xhr.open('POST', url, true);
        xhr.timeout = 30 * 60 * 1000;
        xhr.setRequestHeader('content-type', 'application/octet-stream');
        xhr.upload.onprogress = function (e) { if (e.lengthComputable) onProgress(e.loaded); };
        xhr.onload = function () {
          session.xhrs.delete(xhr);
          let data = {};
          try { data = JSON.parse(xhr.responseText); } catch (e) { /* nginx HTML error page */ }
          if (xhr.status >= 200 && xhr.status < 300) { resolve(data); return; }
          let msg = data && data.error ? data.error : httpErrorText(xhr.status, xhr.responseText);
          if (xhr.status === 413) msg = data && data.error ? data.error : 'File is larger than the server limit';
          reject(new Error(msg));
        };
        xhr.onerror = function () { session.xhrs.delete(xhr); reject(new Error('Network error')); };
        xhr.onabort = function () { session.xhrs.delete(xhr); reject(new Error('Cancelled')); };
        xhr.ontimeout = function () { session.xhrs.delete(xhr); reject(new Error('Timed out')); };
        xhr.send(item.file);
      });
    }
    
    // One archive, extracted server-side. The same XHR session as a file upload,
    // so Cancel aborts it too.
    function uploadArchive(file, onProgress) {
      return new Promise(function (resolve, reject) {
        let url = API + '/upload-archive?path=' + encodeURIComponent(currentPath) +
          '&onConflict=' + encodeURIComponent(upState.policy);
        if (upState.mode) url += '&mode=' + encodeURIComponent(upState.mode);
        if (upState.skipHidden) url += '&skipHidden=1';
        const xhr = new XMLHttpRequest();
        const session = upState.abort || { xhrs: new Set() };
        session.xhrs.add(xhr);
        xhr.open('POST', url, true);
        xhr.timeout = 60 * 60 * 1000;
        xhr.setRequestHeader('content-type', 'application/octet-stream');
        xhr.upload.onprogress = function (e) { if (e.lengthComputable) onProgress(e.loaded, e.total); };
        xhr.onload = function () {
          session.xhrs.delete(xhr);
          let data = {};
          try { data = JSON.parse(xhr.responseText); } catch (e) { /* nginx HTML error page */ }
          if (xhr.status >= 200 && xhr.status < 300 && data && data.ok) { resolve(data); return; }
          reject(new Error((data && data.error) || httpErrorText(xhr.status, xhr.responseText)));
        };
        xhr.onerror = function () { session.xhrs.delete(xhr); reject(new Error('Network error')); };
        xhr.onabort = function () { session.xhrs.delete(xhr); reject(new Error('Cancelled')); };
        xhr.ontimeout = function () { session.xhrs.delete(xhr); reject(new Error('Timed out')); };
        xhr.send(file);
      });
    }
    
    // Wrapper so a throw can never leave the dialog stuck in the running state.
    // The re-entrancy guard lives HERE as well: a second call must not fall
    // through the finally and clear the state of the run that is still going.
    async function startUpload() {
      if (upState.running) return;
      try {
        await runUpload();
      } finally {
        upState.running = false;
        upState.abort = null;
      }
    }
    
    async function runUpload() {
      if (upState.running) return;
      upState.policy = document.getElementById('up-conflict').value;
      upState.keepTop = document.getElementById('up-keep-top').checked;
      upState.skipHidden = document.getElementById('up-skip-hidden').checked;
      upState.extract = document.getElementById('up-extract').checked;
      upState.mode = document.getElementById('up-mode').value;
    
      const plan = buildUploadPlan(upState.items, upState.folderMode, upState.keepTop, upState.skipHidden)
        .map(function (p, i) { return { file: p.file, dir: p.dir, rel: p.rel, origRel: p.origRel, key: i }; });
      const planned = plan.filter(function (p) { return !!p.file; });
      const dirs = plan.filter(function (p) { return !!p.dir; });
      const archives = upState.extract ? planned.filter(function (p) { return isArchiveName(p.file.name); }) : [];
      const files = planned.filter(function (p) { return archives.indexOf(p) === -1; });
    
      const startBtn = document.getElementById('up-start');
      const cancelBtn = document.getElementById('up-cancel');
      const list = document.getElementById('up-list');
      const bar = document.getElementById('up-bar-fill');
      const barBox = document.getElementById('up-bar');
      const count = document.getElementById('up-count');
    
      upState.running = true;
      upState.abort = { aborted: false, xhrs: new Set() };
      startBtn.classList.add('hidden');
      cancelBtn.textContent = 'Cancel';
      document.getElementById('up-pre').classList.add('hidden');
      document.getElementById('up-progress').classList.remove('hidden');
      list.innerHTML = '';
    
      const rows = new Map();
      const addRow = function (rel, key) {
        const row = document.createElement('div');
        row.className = 'up-row';
        const name = document.createElement('span');
        name.className = 'up-name';
        name.textContent = rel;
        const status = document.createElement('span');
        status.className = 'up-status';
        status.textContent = '…';
        row.appendChild(name);
        row.appendChild(status);
        // Reading scrollHeight forces a layout: only do it while the list is
        // pinned to the bottom, and keep the DOM bounded on huge trees.
        const pinned = list.scrollTop + list.clientHeight >= list.scrollHeight - 24;
        list.appendChild(row);
        if (pinned) list.scrollTop = list.scrollHeight;
        if (list.children.length > UPLOAD_MAX_ROWS) {
          const first = list.firstChild;
          if (first) list.removeChild(first);
        }
        rows.set(key, { row: row, status: status });
      };
    
      let totalBytes = 0;
      for (const f of planned) totalBytes += f.file.size;
      let completedBytes = 0;
      let done = 0;
      const totalUnits = archives.length + files.length;
      let okCount = 0;
      let skipCount = 0;
      let failCount = 0;
      let extractedFiles = 0;
      const failures = [];
      const inflight = new Map();
      const recompute = function () {
        let live = 0;
        inflight.forEach(function (v) { live += v; });
        const pct = totalBytes > 0
          ? Math.min(100, Math.round(((completedBytes + live) / totalBytes) * 100))
          : (totalUnits ? Math.round((done / totalUnits) * 100) : 100);
        bar.style.width = pct + '%';
        if (barBox) barBox.setAttribute('aria-valuenow', String(pct));
        count.textContent = done + ' of ' + totalUnits + ' item' + (totalUnits === 1 ? '' : 's') + ' · ' +
          fmt(completedBytes + live) + ' of ' + fmt(totalBytes);
      };
      recompute();
    
      // Empty directories first, so a tree with no files still appears.
      for (const d of dirs) {
        if (!upState.abort || upState.abort.aborted) break;
        try {
          await api('/mkdir', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ path: currentPath, rel: d.rel }),
          });
        } catch (e) { /* already exists is fine */ }
      }
    
      // Archives are extracted one at a time (one server-side unpack at a time),
      // then the plain files stream through the usual worker pool.
      for (const item of archives) {
        if (upState.abort && upState.abort.aborted) break;
        addRow(item.rel, item.key);
        const row = rows.get(item.key);
        inflight.set(item.key, 0);
        row.status.textContent = 'extracting…';
        try {
          const data = await uploadArchive(item.file, function (loaded) {
            inflight.set(item.key, loaded);
            recompute();
          });
          inflight.delete(item.key);
          completedBytes += item.file.size;
          okCount += 1;
          extractedFiles += data.installed || 0;
          skipCount += data.skipped || 0;
          row.row.classList.add('ok');
          row.status.textContent = 'extracted ' + (data.installed || 0) +
            (data.skipped ? ', ' + data.skipped + ' skipped' : '') +
            (data.failed ? ', ' + data.failed + ' failed' : '');
          if (data.failed) failCount += data.failed;
        } catch (e) {
          inflight.delete(item.key);
          if (upState.abort && upState.abort.aborted) {
            row.row.classList.add('skip');
            row.status.textContent = 'cancelled';
          } else {
            failCount += 1;
            row.row.classList.add('err');
            row.status.textContent = e.message;
            failures.push({ file: item.file, dir: item.dir, rel: item.origRel });
          }
        }
        done += 1;
        recompute();
      }
    
      const queue = files.slice();
      const worker = async function () {
        for (;;) {
          if (!upState.abort || upState.abort.aborted) return;
          const item = queue.shift();
          if (!item) return;
          addRow(item.rel, item.key);
          const row = rows.get(item.key);
          inflight.set(item.key, 0);
          try {
            const data = await uploadOne(item, function (loaded) {
              inflight.set(item.key, loaded);
              recompute();
            });
            inflight.delete(item.key);
            completedBytes += item.file.size;
            if (data && data.skipped) {
              skipCount += 1;
              row.row.classList.add('skip');
              row.status.textContent = 'skipped';
            } else {
              okCount += 1;
              row.row.classList.add('ok');
              const saved = data && data.savedAs;
              row.status.textContent = saved && saved !== item.rel ? 'ok → ' + saved : 'ok';
            }
          } catch (e) {
            inflight.delete(item.key);
            if (upState.abort && upState.abort.aborted) {
              row.row.classList.add('skip');
              row.status.textContent = 'cancelled';
            } else {
              failCount += 1;
              row.row.classList.add('err');
              row.status.textContent = e.message;
              failures.push({ file: item.file, dir: item.dir, rel: item.origRel });
            }
          }
          done += 1;
          recompute();
        }
      };
      const lanes = Math.min(UPLOAD_CONCURRENCY, files.length);
      const running = [];
      for (let i = 0; i < lanes; i += 1) running.push(worker());
      await Promise.all(running);
    
      cancelBtn.textContent = 'Close';
      const aborted = !!(upState.abort && upState.abort.aborted);
      const archiveNote = extractedFiles ? ', ' + extractedFiles + ' file(s) extracted' : '';
      if (aborted) {
        count.textContent = 'Cancelled — ' + okCount + ' uploaded' + (skipCount ? ', ' + skipCount + ' skipped' : '');
        toast(count.textContent, 'info');
      } else if (failCount > 0) {
        count.textContent = okCount + ' uploaded' + archiveNote + ', ' + failCount + ' failed' + (skipCount ? ', ' + skipCount + ' skipped' : '');
        startBtn.classList.remove('hidden');
        startBtn.textContent = 'Retry failed';
        startBtn.onclick = function () { openUploadDialog(failures.slice(), upState.folderMode); };
        toast(failCount + ' item(s) failed', 'error');
      } else {
        count.textContent = okCount + ' uploaded' + archiveNote + (skipCount ? ', ' + skipCount + ' skipped' : '');
        toast(count.textContent, okCount > 0 ? 'success' : 'info');
      }
      await loadDir(currentPath);
      loadStorage();
    }
    
    document.getElementById('btn-upload').onclick = pickUploadFiles;
    document.getElementById('btn-upload-folder').onclick = pickUploadFolder;
    
    document.getElementById('up-cancel').onclick = function () {
      if (upState.running && upState.abort) {
        upState.abort.aborted = true;
        upState.abort.xhrs.forEach(function (xhr) { try { xhr.abort(); } catch (e) {} });
      } else {
        upState.items = [];
        document.getElementById('upload-dialog').close();
      }
    };
    document.getElementById('upload-dialog').addEventListener('cancel', function (e) {
      if (upState.running) {
        e.preventDefault();
        document.getElementById('up-cancel').click();
      } else {
        upState.items = [];
      }
    });
    
    // Drag & Drop
    let dragCounter = 0;
    const mainEl = document.getElementById('main');
    const dropOverlay = document.getElementById('drop-overlay');
    
    mainEl.addEventListener('dragenter', (e) => {
      e.preventDefault();
      dragCounter++;
      dropOverlay.classList.add('active');
    });
    mainEl.addEventListener('dragleave', (e) => {
      e.preventDefault();
      dragCounter--;
      if (dragCounter <= 0) {
        dragCounter = 0;
        dropOverlay.classList.remove('active');
      }
    });
    mainEl.addEventListener('dragover', (e) => { e.preventDefault(); });
    mainEl.addEventListener('drop', async (e) => {
      e.preventDefault();
      dragCounter = 0;
      dropOverlay.classList.remove('active');
      if (!uploadAllowed()) { toast('This location is read-only', 'error'); return; }
      try {
        // Walking a big tree takes a moment and shows nothing yet: say so.
        toast('Reading dropped items…', 'info');
        const result = await itemsFromDrop(e.dataTransfer);
        if (result.error) { toast(result.error, 'error'); return; }
        const items = result.items || [];
        if (items.length === 0) { toast('Nothing to upload', 'info'); return; }
        const hasDir = items.some(function (i) { return !!i.dir || i.rel.indexOf('/') !== -1; });
        openUploadDialog(items, hasDir);
      } catch (err) {
        toast('Could not read the dropped items: ' + err.message, 'error');
      }
    });
    // ─── Download ───────────────────────────────────────
    document.getElementById('btn-download-sel').onclick = function() {
      const paths = Array.from(selectedPaths);
      if (paths.length === 0) return;
    
      if (paths.length === 1) {
        // Check if it's a single file
        const tr = document.querySelector('tr[data-path="' + CSS.escape(paths[0]) + '"]');
        // Simpler: just try download, backend checks if file
        // But we need to know if it's a file or dir
        // For single file: direct download with rename option
        // For single dir or multiple: archive
        checkSingleFile(paths[0]);
      } else {
        showDownloadDialog(paths, true);
      }
    };
    
    async function checkSingleFile(filePath) {
      // Probe the entry type BEFORE showing the dialog: /api/list answers
      // 200 for a directory and 400 for a file. A FILE downloads AS-IS (raw
      // byte stream — no archive wrapper); a FOLDER archives, with the
      // tar.gz/zip choice surfaced. (The old flow hid the format field for
      // both and discovered directories via a failed download round-trip.)
      const name = filePath.split('/').pop();
      document.getElementById('dl-name').value = name;
      let isDir = false;
      try {
        const res = await fetch(API + '/list?path=' + encodeURIComponent(filePath));
        isDir = res.ok;
      } catch {
        isDir = false;
      }
      document.getElementById('dl-format-field').classList.toggle('hidden', !isDir);
      const hint = document.getElementById('dl-hint');
      hint.textContent = isDir
        ? 'Archives "' + name + '" — the folder itself is the archive root.'
        : 'Downloads "' + name + '" as-is — no archive.';
      hint.style.display = 'block';
      const dlg = document.getElementById('download-dialog');
      dlg.dataset.singleFile = filePath;
      dlg.dataset.singleDir = isDir ? '1' : '';
      dlg.dataset.multi = '';
      dlg.showModal();
    }
    
    function showDownloadDialog(paths, isMulti) {
      document.getElementById('dl-name').value = 'archive';
      document.getElementById('dl-format-field').classList.remove('hidden');
      document.getElementById('download-dialog').dataset.multi = JSON.stringify(paths);
      document.getElementById('download-dialog').dataset.singleFile = '';
      document.getElementById('download-dialog').showModal();
    }
    
    document.getElementById('dl-confirm').onclick = async function() {
      const dlg = document.getElementById('download-dialog');
      const name = document.getElementById('dl-name').value || 'download';
      const format = document.getElementById('dl-format').value;
      const singleFile = dlg.dataset.singleFile;
      const multi = dlg.dataset.multi;
    
      dlg.close();
    
      if (singleFile) {
        if (dlg.dataset.singleDir === '1') {
          // Folder — archive it (anchored at its parent: the archive root IS
          // the folder). The format selector was surfaced in the dialog.
          await downloadArchive([singleFile], name, format);
        } else {
          // File — download as-is: a raw byte stream, no archive wrapper.
          try {
            const res = await fetch(API + '/download?path=' + encodeURIComponent(singleFile) + '&name=' + encodeURIComponent(name), { method: 'GET' });
            if (!res.ok) throw new Error('Download failed (' + res.status + ')');
            const blob = await res.blob();
            triggerDownload(blob, name);
            toast('Downloaded ' + name, 'success');
          } catch (e) {
            toast('Download failed: ' + e.message, 'error');
          }
        }
      } else if (multi) {
        const paths = JSON.parse(multi);
        await downloadArchive(paths, name, format);
      }
    };
    
    async function downloadArchive(paths, name, format) {
      toast('Creating archive...', 'info');
      try {
        const res = await fetch(API + '/archive', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ paths, format, name }),
        });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          throw new Error(data.error || 'Archive failed');
        }
        const blob = await res.blob();
        const ext = format === 'tar.gz' ? '.tar.gz' : '.zip';
        triggerDownload(blob, name + ext);
        toast('Archive downloaded', 'success');
      } catch (e) {
        toast('Archive failed: ' + e.message, 'error');
      }
    }
    
    function triggerDownload(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }
    
    document.getElementById('dl-cancel').onclick = () => document.getElementById('download-dialog').close();
    
    // ─── Delete ─────────────────────────────────────────
    function askDelete(paths) {
      if (!paths || paths.length === 0) return;
      const msg = paths.length === 1
        ? 'Delete "' + paths[0].split('/').pop() + '"? This cannot be undone.'
        : 'Delete ' + paths.length + ' items? This cannot be undone.';
      document.getElementById('confirm-message').textContent = msg;
      document.getElementById('confirm-dialog').dataset.paths = JSON.stringify(paths);
      document.getElementById('confirm-dialog').showModal();
    }
    
    document.getElementById('btn-delete-sel').onclick = function() {
      askDelete(Array.from(selectedPaths));
    };
    
    document.getElementById('confirm-yes').onclick = async function() {
      const dlg = document.getElementById('confirm-dialog');
      const paths = JSON.parse(dlg.dataset.paths);
      dlg.close();
      toast('Deleting...', 'info');
      try {
        await api('/delete', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ paths }),
        });
        toast('Deleted ' + paths.length + ' item(s)', 'success');
        selectedPaths.clear();
        await loadDir(currentPath);
        loadStorage();
      } catch (e) {
        toast('Delete failed: ' + e.message, 'error');
      }
    };
    
    document.getElementById('confirm-cancel').onclick = () => document.getElementById('confirm-dialog').close();
    
    // ─── New Folder ─────────────────────────────────────
    document.getElementById('btn-new-folder').onclick = function() {
      document.getElementById('mkdir-input').value = '';
      document.getElementById('mkdir-dialog').showModal();
      setTimeout(() => document.getElementById('mkdir-input').focus(), 50);
    };
    
    document.getElementById('mkdir-confirm').onclick = async function() {
      const name = document.getElementById('mkdir-input').value.trim();
      if (!name) return;
      document.getElementById('mkdir-dialog').close();
      try {
        await api('/mkdir', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ path: joinPath(currentPath, name) }),
        });
        toast('Folder created', 'success');
        await loadDir(currentPath);
        loadStorage();
      } catch (e) {
        toast('Failed: ' + e.message, 'error');
      }
    };
    
    document.getElementById('mkdir-cancel').onclick = () => document.getElementById('mkdir-dialog').close();
    
    // ─── New File ───────────────────────────────────────
    document.getElementById('btn-new-file').onclick = function() {
      document.getElementById('newfile-input').value = '';
      document.getElementById('newfile-dialog').showModal();
      setTimeout(() => document.getElementById('newfile-input').focus(), 50);
    };
    
    document.getElementById('newfile-confirm').onclick = async function() {
      const name = document.getElementById('newfile-input').value.trim();
      if (!name) return;
      document.getElementById('newfile-dialog').close();
      const fullPath = joinPath(currentPath, name);
      try {
        await api('/write?path=' + encodeURIComponent(fullPath), {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content: '' }),
        });
        toast('File created', 'success');
        await loadDir(currentPath);
        openEditor(fullPath, { name, ext: name.split('.').pop().toLowerCase(), type: 'file' });
        loadStorage();
      } catch (e) {
        toast('Failed: ' + e.message, 'error');
      }
    };
    
    document.getElementById('newfile-cancel').onclick = () => document.getElementById('newfile-dialog').close();
    
    // ─── Rename ─────────────────────────────────────────
    function showRenameDialog(filePath) {
      const name = filePath.split('/').pop();
      document.getElementById('rename-input').value = name;
      document.getElementById('rename-dialog').dataset.path = filePath;
      document.getElementById('rename-dialog').showModal();
      setTimeout(() => {
        const inp = document.getElementById('rename-input');
        inp.focus();
        inp.select();
      }, 50);
    }
    
    document.getElementById('rename-confirm').onclick = async function() {
      const dlg = document.getElementById('rename-dialog');
      const oldPath = dlg.dataset.path;
      const newName = document.getElementById('rename-input').value.trim();
      if (!newName) return;
      dlg.close();
      const dir = oldPath.split('/').slice(0, -1).join('/');
      const newPath = joinPath(dir, newName);
      try {
        await api('/rename', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ from: oldPath, to: newPath }),
        });
        toast('Renamed', 'success');
        if (editorCurrentPath === oldPath) editorCurrentPath = newPath;
        await loadDir(currentPath);
        loadStorage();
      } catch (e) {
        toast('Rename failed: ' + e.message, 'error');
      }
    };
    
    document.getElementById('rename-cancel').onclick = () => document.getElementById('rename-dialog').close();
    
    // ─── Copy / Move / Duplicate wiring ─────────────────
    document.getElementById('btn-copy-sel').onclick = function () { setClipboard('copy'); };
    document.getElementById('btn-move-sel').onclick = function () { setClipboard('move'); };
    document.getElementById('btn-dup-sel').onclick = duplicateSelection;
    document.getElementById('btn-paste').onclick = openPasteDialog;
    document.getElementById('paste-confirm').onclick = runPaste;
    document.getElementById('paste-cancel').onclick = function () { document.getElementById('paste-dialog').close(); };
    
    // Ctrl/Cmd+C / X / V act on the file selection, but only when they cannot
    // mean "copy this text": collapsed selection, no input focused, no Monaco
    // editor and no open dialog. Otherwise the browser keeps the shortcut.
    function typingTarget(el) {
      if (!el) return false;
      const tag = String(el.tagName || '').toLowerCase();
      if (tag === 'input' || tag === 'textarea' || tag === 'select') return true;
      if (el.isContentEditable) return true;
      return !!(el.closest && el.closest('.monaco-editor'));
    }
    
    document.addEventListener('keydown', function (e) {
      if (!(e.ctrlKey || e.metaKey) || e.altKey || e.shiftKey) return;
      const key = String(e.key || '').toLowerCase();
      if (key !== 'c' && key !== 'x' && key !== 'v') return;
      if (typingTarget(e.target)) return;
      if (document.querySelector('dialog[open]')) return;
      const sel = window.getSelection ? window.getSelection() : null;
      if (key !== 'v' && sel && sel.isCollapsed === false && String(sel).length > 0) return;
      if (key === 'v') {
        if (!clipboard || clipboard.paths.length === 0) return;
        e.preventDefault();
        openPasteDialog();
        return;
      }
      if (selectedPaths.size === 0) return;
      e.preventDefault();
      setClipboard(key === 'x' ? 'move' : 'copy');
    });
    
    // ─── Refresh ────────────────────────────────────────
    document.getElementById('btn-refresh').onclick = function() {
      loadDir(currentPath);
      loadStorage();
    };
    
    // ─── Monaco Editor ──────────────────────────────────
    function initMonaco() {
      if (typeof require === 'undefined') return;
      require.config({ paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs' } });
      require(['vs/editor/editor.main'], function() {
        monacoReady = true;
      });
    }
    initMonaco();
    
    // Extensions the server can serve inline (mirrors PREVIEW_MIME in
    // data_manager.mjs). Images/PDF/video/audio render in the dialog instead of
    // the "binary file, use download" placeholder.
    const PREVIEW_IMAGE = ['png', 'jpg', 'jpeg', 'gif', 'webp', 'svg', 'bmp', 'avif', 'ico'];
    const PREVIEW_VIDEO = ['mp4', 'webm', 'mov', 'm4v', 'ogv'];
    const PREVIEW_AUDIO = ['mp3', 'wav', 'ogg', 'm4a', 'flac', 'aac'];
    const PREVIEW_PDF = ['pdf'];
    // Rendered server-side by /api/preview (see handlePreviewDoc in
    // data_manager.mjs) — markdown is rendered there, HTML is served verbatim.
    const PREVIEW_MARKDOWN = ['md', 'markdown', 'mdown', 'mkd'];
    const PREVIEW_HTML = ['html', 'htm'];
    
    function previewKind(ext) {
      const e = String(ext || '').toLowerCase();
      if (PREVIEW_IMAGE.includes(e)) return 'image';
      if (PREVIEW_VIDEO.includes(e)) return 'video';
      if (PREVIEW_AUDIO.includes(e)) return 'audio';
      if (PREVIEW_PDF.includes(e)) return 'pdf';
      if (PREVIEW_MARKDOWN.includes(e)) return 'markdown';
      if (PREVIEW_HTML.includes(e)) return 'html';
      return null;
    }
    
    function previewUrl(filePath, kind) {
      if (kind === 'markdown' || kind === 'html') {
        // The rendered page carries its own stylesheet, so it needs to know
        // which theme the data manager is in.
        const theme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
        return API + '/preview?path=' + encodeURIComponent(filePath) + '&theme=' + theme;
      }
      return API + '/download?inline=1&path=' + encodeURIComponent(filePath);
    }
    
    function renderPreview(container, filePath, kind, name) {
      const url = previewUrl(filePath, kind);
      const wrap = document.createElement('div');
      wrap.className = 'preview-wrap';
      let el;
      if (kind === 'image') {
        el = document.createElement('img');
        el.alt = name || 'preview';
      } else if (kind === 'video') {
        el = document.createElement('video');
        el.controls = true;
        el.playsInline = true;
      } else if (kind === 'audio') {
        el = document.createElement('audio');
        el.controls = true;
      } else if (kind === 'markdown' || kind === 'html') {
        // Rendered document. MARKDOWN is our own generated, escaped HTML: it is
        // framed same-origin ('allow-same-origin' without 'allow-scripts' — no
        // script can run, so it cannot reach this page's DOM) so that a link
        // clicked inside it is a SAME-SITE navigation and keeps the session
        // cookies. A sandboxed iframe would drop them and every in-document link
        // would bounce off the ingress.
        // RAW .html is arbitrary user markup, so it keeps the empty sandbox: no
        // scripts, no same-origin, no forms, no top navigation.
        el = document.createElement('iframe');
        el.setAttribute('sandbox', kind === 'markdown' ? 'allow-same-origin' : '');
        el.title = name || 'Document preview';
      } else {
        // PDF: native viewer via <iframe>. Range support on the endpoint lets
        // the browser's viewer jump to a page without downloading everything.
        el = document.createElement('iframe');
        el.title = name || 'PDF preview';
      }
      el.src = url;
      // Document previews use the .preview-doc sizing rule (fill the dialog);
      // the media kinds keep preview-<kind> for their own rules.
      el.className = (kind === 'markdown' || kind === 'html')
        ? 'preview-el preview-doc'
        : 'preview-el preview-' + kind;
      if (kind === 'markdown' || kind === 'html') {
        // A rendered document navigates on its own (in-document links, the back
        // chip). Track it, so Source / Rename / Delete / Save act on the page
        // being displayed instead of the file the dialog was opened with.
        previewFrame = el;
        el.addEventListener('load', syncEditorFromFrame);
      }
      el.onerror = () => {
        wrap.innerHTML = '';
        const msg = document.createElement('div');
        msg.className = 'preview-error';
        msg.textContent = 'Could not preview this file. Use Download to open it locally.';
        wrap.appendChild(msg);
      };
      wrap.appendChild(el);
      container.appendChild(wrap);
    }
    
    // View state for .md / .html, which are previewed by default but stay
    // editable: the Source toggle swaps the rendered iframe for the editor,
    // and only that mode can Save.
    let editorViewMode = 'preview';
    let editorCurrentEntry = null;
    let previewFrame = null;
    
    // The iframe is same-origin for markdown, so its current URL is readable. It
    // is only adopted when it really is a preview page (not the file browser the
    // folder deep-link opens), and the dialog is NOT re-rendered here — the frame
    // is already showing that document.
    function syncEditorFromFrame() {
      if (!previewFrame || !editorCurrentPath) return;
      let target = null;
      try {
        const u = new URL(previewFrame.contentWindow.location.href);
        if (!/\/api\/preview$/.test(u.pathname)) return;
        target = u.searchParams.get('path');
      } catch (e) {
        return; // opaque origin (.html preview): nothing readable, nothing to do
      }
      if (!target || target === editorCurrentPath) return;
      editorCurrentPath = target;
      const nm = target.split('/').pop() || target;
      const ext = (nm.split('.').pop() || '').toLowerCase();
      editorCurrentEntry = { name: nm, ext: ext, type: 'file' };
      document.getElementById('edit-title').textContent = nm;
      const kind = previewKind(ext);
      document.getElementById('edit-meta').textContent = kind ? kind.toUpperCase() + ' preview' : '';
    }
    
    async function openEditor(filePath, entry) {
      if (editorCurrentPath !== filePath) editorViewMode = 'preview';
      editorCurrentPath = filePath;
      editorCurrentEntry = entry;
      document.getElementById('edit-title').textContent = entry.name;
      const dlg = document.getElementById('edit-dialog');
      if (!dlg.open) dlg.showModal();
      await renderEditorBody();
    }
    
    async function renderEditorBody() {
      const filePath = editorCurrentPath;
      const entry = editorCurrentEntry || {
        name: filePath.split('/').pop(),
        ext: (filePath.split('.').pop() || '').toLowerCase(),
        type: 'file',
      };
      const container = document.getElementById('editor-container');
      container.innerHTML = '';
      if (monacoEditor) { monacoEditor.dispose(); monacoEditor = null; }
    
      const kind = previewKind(entry.ext);
      const isDoc = kind === 'markdown' || kind === 'html';
      const toggle = document.getElementById('btn-editor-source');
      toggle.style.display = isDoc ? '' : 'none';
      if (isDoc) toggle.textContent = editorViewMode === 'source' ? 'Rendered' : 'Source';
    
      // Previewable media never goes through /read (which returns text and
      // bails on binary) — render it straight from the inline endpoint. A
      // markdown/HTML file is previewed too, unless the user asked for source.
      if (kind && !(isDoc && editorViewMode === 'source')) {
        renderPreview(container, filePath, kind, entry.name);
        document.getElementById('edit-meta').textContent = kind.toUpperCase() + ' preview' + (entry.size ? ' \u00b7 ' + fmt(entry.size) : '');
        document.getElementById('btn-editor-save').disabled = true;
        return;
      }
    
      try {
        const data = await api('/read?path=' + encodeURIComponent(filePath));
    
        if (data.tooLarge) {
          container.innerHTML = '<div style="padding:20px;color:var(--text-muted);">File is too large to edit (' + fmt(data.size) + '). Use download instead.</div>';
          document.getElementById('edit-meta').textContent = fmt(data.size);
          document.getElementById('btn-editor-save').disabled = true;
          return;
        }
    
        if (data.binary) {
          container.innerHTML = '<div style="padding:20px;color:var(--text-muted);">Binary file (' + fmt(data.size) + '). Use download instead.</div>';
          document.getElementById('edit-meta').textContent = fmt(data.size);
          document.getElementById('btn-editor-save').disabled = true;
          return;
        }
    
        document.getElementById('btn-editor-save').disabled = false;
        document.getElementById('edit-meta').textContent = fmt(data.size) + ' \u00b7 ' + (entry.ext || 'plaintext');
    
        const lang = langForExt(entry.ext);
    
        if (monacoReady) {
          if (monacoEditor) monacoEditor.dispose();
          monacoEditor = monaco.editor.create(container, {
            value: data.content,
            language: lang,
            theme: 'vs-dark',
            automaticLayout: true,
            fontSize: 13,
            minimap: { enabled: false },
            scrollBeyondLastLine: false,
            wordWrap: 'on',
            tabSize: 2,
          });
        } else {
          const ta = document.createElement('textarea');
          ta.id = 'editor-textarea';
          ta.value = data.content;
          container.appendChild(ta);
        }
      } catch (e) {
        container.innerHTML = '<div style="padding:20px;color:var(--danger);">Error: ' + escHtml(e.message) + '</div>';
      }
    }
    
    document.getElementById('btn-editor-save').onclick = async function() {
      if (!editorCurrentPath) return;
      let content;
      if (monacoEditor) {
        content = monacoEditor.getValue();
      } else {
        const ta = document.getElementById('editor-textarea');
        if (ta) content = ta.value;
      }
      if (content === undefined) return;
      try {
        await api('/write?path=' + encodeURIComponent(editorCurrentPath), {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content }),
        });
        toast('Saved', 'success');
        await loadDir(currentPath);
        loadStorage();
      } catch (e) {
        toast('Save failed: ' + e.message, 'error');
      }
    };
    
    document.getElementById('btn-editor-download').onclick = function() {
      if (!editorCurrentPath) return;
      const name = editorCurrentPath.split('/').pop();
      window.location.href = API + '/download?path=' + encodeURIComponent(editorCurrentPath) + '&name=' + encodeURIComponent(name);
    };
    
    document.getElementById('btn-editor-rename').onclick = function() {
      if (!editorCurrentPath) return;
      document.getElementById('edit-dialog').close();
      showRenameDialog(editorCurrentPath);
    };
    
    document.getElementById('btn-editor-delete').onclick = async function() {
      if (!editorCurrentPath) return;
      const name = editorCurrentPath.split('/').pop();
      document.getElementById('confirm-message').textContent = 'Delete "' + name + '"? This cannot be undone.';
      document.getElementById('confirm-dialog').dataset.paths = JSON.stringify([editorCurrentPath]);
      document.getElementById('edit-dialog').close();
      document.getElementById('confirm-dialog').showModal();
    };
    
    document.getElementById('btn-editor-source').onclick = async function() {
      if (!editorCurrentPath) return;
      editorViewMode = editorViewMode === 'source' ? 'preview' : 'source';
      await renderEditorBody();
    };
    
    document.getElementById('btn-editor-close').onclick = function() {
      if (monacoEditor) { monacoEditor.dispose(); monacoEditor = null; }
      previewFrame = null;
      editorCurrentPath = null;
      document.getElementById('edit-dialog').close();
    };
    
    // ─── Init ───────────────────────────────────────────
    (async function init() {
      await loadRoots();
      loadStorage();
      setInterval(loadStorage, 30000);
    })();
    </script>
    <footer class="hpe-footer app-footer">Powered by HPE Private Cloud AI</footer>
    <script>
    (function() {
      var themeLight = document.getElementById("themeLight");
      var themeDark = document.getElementById("themeDark");
      var themeSwitch = document.getElementById("themeSwitch");
      function applyTheme(theme) {
        document.documentElement.setAttribute("data-theme", theme);
        try { localStorage.setItem("theme", theme); } catch (e) {}
        themeSwitch.checked = theme === "dark";
        themeLight.classList.toggle("active", theme === "light");
        themeDark.classList.toggle("active", theme === "dark");
      }
      applyTheme(document.documentElement.getAttribute("data-theme") || "light");
      themeLight.addEventListener("click", function() { applyTheme("light"); });
      themeDark.addEventListener("click", function() { applyTheme("dark"); });
      themeSwitch.addEventListener("change", function() { applyTheme(themeSwitch.checked ? "dark" : "light"); });
    })();
    </script>
    </body>
