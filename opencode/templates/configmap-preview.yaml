apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-preview-config
  namespace: {{ .Release.Namespace }}
  labels:
    hpe-ezua/type: vendor-service
    hpe-ezua/app: {{ .Chart.Name }}
data:
  nginx.conf: |
    # Non-root-safe (tr211): a tenant-uid nginx cannot write the default
    # /var/run/nginx.pid. /tmp is world-writable inside the container.
    pid /tmp/nginx.pid;
    worker_processes 1;
    events {
      worker_connections 1024;
    }
    http {
      # nginx defaults to 1 MB, which rejects a pasted/dropped image once the
      # browser base64-encodes it into a prompt body (HTTP 413, before the app
      # sees the request). Tunable via nginx.clientMaxBodySize.
      client_max_body_size {{ .Values.nginx.clientMaxBodySize | default "64m" }};

      map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
      }
      server {
        listen 8082;
        server_name _;

        # --- Single in-pod entry point -------------------------------------
        # Every request to this pod (UI, terminal, data manager, previews) is
        # gated by the signed session cookie validated by the in-pod auth
        # validator (auth_validator.mjs on 127.0.0.1:7684).
        auth_request /__auth;

        # Unauthenticated / expired session on a pod host -> send to the main
        # login page instead of showing an error.
        error_page 401 = @oc_login;
        location @oc_login {
        # $host = the host the user came in on (the main opencode host in
        # every user-facing routing context). Deliberately NOT tied to the
        # ezua.virtualService.endpoint value: it ships as a platform-pipeline
        # placeholder, which breaks hand-applied ConfigMaps (nginx fails on
        # the unknown variable at startup).
        return 302 https://$host;
        }

        location = /__auth {
          internal;
          proxy_pass http://127.0.0.1:7684;
          proxy_pass_request_body off;
          proxy_set_header Content-Length "";
          proxy_set_header Cookie $http_cookie;
        }

        # UI port: OpenChamber on 3000 (chamber mode) or opencode web on 4096.
        set $ui_port {{ if eq .Values.ui.mode "openchamber" }}3000{{ else }}4096{{ end }};

        # --- UI ------------------------------------------------------------
        location ^~ /terminal {
          proxy_pass http://127.0.0.1:7683;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_buffering off;
        }
        location ^~ /term {
          proxy_pass http://127.0.0.1:7681;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_buffering off;
        }
        location ^~ /data-manager {
          # Folder / large-file uploads: the http{}-level 64m cap is sized for
          # the UI (a pasted image), not for a model or dataset tree. This
          # location gets its own, operator-tunable ceiling. Keep
          # dataManager.maxUploadMb (the server-side guard) at or above it.
          client_max_body_size {{ .Values.dataManager.clientMaxBodySize | default "2g" }};
          # Stream the body straight to data_manager.mjs instead of spooling
          # the whole request into /var/cache/nginx first — the node process
          # writes it to disk itself (temp file + rename).
          proxy_request_buffering off;
          proxy_read_timeout 1800s;
          proxy_send_timeout 1800s;
          proxy_pass http://127.0.0.1:7682;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_buffering off;
        }
        # Legacy underscore path: redirect pre-rename bookmarks to the new route.
        location ^~ /data_manager {
          client_max_body_size {{ .Values.dataManager.clientMaxBodySize | default "2g" }};
          proxy_request_buffering off;
          proxy_read_timeout 1800s;
          proxy_send_timeout 1800s;
          rewrite ^/data_manager(/.*)$ /data-manager$1 permanent;
          return 301 /data-manager;
        }
        location ~ ^/__preview/(?<preview_port>[0-9]+)(?<preview_rest>.*)$ {
          if ($preview_port !~ '^[1-9][0-9]{3,4}$') {
            return 403;
          }
          proxy_pass http://127.0.0.1:$preview_port$preview_rest;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_buffering off;
        }

        # --- Fallback / main app -------------------------------------------
        location / {
          proxy_pass http://127.0.0.1:$ui_port;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-Host $host;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          # The upstream Basic-auth header is generated at container start from
          # the secret-backed OPENCODE_SERVER_USERNAME/PASSWORD env (see the
          # preview-proxy command), so no credential is baked into this file.
          include /tmp/opencode-upstream-auth.conf;
          proxy_buffering off;
          proxy_read_timeout 660s;
          proxy_send_timeout 660s;
        }
      }
    }
  auth_validator.mjs: |
    import http from 'node:http'
    import crypto from 'node:crypto'

    const PORT = Number(process.env.AUTH_VALIDATOR_PORT || '7684')
    const SECRET = process.env.SESSION_KEY || ''
    const MY_SLUG = process.env.USER_SLUG || ''
    const COOKIE = 'oc_sess'

    function readCookie(req) {
      const header = req.headers.cookie || ''
      for (const part of header.split(';')) {
        const [name, ...rest] = part.trim().split('=')
        if (name === COOKIE) return decodeURIComponent(rest.join('='))
      }
      return null
    }

    function valid(req) {
      if (!SECRET || !MY_SLUG) return false
      const value = readCookie(req)
      if (!value) return false
      const dot = value.lastIndexOf('.')
      if (dot <= 0) return false
      const payloadB64 = value.slice(0, dot)
      const sig = value.slice(dot + 1)
      const expected = crypto.createHmac('sha256', SECRET).update(payloadB64).digest('hex')
      if (sig.length !== expected.length) return false
      const sigBuf = Buffer.from(sig, 'hex')
      const expBuf = Buffer.from(expected, 'hex')
      if (!crypto.timingSafeEqual(sigBuf, expBuf)) return false
      let payload
      try {
        payload = JSON.parse(Buffer.from(payloadB64, 'base64url').toString('utf8'))
      } catch {
        return false
      }
      if (typeof payload.exp === 'number' && payload.exp * 1000 < Date.now()) return false
      if (payload.slug !== MY_SLUG) return false
      return true
    }

    http.createServer((req, res) => {
      if (valid(req)) {
        res.writeHead(200, { 'content-type': 'text/plain' })
        res.end('ok')
      } else {
        res.writeHead(401, { 'content-type': 'text/plain' })
        res.end('unauthorized')
      }
    }).listen(PORT, '127.0.0.1', () => {
      console.log(`[auth_validator] listening on 127.0.0.1:${PORT} slug=${MY_SLUG}`)
    })
  port_watcher.mjs: |
    import fs from 'node:fs/promises'
    import path from 'node:path'

    const domain = process.env.PREVIEW_DOMAIN_SUFFIX || '{{ .Values.previewDomain }}'
    const userSlug = process.env.PREVIEW_USER_SLUG || 'shared'
    const stateFile = process.env.PREVIEW_STATE_FILE || '/var/opencode/state/preview-ports.txt'
    const minPort = Number(process.env.PREVIEW_MIN_PORT || '3000')
    const maxPort = Number(process.env.PREVIEW_MAX_PORT || '9999')
    const exclude = new Set(
      (process.env.PREVIEW_EXCLUDE_PORTS || '4096,8082,7681,7682,7683,7684')
        .split(',')
        .map((value) => Number(value.trim()))
        .filter((value) => Number.isInteger(value)),
    )

    function url(port) {
      // Build the URL from the host the UI is actually served on: the chart's
      // VirtualService endpoint (PREVIEW_UI_HOST, e.g. opencode.<domain>).
      // The old hardcoded `opencode.` prefix broke deployments whose endpoint
      // moved off opencode.<domain>. opencode.<domain suffix> remains the
      // fallback when PREVIEW_UI_HOST is unset. Never render the Helm value
      // into this template literal: ezua.virtualService.endpoint ships as a
      // platform-pipeline placeholder and must stay runtime-configurable.
      const host = process.env.PREVIEW_UI_HOST || `opencode.${domain}`
      // Per-user prefix is the readable slug (the username); legacy
      // /u-<hash> bookmarks are handled by the router, not here.
      return `https://${host}/${userSlug}/__preview/${port}/`
    }

    async function broadcast(message) {
      const line = `\r\n${message}\r\n`
      try {
        const entries = await fs.readdir('/dev/pts')
        await Promise.all(
          entries
            .filter((entry) => /^\d+$/.test(entry))
            .map((entry) => fs.writeFile(`/dev/pts/${entry}`, line, { flag: 'a' }).catch(() => {})),
        )
      } catch {
        // Ignore PTY broadcast failures.
      }
    }

    async function listPorts(path) {
      try {
        const content = await fs.readFile(path, 'utf8')
        return content
          .split('\n')
          .slice(1)
          .flatMap((line) => {
            const parts = line.trim().split(/\s+/)
            if (parts.length < 4 || parts[3] !== '0A') return []
            const address = parts[1] || ''
            const portHex = address.split(':').pop()
            if (!portHex) return []
            const port = Number.parseInt(portHex, 16)
            if (exclude.has(port) || port < minPort || port > maxPort) return []
            return [port]
          })
      } catch {
        return []
      }
    }

    async function previewPorts() {
      const ports = new Set()
      for (const path of ['/proc/net/tcp', '/proc/net/tcp6']) {
        for (const port of await listPorts(path)) {
          ports.add(port)
        }
      }
      return ports
    }

    async function writeState(ports) {
      await fs.mkdir(path.dirname(stateFile), { recursive: true })
      const content = [...ports].sort((left, right) => left - right).map((port) => `${port} ${url(port)}`).join('\n')
      await fs.writeFile(stateFile, content ? `${content}\n` : '', 'utf8')
    }

    let seen = new Set()

    async function tick() {
      const current = await previewPorts()
      const currentPorts = [...current].sort((left, right) => left - right)
      const seenPorts = [...seen].sort((left, right) => left - right)

      for (const port of currentPorts) {
        if (!seen.has(port)) {
          const message = `[preview] Preview available for port ${port}: ${url(port)}`
          console.log(message)
          await broadcast(message)
        }
      }

      for (const port of seenPorts) {
        if (!current.has(port)) {
          const message = `[preview] Preview closed for port ${port}: ${url(port)}`
          console.log(message)
          await broadcast(message)
        }
      }

      if (currentPorts.join(',') !== seenPorts.join(',')) {
        await writeState(current)
        seen = current
      }
    }

    await tick()
    setInterval(() => {
      tick().catch((error) => console.error('[preview] watcher failed', error))
    }, 3000)
  preview-url: |
    #!/bin/sh
    DOMAIN="${PREVIEW_DOMAIN_SUFFIX:-}"
    # Canonical public UI host (the chart's VirtualService endpoint, e.g.
    # opencode.<domain>). Falls back to opencode.<domain> when unset.
    UI_HOST="${PREVIEW_UI_HOST:-opencode.${DOMAIN}}"
    STATE_FILE="${PREVIEW_STATE_FILE:-/var/opencode/state/preview-ports.txt}"
    USER_SLUG="${PREVIEW_USER_SLUG:-shared}"

    if [ "$#" -gt 1 ]; then
      echo "usage: preview-url [port]" >&2
      exit 1
    fi

    if [ "$#" -eq 1 ]; then
      case "$1" in
        ''|*[!0-9]*)
          echo "port must be numeric" >&2
          exit 1
          ;;
      esac
      echo "https://${UI_HOST}/$USER_SLUG/__preview/$1/"
      exit 0
    fi

    if [ -s "$STATE_FILE" ]; then
      cat "$STATE_FILE"
      exit 0
    fi

    echo "No active preview ports detected."
  opencode_supervisor.mjs: |
    import { spawn } from 'node:child_process'
    import fs from 'node:fs'
    import net from 'node:net'
    import path from 'node:path'

    const primaryConfigPath = process.env.OPENCODE_CONFIG || process.env.OPENCODE_CONFIG_PATH || '/var/opencode/home/.config/opencode/opencode.json'
    const configDir = path.dirname(primaryConfigPath)
    const watchedConfigFiles = [
      ...new Set(
        (process.env.OPENCODE_WATCH_CONFIG_FILES || 'opencode.json,config.json,opencode.jsonc')
          .split(',')
          .map((value) => value.trim())
          .filter(Boolean)
          .concat(path.basename(primaryConfigPath)),
      ),
    ]
    const watchedConfigDirs = [
      ...new Set(
        (process.env.OPENCODE_WATCH_CONFIG_DIRS || 'skills,agents')
          .split(',')
          .map((value) => value.trim())
          .filter(Boolean),
      ),
    ]
    const uiMode = process.env.OPENCODE_UI_MODE || 'opencode'
    const isChamber = uiMode === 'openchamber'
    const webPort = Number(process.env.OPENCODE_WEB_PORT || process.env.OPENCODE_SERVER_PORT || '4096')
    const webHost = process.env.OPENCODE_WEB_HOST || '0.0.0.0'
    const portCheckHost = process.env.OPENCODE_WEB_CHECK_HOST || '127.0.0.1'
    const chamberPort = Number(process.env.OPENCHAMBER_PORT || '3000')

    // The chart installs the configured opencode/openchamber versions into the
    // state PVC; the image also carries baked copies under /usr/local/bin.
    // opencode-startup.sh relinks /usr/local/bin to the PVC copies, but that
    // needs root — on forced-uid platform units the relink silently fails and
    // the baked versions would win. Resolve the PVC copy (what the chart asked
    // for) and fall back to the image only when it is missing.
    function resolveBinary(name) {
      const statePath = `/var/opencode/data/npm/bin/${name}`
      try {
        if (fs.statSync(statePath).isFile()) {
          fs.accessSync(statePath, fs.constants.X_OK)
          return statePath
        }
      } catch {}
      return `/usr/local/bin/${name}`
    }
    // The resolved path alone does not prove which pair is running: a PVC copy
    // and the baked copy share the same path through the npm-prefix alias.
    // Log the package version too, so a drifted unit is visible in the log.
    // npm links bin/<name> into ../lib/node_modules/<pkg>/, so realpathSync lands
    // on the package's own bin script, not on <prefix>/bin/<name>. Walk up until
    // the manifest is found rather than assuming a fixed depth.
    function binaryVersion(binaryPath, packageName) {
      try {
        let dir = path.dirname(fs.realpathSync(binaryPath))
        for (let depth = 0; depth < 6; depth += 1) {
          try {
            return JSON.parse(fs.readFileSync(path.join(dir, 'node_modules', packageName, 'package.json'), 'utf8')).version
          } catch {}
          const parent = path.dirname(dir)
          if (parent === dir) break
          dir = parent
        }
        return 'unknown'
      } catch {
        return 'unknown'
      }
    }
    const opencodeBinary = resolveBinary('opencode')
    const openchamberBinary = resolveBinary('openchamber')
    console.log(`[opencode] binaries: opencode=${opencodeBinary} (${binaryVersion(opencodeBinary, 'opencode-ai')}) openchamber=${openchamberBinary} (${binaryVersion(openchamberBinary, '@openchamber/web')})`)
    const opencodeArgs = isChamber
      ? ['--print-logs', 'serve', '--port', String(webPort), '--hostname', '127.0.0.1']
      : ['--print-logs', 'web', '--port', String(webPort), '--hostname', webHost]

    let child = null
    let chamberChild = null
    let chamberBackoffMs = 1000
    let restartTimer = null
    let restartInProgress = false
    let stopping = false
    let lastConfigSignature = readConfigSignature()
    let restartBackoffMs = 1000

    function readConfigSignature() {
      const signature = {}
      for (const file of watchedConfigFiles) {
        const filePath = path.join(configDir, file)
        try {
          const stat = fs.statSync(filePath)
          signature[`file:${file}`] = `${stat.mtimeMs}:${stat.size}`
        } catch {
          signature[`file:${file}`] = 'missing'
        }
      }
      for (const dir of watchedConfigDirs) {
        signature[`dir:${dir}`] = readDirectorySignature(path.join(configDir, dir))
      }
      return signature
    }

    function readDirectorySignature(dirPath) {
      const entries = []

      function walk(currentPath, relativePath = '') {
        let dirEntries = []
        try {
          dirEntries = fs.readdirSync(currentPath, { withFileTypes: true })
        } catch {
          entries.push(`${relativePath || '.'}:missing`)
          return
        }

        for (const entry of dirEntries) {
          const entryRelativePath = relativePath ? `${relativePath}/${entry.name}` : entry.name
          const entryPath = path.join(currentPath, entry.name)

          if (entry.isDirectory()) {
            entries.push(`${entryRelativePath}/:dir`)
            walk(entryPath, entryRelativePath)
            continue
          }

          if (!entry.isFile()) continue

          try {
            const stat = fs.statSync(entryPath)
            entries.push(`${entryRelativePath}:${stat.mtimeMs}:${stat.size}`)
          } catch {
            entries.push(`${entryRelativePath}:missing`)
          }
        }
      }

      walk(dirPath)
      return entries.sort().join('|') || 'empty'
    }

    function changedConfigFiles(nextSignature) {
      const keys = new Set([...Object.keys(nextSignature), ...Object.keys(lastConfigSignature)])
      return [...keys]
        .filter((key) => nextSignature[key] !== lastConfigSignature[key])
        .map((key) => key.replace(/^file:/, '').replace(/^dir:/, ''))
    }

    function isPrimaryConfigValid() {
      try {
        JSON.parse(fs.readFileSync(primaryConfigPath, 'utf8'))
        return true
      } catch (error) {
        console.error(`[opencode] skipping restart: ${primaryConfigPath} is invalid JSON: ${error.message}`)
        return false
      }
    }

    function sleep(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms))
    }

    function isPortOpen() {
      return new Promise((resolve) => {
        const socket = net.createConnection({ host: portCheckHost, port: webPort })
        const finish = (open) => {
          socket.removeAllListeners()
          socket.destroy()
          resolve(open)
        }

        socket.setTimeout(500)
        socket.once('connect', () => finish(true))
        socket.once('timeout', () => finish(false))
        socket.once('error', () => finish(false))
      })
    }

    function listeningSocketInodes(port) {
      const inodes = new Set()
      const portHex = port.toString(16).toUpperCase().padStart(4, '0')

      for (const procFile of ['/proc/net/tcp', '/proc/net/tcp6']) {
        try {
          const lines = fs.readFileSync(procFile, 'utf8').split('\n').slice(1)
          for (const line of lines) {
            const parts = line.trim().split(/\s+/)
            const localAddress = parts[1] || ''
            const state = parts[3]
            const inode = parts[9]
            const localPortHex = localAddress.split(':').pop()?.toUpperCase()
            if (state === '0A' && localPortHex === portHex && inode) {
              inodes.add(inode)
            }
          }
        } catch {}
      }

      return inodes
    }

    function processCommand(pid) {
      try {
        const command = fs.readFileSync(`/proc/${pid}/cmdline`, 'utf8').replace(/\0/g, ' ').trim()
        if (command) return command
      } catch {}

      try {
        return fs.readFileSync(`/proc/${pid}/comm`, 'utf8').trim()
      } catch {
        return ''
      }
    }

    function portOwnerProcesses(port) {
      const inodes = listeningSocketInodes(port)
      if (inodes.size === 0) return []

      const owners = []
      let procEntries = []
      try {
        procEntries = fs.readdirSync('/proc', { withFileTypes: true })
      } catch {
        return owners
      }

      for (const entry of procEntries) {
        if (!entry.isDirectory() || !/^\d+$/.test(entry.name)) continue

        const pid = Number(entry.name)
        if (pid === process.pid) continue

        const fdDir = `/proc/${pid}/fd`
        try {
          for (const fd of fs.readdirSync(fdDir)) {
            const target = fs.readlinkSync(path.join(fdDir, fd))
            const match = target.match(/^socket:\[(\d+)\]$/)
            if (match && inodes.has(match[1])) {
              owners.push({ pid, command: processCommand(pid) })
              break
            }
          }
        } catch {}
      }

      return owners
    }

    function canKillPortOwner(owner) {
      const command = owner.command.toLowerCase()
      if (!command) return false
      if (command.includes('opencode_supervisor') || command.includes('port_watcher')) return false
      if (command.includes('opencode')) return true
      if ((command.includes('node') || command.includes('bun')) && command.includes(`--port ${webPort}`)) return true
      return false
    }

    function signalPortOwners(signal) {
      const owners = portOwnerProcesses(webPort)
      const eligible = owners.filter(canKillPortOwner)

      if (owners.length > 0) {
        console.log(
          `[opencode] port ${webPort} owners: ${owners
            .map((owner) => `${owner.pid} ${owner.command || '<unknown>'}`)
            .join('; ')}`,
        )
      }

      for (const owner of eligible) {
        try {
          console.log(`[opencode] sending ${signal} to port ${webPort} owner pid=${owner.pid}`)
          process.kill(owner.pid, signal)
        } catch (error) {
          console.error(`[opencode] failed to signal port ${webPort} owner pid=${owner.pid}`, error)
        }
      }

      return eligible.length
    }

    async function cleanupPortOwner() {
      const signaled = signalPortOwners('SIGTERM')
      if (signaled === 0) return

      await sleep(2000)
      if (await isPortOpen()) {
        signalPortOwners('SIGKILL')
        await sleep(500)
      }
    }

    async function waitForPortFree(timeoutMs = 30000, cleanupOwners = false) {
      const start = Date.now()
      let cleanupAttempted = false
      let lastLogAt = 0

      while (await isPortOpen()) {
        const elapsed = Date.now() - start
        if (cleanupOwners && !cleanupAttempted && elapsed >= timeoutMs) {
          console.log(`[opencode] port ${webPort} is still busy after ${timeoutMs}ms; checking for orphaned web process`)
          cleanupAttempted = true
          await cleanupPortOwner()
        } else if (elapsed >= timeoutMs && Date.now() - lastLogAt >= 10000) {
          console.log(`[opencode] port ${webPort} is still busy after ${timeoutMs}ms; waiting`)
          lastLogAt = Date.now()
        }
        await sleep(500)
      }
    }

    function signalProcessGroup(proc, signal) {
      try {
        process.kill(-proc.pid, signal)
      } catch {
        try {
          proc.kill(signal)
        } catch {}
      }
    }

    function opencodeServerEnv() {
      if (!isChamber) return process.env
      const env = { ...process.env }
      delete env.OPENCODE_SERVER_PASSWORD
      delete env.OPENCODE_SERVER_USERNAME
      return env
    }

    function startChamber() {
      console.log('[opencode] starting openchamber process')
      const args = ['serve', '--port', String(chamberPort), '--host', '0.0.0.0', '--foreground']
      const chamberEnv = {
        ...process.env,
        OPENCODE_HOST: `http://127.0.0.1:${webPort}`,
        OPENCODE_SKIP_START: 'true',
      }
      const proc = spawn(openchamberBinary, args, {
        detached: true,
        stdio: 'inherit',
        env: chamberEnv,
      })
      chamberChild = proc

      proc.on('error', (error) => {
        console.error(`[opencode] failed to spawn openchamber: ${error.message}`)
        if (chamberChild === proc) chamberChild = null
        if (!stopping && !restartInProgress) {
          const delay = chamberBackoffMs
          chamberBackoffMs = Math.min(chamberBackoffMs * 2, 15000)
          setTimeout(() => {
            if (chamberChild === null) startChamber()
          }, delay)
        }
      })

      proc.on('exit', (code, signal) => {
        if (chamberChild === proc) chamberChild = null
        if (!stopping && !restartInProgress) {
          const delay = chamberBackoffMs
          chamberBackoffMs = Math.min(chamberBackoffMs * 2, 15000)
          console.log(`[opencode] openchamber exited code=${code} signal=${signal}; restarting in ${delay}ms`)
          setTimeout(() => {
            if (chamberChild === null) startChamber()
          }, delay)
        }
      })

      setTimeout(() => {
        if (chamberChild === proc) chamberBackoffMs = 1000
      }, 10000)
    }

    function stopChamber() {
      return new Promise((resolve) => {
        if (!chamberChild) {
          resolve()
          return
        }

        const proc = chamberChild
        let done = false
        const finish = () => {
          if (done) return
          done = true
          if (chamberChild === proc) chamberChild = null
          resolve()
        }

        const timeout = setTimeout(() => {
          signalProcessGroup(proc, 'SIGKILL')
        }, 5000)

        proc.once('exit', finish)

        try {
          signalProcessGroup(proc, 'SIGTERM')
        } catch {
          finish()
        }
      })
    }

    async function startOpencode() {
      await waitForPortFree(30000, true)
      if (stopping || child) return

      console.log('[opencode] starting web process')
      const proc = spawn(opencodeBinary, opencodeArgs, {
        detached: true,
        stdio: 'inherit',
        env: opencodeServerEnv(),
      })
      child = proc

      // Without this handler an ENOENT/EACCES spawn error is an uncaught
      // exception in the supervisor (the container's main process) and the unit
      // dies in a restart loop. startChamber() already carries the same guard.
      proc.on('error', (error) => {
        console.error(`[opencode] failed to spawn opencode: ${error.message}`)
        if (child === proc) child = null
        if (!stopping && !restartInProgress) {
          const delay = restartBackoffMs
          restartBackoffMs = Math.min(restartBackoffMs * 2, 15000)
          setTimeout(() => {
            if (child === null) startOpencode().catch((err) => console.error('[opencode] restart failed', err))
          }, delay)
        }
      })

      proc.on('exit', (code, signal) => {
        if (child === proc) child = null
        if (!stopping && !restartInProgress) {
          const delay = restartBackoffMs
          restartBackoffMs = Math.min(restartBackoffMs * 2, 15000)
          console.log(`[opencode] web process exited code=${code} signal=${signal}; restarting in ${delay}ms`)
          setTimeout(() => {
            startOpencode().catch((error) => console.error('[opencode] restart failed', error))
          }, delay)
        }
      })

      setTimeout(() => {
        if (child === proc) restartBackoffMs = 1000
      }, 10000)
    }

    function stopOpencode() {
      return new Promise((resolve) => {
        if (!child) {
          resolve()
          return
        }

        const proc = child
        let done = false
        const finish = async () => {
          if (done) return
          done = true
          clearTimeout(timeout)
          if (child === proc) child = null
          await waitForPortFree(30000, true)
          resolve()
        }

        const timeout = setTimeout(() => {
          signalProcessGroup(proc, 'SIGKILL')
        }, 8000)

        // A child that fails to spawn emits 'error' + 'close' and never 'exit',
        // so waiting on 'exit' alone would hang the stop path until SIGKILL.
        proc.once('exit', finish)
        proc.once('close', finish)

        try {
          signalProcessGroup(proc, 'SIGTERM')
        } catch {
          finish()
        }
      })
    }

    function scheduleRestart(reason) {
      if (stopping) return
      clearTimeout(restartTimer)
      restartTimer = setTimeout(async () => {
        if (restartInProgress) return
        restartInProgress = true
        console.log(`[opencode] ${reason}; restarting web process`)
        await stopOpencode()
        if (!stopping) await startOpencode()
        restartInProgress = false
      }, 750)
    }

    function maybeRestart() {
      const nextSignature = readConfigSignature()
      const changedFiles = changedConfigFiles(nextSignature)
      if (changedFiles.length === 0) return
      lastConfigSignature = nextSignature
      if (!isPrimaryConfigValid()) return
      scheduleRestart(`config changed: ${changedFiles.join(', ')}`)
    }

    try {
      fs.watch(configDir, (_event, filename) => {
        const changedFile = filename?.toString()
        if (!changedFile || watchedConfigFiles.includes(changedFile)) {
          setTimeout(() => maybeRestart(), 250)
        }
      })
    } catch (error) {
      console.error('[opencode] config watch setup failed', error)
    }

    setInterval(() => maybeRestart(), 3000)

    async function shutdown(signal) {
      stopping = true
      clearTimeout(restartTimer)
      console.log(`[opencode] received ${signal}; stopping web process`)
      await stopOpencode()
      await stopChamber()
      process.exit(0)
    }

    process.on('SIGINT', () => shutdown('SIGINT'))
    process.on('SIGTERM', () => shutdown('SIGTERM'))

    startOpencode().then(() => {
      if (isChamber) startChamber()
    }).catch((error) => console.error('[opencode] start failed', error))

