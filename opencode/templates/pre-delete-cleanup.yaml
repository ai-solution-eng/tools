{{- /*
  Pre-delete hook: cleans up dynamically-created per-user resources
  (deployments, pods, services, leases, Jobs, mirrored ConfigMaps,
  ownership anchors) that the router provisions at runtime via the
  Kubernetes API. Without this hook `helm uninstall` only removes
  Helm-tracked resources, leaving user pods — which still mount PVCs —
  stranded (the shared PVC hangs in Terminating and the namespace never
  completes deletion).

  UNINSTALL CONTRACT:
  Only chart-created objects (label `opencode-user-managed=true`) are
  deleted, in the release namespace AND in each unit namespace recorded in
  the user registry (platform integration: units inside
  project-user-<name>). Platform PVCs (kubeflow-shared-pvc / user-pvc) are
  NEVER deleted: they carry no chart label, and a belt-and-braces skip-assert
  refuses any PVC carrying an `ezprojects.hpe.com/*` label (or an unreadable
  PVC). Namespaces are never deleted by this hook.

  PVC SURVIVAL (storage.keepPvcOnDelete=true, the default): user data PVCs —
  per-user ws/st claims, warm-pool claims and the per-namespace shared mirror
  — are NOT deleted on uninstall. They are listed and logged only, so the
  first re-login / re-install re-binds the exact same volumes. Deliberate
  purge = manual `kubectl delete pvc` (set storage.keepPvcOnDelete=false to
  restore the legacy delete-on-uninstall behavior). The Helm-tracked release
  shared PVC carries `helm.sh/resource-policy: keep` and likewise survives
  uninstall; delete it manually before reinstalling if a fresh one is wanted.

  Execution order (hook weights):
    -4  ServiceAccount
    -3  Role + (platform mode) ClusterRole
    -2  RoleBinding + (platform mode) ClusterRoleBinding
    -1  Job  (the actual cleanup)
*/ -}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-cleanup
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "-4"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  labels:
    hpe-ezua/type: vendor-service
    hpe-ezua/app: {{ .Chart.Name }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-cleanup
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "-3"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  labels:
    hpe-ezua/type: vendor-service
    hpe-ezua/app: {{ .Chart.Name }}
rules:
- apiGroups: [""]
  resources: ["pods", "persistentvolumeclaims", "services", "secrets"]
  verbs: ["get", "list", "delete"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "delete"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "delete"]
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "list", "delete"]
- apiGroups: ["networking.istio.io"]
  resources: ["virtualservices"]
  verbs: ["get", "list", "delete"]
{{- if .Values.platformIntegration.enabled }}
---
# Platform integration: units may live inside the users' platform project
# namespaces — the cleanup needs the same kinds cross-namespace. Deletion
# stays bound to the `opencode-user-managed=true` label contract plus the
# ezprojects.hpe.com/* skip-assert; namespaces themselves are never deleted.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-cleanup-platform
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "-3"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  labels:
    hpe-ezua/type: vendor-service
    hpe-ezua/app: {{ .Chart.Name }}
rules:
- apiGroups: [""]
  # secrets: the mirrored per-unit auth/pull secrets (labels
  # opencode-user-managed=true) are cleaned with the unit on uninstall.
  resources: ["pods", "persistentvolumeclaims", "services", "configmaps", "secrets"]
  verbs: ["get", "list", "delete"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "delete"]
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-cleanup-platform
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "-2"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  labels:
    hpe-ezua/type: vendor-service
    hpe-ezua/app: {{ .Chart.Name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-cleanup-platform
subjects:
- kind: ServiceAccount
  name: {{ .Release.Name }}-cleanup
  namespace: {{ .Release.Namespace }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-cleanup
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "-2"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  labels:
    hpe-ezua/type: vendor-service
    hpe-ezua/app: {{ .Chart.Name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-cleanup
subjects:
- kind: ServiceAccount
  name: {{ .Release.Name }}-cleanup
  namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-cleanup
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "-1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  labels:
    hpe-ezua/type: vendor-service
    hpe-ezua/app: {{ .Chart.Name }}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 60
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        hpe-ezua/type: vendor-service
        hpe-ezua/app: {{ .Chart.Name }}
    spec:
      serviceAccountName: {{ .Release.Name }}-cleanup
      restartPolicy: Never
      containers:
      - name: cleanup
        image: {{ .Values.cleanup.image | default "node:22-bookworm-slim" }}
        imagePullPolicy: IfNotPresent
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_TIMEOUT
          value: "{{ .Values.cleanup.podTimeout | default 180 }}"
        - name: PVC_TIMEOUT
          value: "{{ .Values.cleanup.pvcTimeout | default 120 }}"
        - name: RELEASE_NAME
          value: "{{ .Release.Name }}"
        - name: REGISTRY_SECRET
          value: "{{ .Release.Name }}-users"
        - name: KEEP_PVC_ON_DELETE
          value: {{ .Values.storage.keepPvcOnDelete | default true | quote }}
        command: ['/bin/sh', '-c']
        args:
        - |
          cat > /tmp/cleanup.mjs << 'SCRIPT'
          import https from 'node:https'
          import fs from 'node:fs'

          const namespace = process.env.POD_NAMESPACE
          const podTimeout = parseInt(process.env.POD_TIMEOUT || '180', 10) * 1000
          const pvcTimeout = parseInt(process.env.PVC_TIMEOUT || '120', 10) * 1000
          const kubeHost = process.env.KUBERNETES_SERVICE_HOST
          const kubePort = process.env.KUBERNETES_SERVICE_PORT_HTTPS || '443'
          const token = fs.readFileSync('/var/run/secrets/kubernetes.io/serviceaccount/token', 'utf8').trim()
          const ca = fs.readFileSync('/var/run/secrets/kubernetes.io/serviceaccount/ca.crt')

          function req(method, path, body) {
            return new Promise((resolve, reject) => {
              const headers = { accept: 'application/json', authorization: 'Bearer ' + token }
              if (body) headers['content-type'] = 'application/json'
              const r = https.request({ host: kubeHost, port: kubePort, method, path, ca, headers }, (res) => {
                let data = ''
                res.setEncoding('utf8')
                res.on('data', (c) => { data += c })
                res.on('end', () => {
                  let parsed = null
                  try { parsed = data ? JSON.parse(data) : null } catch (e) { parsed = null }
                  if (res.statusCode >= 200 && res.statusCode < 300 || res.statusCode === 404) {
                    resolve(res.statusCode === 404 ? null : parsed)
                    return
                  }
                  const err = new Error('API ' + method + ' ' + path + ' -> ' + res.statusCode)
                  err.statusCode = res.statusCode
                  reject(err)
                })
              })
              r.on('error', reject)
              if (body) r.write(JSON.stringify(body))
              r.end()
            })
          }

          async function listByLabel(path, label) {
            const result = await req('GET', path + '?labelSelector=' + encodeURIComponent(label))
            return (result && result.items) || []
          }

          function isPlatformOwned(meta) {
            // Uninstall-contract tripwire: platform (EzProject) objects carry
            // ezprojects.hpe.com/* labels; chart-created objects never do.
            const labels = (meta && meta.labels) || {}
            return Object.keys(labels).some((l) => l.startsWith('ezprojects.hpe.com/'))
          }

          async function deleteByName(path, name, meta) {
            if (meta && isPlatformOwned(meta)) {
              console.log('    SKIP (platform-owned): ' + name)
              return false
            }
            try {
              await req('DELETE', path + '/' + name + '?propagationPolicy=Background')
              console.log('    deleted ' + name)
              return true
            } catch (e) {
              console.log('    WARN: ' + name + ': ' + e.message)
              return false
            }
          }

          async function deleteByLabel(path, label, desc, ns) {
            const items = await listByLabel(path, label)
            console.log('  [' + ns + '] ' + items.length + ' ' + desc + ' to delete')
            await Promise.all(items.map((item) => deleteByName(path, item.metadata.name, item.metadata)))
            return items.length
          }

          async function countByLabel(path, label) {
            const items = await listByLabel(path, label)
            return items.length
          }

          async function waitForGone(path, label, desc, timeoutMs, ns) {
            const start = Date.now()
            while (Date.now() - start < timeoutMs) {
              const count = await countByLabel(path, label)
              if (count === 0) {
                console.log('  [' + ns + '] ' + desc + ': gone')
                return
              }
              console.log('  [' + ns + '] ' + desc + ': ' + count + ' remaining ...')
              await new Promise((r) => setTimeout(r, 3000))
            }
            console.log('  [' + ns + '] WARN: ' + desc + ' still present after timeout, proceeding')
          }

          // Unit namespaces = release namespace + every unitNs recorded in
          // the user registry (platform units live inside the users'
          // project-user-<name> namespaces). A registry read failure
          // degrades to release-namespace-only cleanup.
          async function unitNamespaces() {
            const namespaces = new Set([namespace])
            const secretName = process.env.REGISTRY_SECRET
            if (secretName) {
              try {
                const secret = await req('GET', '/api/v1/namespaces/' + namespace + '/secrets/' + secretName)
                const raw = secret && secret.data && secret.data.users
                if (raw) {
                  const users = JSON.parse(Buffer.from(raw, 'base64').toString('utf8')) || {}
                  for (const record of Object.values(users)) {
                    if (record && record.unitNs) namespaces.add(record.unitNs)
                  }
                }
              } catch (e) {
                console.log('  WARN: registry unreadable (' + e.message + '); cleaning the release namespace only')
              }
            }
            return [...namespaces]
          }

          async function main() {
            const um = 'opencode-user-managed=true'
            const pods = 'app=opencode-user'
            const routerLabel = 'opencode-role=router'
            const routerDeployment = process.env.RELEASE_NAME || ''
            const nsList = await unitNamespaces()

            console.log('=== Helm pre-delete cleanup ===')
            console.log('namespaces: ' + nsList.join(', '))

            // Orphan-proof discovery: the registry is only a HINT. Sweep
            // cluster-wide for chart-labeled objects and add every namespace
            // hosting one — catches units whose registry entry is already
            // gone (deleted earlier, or an older chart revision's hook ran).
            // Deletion safety is unchanged: only `opencode-user-managed=true`
            // objects are ever touched, and the ezprojects.hpe.com/*
            // skip-assert still refuses platform PVCs.
            console.log('Phase 0b: cluster-wide discovery of chart-labeled unit namespaces')
            const scans = [
              '/api/v1/configmaps',
              '/apis/apps/v1/deployments',
              '/api/v1/persistentvolumeclaims',
              '/api/v1/pods',
            ]
            for (const scanPath of scans) {
              try {
                const items = await listByLabel(scanPath, um)
                for (const item of items) {
                  const ns = item.metadata && item.metadata.namespace
                  if (ns && !nsList.includes(ns)) {
                    console.log('  discovered chart resources in namespace: ' + ns)
                    nsList.push(ns)
                  }
                }
              } catch (e) {
                console.log('  WARN: cluster-wide scan failed for ' + scanPath + ': ' + e.message)
              }
            }
            console.log('namespaces (final): ' + nsList.join(', '))

            console.log('Phase 0: stop router (prevents warm-unit recreation during teardown)')
            if (routerDeployment) {
              await deleteByName('/apis/apps/v1/namespaces/' + namespace + '/deployments', routerDeployment)
            }
            await waitForGone('/api/v1/namespaces/' + namespace + '/pods', routerLabel, 'router pods', podTimeout, namespace)

            console.log('Phase 1: delete user deployments, services, jobs, configmaps (anchors + mirrors)')
            for (const ns of nsList) {
              await Promise.all([
                deleteByLabel('/apis/apps/v1/namespaces/' + ns + '/deployments', um, 'deployments', ns),
                deleteByLabel('/api/v1/namespaces/' + ns + '/services', um, 'services', ns),
                deleteByLabel('/apis/batch/v1/namespaces/' + ns + '/jobs', um, 'jobs', ns),
                deleteByLabel('/api/v1/namespaces/' + ns + '/configmaps', um, 'configmaps', ns),
              ])
            }
            // Release-namespace-only resources (registry, leases, VS).
            await Promise.all([
              deleteByLabel('/api/v1/namespaces/' + namespace + '/secrets', um, 'secrets', namespace),
              deleteByLabel('/apis/coordination.k8s.io/v1/namespaces/' + namespace + '/leases', um, 'leases', namespace),
              deleteByLabel('/apis/networking.istio.io/v1/namespaces/' + namespace + '/virtualservices', um, 'virtualservices', namespace),
            ])

            console.log('Phase 2: wait for user pods to terminate (releases PVC mounts)')
            for (const ns of nsList) {
              await waitForGone('/api/v1/namespaces/' + ns + '/pods', pods, 'pods', podTimeout, ns)
            }

            console.log('Phase 3: user data PVCs (keepPvcOnDelete=' + (process.env.KEEP_PVC_ON_DELETE || 'true') + ')')
            for (const ns of nsList) {
              const claims = await listByLabel('/api/v1/namespaces/' + ns + '/persistentvolumeclaims', um)
              if (claims.length === 0) {
                console.log('  [' + ns + '] no user data PVCs found')
                continue
              }
              if ((process.env.KEEP_PVC_ON_DELETE || 'true') !== 'false') {
                // PVC-survival contract: list them so operators can purge
                // deliberately, but never delete them. The first re-login /
                // re-install re-binds the exact same volumes.
                for (const claim of claims) {
                  if (isPlatformOwned(claim.metadata)) { console.log('    SKIP (platform-owned): ' + claim.metadata.name); continue }
                  console.log('    KEPT (manual deletion required to purge): ' + claim.metadata.name)
                }
              } else {
                await deleteByLabel('/api/v1/namespaces/' + ns + '/persistentvolumeclaims', um, 'PVCs', ns)
                await waitForGone('/api/v1/namespaces/' + ns + '/persistentvolumeclaims', um, 'PVCs', pvcTimeout, ns)
              }
            }

            console.log('=== Cleanup done ===')
          }

          main().then(() => process.exit(0)).catch((e) => {
            console.error('FATAL (non-blocking): ' + e.message)
            process.exit(0)
          })
          SCRIPT
          exec node /tmp/cleanup.mjs
