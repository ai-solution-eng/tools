# Opencode harness deployment in PCAI
# This app is very powerful, be responsible.

# ============================================================
# EZUA settings
# ============================================================
ezua:
  domainName: "${DOMAIN_NAME}"
  virtualService:
    endpoint: "opencode.${DOMAIN_NAME}"
    istioGateway: "istio-system/ezaf-gateway"
  authorizationPolicy:
    namespace: "istio-system"
    providerName: "oauth2-proxy"

# ============================================================
# General configuration
# ============================================================
previewDomain: "${DOMAIN_NAME}"

# Session cookie signing secret (also used by each user pod to validate the
# session cookie that gates access to that pod's UI/terminal/previews).
sessionSecret: "9xT2mQvR4pS7kL1nW8yB5dF3hJ6cZ0aG"

# How long a login lasts, in days. The router issues a signed 'oc_sess' cookie
# at login and each user pod's nginx auth gate validates it; this value is the
# cookie's Max-Age and the 'exp' claim inside it. When it lapses the user is
# asked to log in again — NOTHING on disk is deleted: conversations
# (opencode.db), workspace files, opencode.json/agents/skills and auth.json all
# survive untouched. There is no age-based conversation retention in this chart
# or in upstream opencode; clearing chat history is only ever an explicit admin
# action (POST /__oc_admin/api/sessions/clear).
# 7 was the historical hardcoded value; 180 keeps an active user logged in for
# roughly half a year. The router clamps this to [1 hour, 400 days] and falls
# back to 7 on a non-numeric/zero/negative value — 400 days is the hard cap
# browsers put on cookie lifetime (RFC 6265bis), so a larger number would just
# be truncated client-side.
# NOTE: the expiry is baked into each cookie at issue time. Raising this value
# does NOT retroactively extend cookies already in users' browsers — they pick
# up the new lifetime at their next login (their current cookie simply lapses
# on its old schedule first).
sessionCookieTtlDays: 180

storageClass: gl4f-filesystem
storage:
  sharedSize: 20Gi
  workspaceSize: 5Gi
  # Version prefix for per-user PVC names (`opencode-<nameVersion>-ws/st-<slug>`).
  # CANONICAL SCHEME: opencode-v2 — do NOT bump this casually and never revert
  # to v1 (v2 is what the live release uses; a mismatch re-stamps units onto
  # fresh volumes). The version is embedded early in the PVC name (VAST quota
  # names are `csi:<ns>:<pvc>` truncated to 64 chars), the claims convergence
  # contract re-stamps EXISTING units on a bump, and every bump mints FRESH
  # volumes while the old data is orphaned (kept, never deleted, never
  # migrated). Reinstall with this value unchanged always re-attaches the
  # existing opencode-v2-* claims.
  nameVersion: v2
  keepPvcOnDelete: true
  stateSize: 2Gi

# Max request body accepted by the in-pod nginx (the single entry point in
# front of opencode at :8082). nginx's own default is 1 MB, which is far too
# small once the browser base64-encodes a pasted/dropped image into a prompt
# body — the request is rejected with HTTP 413 before the app sees it. 64 MB
# comfortably covers a screenshot plus conversation history. Raise it if users
# paste very large images; the platform gateway in front of the pod may impose
# its own (separate) limit.
nginx:
  clientMaxBodySize: 64m

# Pod-template convergence counter. Bump this to force EVERY user unit to
# re-stamp onto the current chart-rendered pod template (nginx.conf, supervisor,
# probes, env) on the next router reconcile — no chart/template edit required.
# Folded into the 'opencode-web-helm/user-template-version' annotation; when it
# changes the router patches each Deployment and the unit rolls.
# LEAVE UNSET unless you need a forced rollout: unset renders the historical
# marker unchanged (no surprise rollout on upgrade). Any value you set here
# becomes the '-r<value>' suffix.
# RUNTIME_REV: 20

images:
  # Baked user image: carries the apt toolchain, opencode-ai,
  # @openchamber/web, uv, ttyd and helm under /opt/opencode so pods stop
  # installing everything at boot (see docker/user/Dockerfile +
  # scripts/build-user-image.sh). Rebuild and bump whenever opencode.version /
  # openchamber.version / provisioning.aptPackages / provisioning.helmVersion
  # change — the router folds the tag into the pod-template version, so
  # existing units re-stamp automatically on upgrade. Set both entries back to
  # node:22-bookworm-slim to revert to install-on-boot behavior.
  #
  # NOTE (opencode 1.19.4 + openchamber 1.24.2): the tag still names
  # 1.18.11-1.17.2 on purpose. The baked image for the new pair does not exist
  # yet, and pointing at a missing tag would put every user pod into
  # ImagePullBackOff. With the tag left as-is the router's npm guard sees BOTH
  # baked markers (.opencode-version 1.18.11, .openchamber-version 1.17.2)
  # differ from OPENCODE_VERSION 1.19.4 / OPENCHAMBER_VERSION 1.24.2, so it
  # installs opencode-ai@1.19.4 AND @openchamber/web@1.24.2 into the state PVC
  # at boot — the documented fallback (the openchamber install fires because
  # ui.mode: openchamber stamps OPENCHAMBER_INSTALL=true). After
  # building+pushing the new image, set BOTH lines to
  # ghcr.io/ai-solution-eng/opencode-openchamber:1.19.4-1.24.2-dind to get the
  # fast baked path back.
  user: ghcr.io/ai-solution-eng/opencode-openchamber:1.19.4-1.24.2-dind
  init: ghcr.io/ai-solution-eng/opencode-openchamber:1.19.4-1.24.2-dind
  # imagePullSecret in the release namespace, for PRIVATE ghcr.io packages.
  # Public ghcr.io packages pull anonymously (leave empty).
  pullSecret: ""

# ============================================================
# Docker-in-Docker (dockerize + push images from the pod terminal)
# ============================================================
# SECURITY (2026-10-03 decision): docker is an SSO-IDENTITY capability.
# The classic (non-SSO) login is a single shared credential and daemon
# access is node-root-equivalent (privileged container + unauthenticated
# API), so units resolved by a LOCAL session NEVER get a daemon — only
# SSO-resolved units do: platform units via the per-user broker (default,
# see below) or the in-pod sidecar with the Kyverno PolicyException
# (onPlatformUnits), and SSO fallback units in the release namespace via
# the in-pod sidecar (loopback). The docker CLI stays baked in the image
# for everyone (harmless without a daemon). Notes:
#   - The sidecar is privileged and runs as root (dockerd needs it; platform
#     admission in project-user-* namespaces is beaten by explicit container-
#     level overrides). Clusters that reject privileged containers must not
#     enable this.
#   - /var/lib/docker is an emptyDir on node-local disk: built images are
#     ephemeral (survive pod restarts only until the pod is rescheduled).
#     PUSH after building. A VAST-backed docker-data does NOT work (overlay2
#     layer extraction fails on network volumes). Disk-capped via
#     docker.diskSize — rendered as BOTH the emptyDir sizeLimit AND the
#     sidecar's ephemeral-storage limit (the pairing is what makes the cap
#     enforceable: kubelet evicts when either is exceeded).
#   - On proxied clusters the daemon receives proxy.env (pulls/pushes) and
#     the certificatesPolicy CA bundle (SSL_CERT_FILE) automatically; build
#     RUN steps additionally need --network host + explicit proxy build-args
#     — use the baked `dockerbuild` wrapper (see docker/user/Dockerfile).
docker:
  ###
  # Setting	Effect
  # enabled: true	Docker exists at all (and only for SSO users — local accounts never get a daemon)
  # brokerForPlatformUnits: true	Your current setup. Platform units (project-user-*) get a separate privileged dind pod in the release namespace; the unit reaches it over the network
  # onPlatformUnits: false	Platform units must not carry an in-pod daemon (privileged containers are denied there by Kyverno)
  # onPlatformUnits: true	Forces the daemon inside the platform unit's own pod (sidecar mode) instead of the broker
  ###
  enabled: true
  image: docker:28-dind
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits:   {cpu: "4", memory: 8Gi}
  # DinD image-store sizing on node-local disk. diskSize caps the emptyDir
  # and doubles as the sidecar's ephemeral-storage limit (see note above);
  # diskRequest is the scheduler's ephemeral-storage reservation.
  diskSize: 50Gi
  diskRequest: 5Gi
  # Platform units (project-user-* namespaces): the platform Kyverno policies
  # deny privileged containers there (tr7: ezprojects-restrict-privileged-pods
  # — with the sidecar present, the unit's Deployment POST fails with 400 and
  # platform SSO breaks ENTIRELY). So platform units get their daemon OUT-OF-
  # POD by default: a per-user privileged dind Deployment + Service +
  # NetworkPolicy (ingress restricted to the owning unit) in THIS release
  # namespace, reached cross-namespace via DOCKER_HOST (brokerForPlatformUnits).
  onPlatformUnits: false
  # false = platform units carry NO docker at all. true (default) = the
  # per-user broker described above. Setting onPlatformUnits: true INSTEAD
  # runs the daemon inside the platform pod — only do that after the platform
  # team adds the Kyverno PolicyException (opencode-user-managed=true, kinds
  # Deployment+Pod).
  brokerForPlatformUnits: true

opencode:
  version: 1.19.4

# Browser-facing UI. "opencode" uses the built-in opencode web UI; "openchamber"
# serves OpenChamber on chamberPort with a headless opencode server on serverPort.
#
# VERSION PAIRING (checked 2026-10-26 against npm + openchamber.dev/changelog):
#   OpenChamber 2.x  -> depends on @opencode/client 2.1.4 / @opencode/schema
#                       2.1.4, i.e. it REQUIRES opencode v2. Do not pair 2.x
#                       with the 1.19 line.
#   OpenChamber 1.x  -> pins @opencode-ai/sdk 1.18.x; the line ENDS at 1.24.2
#                       (1.25+ unpublished). 1.24.2 pins sdk 1.18.31, the
#                       closest 1.x pin to opencode 1.19.4.
# NOTE: no OpenChamber 1.x pins an sdk >= 1.19, so opencode 1.19.4 + OpenChamber
# 1.24.2 is the CLOSEST available pairing, not an officially blessed one — the
# sdk/server gap is one minor version. This chart previously used an exact
# sdk match (opencode 1.18.11 <-> openchamber 1.17.2, sdk 1.18.11). If 1.24.2
# misbehaves against 1.19.4, the exact-match fallback is opencode 1.18.31 +
# openchamber 1.24.2.
openchamber:
  version: "1.24.2"
  # OpenChamber "Send anonymous usage reports". false (default) forces it OFF for
  # every user on each unit start; true leaves the user's own choice alone.
  #
  # OpenChamber exposes no env var for this - it is a profile setting - so the
  # unit init writes it into settings.json AND preferences.json (preferences
  # wins, and is seeded from settings on first read) via apply-defaults.mjs in
  # the project ConfigMap. Part of Phase 0 egress hardening: an anonymous usage
  # report is an outbound call we do not need.
  reportUsage: false

ui:
  mode: openchamber
  chamberPort: 3000
  serverPort: 4096

provisioning:
  aptPackages: "bash ca-certificates curl dnsutils fd-find gh git jq less make nano ncurses-term openssh-client python3 python3-pip python3-venv procps ripgrep tini tmux tree unzip util-linux vim-tiny zip zstd xz-utils lsof"
  # Helm CLI version baked into the user image (docker/user/Dockerfile
  # HELM_VERSION must mirror this; scripts/build-user-image.sh --helm-version
  # overrides). Latest Helm 3 release — Helm 4 is out, but the chart and the
  # platform-side install tooling are Helm 3.
  helmVersion: "3.22.0"
  # Loading screen shown while a user's pod is being provisioned/assigned.
  # When disabled the router reverts to the original blocking behavior.
  loadingUI:
    enabled: true
    heading: "Setting up your account\u2026"
    subtext: "This usually takes a few minutes on first launch. Please wait."

# ============================================================
# Warm pool: pre-provisioned, always-ready per-user units.
# When enabled, the router keeps `size` fully-initialized user pods
# warm so a new user's first launch proxies in ~seconds instead of
# waiting 3-5 minutes for the per-user install. A warm unit = its own
# Deployment + Service + workspace PVC + state PVC (the state PVC holds
# the installed toolchain, so claiming only restarts the pod, it does
# not reinstall opencode/uv/ttyd).
#
# Assignment is warm-first for NEW users: they claim a warm unit when one
# is available (even one that is still starting - the loading screen waits
# for it), and only get a dedicated pod when the pool is disabled or has
# nothing claimable. Users who already have a dedicated environment stay
# on it (their data is in the dedicated PVCs and is not migrated).
#
# Tradeoff: each warm unit is an idle user pod consuming resources
# (up to user.resources.limits). Set size: 0 or enabled: false to keep
# the original on-demand cold spin-up behavior (exact same as before).
#
# Versions are NOT baked into an image: tools are installed at runtime
# into the pooled state PVCs, so opencode.version / openchamber.version
# still upgrade via a values.yaml bump - pooled units re-init on the
# existing template-version annotation check.
# ============================================================
warmPool:
  enabled: false
  size: 2
  refreshIntervalSeconds: 15

auth:
  username: opencode
  password: "7Vf9mQ2xKp8tL4nR6wY1cB3hDz5sUa0N"

# Admin console credentials (admin page to create/delete user accounts).
admin:
  username: admin-user
  password: "admin-password"

# ============================================================
# Opencode config (model, provider, MCP servers)
# ============================================================
opencodeConfig: |
    {
      "$schema": "https://opencode.ai/config.json",
      "permission": {
        "*": "ask",
        "bash": {
          "*": "ask",
          "ls *": "allow",
          "grep *": "allow",
          "glob *": "allow",
          "rm *": "deny"
        },
        "edit": "ask",
        "read": "allow",
        "glob": "allow",
        "question": "allow",
        "webfetch": "ask",
        "websearch": "ask",
        "codesearch": "allow",
        "external_directory": "allow",
        "doom_loop": "deny"
      }
    }

opencodeSkills:
  - name: pcai-platform
    content: |
      ---
      name: pcai-platform
      description: Use for PCAI/AIE Kubernetes, routing, model-serving, and deployment troubleshooting.
      compatibility: opencode
      ---

      ## Guidance

      - Start with read-only inspection.
      - Check pods, services, endpoints, VirtualServices, and logs before changing anything.
      - Prefer the smallest safe fix.

opencodeAgents:
  - name: pcai-platform-assistant
    content: |
      ---
      description: Expert HPE AIE/PCAI platform engineer and advisor.
      mode: subagent
      ---

      # HPE AI Essentials (AIE) Platform Assistant

      You are an expert AIE/PCAI platform engineer and advisor. You have access to live Kubernetes cluster tools, indexed product documentation, and web search.

      Your mission: **Think deeply. Act decisively. Anticipate what the user needs before they ask.**

  - name: pcai-debugger
    content: |
      ---
      description: Diagnose PCAI/AIE Kubernetes, Istio routing, PVC, and opencode deployment issues.
      mode: subagent
      ---

      Start with read-only inspection. Check pods, events, services, endpoints, VirtualServices, PVCs, and logs before recommending changes.

      Prefer the smallest safe fix and call out any destructive operation before suggesting it.

router:
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

# ============================================================
# Pre-delete cleanup hook (removes dynamically-created per-user
# resources on helm uninstall so the namespace and shared PVC
# don't hang in Terminating)
# ============================================================
cleanup:
  image: node:22-bookworm-slim
  podTimeout: 180  # seconds to wait for user pods to terminate
  pvcTimeout: 120  # seconds to wait for user PVCs to be deleted

# ============================================================
# Certificate policy (for clusters with private/internal CA)
# ============================================================

certificatesPolicy:
  enabled: false 

  # These env vars are applied to the router container AND to every dynamically
  # created user pod (warm pool + per-user). NODE_EXTRA_CA_CERTS is set as a
  # container env var so it is re-applied automatically on every restart.
  env: []

# ============================================================
# Proxy configuration 
# ============================================================
proxy:
  enabled: false 
  
# ============================================================ 
no_proxy:
  enabled: false

# ============================================================
# Egress hardening (agent internet sandboxing)
# ============================================================
# Phase 0 of agent-egress-sandbox-design.md: remove the agent's runtime
# internet dependencies that cost nothing to remove. ENV DEFAULTS only —
# no NetworkPolicy, no traffic is blocked, fully reversible.
#
#   OPENCODE_DISABLE_MODELS_FETCH=1
#     The opencode engine fetches its provider/model catalogue from
#     models.dev on startup and hourly. Not needed with in-cluster model
#     endpoints.
#   OPENCODE_DISABLE_AUTOUPDATE=1
#     Stops the engine's self-update check against opencode.ai.
#   OPENCODE_DISABLE_SHARE=1
#     Stops share/session upload to opncd.ai.
#
# Set enabled: false to restore pre-Phase-0 behaviour.
egress:
  offlineDefaults:
    enabled: true

# ============================================================
# Platform (PCAI/Kubeflow) workspace integration
# ============================================================
# When enabled AND the endpoint is SSO-gated, SSO users get their unit
# deployed INSIDE their platform project namespace (project-user-<username>)
# with the platform volumes kubeflow-shared-pvc (/mnt/shared, cluster-wide
# shared) and user-pvc (/mnt/user, personal project volume) mounted
# read-write, and the unit process running as the project's unix identity
# (uid/gid from the project-info ConfigMap) so file ownership on the
# platform volumes matches notebook-written files exactly.
#
# Enabling this renders a cross-namespace ClusterRole for the router and
# cleanup service accounts (see README "Platform volumes for SSO users").
# Local (non-SSO) users keep the classic single-namespace behavior.
platformIntegration:
  enabled: false
  # Platform project namespace prefix (ezprojects-operator:
  # EZPROJECTS_NAMESPACE_NAME=project-{{ .EzProjectName }}, private projects
  # are named user-<username>).
  namespacePrefix: "project-user-"
  # Candidate naming patterns for a user's platform project namespace —
  # comma-separated templates with a {username} placeholder (the sanitized
  # username). A trailing * acts as a wildcard: any namespace whose name
  # starts with the expanded prefix becomes a candidate (ownership is
  # verified through the project-info user field). The first candidate that
  # verifies (namespace exists + project-info carries uid/gid) wins.
  # Example: "project-user-{username},user-{username},{username}-slug"
  # When empty, the legacy single-prefix behavior applies (namespacePrefix).
  namespacePatterns: ""
  volumes:
    shared:
      claim: "kubeflow-shared-pvc"
      mountPath: "/mnt/shared"
    user:
      claim: "user-pvc"
      mountPath: "/mnt/user"
  # Monitor-only deployments: mount the platform volumes but expose them
  # read-only in the Data Manager (unix permissions stay the real
  # enforcement regardless).
  readOnly: false

# ============================================================
# Shared workspace content (populates the shared PVC)
# ============================================================
sharedContent:
  enabled: true
