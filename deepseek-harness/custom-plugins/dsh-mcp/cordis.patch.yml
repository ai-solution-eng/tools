# MCP bundle: one row, two jobs.
#
# The row config is shared. `servers` is the list the Settings page edits; the
# remaining keys (`routePath`, `catalogTools`, TTLs) configure the status view.
#
# This bundle composes the two halves in ../dsh-mcp-servers and
# ../dsh-mcp-status, so both packages must stay installed next to it.
# The row id must stay "mcp-servers": the browser half addresses its settings
# namespace by that name, and a different id makes the Settings page write into
# whatever row it can reach instead.
- insert:
    - id: mcp-servers
      name: '@local/dsh-mcp'
      config:
        servers: []
