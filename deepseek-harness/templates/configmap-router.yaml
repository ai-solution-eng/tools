                    { name: 'DSH_PLATFORM_ROOTS', value: platformRootsMode },
                    { name: 'DSH_PLATFORM_ROOTS_READONLY', value: platformReadOnly ? 'true' : 'false' },
                    {{- if and .Values.certificatesPolicy .Values.certificatesPolicy.enabled }}
                    {{- range .Values.certificatesPolicy.env }}
