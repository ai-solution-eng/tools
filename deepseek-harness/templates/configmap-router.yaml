        <div id="spinner" class="spinner"></div>
        <div id="heading">${heading}</div>
        <div id="subtext">${subtext}</div>
        <div id="error-box">
          <div class="error-title">Something went wrong setting up your environment</div>
          <div class="error-detail" id="error-detail"></div>
          <button id="retry">Retry</button>
        </div>
      </div>
    </div>
    <script>
    (function () {
      var statusUrl = ${statusUrl};
      var errorBox = document.getElementById('error-box');
      var spinner = document.getElementById('spinner');
      var detail = document.getElementById('error-detail');
      var retryBtn = document.getElementById('retry');
      function showError(message) {
        spinner.style.display = 'none';
        detail.textContent = message || '';
        errorBox.style.display = 'block';
      }
      function check() {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', statusUrl, true);
        xhr.onload = function () {
          var state = null;
          try { state = JSON.parse(xhr.responseText); } catch (e) { state = null; }
          if (xhr.status !== 200 || !state) { setTimeout(check, 2000); return; }
          if (state.ready) { window.location.reload(); return; }
          if (state.failed) { showError(state.error); return; }
          setTimeout(check, 2000);
        };
        xhr.onerror = function () { setTimeout(check, 2000); };
        xhr.send();
      }
      retryBtn.addEventListener('click', function () {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', statusUrl + '?reset=retry', true);
        xhr.onload = function () { window.location.reload(); };
        xhr.onerror = function () { window.location.reload(); };
        xhr.send();
      });
      check();
    })();
    </script>
    <script>
    (function() {
      var themeLight = document.getElementById("themeLight");
      var themeDark = document.getElementById("themeDark");
      var themeSwitch = document.getElementById("themeSwitch");
      function applyTheme(theme) {
        document.documentElement.setAttribute("data-theme", theme);
        try { localStorage.setItem("theme", theme); } catch (e) {}
        themeSwitch.checked = theme === "dark";
        themeLight.classList.toggle("active", theme === "light");
        themeDark.classList.toggle("active", theme === "dark");
      }
      applyTheme(document.documentElement.getAttribute("data-theme") || "light");
      themeLight.addEventListener("click", function() { applyTheme("light"); });
      themeDark.addEventListener("click", function() { applyTheme("dark"); });
      themeSwitch.addEventListener("change", function() { applyTheme(themeSwitch.checked ? "dark" : "light"); });
    })();
    </script>
    <footer class="hpe-footer">Powered by HPE Private Cloud AI</footer>
    </body>
    </html>`
    }

    function serveSetupPage(response) {
      response.writeHead(200, {
        'content-type': 'text/html; charset=utf-8',
        'cache-control': 'no-store, no-cache, must-revalidate, max-age=0',
      })
      response.end(setupPageHtml())
    }

    function readJsonBody(request) {
      return new Promise((resolve, reject) => {
        const chunks = []
        request.on('data', (chunk) => chunks.push(chunk))
        request.on('end', () => {
          try {
            resolve(JSON.parse(Buffer.concat(chunks).toString('utf8') || '{}'))
          } catch (error) {
            reject(error)
          }
        })
        request.on('error', reject)
      })
    }

    function authPageHtml(identity) {
      const esc = (value) => String(value).replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]))
      const adminConfigured = !!(adminUsername && adminPassword)
      const strip = identity
        ? `<div class="card" style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;">
            <div style="font-size:13px;">Signed in as <b>${esc(identity)}</b></div>
            <div style="display:flex;gap:14px;">
              <a href="/__dsh_start" style="color:var(--accent);">Open your environment</a>
              <a href="/__dsh_logout" style="color:var(--text-muted);">Log out</a>
            </div>
          </div>`
        : ''
      return `<!DOCTYPE html>
    <html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepSeek Harness</title>
    <link rel="icon" type="image/x-icon" href="data:image/x-icon;base64,">
    <script>
    (function() {
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
    </script>
    <style>
    :root, [data-theme="light"] {
      --bg: #f4f6f9; --surface: #ffffff; --surface-2: #eef0f5;
      --border: #d1d5db; --text: #1f2937; --text-muted: #6b7280;
      --accent: #01a982; --accent-hover: #02c99a;
      --green: #059669; --red: #dc2626; --radius: 6px;
      --accent-soft: rgba(1, 169, 130, 0.08);
    }
    [data-theme="dark"] {
      --bg: #0b0e14; --surface: #161a24; --surface-2: #1e2432;
      --border: #2a3142; --text: #e0e4ed; --text-muted: #8891a8;
      --accent: #01a982; --accent-hover: #02c99a;
      --green: #34d399; --red: #f87171;
      --accent-soft: rgba(1, 169, 130, 0.14);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 14px; padding: 24px 0; }
    .wrap { width: 100%; max-width: 560px; padding: 0 24px; }
    .hpe-header { display: flex; align-items: center; margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
    .hpe-header-left { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
    .hpe-brand { display: flex; flex-direction: column; }
    .hpe-brand-name { font-size: 0.7rem; font-weight: 500; color: var(--text-muted); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 1px; }
    .hpe-brand-title { font-size: 1.3rem; font-weight: 600; color: var(--text); }
    .hpe-brand-sub { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }
    .sub { color: var(--text-muted); margin-bottom: 20px; line-height: 1.5; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; margin-bottom: 20px; }
    .card h2 { font-size: 15px; font-weight: 600; margin-bottom: 12px; }
    label { display: block; font-size: .85rem; font-weight: 500; margin: 10px 0 4px; color: var(--text-muted); }
    input { width: 100%; padding: 10px 12px; border-radius: 4px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); font-size: .9rem; font-family: inherit; }
    input:focus { outline: none; border-color: var(--accent); }
    input[type="checkbox"] { width: auto; padding: 0; }
    button { width: 100%; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 18px; border-radius: 4px; border: 1px solid transparent; font-size: .9rem; font-weight: 600; cursor: pointer; margin-top: 14px; font-family: inherit; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 18px; border-radius: 4px; border: none; font-size: .85rem; font-weight: 500; cursor: pointer; font-family: inherit; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-outline:hover { border-color: var(--accent); color: var(--accent); }
    .err { display: none; color: var(--red); font-size: 12px; margin-top: 10px; word-break: break-word; }
    .hint { color: var(--text-muted); font-size: 11px; margin-top: 10px; line-height: 1.4; }
    .theme-controls { margin-left: auto; display: flex; align-items: center; gap: 10px; }
    .theme-emoji-btn { width: 38px; height: 38px; margin-top: 0; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface-2); color: var(--text); cursor: pointer; font-size: 1.1rem; line-height: 1; opacity: 0.55; transition: opacity 0.15s ease, border-color 0.15s ease, color 0.15s ease; }
    .theme-emoji-btn:hover { border-color: var(--accent); color: var(--accent); opacity: 1; }
    .theme-emoji-btn.active { opacity: 1; border-color: var(--accent); color: var(--accent); }
    .theme-switch { display: flex; align-items: center; margin: 0; cursor: pointer; }
    .theme-switch input { position: absolute; opacity: 0; width: 0; height: 0; }
    .switch-track { position: relative; width: 44px; height: 24px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); transition: background 0.2s ease; }
    .switch-thumb { position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: var(--text); transition: transform 0.2s ease, background 0.2s ease; }
    .theme-switch input:checked + .switch-track { background: var(--accent); border-color: var(--accent); }
    .theme-switch input:checked + .switch-track .switch-thumb { transform: translateX(20px); background: var(--surface); }
    .theme-controls.fixed { position: fixed; top: 16px; right: 16px; margin-left: 0; z-index: 100; }
    .hpe-footer { margin-top: 32px; padding-top: 18px; border-top: 1px solid var(--border); font-size: .78rem; color: var(--text-muted); text-align: center; }
    </style>
    </head>
    <body>
    <div class="theme-controls fixed" title="Dark / light mode">
      <button class="theme-emoji-btn" id="themeLight" aria-label="Light mode">☀️</button>
      <label class="theme-switch">
        <input type="checkbox" id="themeSwitch" />
        <span class="switch-track"><span class="switch-thumb"></span></span>
      </label>
      <button class="theme-emoji-btn" id="themeDark" aria-label="Dark mode">🌙</button>
    </div>
    <div class="wrap">
      <header class="hpe-header">
        <div class="hpe-header-left">
          <svg xmlns="http://www.w3.org/2000/svg" width="210" height="140" viewBox="0 0 432 288" style="flex-shrink:0">
